<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider cards</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#151920;--panel2:#1d232c;--line:#2c3440;--ink:#edf1f5;--dim:#8592a3;
  --long:#3ddc84;--short:#ff5a5f;--leverage:#ffc94d;--special:#6cb6ff;--manip:#ff8a3d;
  --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px var(--sans);padding:28px 16px 60px}
main{max-width:1180px;margin:0 auto}
h1{font:800 16px var(--mono);letter-spacing:.3em;color:var(--leverage);margin:0 0 4px}
h2{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:34px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:14px}

/* one card */
.card{--c:var(--ink);position:relative;width:118px;height:166px;border-radius:12px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--panel2)),var(--panel) 70%);
  border:2px solid color-mix(in srgb,var(--c) 70%,transparent);
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;padding:8px 6px;overflow:hidden}
.card.long{--c:var(--long)} .card.short{--c:var(--short)} .card.leverage{--c:var(--leverage)}
.card.special{--c:var(--special)} .card.manip{--c:var(--manip)}
.card .family{font:800 9px var(--mono);letter-spacing:.2em;color:var(--c);align-self:flex-start}
.card .tier{position:absolute;top:8px;right:8px;font:800 9px var(--mono);color:var(--c)}
.card .glyph{flex:1;display:grid;place-items:center;width:100%}
.card .glyph svg{width:62px;height:62px;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent))}
.card .big{font:800 36px var(--mono);color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent);line-height:1}
.card .big small{display:block;font-size:13px;text-align:center;opacity:.8;margin-bottom:2px}
.card .name{font:800 13px var(--mono);letter-spacing:.04em}
.card .detail{font:500 10px var(--mono);color:var(--dim);margin-top:2px;text-align:center;min-height:13px}

/* the bench */
.bench{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.bench .chain{display:flex;gap:8px;align-items:center}
.bench .arrow{font:800 18px var(--mono);color:var(--dim)}
.readout{font:500 13px var(--mono);line-height:1.9}
.readout b{font-weight:800} .readout .l{color:var(--leverage)} .readout .r{color:var(--short)}

/* the shop reels */
.shop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:inline-flex;flex-direction:column;gap:14px;max-width:100%}
.reels{display:flex;flex-wrap:wrap;gap:16px}
.reel{display:flex;flex-direction:column;align-items:center;gap:8px}
.reelLabel{font:800 10px var(--mono);letter-spacing:.2em;color:var(--dim)}
.window{width:134px;height:182px;border-radius:14px;background:#090b0e;border:1px solid var(--line);overflow:hidden;position:relative;
  box-shadow:inset 0 12px 16px -8px #000,inset 0 -12px 16px -8px #000}
.strip{position:absolute;left:8px;top:0;display:flex;flex-direction:column}
.strip .card{margin:8px 0}
.price{font:800 14px var(--mono);color:var(--leverage)}
.button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font:800 12px var(--mono);letter-spacing:.12em;cursor:pointer;color:var(--ink)}
.button:hover{border-color:var(--leverage)}
.button.spin{background:var(--leverage);color:#1a1405;border:none;font-size:14px;padding:12px 26px;align-self:center}
.sold{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);font:800 18px var(--mono);letter-spacing:.2em;color:var(--dim)}
.reel.isSold .sold{display:grid}
</style></head><body><main>
<h1>INSIDER · TRADE CARDS</h1>
<div style="color:var(--dim)">Mockup for CARDS_DESIGN.md. Click SPIN.</div>

<h2>Long</h2><div class="row" id="longRow"></div>
<h2>Short</h2><div class="row" id="shortRow"></div>
<h2>Leverage</h2><div class="row" id="leverageRow"></div>
<h2>Special</h2><div class="row" id="specialRow"></div>
<h2>Manipulation</h2><div class="row" id="manipRow"></div>

<h2>The bench: one trade being built</h2>
<div class="bench">
  <div class="chain" id="benchChain"></div>
  <div class="readout">
    leverage <b class="l">1 → +4 = 5 → ×10 = 50</b><br>
    stake <b>$400</b> · position <b>$20,000</b><br>
    liquidation <b class="r">S = 98.00 (−2.0%)</b>
  </div>
</div>

<h2>The shop</h2>
<div class="shop">
  <div class="reels" id="reels"></div>
  <button class="button spin" id="spinButton">SPIN · $5</button>
</div>
</main>
<script>
// 1. glyphs, drawn in a 100 × 100 box
const BOLT_UP = '<path d="M60 4 L86 38 L69 38 L59 55 L74 55 L34 97 L45 63 L30 63 L47 38 L34 38 Z" fill="currentColor"/>';
const GLYPHS = {
  boltUp:   BOLT_UP,
  boltDown: '<g transform="translate(0 100) scale(1 -1)">' + BOLT_UP + '</g>',
  hype:     '<polyline points="6,80 30,62 50,14 70,62 94,80" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  bash:     '<polyline points="6,20 30,38 50,86 70,38 94,20" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  turmoil:  '<polyline points="4,50 14,18 24,80 34,10 46,88 58,16 70,84 82,24 96,50" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>',
  calm:     '<path d="M4 50 C 20 40, 30 40, 50 50 S 80 60, 96 50" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>',
  ceiling:  '<rect x="6" y="14" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,90 30,60 46,72 66,34 80,44 92,30" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  floor:    '<rect x="6" y="77" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,10 30,40 46,28 66,66 80,56 92,70" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  dividend: '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/><text x="50" y="66" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="46" fill="currentColor">$</text>',
  topUp:    '<rect x="14" y="56" width="72" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 8 V44 M32 26 H68" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>',
};
const svg = name => `<svg viewBox="0 0 100 100" style="color:var(--c)">${GLYPHS[name]}</svg>`;

// 2. every card in the design
const ROMAN = ['', 'I', 'II', 'III'];
const card = (family, name, detail, look, tier = 0) => ({ family, name, detail, look, tier });
const strikes = ['S', '3S/4', 'S/2', 'S/4'];
const CARDS = {
  long:  [card('long', 'STOCK', 'P&L = S − entry', svg('boltUp')),
          ...strikes.map((k, i) => card('long', 'CALL', 'K = ' + k, svg('boltUp'), [1, 1, 2, 3][i]))],
  short: [card('short', 'STOCK', 'P&L = entry − S', svg('boltDown')),
          ...strikes.map((k, i) => card('short', 'PUT', 'K = ' + k, svg('boltDown'), [1, 1, 2, 3][i]))],
  leverage: [
    ...[1, 4, 9].map((n, i) => card('leverage', 'ADD', 'L + ' + n, `<div class="big">+${n}</div>`, i + 1)),
    ...[2, 5, 10].map((n, i) => card('leverage', 'MULTIPLY', 'L × ' + n, `<div class="big">×${n}</div>`, i + 1)),
    ...[2, 5, 10].map((n, i) => card('leverage', 'POWER', '(L + 1)^' + n, `<div class="big"><small>+1 &amp;</small>^${n}</div>`, i + 1)),
  ],
  special: [
    card('special', 'DOUBLE', 'open trade ×2', '<div class="big">2×</div>'),
    ...['1%', '3%', '8%'].map((p, i) => card('special', 'DIVIDENDS', p + ' at the close', svg('dividend'), i + 1)),
    ...[15, 30, 60].map((t, i) => card('special', 'CEILING', t + ' ticks', svg('ceiling'), i + 1)),
    ...[15, 30, 60].map((t, i) => card('special', 'FLOOR', t + ' ticks', svg('floor'), i + 1)),
    card('special', 'TOP-UP', '+50% margin', svg('topUp'), 1),
  ],
  manip: [
    ...['+5%', '+12%', '+30%'].map((p, i) => card('manip', 'HYPE', p + ', then back', svg('hype'), i + 1)),
    ...['−5%', '−12%', '−30%'].map((p, i) => card('manip', 'BASH', p + ', then back', svg('bash'), i + 1)),
    ...['×1.5', '×2', '×3'].map((p, i) => card('manip', 'TURMOIL', 'σ ' + p, svg('turmoil'), i + 1)),
    ...['×0.7', '×0.5', '×0.25'].map((p, i) => card('manip', 'CALM', 'σ ' + p, svg('calm'), i + 1)),
  ],
};
const cardHtml = c => `<div class="card ${c.family}">
  <div class="family">${c.family.toUpperCase()}</div><div class="tier">${ROMAN[c.tier]}</div>
  <div class="glyph">${c.look}</div><div class="name">${c.name}</div><div class="detail">${c.detail}</div></div>`;
for (const family of Object.keys(CARDS)) document.getElementById(family + 'Row').innerHTML = CARDS[family].map(cardHtml).join('');

// 3. the bench example: long stock, then +4, then ×10
document.getElementById('benchChain').innerHTML = [CARDS.long[0], CARDS.leverage[1], CARDS.leverage[5]]
  .map(cardHtml).join('<span class="arrow">→</span>');

// 4. the shop: four reels, each shows one card, SPIN rerolls all of them
const REELS = [
  { label: 'LONG',     pool: [...CARDS.long, CARDS.special[1], CARDS.special[2], CARDS.special[3], CARDS.special[7], CARDS.special[8], CARDS.special[9]] },
  { label: 'SHORT',    pool: [...CARDS.short, CARDS.special[4], CARDS.special[5], CARDS.special[6]] },
  { label: 'MANIP',    pool: CARDS.manip },
  { label: 'LEVERAGE', pool: [...CARDS.leverage, CARDS.special[0], CARDS.special[10]] },
];
const TIER_PRICES = [40, 40, 100, 250];
const CARD_STEP = 182, SPIN_CARDS = 18, SPIN_SECONDS = 1.1, STOP_STAGGER_SECONDS = 0.22;
let spinPrice = 5, spinning = false;
const pick = pool => pool[Math.floor(Math.random() * pool.length)];
const reelsBox = document.getElementById('reels');
REELS.forEach((reel, index) => {
  reel.shown = pick(reel.pool);
  reelsBox.insertAdjacentHTML('beforeend', `<div class="reel" id="reel${index}">
    <div class="reelLabel">${reel.label}</div>
    <div class="window"><div class="strip">${cardHtml(reel.shown)}</div><div class="sold">SOLD</div></div>
    <div class="price">$${TIER_PRICES[reel.shown.tier]}</div><button class="button">BUY</button></div>`);
  document.querySelector(`#reel${index} .button`).onclick = () => document.getElementById('reel' + index).classList.add('isSold');
});

function spinAll() {
  if (spinning) return;
  spinning = true;
  REELS.forEach((reel, index) => {
    const box = document.getElementById('reel' + index), strip = box.querySelector('.strip');
    const passing = Array.from({ length: SPIN_CARDS }, () => pick(reel.pool));
    const landing = pick(reel.pool);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    strip.innerHTML = [reel.shown, ...passing, landing].map(cardHtml).join('');
    strip.offsetHeight;                                   // apply the start position before animating
    const seconds = SPIN_SECONDS + index * STOP_STAGGER_SECONDS;
    strip.style.transition = `transform ${seconds}s cubic-bezier(.15,.7,.25,1.08)`;
    strip.style.transform = `translateY(${-(SPIN_CARDS + 1) * CARD_STEP}px)`;
    setTimeout(() => {
      reel.shown = landing;
      box.classList.remove('isSold');
      box.querySelector('.price').textContent = '$' + TIER_PRICES[landing.tier];
      box.animate([{ transform: 'translateY(3px)' }, { transform: 'none' }], 120);
      if (index === REELS.length - 1) spinning = false;
    }, seconds * 1000);
  });
  spinPrice += 5;
  document.getElementById('spinButton').textContent = `SPIN · $${spinPrice}`;
}
document.getElementById('spinButton').onclick = spinAll;
</script>
</body></html>
