<!doctype html>
<html><head><meta charset="utf-8"><title>Insider icon</title>
<style>html,body{margin:0;background:transparent}svg{display:block;width:1024px;height:1024px}</style></head>
<body>
<!-- The Insider app icon: a macOS-style rounded tile; a stock chart that drops, then one card (BULL +50%) sends it
     up; a gold eye above it for the insider. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#0d0f12"/>
    <g stroke="#1e242d" stroke-width="6"><path d="M100 380H924M100 540H924M100 700H924"/></g>
    <path d="M150 620 L250 600 L330 680 L420 650 L500 720" fill="none" stroke="#ff5a5f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 720 L560 420 L640 470 L720 380 L860 300" fill="none" stroke="#3ddc84" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="860" cy="300" r="26" fill="#3ddc84"/>
    <g transform="rotate(-10 560 560)">
      <rect x="470" y="470" width="190" height="250" rx="26" fill="#1d232c" stroke="#3ddc84" stroke-width="12"/>
      <text x="565" y="582" font-family="Menlo, monospace" font-weight="800" font-size="64" fill="#3ddc84" text-anchor="middle">+50</text>
      <text x="565" y="660" font-family="Menlo, monospace" font-weight="800" font-size="40" fill="#8592a3" text-anchor="middle">BULL</text>
    </g>
    <g transform="translate(330 250)">
      <path d="M-120 0 Q0 -95 120 0 Q0 95 -120 0Z" fill="#3b3014" stroke="#ffc94d" stroke-width="14"/>
      <circle r="42" fill="#ffc94d"/><circle r="18" fill="#0d0f12"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
  </g>
</svg>
</body></html>
