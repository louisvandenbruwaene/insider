<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#151920;--panel2:#1d232c;--line:#2c3440;--ink:#edf1f5;--dim:#8592a3;--faint:#4a5563;
  --up:#3ddc84;--down:#ff5a5f;--vol:#6cb6ff;--event:#ffc94d;--heat:#ff8a3d;--accent:#ffc94d;
  --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px var(--sans);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .heat{color:var(--heat)} .gold{color:var(--accent)}

#app{position:fixed;inset:0;display:grid;grid-template-columns:310px 1fr;gap:18px;padding:18px}

/* the side menu: the only place with numbers */
#side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;min-height:0}
#brand{font:800 14px var(--mono);letter-spacing:.3em;color:var(--accent)}
.sideHead{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.sideHead b{font-size:15px}
.clock{font:800 24px var(--mono)}
.label{font:700 10px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between}
.value{font-size:22px;font-weight:800;margin-top:2px}
.line{font-size:13px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.rule{border-top:1px solid var(--line);margin-top:14px}
.heatBar{height:6px;border-radius:3px;background:#2a2016;overflow:hidden;margin-top:6px}
.heatBar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff5a3d)}
.sideButtons{margin-top:auto;display:flex;gap:8px;padding-top:14px}
.sideButtons .button{flex:1}
.flashUp{animation:flashUp .45s} .flashDown{animation:flashDown .45s}
@keyframes flashUp{0%{color:var(--up);transform:scale(1.06)}}
@keyframes flashDown{0%{color:var(--down);transform:scale(1.06)}}

/* the main column: chart, then the buttons to press */
#mainColumn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-width:0}
#chartBox{position:relative;width:100%;max-width:980px;height:clamp(260px,54vh,520px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#chart{width:100%;height:100%;display:block}
#lastCards{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
#pauseNote{position:absolute;inset:0;display:none;place-items:center;font:800 32px var(--mono);letter-spacing:.3em;color:var(--accent);background:rgba(0,0,0,.45);pointer-events:none}
.shake{animation:shake .35s} .shakeBig{animation:shakeBig .6s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shakeBig{10%{transform:translate(-12px,5px)}25%{transform:translate(11px,-6px)}40%{transform:translate(-9px,4px)}55%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}
#actions{display:flex;gap:10px;align-items:center;justify-content:center;height:70px;width:100%;max-width:980px}
#actions .gap{width:18px}

.button{font:800 13px var(--sans);letter-spacing:.06em;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel2);padding:12px 18px;cursor:pointer;white-space:nowrap}
.button:hover{filter:brightness(1.2)} .button:active{transform:translateY(2px);border-bottom-width:1px}
.button.primary{background:#3b3014;border-color:#8a6d22;color:#ffe08a;padding:14px 30px;font-size:15px}
.button.locked{opacity:.35;cursor:default;filter:none}
.button kbd{font:600 10px var(--mono);opacity:.55;margin-left:6px}
.button.suggest{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,201,77,.3),0 0 24px rgba(255,201,77,.35)}}
.tipButton{width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;align-content:center;cursor:pointer;position:relative;font:700 10px var(--mono);color:var(--heat)}
.tipButton .icon{font-size:20px;line-height:1.1}
.tipButton.used{border-color:var(--accent);background:#2e2812}
.tipButton.locked,.tipButton.cooling,.tipButton.unavailable{opacity:.3;cursor:default}
.tipButton .cd{position:absolute;top:2px;right:4px;color:var(--dim)}
.toggle{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:700 12px var(--sans)}
.toggle.on{background:#2b3a52;border-color:var(--vol);color:#d3e8ff}
.toggle.locked{opacity:.35;cursor:default}

/* card chips (the last card drawn, the deck window, the deck picker) */
.chip{flex:none;height:30px;min-width:46px;padding:0 8px;border-radius:7px;display:inline-grid;place-items:center;font:700 12px var(--mono);border:1px solid;background:var(--panel2)}
.chip.price.pos{color:var(--up);border-color:#1f6b43} .chip.price.neg{color:var(--down);border-color:#7a2b2e}
.chip.vol{color:var(--vol);border-color:#2a4f78} .chip.event{color:var(--event);border-color:#7a5f1f}
.chip.extreme{box-shadow:0 0 0 2px currentColor inset}
.chip.future{border-style:dashed;opacity:.75}
.chip.fresh{animation:pop .3s}
@keyframes pop{0%{transform:translateY(-10px) scale(1.35)}}

/* overlays */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
#overlay.soft{background:rgba(5,6,8,.45);backdrop-filter:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 30px;box-shadow:0 10px 0 #050608;text-align:center;max-width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font:800 26px var(--sans)}
.card .title{font:800 54px var(--mono);letter-spacing:.3em;color:var(--accent);margin:8px 0 2px}
.card .huge{font:800 56px var(--mono);margin:6px 0;font-variant-numeric:tabular-nums}
.card .note{color:var(--dim);margin:5px 0;font-family:var(--mono)}
.menuButtons{display:flex;gap:12px;justify-content:center;margin-top:18px}
.key{font:600 12px var(--mono);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 7px;background:var(--panel2)}
.keys{margin-top:16px;display:flex;gap:8px;justify-content:center;align-items:center;color:var(--dim)}

/* the trade menu: one question at a time */
.tradeCard{width:560px;text-align:left}
.tradeCard h1{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.tradeCard h1 small{font:600 13px var(--mono);color:var(--dim)}
.choiceRow{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-top:7px;cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
.choiceRow .number{color:var(--faint);width:12px}
.choiceRow .main{font-weight:800;font-size:15px;white-space:nowrap}
.choiceRow .detail{white-space:nowrap}
.choiceRow .detail{margin-left:auto;color:var(--dim);font-size:12px}
.choiceRow.selected{border-color:var(--accent);background:#2a2514}
.choiceRow.locked{opacity:.35;cursor:default}
.openChip{height:28px;padding:0 6px;border-radius:7px;border:1px solid currentColor;background:var(--panel);display:inline-flex;align-items:center;gap:3px;font-size:15px;cursor:pointer;flex:none}
.openChip kbd{font:700 10px var(--mono)}
.openChip:hover{filter:brightness(1.3)}
.positionBox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0 4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.slider{width:100%;accent-color:var(--accent);margin:18px 0 6px;height:26px}
.sliderEnds{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--faint)}
.amount{font:800 20px var(--mono);text-align:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.amountNote{font:600 12px var(--mono);text-align:center;color:var(--dim);height:18px}
.tradeCard .confirm{width:100%;margin-top:16px}

/* the deck window */
.card.fullScreen{width:calc(100vw - 48px);height:calc(100vh - 48px);display:flex;flex-direction:column}
.deckGrid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr;gap:14px;margin-top:18px;min-height:0}
.deckCard{border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:10px;font:700 14px var(--mono)}
.deckCard .chip{height:40px;min-width:70px;font-size:16px}
.deckCard .count{font-size:26px} .deckCard .count small{color:var(--faint);font-size:14px}
.deckCard.gone{opacity:.3}

/* shop and deck picker cards */
.shopHead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.shopHead h1{margin:0}
.spacer{flex:1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;font-family:var(--mono)}
.slot small{font:600 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.shopRows{display:grid;gap:10px;text-align:left}
.shopRow{display:flex;gap:10px;align-items:center}
.shopRow .rowName{width:72px;font:700 11px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.choice{width:118px;height:118px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;box-shadow:0 4px 0 #050608;transition:transform .08s;position:relative;text-align:center;padding:4px}
.choice .icon{font-size:30px;line-height:1.1}
.choice .nm{font:700 12px var(--sans)}
.choice .chipLine{font:700 11px var(--mono);color:var(--dim)}
.choice .price{font:700 12px var(--mono);color:var(--accent)}
.choice .price.poor{color:var(--down)}
.choice.selected{border-color:var(--accent);transform:translateY(-5px);box-shadow:0 9px 0 #050608,0 0 18px rgba(255,201,77,.25)}
.choice.owned{opacity:.45} .choice.owned .price{color:var(--up)}
.choice.locked{opacity:.35}
#selectedSentence{height:24px;margin-top:14px;color:var(--ink);font-size:15px}
#tooltip{position:fixed;z-index:20;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:600 12px var(--sans);display:none;max-width:260px}
</style></head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="mainColumn">
    <div id="chartBox"><canvas id="chart"></canvas><div id="lastCards"></div><div id="pauseNote">PAUSED</div></div>
    <div id="actions"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="tooltip"></div>
<script id="game">
"use strict";
/* INSIDER — a trading roguelike. A stock's price is a deck of cards: every second one card is drawn and moves the
   price (up +1%, BEAR −50%) or its volatility σ (volUP: every later move is 5% bigger). The deck is fair, so the
   edge has to come from you: insider tips you use before the open (they raise SEC heat), cards you strip out of or
   add to the deck in the shop, and the leverage and options you unlock. Trading money and shop money are the same
   cash. Every day prices inflate 1%, every 10 days the investors want to see a target, and the run ends when you
   have no money left to trade.

   File guide (search "§ 1" etc.):
   § 1 SETTINGS        every tunable number, card, ticker, tip and shop price
   § 2 HELPERS         number formatting, seeded random numbers, shuffling
   § 3 DECKS           card labels, deck sizes, turning a deck into a pile of cards
   § 4 MARKET          one tick of the market, the day's schedule, the market maker's forecast
   § 5 ACCOUNT         values and equity, margin, stock trades, option trades, expiry
   § 6 INSIDER & HEAT  what each tip reveals, heat, investigations
   § 7 RUN             markets, days, the close, meetings, the shop catalogue, deck edits, saving
   § 8 SOUND           small synthesised effects
   § 9 CHART           last week, today and the forecast (top 10%, average, bottom 10%)
   § 10 PANELS         the side menu, the action buttons, the last card drawn
   § 11 OVERLAYS       title, menu, day result, game over, deck window, trade menu, shop, deck picker
   § 12 INPUT          actions, mouse, keyboard, tooltips
   § 13 START          main loop and start-up (only in a browser; tools/ load §1-§7 headless) */

// ═══════════════════════════════════════ § 1 SETTINGS ═══════════════════════════════════════
const SAVE_KEY = 'insider.save.v1';             // the running game (written every tick, so quitting mid-day resumes there)
const SAVE_VERSION = 3;                         // saves from other versions are not resumed
const RECORDS_KEY = 'insider.records.v1';       // best equity and longest run, kept across runs
const PREFERENCES_KEY = 'insider.preferences.v1'; // sound and speed

// 1.1 The run
const STARTING_CASH = 1000;
const INFLATION_PER_DAY = 0.01;                 // shop prices grow ×(1.01)^(day−1); stocks gain 1% overnight
const BASE_OPEN_PRICE = 100;                    // a stock opens day 1 at this price (after a week of history)
const MINIMUM_CASH_TO_TRADE = 10;               // × inflation: below this after the close the run is over

// 1.2 The trading day
const TICKS_PER_DAY = 90;                       // one card (or one event) per tick
const SECONDS_PER_TICK = 1;                     // at 1× speed
const GAME_SPEEDS = [1, 2, 4];
const HALT_SECONDS = 10;                        // a Halt card freezes the price this long (you can still trade)

// 1.3 Cards. Price cards move the price by move × σ. Vol cards multiply σ by factor. σ starts each day at 1.
const CARD_TYPES = {
  up:       { category: 'price', move: +0.01 },
  down:     { category: 'price', move: -0.01 },
  UP:       { category: 'price', move: +0.05 },
  DOWN:     { category: 'price', move: -0.05 },
  bull:     { category: 'price', move: +0.10 },
  bear:     { category: 'price', move: -0.10 },
  BULL:     { category: 'price', move: +0.50 },
  BEAR:     { category: 'price', move: -0.50 },
  volup:    { category: 'vol', factor: 1.01 },
  voldown:  { category: 'vol', factor: 0.99 },
  volUP:    { category: 'vol', factor: 1.05 },
  volDOWN:  { category: 'vol', factor: 0.95 },
  volbull:  { category: 'vol', factor: 1.10 },
  volbear:  { category: 'vol', factor: 0.90 },
  volBULL:  { category: 'vol', factor: 1.50 },
  volBEAR:  { category: 'vol', factor: 0.50 },
  earnings: { category: 'event', icon: '📊', name: 'Earnings', sentence: 'The next 3 cards all hit the price in the same second.' },
  fed:      { category: 'event', icon: '🏛', name: 'Fed speech', sentence: 'σ is doubled for the next 15 ticks.' },
  halt:     { category: 'event', icon: '⏸', name: 'Halt', sentence: 'The price freezes for 10 seconds. You can still trade.' },
  momentum: { category: 'event', icon: '🔁', name: 'Momentum', sentence: 'Repeats the last price move.' },
  squeeze:  { category: 'event', icon: '🚀', name: 'Squeeze', sentence: 'Shorts are forced to buy: price +25% × σ.' },
};
const CARD_ORDER = ['up', 'down', 'UP', 'DOWN', 'bull', 'bear', 'BULL', 'BEAR',
  'volup', 'voldown', 'volUP', 'volDOWN', 'volbull', 'volbear', 'volBULL', 'volBEAR',
  'earnings', 'fed', 'halt', 'momentum', 'squeeze'];
const EVENT_CARDS = ['earnings', 'fed', 'halt', 'momentum', 'squeeze'];
const PRICE_MOVE_FLOOR = -0.9;                  // no single move takes more than 90% off the price
const VOLATILITY_MINIMUM = 0.25, VOLATILITY_MAXIMUM = 4;
const EARNINGS_EXTRA_CARDS = 3;
const FED_TICKS = 15, FED_VOLATILITY_MULTIPLIER = 2;
const SQUEEZE_MOVE = 0.25;
const BIG_CARD_MOVE = 0.10;                     // price moves this big (or vol factors this far from 1) shake the chart

// 1.4 Tickers: each stock is its own deck (how many copies of each card). NOVA is the starting stock; the others
// are bought in the shop. Event cards start at 0 and are added in the shop.
const TICKERS = {
  NOVA: { name: 'Nova Corp', icon: '◆', sentence: 'The starting stock: every card has its mirror.', deck: {
    up: 100, down: 100, UP: 100, DOWN: 100, bull: 10, bear: 10, BULL: 1, BEAR: 1,
    volup: 100, voldown: 100, volUP: 100, volDOWN: 100, volbull: 10, volbear: 10, volBULL: 1, volBEAR: 1 } },
  UTIL: { name: 'Util Power', icon: '⚡', sentence: 'A calm utility: mostly 1% moves, no BULL or BEAR.', deck: {
    up: 200, down: 200, UP: 30, DOWN: 30, bull: 2, bear: 2, BULL: 0, BEAR: 0,
    volup: 200, voldown: 200, volUP: 30, volDOWN: 30, volbull: 2, volbear: 2, volBULL: 0, volBEAR: 0 } },
  BIOX: { name: 'Biox Labs', icon: '🧬', sentence: 'A biotech on trial news: 10% and 50% moves are common.', deck: {
    up: 40, down: 40, UP: 60, DOWN: 60, bull: 30, bear: 30, BULL: 5, BEAR: 5,
    volup: 40, voldown: 40, volUP: 60, volDOWN: 60, volbull: 30, volbear: 30, volBULL: 5, volBEAR: 5 } },
};
const STARTING_TICKER = 'NOVA';

// 1.5 Costs: the only costs in the game are transaction costs
const STOCK_TRANSACTION_COST = 0.001;           // 0.1% of the traded value
const OPTION_TRANSACTION_COST = 0.03;           // options are bought 3% above and sold 3% below fair value
const SMALLEST_TRADE = 0.01;                    // trades worth less than one cent are not made
const WORTHLESS_OPTION = 1e-6;                  // an option worth less than this share of the stock price can't be traded

// 1.6 The trade menu
const SLIDER_DEFAULT_PERCENT = 50;              // the amount slider starts here …
const SLIDER_STEP_PERCENT = 5;                  // … and moves in these steps (← → keys too)
const CALL_STRIKE_OFFSETS = [-0.1, 0, 0.05, 0.1, 0.2, 0.35, 0.5, 1];      // strikes offered, vs the current price
const PUT_STRIKE_OFFSETS = [0.1, 0, -0.05, -0.1, -0.2, -0.35, -0.5, -0.75];
const LEVERAGE_TIERS = [1, 2, 5, 10, 25, 100];  // buying power = equity × leverage
const LEVERAGE_PRICES = [0, 250, 1500, 8000, 50000, 500000];
const MAINTENANCE_SHARE = 0.5;                  // margin call when equity < exposure × this ÷ leverage

// 1.7 The market maker prices options fairly from the cards left in the deck
const FORECAST_PATHS = 600;                     // simulated futures per forecast
const FORECAST_DAYS_AHEAD = 7;                  // the forecast runs to the close 7 trading days after today
const FORECAST_EVERY_TICKS = 3;                 // re-run it this often during the day (and before every trade)
const FORECAST_LOW_QUANTILE = 0.1;              // the chart shows the bottom 10%, the average and the top 10% close
const FORECAST_HIGH_QUANTILE = 0.9;
const OPTION_EXPIRY_DAYS = 7;                   // options expire at the close 7 trading days after they are traded
const HISTORY_DAYS = 7;                         // the chart shows the previous week

// 1.8 Insider tips: used before the open, each adds heat and then rests for some days
const INSIDER_TIPS = {
  rumour:     { icon: '👂', name: 'Rumour',     heat: 10, cooldownDays: 1, price: 0,     short: '▲ / ▼',   sentence: 'Tells you if the stock closes above or below the open.' },
  analyst:    { icon: '📝', name: 'Analyst',    heat: 20, cooldownDays: 2, price: 700,   short: '±3%',     sentence: 'The close lies inside a band 6% wide.' },
  peek:       { icon: '👁', name: 'Peek',       heat: 25, cooldownDays: 2, price: 1200,  short: '10 cards', sentence: 'Shows the first 10 cards of the day, in order.' },
  volatility: { icon: '〰', name: 'Vol tip',    heat: 15, cooldownDays: 2, price: 500,   short: 'σ path',   sentence: 'Draws the day\'s σ over the chart.' },
  exactClose: { icon: '🎯', name: 'The Call',   heat: 60, cooldownDays: 5, price: 20000, short: 'close',    sentence: 'The exact closing price.' },
};
const TIP_ORDER = ['rumour', 'analyst', 'peek', 'volatility', 'exactClose'];
const STARTING_TIPS = ['rumour'];
const ANALYST_BAND = 0.03;                      // the band reaches this far either side of its centre
const PEEK_CARDS = 10;

// 1.9 Heat and the SEC
const HEAT_LIMIT = 100;                         // reaching it at the close starts an investigation
const HEAT_DECAY_PER_DAY = 12;
const ABNORMAL_RETURN = 0.25;                   // a day above +25% draws attention …
const HEAT_PER_ABNORMAL_RETURN = 40;            // … this much heat per +100% above it …
const HEAT_ABNORMAL_CAP = 50;                   // … at most this much in one day
const HEAT_PER_DECK_EDIT = 4;                   // rigging the deck is noticed too
const INVESTIGATION_DAYS = 3;                   // no tips, no options, leverage 1×
const HEAT_AFTER_INVESTIGATION = 50;

// 1.10 Investor meetings: at the close of every 10th day equity must reach STARTING_CASH × inflation × the multiple
const MEETING_EVERY_DAYS = 10;
const MEETING_MULTIPLES = [1.2, 2, 5, 20, 100, 800, 1e4, 2e5, 1e7, 1e9];
const MEETING_GROWTH_AFTER_LAST = 30;           // the endless meetings after the last one grow ×30 each

// 1.11 The shop (all prices × inflation)
const DECK_BATCH_FIRST = 10;                    // the first remove takes 10 cards, the next 9, … down to 1
const DECK_BATCH_MINIMUM = 1;
const REMOVE_PRICE = 100, ADD_PRICE = 100;
const DECK_EDIT_PRICE_GROWTH = 1.6;             // each remove (or add) costs this much more than the last
const MINIMUM_DECK_SIZE = 150;                  // a deck is never thinned below this
const EVENT_CARD_PRICES = { earnings: 250, fed: 200, halt: 150, momentum: 300, squeeze: 400 };
const EVENT_PRICE_GROWTH = 1.3;                 // each copy bought costs this much more
// The four option positions, each bought separately in the shop (shorting stock needs no unlock).
// P&L per option. S = the stock price when the option is exercised (any time up to expiry, OPTION_EXPIRY_DAYS
// trading days after the trade), K = the strike price, premium = the option's price (paid long, received short).
const OPTION_POSITIONS = {
  longCall:  { direction: 'long',  type: 'call', name: 'Long call',  icon: '📈', price: 300, formula: 'P&L = max(S − K, 0) − premium' },
  shortCall: { direction: 'short', type: 'call', name: 'Short call', icon: '🧾', price: 400, formula: 'P&L = premium − max(S − K, 0)' },
  longPut:   { direction: 'long',  type: 'put',  name: 'Long put',   icon: '🛡', price: 300, formula: 'P&L = max(K − S, 0) − premium' },
  shortPut:  { direction: 'short', type: 'put',  name: 'Short put',  icon: '🪙', price: 400, formula: 'P&L = premium − max(K − S, 0)' },
};
const TICKER_PRICES = { UTIL: 800, BIOX: 1500 };

// 1.12 Look
const CHART_COLOURS = { up: '#3ddc84', down: '#ff5a5f', average: '#edf1f5', openPrice: '#3a4350', label: '#8592a3', grid: '#1e242d', history: '#6b7686',
  entry: '#ffc94d', stop: '#ff8a3d', insight: '#ffc94d', volatility: '#6cb6ff' };
const CHART_ANALYST_BAND = 'rgba(255,201,77,.22)'; // the Analyst tip's band at the close
const CHART_HISTORY_SHARE = 0.34;               // share of the chart's width for the previous week …
const CHART_TODAY_SHARE = 0.42;                 // … for today (the rest is the forecast fan)
const CHART_HISTORY_STEP = 3;                   // draw every 3rd tick of past days
const SIDE_OPTIONS_SHOWN = 3;                   // option positions listed in the side menu
const STOCK_ICON = '📦';                         // marks the open stock position in the trade menu (options use their own icon)
const OPEN_TRADE_KEYS = 'abcdefghijklmnopqrstuvwxyz'; // keys that open the open trades' icons, in order
const EQUITY_FLASH_CHANGE = 0.002;              // the equity number flashes when it moves more than 0.2% …
const POPUP_CHANGE = 0.01;                      // … and a +$ / −$ popup appears over the chart above 1%
const POPUP_SECONDS = 1.2;                    // P&L pops and messages over the chart fade in this time
const POPUPS_SHOWN = 3;                       // at most this many at once, stacked

// ═══════════════════════════════════════ § 2 HELPERS ═══════════════════════════════════════
// Money and big numbers: plain below 10 000, then K/M/B/T, then scientific notation.
function formatMoney(value) {
  const sign = value < 0 ? '−' : '';
  const size = Math.abs(value);
  if (size < 100) return sign + '$' + size.toFixed(2);
  if (size < 1e4) return sign + '$' + Math.round(size).toLocaleString('en-US');
  const units = [[1e15, 'Q'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  if (size >= 1e18) return sign + '$' + size.toExponential(2).replace('e+', 'e');
  for (const [unit, letter] of units) if (size >= unit) return sign + '$' + (size / unit).toFixed(size / unit < 100 ? 2 : 1) + letter;
  return sign + '$' + size.toFixed(0);
}
function formatPrice(price) { return price < 1e4 ? '$' + price.toFixed(2) : formatMoney(price); }
function formatSignedMoney(value) { return (value >= 0 ? '+' : '') + formatMoney(value); }
function formatPercent(fraction, digits = 1) { return (fraction >= 0 ? '+' : '−') + Math.abs(fraction * 100).toFixed(digits) + '%'; }
function formatCount(value) {
  if (Math.abs(value) < 1000) return value.toFixed(Math.abs(value) < 10 ? 2 : 1);
  return formatMoney(value).replace('$', '');
}

// Seeded random numbers: the same seed gives the same numbers, so a day's shuffle is the same after a reload.
// makeRandom is a standard small generator (mulberry32) and mixSeed a standard hash (FNV-1a); their details
// do not matter for the game.
function makeRandom(seed) {
  let counter = seed >>> 0;
  return function random() {                                // a number from 0 up to (not including) 1
    counter = (counter + 0x6D2B79F5) >>> 0;
    let scrambled = Math.imul(counter ^ (counter >>> 15), 1 | counter);
    scrambled = (scrambled + Math.imul(scrambled ^ (scrambled >>> 7), 61 | scrambled)) ^ scrambled;
    return ((scrambled ^ (scrambled >>> 14)) >>> 0) / 4294967296;
  };
}
function mixSeed(...numbers) {
  let hash = 2166136261;
  for (const number of numbers) { hash ^= number >>> 0; hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
}
function shuffleInPlace(list, random) {
  for (let index = list.length - 1; index > 0; index--) {
    const other = Math.floor(random() * (index + 1));
    [list[index], list[other]] = [list[other], list[index]];
  }
  return list;
}
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function inflationIndex(day) { return Math.pow(1 + INFLATION_PER_DAY, day - 1); }

// ═══════════════════════════════════════ § 3 DECKS ═══════════════════════════════════════
// The short text on a card chip: "+5%" for price cards, "σ+5%" for vol cards, the icon for events.
function cardValueText(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.category === 'price') return (card.move > 0 ? '+' : '−') + Math.abs(card.move * 100) + '%';
  if (card.category === 'vol') return 'σ' + (card.factor > 1 ? '+' : '−') + Math.round(Math.abs(card.factor - 1) * 100) + '%';
  return card.icon;
}
function cardLabel(cardId) { return CARD_TYPES[cardId].category === 'event' ? CARD_TYPES[cardId].name : cardId; }
// Is this card dramatic enough to shake the chart? (2 = a BULL/BEAR-sized shock)
function cardImpact(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.category === 'price') return Math.abs(card.move) >= 0.5 ? 2 : Math.abs(card.move) >= BIG_CARD_MOVE ? 1 : 0;
  if (card.category === 'vol') return Math.abs(card.factor - 1) >= 0.5 ? 2 : Math.abs(card.factor - 1) >= BIG_CARD_MOVE ? 1 : 0;
  return 1;
}
function deckSize(deck) { return CARD_ORDER.reduce((total, cardId) => total + (deck[cardId] || 0), 0); }
// All the cards of a deck as one list of ids, ready to shuffle.
function deckToCardList(deck) {
  const cardList = [];
  for (const cardId of CARD_ORDER) for (let copy = 0; copy < (deck[cardId] || 0); copy++) cardList.push(cardId);
  return cardList;
}
function countCards(cardList) {
  const counts = {};
  for (const cardId of CARD_ORDER) counts[cardId] = 0;
  for (const cardId of cardList) counts[cardId]++;
  return counts;
}

// ═══════════════════════════════════════ § 4 MARKET ═══════════════════════════════════════
// The market state is { price, volatility (σ), fedTicksLeft, lastPriceMove }. One tick draws one card (an Earnings card draws
// three more) through drawCard(), which always returns a card id. The same function runs the real day and the
// market maker's simulations, so the forecast is exactly as fair as the game.
function applyPriceMove(market, rawMove) {
  const volatility = market.volatility * (market.fedTicksLeft > 0 ? FED_VOLATILITY_MULTIPLIER : 1);
  market.price *= 1 + Math.max(PRICE_MOVE_FLOOR, rawMove * volatility);
  market.lastPriceMove = rawMove;
}
function applyCard(market, cardId, drawCard, cardsApplied) {
  const card = CARD_TYPES[cardId];
  cardsApplied.push(cardId);
  if (card.category === 'price') applyPriceMove(market, card.move);
  else if (card.category === 'vol') market.volatility = clamp(market.volatility * card.factor, VOLATILITY_MINIMUM, VOLATILITY_MAXIMUM);
  else if (cardId === 'earnings') {
    for (let extra = 0; extra < EARNINGS_EXTRA_CARDS; extra++) applyCard(market, drawCard(), drawCard, cardsApplied);
  }
  else if (cardId === 'fed') market.fedTicksLeft = FED_TICKS + 1;
  else if (cardId === 'momentum') applyPriceMove(market, market.lastPriceMove);
  else if (cardId === 'squeeze') applyPriceMove(market, SQUEEZE_MOVE);
  // 'halt' does nothing to the price: the live day pauses on it
}
function tickMarket(market, drawCard) {
  if (market.fedTicksLeft > 0) market.fedTicksLeft--;
  const cardsApplied = [];
  applyCard(market, drawCard(), drawCard, cardsApplied);
  return cardsApplied;
}

// The deck is dealt from a draw pile: the shuffled cards not drawn yet. It lasts several days (NOVA: 844 cards at
// 90 a day); when it runs out a fresh shuffle of the whole deck replaces it, in the middle of a day if need be.
// The whole day is fixed at the open: insider tips read this schedule, the live day replays it one tick per second.
// schedule.drawPiles holds the draw pile the day starts with (and a fresh one if it ran out);
// positions[tick] = [which draw pile, how many cards of it are drawn].
function scheduleDay(drawPile, deck, openPrice, random) {
  const drawPiles = [drawPile.slice()];
  let drawPileIndex = 0, cardsTakenFromPile = 0, cardsDrawnToday = 0;
  const drawCard = () => {
    if (cardsTakenFromPile >= drawPiles[drawPileIndex].length) {          // the pile is empty: shuffle the whole deck
      drawPiles.push(shuffleInPlace(deckToCardList(deck), random));
      drawPileIndex++;
      cardsTakenFromPile = 0;
    }
    cardsDrawnToday++;
    return drawPiles[drawPileIndex][cardsTakenFromPile++];
  };
  const market = { price: openPrice, volatility: 1, fedTicksLeft: 0, lastPriceMove: 0 };
  const schedule = { states: [{ ...market }], cards: [[]], drawPiles, pilePositions: [[0, 0]], drawnBefore: [0] };
  for (let tick = 1; tick <= TICKS_PER_DAY; tick++) {
    schedule.cards.push(tickMarket(market, drawCard));
    schedule.states.push({ ...market });
    schedule.pilePositions.push([drawPileIndex, cardsTakenFromPile]);
    schedule.drawnBefore.push(cardsDrawnToday);
  }
  return schedule;
}
// The cards still in the draw pile after this tick (what the market maker counts on).
function drawPileAfter(schedule, tick) {
  const [drawPileIndex, cardsTaken] = schedule.pilePositions[tick];
  return schedule.drawPiles[drawPileIndex].slice(cardsTaken);
}
// Overnight the price grows with inflation; σ, the Fed and momentum reset.
function nextOpenPrice(closePrice) { return closePrice * (1 + INFLATION_PER_DAY); }

// The market maker knows which cards are left in the draw pile and what the whole deck holds, but not the order. It
// plays out the rest of today and the next daysAhead days many times, with the same tickMarket as the real day.
// Returns closesByDay[k][path]: the close k days from today (k = 0 is today's close).
function simulateForecast(market, remainingDrawPile, deck, ticksLeftToday, daysAhead, paths, random) {
  const wholeDeck = deckToCardList(deck);
  const closesByDay = Array.from({ length: daysAhead + 1 }, () => []);
  for (let path = 0; path < paths; path++) {
    const marketState = { ...market };
    let cardsLeft = remainingDrawPile.slice();
    const drawCard = () => {                       // a random card from what is left; a fresh deck when the pile is empty
      if (cardsLeft.length === 0) cardsLeft = wholeDeck.slice();
      const index = Math.floor(random() * cardsLeft.length);
      const card = cardsLeft[index];
      cardsLeft[index] = cardsLeft[cardsLeft.length - 1];
      cardsLeft.pop();
      return card;
    };
    for (let day = 0; day <= daysAhead; day++) {
      if (day > 0) Object.assign(marketState, { price: nextOpenPrice(marketState.price), volatility: 1, fedTicksLeft: 0, lastPriceMove: 0 });
      const ticks = day === 0 ? ticksLeftToday : TICKS_PER_DAY;
      for (let tick = 0; tick < ticks; tick++) tickMarket(marketState, drawCard);
      closesByDay[day].push(marketState.price);
    }
  }
  return closesByDay;
}

// What one option pays when exercised at price S: max(S − K, 0) for a call, max(K − S, 0) for a put.
function payoff(type, strikePrice, price) { return Math.max(0, type === 'call' ? price - strikePrice : strikePrice - price); }
// The value of an option held to expiry: its average payoff over the simulated closes.
function averagePayoff(closes, type, strikePrice) {
  let total = 0;
  for (const closePrice of closes) total += payoff(type, strikePrice, closePrice);
  return total / closes.length;
}

// ═══════════════════════════════════════ § 5 ACCOUNT ═══════════════════════════════════════
// What you own. run.cash can go negative (money borrowed on margin) and grows when you short stock or options (you
// receive the money). run.today.shares is the stock position: positive = long, negative = short. Each option position is
// { type: 'call' | 'put', direction: 'long' | 'short', strikePrice, quantity, premiumTotal, expiryDay }, where premiumTotal is what was paid
// (long) or received (short). Positions are held overnight; options expire at the close of their expiryDay.

// ── 5.1 Prices and values
function currentPrice(today) { return today.schedule.states[today.tick].price; }
function accountLeverage(run) { return LEVERAGE_TIERS[run.leverageTier]; }
// New trades are capped at 1× during an investigation. The margin call keeps using the account's own leverage,
// so positions carried into an investigation are not liquidated by the cap itself.
function maximumLeverage(run) { return run.today && run.today.investigation ? 1 : accountLeverage(run); }

// One option is worth the higher of exercising it now (its payoff at today's price) and holding it to expiry (the
// forecast's average payoff at the expiry day's close). At the close of its last day only exercising is left.
function valueOfOneOption(run, type, strikePrice, expiryDay) {
  const today = run.today, daysLeft = expiryDay - run.day;
  const exerciseNow = payoff(type, strikePrice, currentPrice(today));
  const lastMoment = daysLeft <= 0 && today.tick >= TICKS_PER_DAY;
  if (lastMoment || !today.forecast) return exerciseNow;
  const holdToExpiry = averagePayoff(today.forecast[clamp(daysLeft, 0, FORECAST_DAYS_AHEAD)], type, strikePrice);
  return Math.max(exerciseNow, holdToExpiry);
}
// For an option position: optionWorth is what its options are worth (never negative). optionBuyIn and optionValueNow
// carry the sign of the position: + for long, − for short (a short option is money received, and a debt now).
function directionSign(option) { return option.direction === 'short' ? -1 : 1; }
function optionWorth(run, option) { return valueOfOneOption(run, option.type, option.strikePrice, option.expiryDay) * option.quantity; }
function optionBuyIn(option) { return directionSign(option) * option.premiumTotal; }
function optionValueNow(run, option) { return directionSign(option) * optionWorth(run, option); }
function daysToExpiry(run, option) { return option.expiryDay - run.day; }

// Equity: cash plus everything at its value now.
function totalEquity(run) {
  if (!run.today) return run.cash;
  const optionsValue = run.today.options.reduce((total, option) => total + optionValueNow(run, option), 0);
  return run.cash + run.today.shares * currentPrice(run.today) + optionsValue;
}
function hasPositions(run) { return run.today.shares !== 0 || run.today.options.length > 0; }

// ── 5.2 Margin. Margin equity leaves out bought options (a broker lends nothing on them). Exposure is the stock
// position's size plus short options counted like a short of that many shares.
function shortOptions(run) { return run.today.options.filter(option => option.direction === 'short'); }
function shortOptionDebt(run) { return shortOptions(run).reduce((total, option) => total + optionWorth(run, option), 0); }
function shortOptionShares(run) { return shortOptions(run).reduce((total, option) => total + option.quantity, 0); }
function marginEquity(run) { return run.cash + run.today.shares * currentPrice(run.today) - shortOptionDebt(run); }
function exposure(run) {
  const price = currentPrice(run.today);
  return Math.abs(run.today.shares * price) + shortOptionShares(run) * price;
}
function buyingPower(run) { return Math.max(0, marginEquity(run)) * maximumLeverage(run) / (1 + STOCK_TRANSACTION_COST); }
// Cash not needed as margin: what long options can be bought with.
function freeCash(run) { return Math.max(0, marginEquity(run) - exposure(run) / maximumLeverage(run)); }

// Run after every tick: below the maintenance margin the stock and the short options are closed.
function checkMargin(run) {
  if (exposure(run) === 0) return null;
  if (marginEquity(run) >= exposure(run) * MAINTENANCE_SHARE / accountLeverage(run)) return null;
  closeStock(run);
  for (let index = run.today.options.length - 1; index >= 0; index--)
    if (run.today.options[index].direction === 'short') closeOption(run, index);
  return 'Margin call!';
}

// ── 5.3 Stock trades
// Move the stock position to newShares at the current price, paying the transaction cost. The entry price is the
// average price paid for the shares now held; it resets when the position closes or turns around.
function setShares(run, newShares) {
  const today = run.today, price = currentPrice(today);
  const change = newShares - today.shares;
  if (change === 0) return 0;
  run.cash -= change * price + Math.abs(change) * price * STOCK_TRANSACTION_COST;
  const sameDirection = today.shares !== 0 && Math.sign(newShares) === Math.sign(today.shares);
  const growing = Math.abs(newShares) > Math.abs(today.shares);
  if (newShares === 0) today.averageEntryPrice = 0;
  else if (!sameDirection) today.averageEntryPrice = price;
  else if (growing) today.averageEntryPrice = (today.averageEntryPrice * today.shares + price * change) / newShares;
  today.shares = newShares;
  today.tradeCount++;
  return change;
}
// How many shares can still be bought (direction +1) or shorted (−1) with the buying power left.
function sharesAvailable(run, direction) {
  const largestPosition = Math.max(0, buyingPower(run) - shortOptionShares(run) * currentPrice(run.today)) / currentPrice(run.today);
  return Math.max(0, largestPosition - direction * run.today.shares);
}
// Buy (+1) or short (−1) this fraction of the shares available. Returns the share change, or why nothing happened.
function tradeStock(run, direction, fraction) {
  const change = direction * fraction * sharesAvailable(run, direction);
  if (Math.abs(change) * currentPrice(run.today) < SMALLEST_TRADE) return 'Nothing to trade';
  setShares(run, run.today.shares + change);
  return change;
}
function closeStock(run) { return setShares(run, 0); }
// Close this fraction (0..1) of the stock position, long or short.
function closeStockPart(run, fraction) { return setShares(run, fraction >= 1 ? 0 : run.today.shares * (1 - fraction)); }

// ── 5.4 Option trades
function optionPositionId(direction, type) { return direction + type[0].toUpperCase() + type.slice(1); }   // 'long', 'call' → 'longCall'
function optionsAllowed(run, direction, type) {
  return run.unlocked[optionPositionId(direction, type)] && !run.today.investigation && run.today.tick < TICKS_PER_DAY;
}
function strikeOffsets(type) { return type === 'call' ? CALL_STRIKE_OFFSETS : PUT_STRIKE_OFFSETS; }
function newExpiryDay(run) { return run.day + OPTION_EXPIRY_DAYS; }
// The prices of one option: buyPrice = what you pay to go long, sellPrice = what you receive to go short.
function optionPrices(run, type, strikePrice, expiryDay = newExpiryDay(run)) {
  const fairValue = valueOfOneOption(run, type, strikePrice, expiryDay);
  return { fairValue, buyPrice: fairValue * (1 + OPTION_TRANSACTION_COST), sellPrice: fairValue * (1 - OPTION_TRANSACTION_COST) };
}
function isWorthless(premium, run) { return premium <= currentPrice(run.today) * WORTHLESS_OPTION; }
// How many options can be shorted: like shorting that many shares.
function optionsAvailableToShort(run) {
  return Math.max(0, (Math.max(0, marginEquity(run)) * maximumLeverage(run) - exposure(run)) / currentPrice(run.today));
}
// A new option position joins an open one of the same option (same type, direction, strike price and expiry).
function addOption(run, newOption) {
  const same = run.today.options.find(option => option.type === newOption.type && option.direction === newOption.direction
    && option.expiryDay === newOption.expiryDay && Math.abs(option.strikePrice - newOption.strikePrice) < 1e-9);
  if (same) { same.quantity += newOption.quantity; same.premiumTotal += newOption.premiumTotal; }
  else run.today.options.push(newOption);
  run.today.tradeCount++;
}
// Long options for this fraction of free cash. Returns the quantity, or why nothing happened.
function buyOption(run, type, strikePrice, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'long', type)) return 'Options locked';
  const { buyPrice } = optionPrices(run, type, strikePrice, expiryDay);
  if (isWorthless(buyPrice, run)) return 'Worth nothing at that strike';
  const cashToSpend = fraction * freeCash(run);
  if (cashToSpend < SMALLEST_TRADE) return 'No free cash';
  run.cash -= cashToSpend;
  addOption(run, { type, direction: 'long', strikePrice, quantity: cashToSpend / buyPrice, premiumTotal: cashToSpend, expiryDay });
  return cashToSpend / buyPrice;
}
// Short options for this fraction of what is available: the premium comes in now, the payoff is owed when exercised.
function writeOption(run, type, strikePrice, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'short', type)) return 'Options locked';
  const { sellPrice } = optionPrices(run, type, strikePrice, expiryDay);
  if (isWorthless(sellPrice, run)) return 'Worth nothing at that strike';
  const quantity = fraction * optionsAvailableToShort(run);
  if (quantity * sellPrice < SMALLEST_TRADE) return 'No margin left';
  run.cash += quantity * sellPrice;
  addOption(run, { type, direction: 'short', strikePrice, quantity, premiumTotal: quantity * sellPrice, expiryDay });
  return quantity;
}
// The cash from closing this fraction of an option position: long is sold at its worth −cost, short costs its worth +cost.
function cashFromClosingOption(run, option, fraction) {
  const worth = optionWorth(run, option) * fraction;
  return option.direction === 'long' ? worth * (1 - OPTION_TRANSACTION_COST) : -worth * (1 + OPTION_TRANSACTION_COST);
}
// Close this fraction (0..1, default all) of an option position.
function closeOption(run, optionIndex, fraction = 1) {
  const option = run.today.options[optionIndex];
  if (!option) return 0;
  const cashChange = cashFromClosingOption(run, option, fraction);
  run.cash += cashChange;
  if (fraction >= 1) run.today.options.splice(optionIndex, 1);
  else { option.quantity *= 1 - fraction; option.premiumTotal *= 1 - fraction; }
  return cashChange;
}
function closeEverything(run) {
  closeStock(run);
  while (run.today.options.length) closeOption(run, 0);
}
// At the close: options on their last day pay out (long) or are paid (short). The stock is held overnight.
function expireOptions(run) {
  const today = run.today, closePrice = currentPrice(today);
  const expiring = today.options.filter(option => option.expiryDay <= run.day);
  for (const option of expiring) run.cash += directionSign(option) * payoff(option.type, option.strikePrice, closePrice) * option.quantity;
  today.options = today.options.filter(option => option.expiryDay > run.day);
  return expiring.length;
}

// ═══════════════════════════════════════ § 6 INSIDER & HEAT ═══════════════════════════════════════
// Every tip reads today's schedule, which is fixed at the open. Tips tell you about today only; the forecast
// (§ 4) is about the week ahead.
function revealTip(run, tipId) {
  const schedule = run.today.schedule;
  const openPrice = schedule.states[0].price, closePrice = schedule.states[TICKS_PER_DAY].price;
  if (tipId === 'rumour') return { direction: closePrice >= openPrice ? 'up' : 'down' };
  if (tipId === 'analyst') {
    const random = makeRandom(mixSeed(run.seed, run.day, 77));
    const centre = closePrice * (1 + (random() * 2 - 1) * ANALYST_BAND);       // the band sits somewhere around the close
    return { low: centre * (1 - ANALYST_BAND), high: centre * (1 + ANALYST_BAND) };
  }
  if (tipId === 'peek') return { cards: schedule.cards.flat().slice(0, PEEK_CARDS) };
  if (tipId === 'volatility') return { volatilities: schedule.states.map(marketState => marketState.volatility * (marketState.fedTicksLeft > 0 ? FED_VOLATILITY_MULTIPLIER : 1)) };
  return { closePrice };                                                         // 'exactClose'
}
// locked (not bought) · used (today) · cooling (resting) · unavailable (after the open, or investigated) · ready
function tipStatus(run, tipId) {
  const tip = run.tips[tipId];
  if (!tip.owned) return 'locked';
  if (run.today && run.today.insights[tipId]) return 'used';
  if (tip.cooldownLeft > 0) return 'cooling';
  if (!run.today || run.today.tick > 0 || run.today.investigation) return 'unavailable';
  return 'ready';
}
function useTip(run, tipId) {
  if (tipStatus(run, tipId) !== 'ready') return false;
  run.today.insights[tipId] = revealTip(run, tipId);
  run.tips[tipId].cooldownLeft = INSIDER_TIPS[tipId].cooldownDays + 1;   // +1: the count drops the same night
  run.heat += INSIDER_TIPS[tipId].heat;
  run.today.tickerLocked = true;
  return true;
}
// Heat from a suspiciously good day.
function abnormalProfitHeat(dayReturn) {
  if (dayReturn <= ABNORMAL_RETURN) return 0;
  return Math.min(HEAT_ABNORMAL_CAP, (dayReturn - ABNORMAL_RETURN) * HEAT_PER_ABNORMAL_RETURN);
}
// At the close: add the day's heat and open or end an investigation. Returns 'opened', 'cleared' or null.
function updateHeat(run, dayReturn) {
  run.heat += abnormalProfitHeat(dayReturn);
  if (run.today.investigation) {
    run.investigationDaysLeft--;
    if (run.investigationDaysLeft > 0) return null;
    run.heat = HEAT_AFTER_INVESTIGATION;
    return 'cleared';
  }
  if (run.heat < HEAT_LIMIT) return null;
  run.investigationDaysLeft = INVESTIGATION_DAYS;
  return 'opened';
}

// ═══════════════════════════════════════ § 7 RUN ═══════════════════════════════════════
// Each stock has a market that lives across days: { drawPile (cards not drawn yet), history (the last HISTORY_DAYS days
// as { day, prices }), lastClose }. Every owned stock trades every day; you trade one of them.
function newRun(seed = Math.floor(Math.random() * 2 ** 31)) {
  const decks = {};
  for (const tickerId in TICKERS) {
    decks[tickerId] = { ...TICKERS[tickerId].deck };
    for (const cardId of EVENT_CARDS) decks[tickerId][cardId] = 0;
  }
  const tips = {};
  for (const tipId of TIP_ORDER) tips[tipId] = { owned: STARTING_TIPS.includes(tipId), cooldownLeft: 0 };
  const unlocked = {};
  for (const positionId in OPTION_POSITIONS) unlocked[positionId] = false;
  const eventCopiesBought = {};
  for (const cardId of EVENT_CARDS) eventCopiesBought[cardId] = 0;
  const run = {
    version: SAVE_VERSION, seed, day: 1, phase: 'preopen',
    cash: STARTING_CASH, peakEquity: STARTING_CASH, heat: 0, investigationDaysLeft: 0,
    unlocked, leverageTier: 0, tips, tickersOwned: [STARTING_TICKER], ticker: STARTING_TICKER,
    decks, markets: {}, removalsDone: 0, additionsDone: 0, eventCopiesBought,
    meetingsPassed: 0, lastResult: null, gameOverReason: null, today: null,
  };
  createMarket(run, STARTING_TICKER);
  prepareDay(run);
  return run;
}

function tickerNumber(tickerId) { return Object.keys(TICKERS).indexOf(tickerId); }
function dayRandom(run, tickerId) { return makeRandom(mixSeed(run.seed, run.day, tickerNumber(tickerId), 0)); }

// A stock joins the run with a week of history already played (from its own draw pile), scaled so that its next open
// is BASE_OPEN_PRICE × inflation. Bought in the shop after a close, its history runs up to that day.
function createMarket(run, tickerId) {
  const deck = run.decks[tickerId], random = makeRandom(mixSeed(run.seed, run.day, tickerNumber(tickerId), 99));
  let drawPile = shuffleInPlace(deckToCardList(deck), random), price = 1;
  const history = [];
  const lastHistoryDay = run.phase === 'preopen' ? run.day - 1 : run.day;
  for (let back = HISTORY_DAYS - 1; back >= 0; back--) {
    const schedule = scheduleDay(drawPile, deck, price, random);
    history.push({ day: lastHistoryDay - back, prices: schedule.states.map(marketState => marketState.price) });
    drawPile = drawPileAfter(schedule, TICKS_PER_DAY);
    price = nextOpenPrice(schedule.states[TICKS_PER_DAY].price);
  }
  const scale = BASE_OPEN_PRICE * inflationIndex(run.day) / price;
  for (const day of history) day.prices = day.prices.map(value => value * scale);
  run.markets[tickerId] = { drawPile, history, lastClose: history[history.length - 1].prices[TICKS_PER_DAY] };
}
// A stock's day, dealt from its draw pile.
function scheduleMarketDay(run, tickerId) {
  const market = run.markets[tickerId];
  return scheduleDay(market.drawPile, run.decks[tickerId], nextOpenPrice(market.lastClose), dayRandom(run, tickerId));
}
// After the close: the draw pile moves on and the day joins the history.
function commitMarketDay(run, tickerId, schedule) {
  const market = run.markets[tickerId];
  market.drawPile = drawPileAfter(schedule, TICKS_PER_DAY);
  market.history.push({ day: run.day, prices: schedule.states.map(marketState => marketState.price) });
  market.history = market.history.slice(-HISTORY_DAYS);
  market.lastClose = schedule.states[TICKS_PER_DAY].price;
}

// Fix today's schedule for the traded stock. Positions carry over from yesterday (in the same stock).
function prepareDay(run) {
  const yesterday = run.today, carry = yesterday && yesterday.ticker === run.ticker;
  run.today = {
    ticker: run.ticker, tick: 0, schedule: scheduleMarketDay(run, run.ticker),
    shares: carry ? yesterday.shares : 0, averageEntryPrice: carry ? yesterday.averageEntryPrice : 0, options: carry ? yesterday.options : [],
    tradeCount: 0, tickerLocked: false, insights: {}, investigation: run.investigationDaysLeft > 0,
    startEquity: 0, haltSecondsLeft: 0, tickClock: 0, forecast: null, forecastSummary: null,
  };
  run.phase = 'preopen';
  refreshForecast(run);
  run.today.startEquity = totalEquity(run);
}
function remainingDrawPile(today) { return drawPileAfter(today.schedule, today.tick); }
// The market maker's forecast from this tick to the close FORECAST_DAYS_AHEAD days from now.
function refreshForecast(run) {
  const today = run.today;
  const random = makeRandom(mixSeed(run.seed, run.day, today.tick, 5));
  today.forecast = simulateForecast(today.schedule.states[today.tick], remainingDrawPile(today), run.decks[today.ticker],
    TICKS_PER_DAY - today.tick, FORECAST_DAYS_AHEAD, FORECAST_PATHS, random);
  today.forecastSummary = summariseForecast(today.forecast[FORECAST_DAYS_AHEAD]);
}
// The three numbers the chart shows: bottom 10%, average and top 10% of the simulated closes.
function summariseForecast(closes) {
  const sorted = Float64Array.from(closes).sort();
  let total = 0;
  for (const closePrice of sorted) total += closePrice;
  return {
    low: sorted[Math.floor(sorted.length * FORECAST_LOW_QUANTILE)],
    average: total / sorted.length,
    high: sorted[Math.floor(sorted.length * FORECAST_HIGH_QUANTILE)],
  };
}
// Only before the open, and only without positions (they belong to the stock they were traded in).
function switchTicker(run, tickerId) {
  if (!run.tickersOwned.includes(tickerId) || run.phase !== 'preopen' || run.today.tickerLocked || hasPositions(run)) return false;
  run.ticker = tickerId;
  prepareDay(run);
  return true;
}

// One tick of the live day. Returns what happened so the screen can react.
function advanceTick(run) {
  const today = run.today;
  today.tick++;
  const cards = today.schedule.cards[today.tick];
  if (cards.includes('halt')) today.haltSecondsLeft = HALT_SECONDS;
  if (today.tick % FORECAST_EVERY_TICKS === 0 || today.tick >= TICKS_PER_DAY) refreshForecast(run);
  const message = checkMargin(run);
  return { cards, message, closed: today.tick >= TICKS_PER_DAY };
}

// Meeting n is held at the close of day n × MEETING_EVERY_DAYS. Its target is STARTING_CASH × inflation × the
// listed multiple; meetings after the list grow ×MEETING_GROWTH_AFTER_LAST each.
function meetingTarget(run, meetingNumber) {
  const day = meetingNumber * MEETING_EVERY_DAYS;
  const listed = MEETING_MULTIPLES[Math.min(meetingNumber, MEETING_MULTIPLES.length) - 1];
  const extra = Math.pow(MEETING_GROWTH_AFTER_LAST, Math.max(0, meetingNumber - MEETING_MULTIPLES.length));
  return STARTING_CASH * inflationIndex(day) * listed * extra;
}
function nextMeetingNumber(run) { return Math.ceil(run.day / MEETING_EVERY_DAYS); }
// If today is a meeting day: { number, target, passed, final }, else null.
function holdMeeting(run, equity) {
  if (run.day % MEETING_EVERY_DAYS !== 0) return null;
  const number = run.day / MEETING_EVERY_DAYS, target = meetingTarget(run, number);
  const meeting = { number, target, passed: equity >= target, final: number === MEETING_MULTIPLES.length };
  if (meeting.passed) run.meetingsPassed = number;
  return meeting;
}

// The close: options expire, every stock moves on a day, heat is added, the meeting is held if it is due, and the
// run ends if there is no money left or the meeting failed.
function closeDay(run) {
  const today = run.today;
  const expired = expireOptions(run);
  commitMarketDay(run, today.ticker, today.schedule);
  for (const tickerId of run.tickersOwned)
    if (tickerId !== today.ticker) commitMarketDay(run, tickerId, scheduleMarketDay(run, tickerId));

  const endEquity = totalEquity(run);
  const dayReturn = (endEquity - today.startEquity) / Math.max(1e-9, today.startEquity);   // (guards a zero start)
  const heatBefore = run.heat;
  const investigationNote = updateHeat(run, dayReturn);
  const meeting = holdMeeting(run, endEquity);
  run.peakEquity = Math.max(run.peakEquity, endEquity);
  if (endEquity < MINIMUM_CASH_TO_TRADE * inflationIndex(run.day + 1)) run.gameOverReason = 'broke';
  else if (meeting && !meeting.passed) run.gameOverReason = 'meeting';
  run.lastResult = {
    day: run.day, ticker: today.ticker, openPrice: today.schedule.states[0].price, closePrice: currentPrice(today),
    startEquity: today.startEquity, endEquity, dayReturn, expired,
    heatAdded: run.heat - heatBefore, investigationNote, meeting,
  };
  run.phase = 'result';
  return run.lastResult;
}

function startNextDay(run) {
  run.day++;
  run.heat = Math.max(0, run.heat - HEAT_DECAY_PER_DAY);
  for (const tipId of TIP_ORDER) run.tips[tipId].cooldownLeft = Math.max(0, run.tips[tipId].cooldownLeft - 1);
  prepareDay(run);
}

// ── 7.1 The shop catalogue. Every shop item: icon, name, a short line (shortText), one full sentence, a price, and
// either owned / a deck edit (applied to a card in the deck picker, § 11) / a plain purchase (buyShopItem).
function deckBatchSize(doneSoFar) { return Math.max(DECK_BATCH_MINIMUM, DECK_BATCH_FIRST - doneSoFar); }
function shopCatalogue(run) {
  const inflation = inflationIndex(run.day);
  return [...deckItems(run, inflation), ...tradingItems(run, inflation), ...insiderItems(run, inflation), ...stockItems(run, inflation)];
}
function deckItems(run, inflation) {
  const removeBatch = deckBatchSize(run.removalsDone), addBatch = deckBatchSize(run.additionsDone);
  const shopItems = [
    { id: 'remove', row: 'deck', icon: '🗑', name: 'Remove ' + removeBatch, shortText: '−' + removeBatch + ' of one card', deckEdit: 'remove',
      sentence: `Take ${removeBatch} copies of one card out of a deck. Next time ${deckBatchSize(run.removalsDone + 1)}.`,
      price: REMOVE_PRICE * Math.pow(DECK_EDIT_PRICE_GROWTH, run.removalsDone) * inflation },
    { id: 'add', row: 'deck', icon: '➕', name: 'Add ' + addBatch, shortText: '+' + addBatch + ' of one card', deckEdit: 'add',
      sentence: `Put ${addBatch} more copies of one card into a deck. Next time ${deckBatchSize(run.additionsDone + 1)}.`,
      price: ADD_PRICE * Math.pow(DECK_EDIT_PRICE_GROWTH, run.additionsDone) * inflation },
  ];
  for (const cardId of EVENT_CARDS) {
    const card = CARD_TYPES[cardId];
    shopItems.push({ id: 'event:' + cardId, row: 'deck', icon: card.icon, name: card.name, shortText: '+1 card', deckEdit: 'event:' + cardId,
      sentence: card.sentence + ' (Added to one deck.)',
      price: EVENT_CARD_PRICES[cardId] * Math.pow(EVENT_PRICE_GROWTH, run.eventCopiesBought[cardId]) * inflation });
  }
  return shopItems;
}
function tradingItems(run, inflation) {
  const shopItems = [];
  for (const [positionId, position] of Object.entries(OPTION_POSITIONS))
    shopItems.push({ id: 'unlock:' + positionId, row: 'trading', icon: position.icon, name: position.name, shortText: OPTION_EXPIRY_DAYS + '-day option',
      sentence: `${position.name}: ${position.formula} per option. S = the price when exercised (any time, at the latest after ${OPTION_EXPIRY_DAYS} trading days), K = the strike you choose.`,
      price: position.price * inflation, owned: run.unlocked[positionId] });
  const now = LEVERAGE_TIERS[run.leverageTier], next = LEVERAGE_TIERS[run.leverageTier + 1];
  if (next) shopItems.push({ id: 'leverage', row: 'trading', icon: '⚙', name: `Leverage ${next}×`, shortText: `${now}× → ${next}×`,
    sentence: `Buying power becomes ${next}× your equity. Margin call when you lose half your margin.`,
    price: LEVERAGE_PRICES[run.leverageTier + 1] * inflation });
  else shopItems.push({ id: 'leverage', row: 'trading', icon: '⚙', name: 'Leverage max', shortText: `${now}×`, sentence: 'The highest leverage there is.', price: 0, owned: true });
  return shopItems;
}
function insiderItems(run, inflation) {
  return TIP_ORDER.filter(tipId => !STARTING_TIPS.includes(tipId)).map(tipId => {
    const tip = INSIDER_TIPS[tipId];
    return { id: 'tip:' + tipId, row: 'insider', icon: tip.icon, name: tip.name, shortText: `${tip.short} · 🔥${tip.heat}`,
      sentence: `${tip.sentence} Heat +${tip.heat}, rests ${tip.cooldownDays} day${tip.cooldownDays > 1 ? 's' : ''}.`,
      price: tip.price * inflation, owned: run.tips[tipId].owned };
  });
}
function stockItems(run, inflation) {
  return Object.keys(TICKER_PRICES).map(tickerId => {
    const ticker = TICKERS[tickerId];
    return { id: 'ticker:' + tickerId, row: 'stocks', icon: ticker.icon, name: tickerId, shortText: deckSize(ticker.deck) + ' cards',
      sentence: `${ticker.name}. ${ticker.sentence} Pick it before the open.`,
      price: TICKER_PRICES[tickerId] * inflation, owned: run.tickersOwned.includes(tickerId) };
  });
}
// Buy a plain item (not a deck edit). Returns true when bought.
function buyShopItem(run, shopItem) {
  if (shopItem.owned || run.cash < shopItem.price) return false;
  const [type, which] = shopItem.id.split(':');
  if (type === 'unlock') run.unlocked[which] = true;
  else if (type === 'leverage') run.leverageTier++;
  else if (type === 'tip') run.tips[which].owned = true;
  else if (type === 'ticker') { run.tickersOwned.push(which); createMarket(run, which); }
  else return false;
  run.cash -= shopItem.price;
  return true;
}

// ── 7.2 Deck edits
// How many copies a deck edit leaves of this card.
function countAfterEdit(run, shopItem, deck, cardId) {
  if (shopItem.deckEdit === 'remove') return deck[cardId] - Math.min(deck[cardId], deckBatchSize(run.removalsDone));
  if (shopItem.deckEdit === 'add') return deck[cardId] + deckBatchSize(run.additionsDone);
  return deck[cardId] + 1;                                                  // an event card
}
function deckEditAllowed(run, shopItem, tickerId, cardId) {
  const deck = run.decks[tickerId];
  if (run.cash < shopItem.price) return false;
  if (shopItem.deckEdit === 'remove') return deck[cardId] > 0 && deckSize(deck) - deck[cardId] + countAfterEdit(run, shopItem, deck, cardId) >= MINIMUM_DECK_SIZE;
  if (shopItem.deckEdit === 'add') return CARD_TYPES[cardId].category !== 'event';
  return true;
}
// A deck edit changes the deck and, at once, the draw pile: removed cards come out of the draw pile where they
// are still in it, added cards are shuffled into it.
function applyDeckEdit(run, shopItem, tickerId, cardId) {
  if (!deckEditAllowed(run, shopItem, tickerId, cardId)) return false;
  const deck = run.decks[tickerId], market = run.markets[tickerId];
  const change = countAfterEdit(run, shopItem, deck, cardId) - deck[cardId];
  deck[cardId] += change;
  if (change < 0) removeFromDrawPile(market, cardId, -change);
  else addToDrawPile(market, cardId, change, makeRandom(mixSeed(run.seed, run.day, run.additionsDone, run.removalsDone, 31)));
  if (shopItem.deckEdit === 'remove') run.removalsDone++;
  else if (shopItem.deckEdit === 'add') run.additionsDone++;
  else run.eventCopiesBought[cardId]++;
  run.cash -= shopItem.price;
  run.heat += HEAT_PER_DECK_EDIT;
  return true;
}
// Take up to `copies` of this card out of the draw pile (the first ones found: the pile is shuffled anyway).
function removeFromDrawPile(market, cardId, copies) {
  const kept = [];
  let removed = 0;
  for (const card of market.drawPile) {
    if (card === cardId && removed < copies) removed++;
    else kept.push(card);
  }
  market.drawPile = kept;
}
// Put copies of this card into the draw pile at random places.
function addToDrawPile(market, cardId, copies, random) {
  for (let copy = 0; copy < copies; copy++) market.drawPile.splice(Math.floor(random() * (market.drawPile.length + 1)), 0, cardId);
}

// ── 7.3 Saving: the whole run is plain data. Forecasts are rebuilt on load.
function serialiseRun(run) {
  return JSON.stringify({ ...run, today: run.today ? { ...run.today, forecast: null, forecastSummary: null } : null });
}
function loadRun(text) {
  const run = JSON.parse(text);
  if (!run || run.version !== SAVE_VERSION) return null;
  if (run.today) refreshForecast(run);
  return run;
}

// ═══════════════════════════════════════ § 8 SOUND ═══════════════════════════════════════
// Short synthesised tones; every sound in the game is one of `sounds`.
const sound = { context: null, muted: false };
function playTone(frequency, seconds, { type = 'triangle', volume = 0.05, slideTo = null, delay = 0 } = {}) {
  if (sound.muted) return;
  try {
    sound.context = sound.context || new (window.AudioContext || window.webkitAudioContext)();
    const context = sound.context, start = context.currentTime + delay;
    const oscillator = context.createOscillator(), gain = context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, start + seconds);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  } catch (error) { /* no audio available */ }
}
const sounds = {
  tick(move) { playTone(move >= 0 ? 660 : 440, 0.05, { volume: 0.012, type: 'sine' }); },
  bigCard(rising) { playTone(rising ? 520 : 300, 0.35, { volume: 0.06, slideTo: rising ? 1040 : 120, type: 'sawtooth' }); },
  tradeMenu() { playTone(880, 0.09, { volume: 0.05, type: 'square' }); },
  bad() { playTone(220, 0.4, { volume: 0.07, slideTo: 90, type: 'sawtooth' }); },
  tip() { playTone(1200, 0.12, { volume: 0.03, type: 'sine', slideTo: 1600 }); },
  cash(gained) { (gained ? [523, 659, 784, 1047] : [392, 330, 262]).forEach((frequency, index) => playTone(frequency, 0.14, { volume: 0.05, delay: index * 0.08 })); },
  buy() { playTone(980, 0.1, { volume: 0.04 }); playTone(1470, 0.12, { volume: 0.03, delay: 0.06 }); },
  denied() { playTone(160, 0.12, { volume: 0.04, type: 'square' }); },
};

// ═══════════════════════════════════════ § 9 CHART ═══════════════════════════════════════
// Everything the screen keeps that is not part of the saved run.
const view = {
  run: null, speedIndex: 0, paused: false, overlay: null,
  popups: [], lastEquity: null, freshTick: -1,            // chart popups, equity flash, the newest card chip
  tradeMenu: null,                                              // the open trade menu (see § 11.3)
  shopItems: [], shopSelection: 0,                          // the shop's cards and the selected one
  deckPickerItem: null, deckPickerTicker: null, deckPickerCardsShown: [], deckPickerSelection: 0,   // the deck picker
};
const element = id => document.getElementById(id);
const chartFont = (weight, size) => `${weight} ${size}px JetBrains Mono, Menlo, monospace`;

function fitCanvas(canvas) {
  const pixelRatio = window.devicePixelRatio || 1, bounds = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(bounds.width * pixelRatio) || canvas.height !== Math.round(bounds.height * pixelRatio)) {
    canvas.width = Math.round(bounds.width * pixelRatio);
    canvas.height = Math.round(bounds.height * pixelRatio);
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  return { context, width: bounds.width, height: bounds.height };
}

// The chart, left to right: the previous week (thin), today (live), and three dashed lines from now to the close
// FORECAST_DAYS_AHEAD days ahead (top 10%, average, bottom 10%) with only their numbers. Faint lines mark your
// entry and strikes; insider tips draw their marks at today's close.
function drawChart() {
  const { context, width, height } = fitCanvas(element('chart'));
  context.clearRect(0, 0, width, height);
  const run = view.run;
  if (!run || !run.today) return;
  const chart = chartLayout(run, context, width, height);
  drawGrid(chart);
  drawHistory(chart);
  drawInsiderMarks(chart);
  drawForecast(chart);
  drawToday(chart);
  drawPopups(chart);
}

// Where everything goes: x for past days and today, y on a log scale that fits every price in view.
function chartLayout(run, context, width, height) {
  const today = run.today, states = today.schedule.states;
  const history = run.markets[today.ticker].history.filter(day => day.day < run.day);
  const left = 20, right = width - 84, top = 26, bottom = height - 26;
  const historyEnd = left + (right - left) * CHART_HISTORY_SHARE;
  const todayEnd = historyEnd + (right - left) * CHART_TODAY_SHARE;

  const prices = history.flatMap(day => day.prices).concat(states.slice(0, today.tick + 1).map(marketState => marketState.price), chartLevels(run));
  let low = Math.min(...prices), high = Math.max(...prices);
  if (high / low < 1.06) { const middle = Math.sqrt(high * low); low = middle / 1.03; high = middle * 1.03; }   // never zoom in too far
  const margin = 0.05 * Math.log(high / low);
  const logLow = Math.log(low) - margin, logHigh = Math.log(high) + margin;

  return {
    run, today, context, history, left, right, top, bottom, height, historyEnd, todayEnd,
    openPrice: states[0].price, price: currentPrice(today),
    xOfPastTick: (dayIndex, tick) => left + (historyEnd - left) * (dayIndex * TICKS_PER_DAY + tick) / (Math.max(1, history.length) * TICKS_PER_DAY),
    xOfTodayTick: tick => historyEnd + (todayEnd - historyEnd) * tick / TICKS_PER_DAY,
    yOfPrice: price => bottom - (bottom - top) * (Math.log(price) - logLow) / (logHigh - logLow),
  };
}
// Price levels the chart keeps in view besides the paths: the forecast, your entry and strikes, insider marks.
function chartLevels(run) {
  const today = run.today, levels = [];
  if (today.forecastSummary) levels.push(today.forecastSummary.low, today.forecastSummary.high);
  if (today.shares !== 0) levels.push(today.averageEntryPrice);
  for (const option of today.options) levels.push(option.strikePrice);
  if (today.insights.analyst) levels.push(today.insights.analyst.low, today.insights.analyst.high);
  if (today.insights.exactClose) levels.push(today.insights.exactClose.closePrice);
  return levels;
}

function drawLine(context, fromX, fromY, toX, toY, colour, { width = 1, dashed = false, alpha = 1 } = {}) {
  context.strokeStyle = colour; context.lineWidth = width; context.globalAlpha = alpha;
  context.setLineDash(dashed ? [5, 5] : []);
  context.beginPath(); context.moveTo(fromX, fromY); context.lineTo(toX, toY); context.stroke();
  context.setLineDash([]); context.globalAlpha = 1;
}
function drawDot(context, screenX, screenY, radius, colour) {
  context.fillStyle = colour;
  context.beginPath(); context.arc(screenX, screenY, radius, 0, Math.PI * 2); context.fill();
}
function drawText(context, text, screenX, screenY, colour, { weight = 800, size = 14, align = 'left', alpha = 1 } = {}) {
  context.fillStyle = colour; context.font = chartFont(weight, size); context.globalAlpha = alpha;
  context.textAlign = align; context.textBaseline = 'middle';
  context.fillText(text, screenX, screenY);
  context.globalAlpha = 1;
}
// A path through points [[screenX, screenY], …].
function drawPath(context, points, colour, width) {
  context.strokeStyle = colour; context.lineWidth = width; context.lineJoin = 'round';
  context.beginPath();
  points.forEach(([screenX, screenY], index) => (index === 0 ? context.moveTo(screenX, screenY) : context.lineTo(screenX, screenY)));
  context.stroke();
}

// Day boundaries, the open (dashed), your entry price and your strikes.
function drawGrid({ context, history, top, bottom, right, historyEnd, todayEnd, xOfPastTick, yOfPrice, openPrice, today }) {
  for (let dayIndex = 1; dayIndex < history.length; dayIndex++) drawLine(context, xOfPastTick(dayIndex, 0), top - 10, xOfPastTick(dayIndex, 0), bottom + 10, CHART_COLOURS.grid);
  drawLine(context, historyEnd, top - 10, historyEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawLine(context, todayEnd, top - 10, todayEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawLine(context, historyEnd, yOfPrice(openPrice), right, yOfPrice(openPrice), CHART_COLOURS.openPrice, { dashed: true });
  if (today.shares !== 0) drawLine(context, historyEnd, yOfPrice(today.averageEntryPrice), right, yOfPrice(today.averageEntryPrice), CHART_COLOURS.entry);
  for (const option of today.options)
    drawLine(context, historyEnd, yOfPrice(option.strikePrice), right, yOfPrice(option.strikePrice), option.type === 'call' ? CHART_COLOURS.up : CHART_COLOURS.down, { dashed: true });
}

function drawHistory({ context, history, xOfPastTick, xOfTodayTick, yOfPrice, openPrice }) {
  const points = [];
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) points.push([xOfPastTick(dayIndex, tick), yOfPrice(day.prices[tick])]);
  });
  points.push([xOfTodayTick(0), yOfPrice(openPrice)]);
  drawPath(context, points, CHART_COLOURS.history, 1.5);
}

// Rumour: an arrow at the close. Analyst: a band. The Call: a dot. Vol tip: the σ line along the bottom.
function drawInsiderMarks({ context, today, todayEnd, xOfTodayTick, yOfPrice, bottom, openPrice }) {
  const insights = today.insights;
  if (insights.volatility) {
    const tallest = Math.max(2, ...insights.volatility.volatilities);
    context.globalAlpha = 0.45;
    drawPath(context, insights.volatility.volatilities.map((volatility, tick) => [xOfTodayTick(tick), bottom - 46 * volatility / tallest]), CHART_COLOURS.volatility, 1.5);
    context.globalAlpha = 1;
  }
  if (insights.analyst) {
    context.fillStyle = CHART_ANALYST_BAND;
    context.fillRect(todayEnd - 7, yOfPrice(insights.analyst.high), 14, yOfPrice(insights.analyst.low) - yOfPrice(insights.analyst.high));
  }
  if (insights.exactClose) drawDot(context, todayEnd, yOfPrice(insights.exactClose.closePrice), 6, CHART_COLOURS.insight);
  if (insights.rumour) {
    const up = insights.rumour.direction === 'up';
    drawText(context, up ? '▲' : '▼', todayEnd, yOfPrice(openPrice) + (up ? -18 : 18), up ? CHART_COLOURS.up : CHART_COLOURS.down, { size: 20, align: 'center' });
  }
}

// Three dashed lines from now to the close FORECAST_DAYS_AHEAD days ahead, labelled with their prices only.
function drawForecast({ context, today, right, xOfTodayTick, yOfPrice, price }) {
  const summary = today.forecastSummary;
  if (!summary) return;
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price), labelYs = [];
  for (const [level, colour] of [[summary.high, CHART_COLOURS.up], [summary.average, CHART_COLOURS.average], [summary.low, CHART_COLOURS.down]]) {
    drawLine(context, currentX, currentY, right, yOfPrice(level), colour, { width: 1.5, alpha: 0.5, dashed: true });
    let labelY = yOfPrice(level);
    for (const used of labelYs) if (Math.abs(labelY - used) < 18) labelY = used + (labelY >= used ? 18 : -18);   // labels never overlap
    labelYs.push(labelY);
    drawText(context, formatPlain(level), right + 10, labelY, colour);
  }
}

// Today's path: green above the open, red below. Then the current price.
function drawToday({ context, today, height, historyEnd, todayEnd, xOfTodayTick, yOfPrice, openPrice, price }) {
  const points = today.schedule.states.slice(0, today.tick + 1).map((marketState, tick) => [xOfTodayTick(tick), yOfPrice(marketState.price)]);
  for (const [colour, clipTop, clipBottom] of [[CHART_COLOURS.up, 0, yOfPrice(openPrice)], [CHART_COLOURS.down, yOfPrice(openPrice), height]]) {
    context.save();
    context.beginPath(); context.rect(historyEnd, clipTop, todayEnd - historyEnd + 4, clipBottom - clipTop); context.clip();
    drawPath(context, points, colour, 2.6);
    context.restore();
  }
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price);
  drawDot(context, currentX, currentY, 5.5, price >= openPrice ? CHART_COLOURS.up : CHART_COLOURS.down);
  drawText(context, formatPlain(price), currentX - 10, currentY - 18, CHART_COLOURS.average, { size: 15, align: 'right' });
}

// Popups (+$ / −$, messages) rise and fade above the current price; the newest sits lowest.
function drawPopups({ context, today, left, right, top, xOfTodayTick, yOfPrice, price }) {
  const now = performance.now() / 1000;
  view.popups = view.popups.filter(popup => now - popup.born < POPUP_SECONDS).slice(-POPUPS_SHOWN);
  view.popups.forEach((popup, index) => {
    const age = (now - popup.born) / POPUP_SECONDS;
    const stackOffset = (view.popups.length - 1 - index) * (popup.size + 6);
    const textX = clamp(xOfTodayTick(today.tick), left + 80, right - 80);
    const textY = Math.max(top + 10, yOfPrice(price) - 46 - stackOffset - age * 30);
    drawText(context, popup.text, textX, textY, popup.colour, { size: popup.size, align: 'center', alpha: 1 - age });
  });
}
function addPopup(text, colour, size = 18) { view.popups.push({ text, colour, size, born: performance.now() / 1000 }); }
function shakeChart(strength) {
  const bounds = element('chartBox');
  bounds.classList.remove('shake', 'shakeBig');
  void bounds.offsetWidth;                                     // restart the animation
  bounds.classList.add(strength >= 2 ? 'shakeBig' : 'shake');
}

// Number formats for the screen. formatPlain: chart labels (no $, few digits). formatFull: every digit, never K/M/B.
function formatPlain(price) {
  if (price < 10) return price.toFixed(2);
  if (price < 1000) return price.toFixed(price < 100 ? 1 : 0);
  return formatMoney(price).replace('$', '');
}
function formatFull(value) { return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function formatSignedCount(value) { return (value >= 0 ? '+' : '−') + formatCount(Math.abs(value)); }

// ═══════════════════════════════════════ § 10 PANELS ═══════════════════════════════════════
const colourClass = value => (value >= 0 ? 'up' : 'down');
// A card as a small chip: "+5%", "σ+5%" or an event's icon.
function chipHtml(cardId, extraClass = '') {
  const card = CARD_TYPES[cardId];
  const sign = card.category === 'price' ? (card.move > 0 ? 'pos' : 'neg') : '';
  const extreme = cardImpact(cardId) === 2 ? 'extreme' : '';
  const tip = card.category === 'event' ? `${card.name}: ${card.sentence}` : `${cardId} ${cardValueText(cardId)}`;
  const face = card.category === 'event' ? card.icon : cardValueText(cardId);
  return `<span class="chip ${card.category} ${sign} ${extreme} ${extraClass}" data-tip="${tip}">${face}</span>`;
}
// Two lines for a position: "x × price = buy-in", then "now value  ±P&L" (green for a profit, red for a loss).
function positionLines(firstLine, buyIn, valueNow) {
  return `
    <div class="line"><span>${firstLine}</span><span>= ${formatMoney(buyIn)}</span></div>
    <div class="line ${colourClass(valueNow - buyIn)}"><span>now ${formatMoney(valueNow)}</span><span>${formatSignedMoney(valueNow - buyIn)}</span></div>`;
}
function optionLabel(run, option) { return `${formatSignedCount(directionSign(option) * option.quantity)} ${option.type === 'call' ? 'C' : 'P'}${formatPlain(option.strikePrice)}`; }

// The side menu: day, cash, the stock, options, equity, heat, the next meeting.
function renderSide() {
  const run = view.run, today = run.today, price = currentPrice(today), equity = totalEquity(run);
  const secondsLeft = (TICKS_PER_DAY - today.tick) * SECONDS_PER_TICK;
  const minutes = Math.floor(secondsLeft / 60), seconds = String(Math.floor(secondsLeft % 60)).padStart(2, '0');
  const clock = run.phase === 'preopen' ? '<span class="dim">pre-open</span>' : `${minutes}:${seconds}`;
  const stockHtml = today.shares === 0
    ? '<div class="line dim">—</div><div class="line"></div>'
    : positionLines(`${formatSignedCount(today.shares)} × ${formatPrice(today.averageEntryPrice)}`, today.shares * today.averageEntryPrice, today.shares * price);
  const options = today.options;
  const optionsHtml = options.length === 0 ? '<div class="line dim">—</div>'
    : options.slice(0, SIDE_OPTIONS_SHOWN).map(option => positionLines(`${optionLabel(run, option)} <span class="dim">${daysToExpiry(run, option)}d</span>`, optionBuyIn(option), optionValueNow(run, option))).join('')
      + (options.length > SIDE_OPTIONS_SHOWN ? `<div class="line dim">+${options.length - SIDE_OPTIONS_SHOWN} more</div>` : '');
  const meetingNumber = nextMeetingNumber(run), target = meetingTarget(run, meetingNumber);
  const investigation = run.investigationDaysLeft > 0 ? ` · SEC ${run.investigationDaysLeft}d` : '';

  element('side').innerHTML = `
    <div id="brand">INSIDER</div>
    <div class="sideHead"><b>DAY ${run.day} · ${today.ticker}</b><span class="clock">${clock}</span></div>
    <div class="label">cash</div><div class="value">${formatMoney(run.cash)}</div>
    <div class="label"><span>stock</span><span>${formatPrice(price)}</span></div>${stockHtml}
