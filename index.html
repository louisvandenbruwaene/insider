  }
  market.drawPile = kept;
}
// Put copies of this card into the draw pile at random places.
function addToDrawPile(market, cardId, copies, random) {
  for (let copy = 0; copy < copies; copy++) market.drawPile.splice(Math.floor(random() * (market.drawPile.length + 1)), 0, cardId);
}

// ── 7.3 Saving: the whole run is plain data. Forecasts are rebuilt on load.
function serialiseRun(run) {
  return JSON.stringify({ ...run, today: run.today ? { ...run.today, forecast: null, forecastSummary: null } : null });
}
function loadRun(text) {
  const run = JSON.parse(text);
  if (!run || run.version !== SAVE_VERSION) return null;
  if (run.today) refreshForecast(run);
  return run;
}

// ═══════════════════════════════════════ § 8 SOUND ═══════════════════════════════════════
// Short synthesised tones; every sound in the game is one of `sounds`.
const sound = { context: null, muted: false };
function playTone(frequency, seconds, { type = 'triangle', volume = 0.05, slideTo = null, delay = 0 } = {}) {
  if (sound.muted) return;
  try {
    sound.context = sound.context || new (window.AudioContext || window.webkitAudioContext)();
    const context = sound.context, start = context.currentTime + delay;
    const oscillator = context.createOscillator(), gain = context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, start + seconds);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  } catch (error) { /* no audio available */ }
}
const sounds = {
  tick(move) { playTone(move >= 0 ? 660 : 440, 0.05, { volume: 0.012, type: 'sine' }); },
  bigCard(rising) { playTone(rising ? 520 : 300, 0.35, { volume: 0.06, slideTo: rising ? 1040 : 120, type: 'sawtooth' }); },
  trade() { playTone(880, 0.09, { volume: 0.05, type: 'square' }); },
  bad() { playTone(220, 0.4, { volume: 0.07, slideTo: 90, type: 'sawtooth' }); },
  tip() { playTone(1200, 0.12, { volume: 0.03, type: 'sine', slideTo: 1600 }); },
  cash(gained) { (gained ? [523, 659, 784, 1047] : [392, 330, 262]).forEach((frequency, index) => playTone(frequency, 0.14, { volume: 0.05, delay: index * 0.08 })); },
  buy() { playTone(980, 0.1, { volume: 0.04 }); playTone(1470, 0.12, { volume: 0.03, delay: 0.06 }); },
  denied() { playTone(160, 0.12, { volume: 0.04, type: 'square' }); },
};

// ═══════════════════════════════════════ § 9 CHART ═══════════════════════════════════════
// Everything the screen keeps that is not part of the saved run.
const view = {
  run: null, speedIndex: 0, paused: false, overlay: null,
  popups: [], lastEquity: null, freshTick: -1,            // chart popups, equity flash, the newest card chip
  tradeMenu: null,                                          // the open trade menu (see § 11.3)
  shopItems: [],                                            // the shop's cards, in the order they are shown
};
const element = id => document.getElementById(id);
const chartFont = (weight, size) => `${weight} ${size}px JetBrains Mono, Menlo, monospace`;

function fitCanvas(canvas) {
  const pixelRatio = window.devicePixelRatio || 1, bounds = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(bounds.width * pixelRatio) || canvas.height !== Math.round(bounds.height * pixelRatio)) {
    canvas.width = Math.round(bounds.width * pixelRatio);
    canvas.height = Math.round(bounds.height * pixelRatio);
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  return { context, width: bounds.width, height: bounds.height };
}

// The chart, left to right: the previous week (thin), today (live), and three dashed lines from now to the close
// FORECAST_DAYS_AHEAD days ahead (top 10%, average, bottom 10%) with only their numbers. Faint lines mark your
// entry and strikes; insider tips draw their marks at today's close.
function drawChart() {
  const { context, width, height } = fitCanvas(element('chart'));
  context.clearRect(0, 0, width, height);
  const run = view.run;
  if (!run || !run.today) return;
  const chart = chartLayout(run, context, width, height);
  drawGrid(chart);
  drawHistory(chart);
  drawInsiderMarks(chart);
  if (run.forecastBought) drawForecast(chart);
  drawToday(chart);
  drawPopups(chart);
}

// Where everything goes: x for past days and today, y on a log scale that fits every price in view.
function chartLayout(run, context, width, height) {
  const today = run.today, states = today.schedule.states;
  const history = run.markets[today.ticker].history.filter(day => day.day < run.day);
  const left = 20, right = width - 84, top = 26, bottom = height - 26;
  const historyEnd = left + (right - left) * CHART_HISTORY_SHARE;
  const todayEnd = historyEnd + (right - left) * CHART_TODAY_SHARE;

  const prices = history.flatMap(day => day.prices).concat(states.slice(0, today.tick + 1).map(marketState => marketState.price), chartLevels(run));
  let low = Math.min(...prices), high = Math.max(...prices);
  if (high / low < 1.06) { const middle = Math.sqrt(high * low); low = middle / 1.03; high = middle * 1.03; }   // never zoom in too far
  const margin = 0.05 * Math.log(high / low);
  const logLow = Math.log(low) - margin, logHigh = Math.log(high) + margin;

  return {
    run, today, context, history, left, right, top, bottom, height, historyEnd, todayEnd,
    openPrice: states[0].price, price: currentPrice(today),
    xOfPastTick: (dayIndex, tick) => left + (historyEnd - left) * (dayIndex * TICKS_PER_DAY + tick) / (Math.max(1, history.length) * TICKS_PER_DAY),
    xOfTodayTick: tick => historyEnd + (todayEnd - historyEnd) * tick / TICKS_PER_DAY,
    yOfPrice: price => bottom - (bottom - top) * (Math.log(price) - logLow) / (logHigh - logLow),
  };
}
// Price levels the chart keeps in view besides the paths: the forecast, your entry and strikes, insider marks.
function chartLevels(run) {
  const today = run.today, levels = [];
  if (today.forecastSummary && run.forecastBought) levels.push(today.forecastSummary.low, today.forecastSummary.high);
  if (today.shares !== 0) levels.push(today.averageEntryPrice);
  for (const option of today.options) levels.push(option.strikePrice);
  if (today.insights.exactClose) levels.push(today.insights.exactClose.closePrice);
  return levels;
}

function drawLine(context, fromX, fromY, toX, toY, colour, { width = 1, dashed = false, alpha = 1 } = {}) {
  context.strokeStyle = colour; context.lineWidth = width; context.globalAlpha = alpha;
  context.setLineDash(dashed ? [5, 5] : []);
  context.beginPath(); context.moveTo(fromX, fromY); context.lineTo(toX, toY); context.stroke();
  context.setLineDash([]); context.globalAlpha = 1;
}
function drawDot(context, screenX, screenY, radius, colour) {
  context.fillStyle = colour;
  context.beginPath(); context.arc(screenX, screenY, radius, 0, Math.PI * 2); context.fill();
}
function drawText(context, text, screenX, screenY, colour, { weight = 800, size = 14, align = 'left', alpha = 1 } = {}) {
  context.fillStyle = colour; context.font = chartFont(weight, size); context.globalAlpha = alpha;
  context.textAlign = align; context.textBaseline = 'middle';
  context.fillText(text, screenX, screenY);
  context.globalAlpha = 1;
}
// A path through points [[screenX, screenY], …].
function drawPath(context, points, colour, width) {
  context.strokeStyle = colour; context.lineWidth = width; context.lineJoin = 'round';
  context.beginPath();
  points.forEach(([screenX, screenY], index) => (index === 0 ? context.moveTo(screenX, screenY) : context.lineTo(screenX, screenY)));
  context.stroke();
}

// Day boundaries, the open (dashed), your entry price and your strikes.
function drawGrid({ context, history, top, bottom, right, historyEnd, todayEnd, xOfPastTick, yOfPrice, openPrice, today }) {
  for (let dayIndex = 1; dayIndex < history.length; dayIndex++) drawLine(context, xOfPastTick(dayIndex, 0), top - 10, xOfPastTick(dayIndex, 0), bottom + 10, CHART_COLOURS.grid);
  drawLine(context, historyEnd, top - 10, historyEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawLine(context, todayEnd, top - 10, todayEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawLine(context, historyEnd, yOfPrice(openPrice), right, yOfPrice(openPrice), CHART_COLOURS.openPrice, { dashed: true });
  if (today.shares !== 0) drawLine(context, historyEnd, yOfPrice(today.averageEntryPrice), right, yOfPrice(today.averageEntryPrice), CHART_COLOURS.entry);
  for (const option of today.options)
    drawLine(context, historyEnd, yOfPrice(option.strikePrice), right, yOfPrice(option.strikePrice), option.type === 'call' ? CHART_COLOURS.up : CHART_COLOURS.down, { dashed: true });
}

function drawHistory({ context, history, xOfPastTick, xOfTodayTick, yOfPrice, openPrice }) {
  const points = [];
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) points.push([xOfPastTick(dayIndex, tick), yOfPrice(day.prices[tick])]);
  });
  points.push([xOfTodayTick(0), yOfPrice(openPrice)]);
  drawPath(context, points, CHART_COLOURS.history, 1.5);
}

// Rumour: an arrow at the close (from the price it was played at). Insider call: a dot at the close.
function drawInsiderMarks({ context, today, todayEnd, xOfTodayTick, yOfPrice, bottom, openPrice }) {
  const insights = today.insights;
  if (insights.exactClose) drawDot(context, todayEnd, yOfPrice(insights.exactClose.closePrice), 6, CHART_COLOURS.insight);
  if (insights.rumour) {
    const up = insights.rumour.direction === 'up';
    drawText(context, up ? '▲' : '▼', todayEnd, yOfPrice(insights.rumour.fromPrice) + (up ? -18 : 18), up ? CHART_COLOURS.up : CHART_COLOURS.down, { size: 20, align: 'center' });
  }
}

// Three dashed lines from now to the close FORECAST_DAYS_AHEAD days ahead, labelled with their prices only.
function drawForecast({ context, today, right, xOfTodayTick, yOfPrice, price }) {
  const summary = today.forecastSummary;
  if (!summary) return;
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price), labelYs = [];
  for (const [level, colour] of [[summary.high, CHART_COLOURS.up], [summary.average, CHART_COLOURS.average], [summary.low, CHART_COLOURS.down]]) {
    drawLine(context, currentX, currentY, right, yOfPrice(level), colour, { width: 1.5, alpha: 0.5, dashed: true });
    let labelY = yOfPrice(level);
    for (const used of labelYs) if (Math.abs(labelY - used) < 18) labelY = used + (labelY >= used ? 18 : -18);   // labels never overlap
    labelYs.push(labelY);
    drawText(context, formatPlain(level), right + 10, labelY, colour);
  }
}

// Today's path: green above the open, red below. Then the current price.
function drawToday({ context, today, height, historyEnd, todayEnd, xOfTodayTick, yOfPrice, openPrice, price }) {
  const points = today.schedule.states.slice(0, today.tick + 1).map((marketState, tick) => [xOfTodayTick(tick), yOfPrice(marketState.price)]);
  for (const [colour, clipTop, clipBottom] of [[CHART_COLOURS.up, 0, yOfPrice(openPrice)], [CHART_COLOURS.down, yOfPrice(openPrice), height]]) {
    context.save();
    context.beginPath(); context.rect(historyEnd, clipTop, todayEnd - historyEnd + 4, clipBottom - clipTop); context.clip();
    drawPath(context, points, colour, 2.6);
    context.restore();
  }
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price);
  drawDot(context, currentX, currentY, 5.5, price >= openPrice ? CHART_COLOURS.up : CHART_COLOURS.down);
  drawText(context, formatPlain(price), currentX - 10, currentY - 18, CHART_COLOURS.average, { size: 15, align: 'right' });
}

// Popups (+$ / −$, messages) rise and fade above the current price; the newest sits lowest.
function drawPopups({ context, today, left, right, top, xOfTodayTick, yOfPrice, price }) {
  const now = performance.now() / 1000;
  view.popups = view.popups.filter(popup => now - popup.born < POPUP_SECONDS).slice(-POPUPS_SHOWN);
  view.popups.forEach((popup, index) => {
    const age = (now - popup.born) / POPUP_SECONDS;
    const stackOffset = (view.popups.length - 1 - index) * (popup.size + 6);
    const textX = clamp(xOfTodayTick(today.tick), left + 80, right - 80);
    const textY = Math.max(top + 10, yOfPrice(price) - 46 - stackOffset - age * 30);
    drawText(context, popup.text, textX, textY, popup.colour, { size: popup.size, align: 'center', alpha: 1 - age });
  });
}
function addPopup(text, colour, size = 18) { view.popups.push({ text, colour, size, born: performance.now() / 1000 }); }
function shakeChart(strength) {
  const bounds = element('chartBox');
  bounds.classList.remove('shake', 'shakeBig');
  void bounds.offsetWidth;                                     // restart the animation
  bounds.classList.add(strength >= 2 ? 'shakeBig' : 'shake');
}

// Number formats for the screen. formatPlain: chart labels (no $, few digits). formatFull: every digit, never K/M/B.
function formatPlain(price) {
  if (price < 10) return price.toFixed(2);
  if (price < 1000) return price.toFixed(price < 100 ? 1 : 0);
  return formatMoney(price).replace('$', '');
}
function formatFull(value) { return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
// "below $X" (red when equity is within MARGIN_WARNING of it), or "—" without positions.
function marginLineHtml(run, equity) {
  if (exposure(run) === 0) return '<span class="dim">—</span>';
  const threshold = marginCallEquity(run);
  return `<span class="${equity < threshold * MARGIN_WARNING ? 'down' : 'dim'}">below ${formatMoney(threshold)}</span>`;
}
function formatSignedCount(value) { return (value >= 0 ? '+' : '−') + formatCount(Math.abs(value)); }

// ═══════════════════════════════════════ § 10 PANELS ═══════════════════════════════════════
const colourClass = value => (value >= 0 ? 'up' : 'down');
// A card as a small chip: "+5%", or a modifier's sign (↻ ⇄ ×2 ½).
function chipHtml(cardId, extraClass = '') {
  const card = CARD_TYPES[cardId];
  const sign = card.category === 'move' ? (card.move > 0 ? 'pos' : 'neg') : '';
  const extreme = cardImpact(cardId) === 2 ? 'extreme' : '';
  const tip = `${cardLabel(cardId)}: ${cardSentence(cardId)}`;
  const face = cardValueText(cardId);
  return `<span class="chip ${card.category} ${sign} ${extreme} ${extraClass}" data-tip="${tip}">${face}</span>`;
}
// Two lines for a position: "x × price = buy-in", then "now value  ±P&L" (green for a profit, red for a loss).
function positionLines(firstLine, buyIn, valueNow) {
  return `
    <div class="line"><span>${firstLine}</span><span>= ${formatMoney(buyIn)}</span></div>
    <div class="line ${colourClass(valueNow - buyIn)}"><span>now ${formatMoney(valueNow)}</span><span>${formatSignedMoney(valueNow - buyIn)}</span></div>`;
}
function optionLabel(run, option) { return `${formatSignedCount(directionSign(option) * option.quantity)} ${option.type === 'call' ? 'C' : 'P'}${formatPlain(option.strikePrice)}`; }

// The side menu: day, cash, the stock, options, equity, heat, the next meeting.
function renderSide() {
  const run = view.run, today = run.today, price = currentPrice(today), equity = totalEquity(run);
  const secondsLeft = (TICKS_PER_DAY - today.tick) * SECONDS_PER_TICK;
  const minutes = Math.floor(secondsLeft / 60), seconds = String(Math.floor(secondsLeft % 60)).padStart(2, '0');
  const clock = run.phase === 'preopen' ? '<span class="dim">pre-open</span>' : `${minutes}:${seconds}`;
  const stockHtml = today.shares === 0
    ? '<div class="line dim">—</div><div class="line"></div>'
    : positionLines(`${formatSignedCount(today.shares)} × ${formatPrice(today.averageEntryPrice)}`, today.shares * today.averageEntryPrice, today.shares * price);
  const options = today.options;
  const optionsHtml = options.length === 0 ? '<div class="line dim">—</div>'
    : options.slice(0, SIDE_OPTIONS_SHOWN).map(option => positionLines(`${optionLabel(run, option)} <span class="dim">${daysToExpiry(run, option)}d</span>`, optionBuyIn(option), optionValueNow(run, option))).join('')
      + (options.length > SIDE_OPTIONS_SHOWN ? `<div class="line dim">+${options.length - SIDE_OPTIONS_SHOWN} more</div>` : '');
  const meetingNumber = nextMeetingNumber(run), target = meetingTarget(run, meetingNumber);
  const investigation = run.investigationDaysLeft > 0 ? ` · SEC ${run.investigationDaysLeft}d` : '';

  element('side').innerHTML = `
    <div id="brand">INSIDER</div>
    <div class="sideHead"><b>DAY ${run.day} · ${today.ticker}</b><span class="clock">${clock}</span></div>
    <div class="label">cash</div><div class="value">${formatMoney(run.cash)}</div>
    <div class="label"><span>stock</span><span>${formatPrice(price)}</span></div>${stockHtml}
    <div class="label"><span>options</span><span>${options.length || ''}</span></div>${optionsHtml}
    <div class="rule"></div>
    <div class="label">equity</div><div class="value ${colourClass(equity - today.startEquity)}" id="equityValue">${formatMoney(equity)}</div>
    <div class="label" data-tip="SEC heat: ending a day at ${HEAT_LIMIT} starts an investigation"><span>heat</span><span class="heat">${Math.round(run.heat)} / ${HEAT_LIMIT}${investigation}</span></div>
    <div class="heatBar"><i style="width:${clamp(run.heat / HEAT_LIMIT, 0, 1) * 100}%"></i></div>
    <div class="label" data-tip="When equity falls below this, every position is closed"><span>margin call</span><span>${accountLeverage(run)}× leverage</span></div>
    <div class="line marginLine">${marginLineHtml(run, equity)}</div>
    <div class="label" data-tip="Equity at the close of that day must reach this, under that day's rule"><span>meeting · day ${meetingNumber * MEETING_EVERY_DAYS}</span></div>
    <div class="line"><span class="${equity >= target ? 'up' : 'gold'}">${formatMoney(target)}</span><span class="heat" data-tip="${BOSS_RULES[bossRuleOn(run, meetingNumber * MEETING_EVERY_DAYS)].sentence}">${BOSS_RULES[bossRuleOn(run, meetingNumber * MEETING_EVERY_DAYS)].face}</span></div>
    <div class="sideButtons">
      <button class="button" data-action="openDeck" data-tip="The deck (D)">🂠 DECK</button>
      <button class="button" data-action="menu" data-tip="Menu (Esc)">☰</button>
    </div>`;

  if (view.lastEquity !== null && Math.abs(equity - view.lastEquity) > Math.abs(view.lastEquity) * EQUITY_FLASH_CHANGE)
    element('equityValue').classList.add(equity > view.lastEquity ? 'flashUp' : 'flashDown');
  view.lastEquity = equity;
}

// The buttons under the chart. Before the open: market choice, TRADE, OPEN. During the day: TRADE, CLOSE ALL,
// speed, skip to the close, pause. The button to press next glows.
function renderActions() {
  const run = view.run;
  element('actions').innerHTML = run.phase === 'preopen' ? preOpenButtons(run) : tradingButtons(run);
}
function preOpenButtons(run) {
  const today = run.today;
  const switchLocked = today.tickerLocked || hasPositions(run) ? 'locked' : '';
  const stocks = run.tickersOwned.length < 2 ? '' : '<span class="gap"></span>' + run.tickersOwned.map(tickerId => `
    <button class="toggle ${tickerId === today.ticker ? 'on' : ''} ${switchLocked}" data-action="ticker" data-argument="${tickerId}"
      data-tip="${TICKERS[tickerId].name}: ${TICKERS[tickerId].sentence}">${TICKERS[tickerId].icon} ${tickerId}</button>`).join('');
  return `${stocks}<span class="gap"></span>
    <button class="button" data-action="openTrade">TRADE</button>
    <button class="button primary suggest" data-action="openMarket">OPEN ▶</button>`;
}
function tradingButtons(run) {
  const positions = hasPositions(run);
  return `
    <button class="button primary ${positions ? '' : 'suggest'}" data-action="openTrade">TRADE</button>
    <button class="button" style="visibility:${positions ? 'visible' : 'hidden'}" data-action="closeEverything" data-tip="Close the stock and every option">CLOSE ALL</button>
    <span class="gap"></span>
    <button class="button" data-action="speed" data-tip="Speed (F)" style="width:74px">${GAME_SPEEDS[view.speedIndex]}×</button>
    <button class="button" data-action="skipToClose" data-tip="Play the rest of the day instantly">⏭ CLOSE</button>
    <button class="button" data-action="pause" data-tip="Pause (Space)" style="width:56px">${view.paused ? '▶' : '⏸'}</button>`;
}

// The corner of the chart: the last card drawn, what is waiting or in force (next ×2, the day's rules, σ), and the
// cards a Peek showed that are still to come.
function formatMultiplier(multiplier) { return multiplier >= 1 ? String(multiplier) : '1/' + Math.round(1 / multiplier); }
function renderLastCards() {
  const today = view.run.today;
  const last = today.tick > 0 ? today.schedule.cards[today.tick] : [];
  const upcoming = today.schedule.cards.flat().slice(today.schedule.drawnBefore[today.tick], today.revealedUpTo);
  const multiplier = today.schedule.states[today.tick].nextMoveMultiplier;
  const state = today.schedule.states[today.tick];
  const badges = [];
  if (multiplier !== 1) badges.push(['next ×' + formatMultiplier(multiplier), 'The next move counts ×' + formatMultiplier(multiplier)]);
  if (state.allDayBonus) badges.push([`${state.allDayBonus > 0 ? '+' : '−'}${Math.round(Math.abs(state.allDayBonus) * 100)}% all day`, 'Every move until the close gets this']);
  if (state.allDayMultiplier !== 1) badges.push(['×' + formatMultiplier(state.allDayMultiplier) + ' all day', 'Every card move until the close counts this much']);
  if (state.noBuying) badges.push(['no buying', 'Until the close you cannot buy']);
  if (state.noSelling) badges.push(['no selling', 'Until the close you cannot sell']);
  if (state.volatility !== 1) badges.push(['σ ' + state.volatility.toFixed(2), 'Every card move is × σ']);
  if (state.frozenTicksLeft > 0) badges.push(['frozen ' + state.frozenTicksLeft, 'No market cards for this many ticks']);
  if (state.moveCap !== Infinity) badges.push(['moves capped at 5%', 'Circuit breakers (meeting day)']);
  if (today.bossRule === 'noOptions') badges.push(['no options', 'The options desk is closed today']);
  if (today.effects.hedge) badges.push(['hedged', 'The next move against your stock costs half']);
  if (today.effects.trailingStop) badges.push(['trailing stop', 'Closes when the price turns 5% from its best']);
  if (today.effects.pyramid) badges.push(['pyramid', 'Every move in your favour adds 10%']);
  const waiting = badges.map(([text, tip]) => `<span class="chip multiplier" data-tip="${tip}">${text}</span>`).join('');
  element('lastCards').innerHTML = last.map(cardId => chipHtml(cardId, view.freshTick === today.tick ? 'fresh' : '')).join('')
    + waiting + upcoming.map(cardId => chipHtml(cardId, 'future')).join('');
}

// The hand: focus left, then each play (cost, heat, name, what it does). Click to play it.
function renderHand() {
  const run = view.run, today = run.today;
  const pips = '●'.repeat(today.focus) + '○'.repeat(Math.max(0, (today.bossRule === 'oneFocus' ? 1 : FOCUS_PER_DAY) - today.focus));
  const cards = today.hand.map((playId, index) => {
    const play = PLAYS[playId], blocked = playBlockedReason(run, index);
    return `<div class="play ${blocked ? 'locked' : ''}" data-action="play" data-argument="${index}" ${blocked ? `data-tip="${blocked}"` : ''}>
      <div class="playTop"><span class="cost">${'●'.repeat(play.cost) || '0'}</span>${play.heat ? `<span class="playHeat">🔥${play.heat}</span>` : ''}</div>
      <div class="playName">${play.face}</div><div class="playText">${play.sentence}</div></div>`;
  }).join('');
  element('hand').innerHTML = `<div class="focus">focus<span class="pips">${pips}</span></div>`
    + (cards || '<span class="emptyHand">no plays left today</span>');
}

function renderAll() {
  if (!view.run || !view.run.today) return;
  renderSide();
  renderHand();
  renderActions();
  renderLastCards();
}

// ═══════════════════════════════════════ § 11 OVERLAYS ═══════════════════════════════════════
// ── 11.1 Showing and hiding. soft = the game stays visible behind (the trade menu).
function showOverlay(name, html, soft = false) {
  view.overlay = name;
  element('overlay').innerHTML = html;
  element('overlay').classList.toggle('show', !!name);
  element('overlay').classList.toggle('soft', soft);
}
function hideOverlay() {
  view.overlay = null;
  view.tradeMenu = null;
  element('overlay').classList.remove('show', 'soft');
  element('overlay').innerHTML = '';
}

// ── 11.2 Title, menu, day result, game over, deck
function readRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || { bestEquity: 0, longestRun: 0 }; }
  catch (error) { return { bestEquity: 0, longestRun: 0 }; }
}
function writeRecords(run) {
  const records = readRecords();
  records.bestEquity = Math.max(records.bestEquity, run.peakEquity);
  records.longestRun = Math.max(records.longestRun, run.day);
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (error) { /* storage blocked */ }
}

function showTitle() {
  const saved = localStorage.getItem(SAVE_KEY), records = readRecords();
  showOverlay('title', `
    <div class="card">
      <div class="title">INSIDER</div>
      <div class="note">the price is a deck of cards · rig it</div>
      ${records.bestEquity ? `<div class="note">best ${formatMoney(records.bestEquity)} · longest ${records.longestRun} days</div>` : ''}
      <div class="menuButtons">
        ${saved ? '<button class="button primary" data-action="continueRun">CONTINUE</button>' : ''}
        <button class="button ${saved ? '' : 'primary'}" data-action="newRun">NEW RUN</button>
      </div>
    </div>`);
}

function showMenu() {
  view.paused = true;
  showOverlay('menu', `
    <div class="card">
      <h1>Paused</h1>
      <div class="menuButtons">
        <button class="button primary" data-action="resume">RESUME</button>
        <button class="button" data-action="sound">${sound.muted ? 'SOUND OFF' : 'SOUND ON'}</button>
        <button class="button" data-action="toTitle">TITLE</button>
      </div>
    </div>`);
}

function showResult() {
  const run = view.run, result = run.lastResult, meeting = result.meeting;
  const profit = result.endEquity - result.startEquity;
  const notes = [];
  if (result.heatAdded > 0) notes.push(`<div class="note heat">🔥 +${Math.round(result.heatAdded)} heat: abnormal day</div>`);
  if (result.investigationNote === 'opened') notes.push(`<div class="note heat">🚨 SEC investigation: ${INVESTIGATION_DAYS} clean days</div>`);
  if (result.investigationNote === 'cleared') notes.push('<div class="note up">Investigation closed</div>');
  if (meeting) notes.push(`<div class="note ${meeting.passed ? 'up' : 'down'}">Meeting ${meeting.number}: ${formatMoney(meeting.target)} ${meeting.passed ? '✓' : '✗'}</div>`);
  if (meeting && meeting.passed && meeting.final) notes.push('<div class="note gold">🏆 Last meeting passed. Play on for bigger numbers.</div>');
  showOverlay('result', `
    <div class="card">
      <h1>Day ${result.day} · ${result.ticker}</h1>
      <div class="note">${formatPrice(result.openPrice)} → ${formatPrice(result.closePrice)} <span class="${colourClass(result.closePrice - result.openPrice)}">${formatPercent(result.closePrice / result.openPrice - 1)}</span></div>
      <div class="huge ${colourClass(profit)}" id="countUp">${formatSignedMoney(0)}</div>
      <div class="note">equity ${formatMoney(result.endEquity)}</div>
      ${notes.join('')}
      <div class="menuButtons"><button class="button primary" data-action="afterResult">${run.gameOverReason ? 'CONTINUE' : 'SHOP'}</button></div>
    </div>`);
  countUp(element('countUp'), profit);
}
// Balatro-style count-up of the day's P&L.
function countUp(target, finalValue) {
  const started = performance.now(), seconds = 0.9;
  const step = () => {
    if (!target.isConnected) return;
    const progress = Math.min(1, (performance.now() - started) / 1000 / seconds);
    target.textContent = formatSignedMoney(finalValue * (1 - Math.pow(1 - progress, 3)));
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function showGameOver() {
  const run = view.run;
  writeRecords(run);
  showOverlay('gameover', `
    <div class="card">
      <h1>Fund closed</h1>
      <div class="note">${run.gameOverReason === 'meeting' ? 'The investors pulled their money.' : 'No money left to trade.'}</div>
      <div class="huge gold">${run.day} days</div>
      <div class="note">peak ${formatMoney(run.peakEquity)} · meetings ${run.meetingsPassed}</div>
      <div class="menuButtons"><button class="button primary" data-action="newRun">NEW RUN</button></div>
    </div>`);
  try { localStorage.removeItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
}

// The deck window: every card of today's stock: how many are left in the draw pile / how many the deck holds.
function showDeck() {
  const today = view.run.today, deck = view.run.decks[today.ticker], left = countCards(remainingDrawPile(today));
  const cards = CARD_ORDER.filter(cardId => deck[cardId] > 0 || !CARD_TYPES[cardId].assetClasses);
  showOverlay('deck', `
    <div class="card fullScreen">
      <div class="shopHead">
        <h1>${TICKERS[today.ticker].icon} ${today.ticker}</h1>
        <span class="slot"><small>left in the draw pile</small><b>${remainingDrawPile(today).length} / ${deckSize(deck)}</b></span>
        <span class="spacer"></span>
        <button class="button" data-action="closeOverlay">CLOSE</button>
      </div>
      <div class="deckGrid">${cards.map(cardId => `
        <div class="deckCard ${deck[cardId] === 0 ? 'gone' : ''}" data-tip="${cardLabel(cardId)}: ${cardSentence(cardId)}">
          ${chipHtml(cardId)}<span>${hasOwnName(cardId) ? cardLabel(cardId) : ''}</span>
          <span class="count">${left[cardId]}<small> / ${deck[cardId]}</small></span>
        </div>`).join('')}
      </div>
      <div class="shopHead" style="margin-top:14px"><h1 style="font-size:18px">Your playbook · ${view.run.playbook.length}</h1></div>
      <div class="offerRow" style="flex-wrap:wrap;justify-content:flex-start;margin-top:4px">${view.run.playbook.map(playId => `<span class="chip rule" data-tip="${PLAYS[playId].sentence}">${PLAYS[playId].face}</span>`).join('')}</div>
    </div>`);
}

// ── 11.3 The trade menu: one question per step.
//   'action'   the six trades (long / short stock, long / short call, long / short put). Open trades sit as small
//              icons on their own row: a key letter or a click opens one.
//   'strike'   a new option: choose the strike price K (each row shows K and the premium).
//   'position' an open trade: ADD (more of the same: direction, K and expiry) or CLOSE (part or all).
//   'amount'   the slider, the numbers it gives, and the button that makes the trade.
// view.tradeMenu = { step, mode: 'new' | 'add' | 'close', action: 'long' | 'short' | 'longOption' | 'shortOption',
//   type, strikePrice, expiryDay, position: { type: 'stock' } | { type: 'option', index }, percent, message }.
// After a trade the menu returns to 'action', so the game stays paused until Esc.
function openTrade() {
  if (!tradingOpen()) return;
  view.tradeMenu = freshTradeMenu();
  showTrade();
}
function freshTradeMenu(message = null) {
  return { step: 'action', mode: 'new', action: null, type: null, strikePrice: null, expiryDay: null, position: null, percent: SLIDER_DEFAULT_PERCENT, message };
}
function goTo(step, changes) {
  Object.assign(view.tradeMenu, changes, { step, message: null });
  if (step === 'amount') view.tradeMenu.percent = view.tradeMenu.mode === 'close' ? 100 : SLIDER_DEFAULT_PERCENT;
  showTrade();
}
function tradeBack() {
  const tradeMenu = view.tradeMenu;
  if (tradeMenu.step === 'action') { hideOverlay(); renderAll(); return; }
  if (tradeMenu.step === 'amount' && tradeMenu.mode !== 'new') { goTo('position', {}); return; }
  if (tradeMenu.step === 'amount' && tradeMenu.strikePrice !== null) { goTo('strike', { strikePrice: null }); return; }
  goTo('action', { strikePrice: null, position: null, mode: 'new' });
}
function optionPositionInfo(option) { return OPTION_POSITIONS[optionPositionId(option.direction, option.type)]; }
function selectedOption() {
  const position = view.tradeMenu.position;
  return position && position.type === 'option' ? view.run.today.options[position.index] : null;
}

// The rows of the current step: { main, detail, locked, tip, openTrades, pick() }.
function tradeRows() {
  const step = view.tradeMenu.step;
  if (step === 'action') return actionRows();
  if (step === 'strike') return strikeRows();
  if (step === 'position') return positionRows();
  return [];
}
function actionRows() {
  const run = view.run, today = run.today;
  const optionRow = (direction, type) => {
    const positionId = optionPositionId(direction, type), position = OPTION_POSITIONS[positionId];
    const blocked = blockedReason(run, direction === 'long' ? 1 : -1);
    return {
      main: position.name.toUpperCase(), detail: position.formula, openTrades: openTradesOn(positionId),
      locked: !run.unlocked[positionId] || today.investigation || !!blocked,
      tip: blocked || (today.investigation ? 'No options during an investigation' : `${position.name} is unlocked in the shop`),
      choose: () => goTo('strike', { action: direction + 'Option', type, mode: 'new', expiryDay: newExpiryDay(run) }),
    };
  };
  return [
    { main: 'LONG STOCK', detail: 'P&L = S − entry price', openTrades: openTradesOn('longStock'), locked: buyingBlocked(run), tip: 'No buying today',
      choose: () => goTo('amount', { action: 'long', mode: 'new' }) },
    { main: 'SHORT STOCK', detail: 'P&L = entry price − S', openTrades: openTradesOn('shortStock'), locked: sellingBlocked(run), tip: 'No selling today',
      choose: () => goTo('amount', { action: 'short', mode: 'new' }) },
    optionRow('long', 'call'), optionRow('short', 'call'), optionRow('long', 'put'), optionRow('short', 'put'),
  ];
}
// The open trades that belong on a row ('longStock', 'shortStock' or an option position id): { icon, hover, profit, show() }.
function openTradesOn(rowId) {
  const run = view.run, today = run.today, price = currentPrice(today), trades = [];
  if (today.shares !== 0 && rowId === (today.shares > 0 ? 'longStock' : 'shortStock'))
    trades.push({ icon: STOCK_ICON, hover: `average price = ${formatFull(today.averageEntryPrice)}, S = ${formatFull(price)}`,
      profit: today.shares * (price - today.averageEntryPrice), show: () => goTo('position', { position: { type: 'stock' } }) });
  today.options.forEach((option, index) => {
    if (optionPositionId(option.direction, option.type) !== rowId) return;
    trades.push({ icon: optionPositionInfo(option).icon, hover: `K = ${formatFull(option.strikePrice)}, S = ${formatFull(price)}`,
      profit: optionValueNow(run, option) - optionBuyIn(option), show: () => goTo('position', { position: { type: 'option', index } }) });
  });
  return trades;
}
// All open trades in the order their icons are drawn, so key letters and clicks agree.
function openTradeIcons() { return actionRows().flatMap(row => row.openTrades); }
function strikeRows() {
  const run = view.run, tradeMenu = view.tradeMenu, price = currentPrice(run.today);
  return strikeOffsets(tradeMenu.type).map(offset => {
    const strikePrice = price * (1 + offset), prices = optionPrices(run, tradeMenu.type, strikePrice);
    const premium = tradeMenu.action === 'longOption' ? prices.buyPrice : prices.sellPrice;           // what you pay or receive
    return { main: 'K ' + formatPlain(strikePrice), detail: `<span class="gold" style="font-size:15px">${formatPrice(premium)}</span>`,

  });
}
function positionRows() {
  const run = view.run, option = selectedOption();
  const addMore = option
    ? { action: option.direction + 'Option', type: option.type, strikePrice: option.strikePrice, expiryDay: option.expiryDay, mode: 'add' }
    : { action: run.today.shares > 0 ? 'long' : 'short', mode: 'add' };
  const long = option ? option.direction === 'long' : run.today.shares > 0;
  const addBlocked = blockedReason(run, long ? 1 : -1), closeBlocked = blockedReason(run, long ? -1 : 1);
  return [
    { main: 'ADD', detail: 'more of the same', locked: !!addBlocked || (!!option && !optionsAllowed(run, option.direction, option.type)),

    { main: 'CLOSE', detail: 'part or all of it', locked: !!closeBlocked, tip: closeBlocked, choose: () => goTo('amount', { mode: 'close' }) },

// What the slider's percentage does right now: { amount, note, confirm, empty, run() }.
function tradePreview() {
  const tradeMenu = view.tradeMenu;
  if (tradeMenu.mode === 'close') return selectedOption() ? closeOptionPreview() : closeStockPreview();
  if (tradeMenu.action === 'long' || tradeMenu.action === 'short') return stockPreview();
  return tradeMenu.action === 'longOption' ? longOptionPreview() : shortOptionPreview();
}
function closeStockPreview() {
  const run = view.run, today = run.today, price = currentPrice(today), fraction = view.tradeMenu.percent / 100;
  const shares = today.shares * fraction;
  return {
    amount: `${formatSignedCount(-shares)} × ${formatPrice(price)} = ${formatMoney(-shares * price)}`,
    note: 'P&L on these ' + formatSignedMoney(shares * (price - today.averageEntryPrice)),
    confirm: `CLOSE ${view.tradeMenu.percent}%`, empty: Math.abs(shares) * price < SMALLEST_TRADE,
    run: () => closeStockPart(run, fraction),

}
function closeOptionPreview() {
  const run = view.run, option = selectedOption(), fraction = view.tradeMenu.percent / 100;
  const quantity = option.quantity * fraction, cash = cashFromClosingOption(run, option, fraction);
  return {
    amount: `${formatSignedCount(-directionSign(option) * quantity)} × ${formatPrice(Math.abs(cash) / Math.max(quantity, 1e-12))} = ${formatMoney(cash)}`,
    note: 'P&L on these ' + formatSignedMoney(cash - optionBuyIn(option) * fraction),
    confirm: `CLOSE ${view.tradeMenu.percent}%`, empty: quantity * currentPrice(run.today) < SMALLEST_TRADE,
    run: () => closeOption(run, view.tradeMenu.position.index, fraction),

function stockPreview() {
  const run = view.run, price = currentPrice(run.today), fraction = view.tradeMenu.percent / 100;

  const leverage = maximumLeverage(run) > 1 ? ` · ${maximumLeverage(run)}×` : '';
  return {
    amount: `${formatSignedCount(shares)} × ${formatPrice(price)} = ${formatMoney(shares * price)}`,
    note: (direction > 0 ? 'of ' : 'of the largest short ') + formatMoney(available * price) + leverage
      + marginNote(run, exposure(run) - Math.abs(run.today.shares * price) + Math.abs((run.today.shares + shares) * price)),
    confirm: direction > 0 ? 'LONG STOCK' : 'SHORT STOCK', empty: available * price < SMALLEST_TRADE,

// After the trade: the equity below which a margin call would come.
function marginNote(run, exposureAfter) { return exposureAfter > 0 ? ` · margin call below ${formatMoney(marginCallEquity(run, exposureAfter))}` : ''; }
function optionSeries(tradeMenu, run) { return `K ${formatPlain(tradeMenu.strikePrice)} · ${tradeMenu.expiryDay - run.day} days`; }
function longOptionPreview() {
  const run = view.run, tradeMenu = view.tradeMenu, fraction = tradeMenu.percent / 100;
  const { buyPrice } = optionPrices(run, tradeMenu.type, tradeMenu.strikePrice, tradeMenu.expiryDay);
  const cashToSpend = fraction * buyingPower(run) / (1 + OPTION_TRANSACTION_COST);
  return {
    amount: `${formatSignedCount(cashToSpend / buyPrice)} × ${formatPrice(buyPrice)} = ${formatMoney(cashToSpend)}`,
    note: `${optionSeries(tradeMenu, run)} · you pay ${formatPrice(buyPrice)} per option${marginNote(run, exposure(run) + cashToSpend)}`,
    confirm: 'LONG ' + tradeMenu.type.toUpperCase(), empty: cashToSpend < SMALLEST_TRADE,

    amount: `${formatSignedCount(-quantity)} × ${formatPrice(sellPrice)} = ${formatMoney(-quantity * sellPrice)}`,
    note: `${optionSeries(tradeMenu, run)} · you receive ${formatPrice(sellPrice)} per option${marginNote(run, exposure(run) + quantity * currentPrice(run.today))}`,
    confirm: 'SHORT ' + tradeMenu.type.toUpperCase(), empty: quantity * sellPrice < SMALLEST_TRADE,

// ═══════════════════════════════════════ § 12 INPUT ═══════════════════════════════════════
// The game is played with the mouse only: every clickable element names its action in data-action.
// Saving never stops the game: if the browser blocks storage, the run just isn't saved.
function saveRun() {
  try { if (view.run) localStorage.setItem(SAVE_KEY, serialiseRun(view.run)); } catch (error) { /* storage blocked */ }
}
function savePreferences() {
  const preferences = { muted: sound.muted, speedIndex: view.speedIndex };
  try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify(preferences)); } catch (error) { /* storage blocked */ }
}
function tradingOpen() { const run = view.run; return run && (run.phase === 'preopen' || run.phase === 'trading') && run.today.tick < TICKS_PER_DAY; }

// Everything a button or key can do. Buttons name their action in data-action (and an optional data-argument).
const ACTIONS = {
  newRun() { view.run = newRun(); view.lastEquity = null; hideOverlay(); saveRun(); },
  continueRun() {
    const run = loadRun(localStorage.getItem(SAVE_KEY));
    if (!run) { ACTIONS.newRun(); return; }
    view.run = run; view.lastEquity = null; hideOverlay();
    if (run.phase === 'trading') showMenu();
    else if (run.phase === 'result') showResult();
    else if (run.phase === 'shop') { if (run.cardOffer) showCardOffer(); else showShop(); }
  },
  toTitle() { saveRun(); view.paused = false; showTitle(); },
  resume() { view.paused = false; hideOverlay(); },
  menu() { if (view.overlay === 'menu') ACTIONS.resume(); else if (!view.overlay && view.run) showMenu(); },
  closeOverlay() { hideOverlay(); },
  speed() { view.speedIndex = (view.speedIndex + 1) % GAME_SPEEDS.length; savePreferences(); },
  sound() { sound.muted = !sound.muted; savePreferences(); if (view.overlay === 'menu') showMenu(); },
  pause() { if (view.run.phase === 'trading') view.paused = !view.paused; },
  openDeck() { if (!view.overlay) showDeck(); },
  openTrade() { openTrade(); },
  tradeRow(index) { pickTradeRow(index); },
  openTradeIcon(index) { openTradeIcon(index); },
  confirmTrade() { confirmTrade(); },
  closeEverything() { if (tradingOpen() && hasPositions(view.run) && !view.tradeMenu) finishTrade(closeEverything(view.run), 'ALL CLOSED'); },
  play(handIndex) {
    if (!tradingOpen()) return;
    if (view.run.today.hand[handIndex] === 'pickOfTwo' && !playBlockedReason(view.run, handIndex)) { showPickOfTwo(handIndex); return; }
    showPlayResult(playCard(view.run, handIndex));
  },
  pickChoice(argument) {
    const [handIndex, choice] = argument.split(':').map(Number);
    hideOverlay();
    showPlayResult(playCard(view.run, handIndex, choice));
  },
  ticker(tickerId) { if (switchTicker(view.run, tickerId)) saveRun(); else sounds.denied(); },
  openMarket() {
    if (view.run.phase !== 'preopen') return;
    openTheMarket(view.run);
    view.paused = false;
    saveRun();
  },
  skipToClose() { while (view.run.phase === 'trading') runOneTick(true); },
  afterResult() {
    if (view.run.gameOverReason) { showGameOver(); return; }
    view.run.phase = 'shop';
    saveRun();
    showShop();
  },
  nextDay() { startNextDay(view.run); view.lastEquity = null; hideOverlay(); saveRun(); },
  tradeBack() { tradeBack(); },
  shopItem(index) { chooseShopItem(index); },
  pickOffer(cardId) { pickOfferedCard(view.run, cardId || null); if (cardId) sounds.buy(); saveRun(); showShop(); },
};
const NUMBER_ARGUMENT_ACTIONS = ['tradeRow', 'openTradeIcon', 'shopItem', 'play'];

function handleClick(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.classList.contains('locked')) { sounds.denied(); return; }
  const action = ACTIONS[target.dataset.action];
  if (!action) return;
  const argument = target.dataset.argument;
  action(NUMBER_ARGUMENT_ACTIONS.includes(target.dataset.action) ? Number(argument) : argument);
  if (!view.overlay || view.overlay === 'menu') renderAll();
}

// Instant tooltips for anything with data-tip; in the shop the line under the cards explains the card under the mouse.
function handleMouseMove(event) {
  const sentenceHolder = event.target.closest('[data-sentence]');
  if (sentenceHolder && element('selectedSentence')) element('selectedSentence').textContent = sentenceHolder.dataset.sentence;
  const tooltip = element('tooltip'), target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) { tooltip.style.display = 'none'; return; }
  tooltip.textContent = target.dataset.tip;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, event.clientX + 14) + 'px';
  tooltip.style.top = Math.min(window.innerHeight - tooltip.offsetHeight - 8, event.clientY + 16) + 'px';
}

// ═══════════════════════════════════════ § 13 START ═══════════════════════════════════════
// One tick of the live day, with its sound, shake and popup. quiet = skipping to the close.
function runOneTick(quiet) {
  const run = view.run, equityBefore = totalEquity(run);
  const outcome = advanceTick(run);
  view.freshTick = run.today.tick;
  if (!quiet) {
    const impact = Math.max(0, ...outcome.cards.map(cardImpact));
    const priceNow = currentPrice(run.today), priceBefore = run.today.schedule.states[run.today.tick - 1].price;
    if (impact > 0) { shakeChart(impact); sounds.bigCard(priceNow >= priceBefore); }
    else if (outcome.cards.length) sounds.tick(priceNow - priceBefore);
    const change = totalEquity(run) - equityBefore;
    if (Math.abs(change) > Math.max(1, Math.abs(equityBefore) * POPUP_CHANGE))
      addPopup(formatSignedMoney(change), change > 0 ? CHART_COLOURS.up : CHART_COLOURS.down, impact === 2 ? 26 : 18);
  }
  if (outcome.message) { sounds.bad(); addPopup(outcome.message, CHART_COLOURS.stop, 22); }
  if (!quiet && outcome.dividendCash) addPopup('dividend ' + formatSignedMoney(outcome.dividendCash), CHART_COLOURS.insight, 17);
  if (outcome.closed) {
    const result = closeDay(run);
    saveRun();
    sounds.cash(result.endEquity >= result.startEquity);
    renderAll();
    showResult();
  }
}

// Every frame: the clock runs (unless paused or a window is open), a tick happens each SECONDS_PER_TICK,
// and the chart is redrawn.
let lastFrameTime = null;
function frame(time) {
  const seconds = lastFrameTime === null ? 0 : Math.min(0.25, (time - lastFrameTime) / 1000);
  lastFrameTime = time;
  const run = view.run, clockRuns = run && run.phase === 'trading' && !view.paused && !view.overlay;
  if (clockRuns) {
    const today = run.today, gameSeconds = seconds * GAME_SPEEDS[view.speedIndex];
    today.tickClock += gameSeconds;
    if (today.tickClock >= SECONDS_PER_TICK) {
      today.tickClock -= SECONDS_PER_TICK;
      runOneTick(false);
      if (run.phase === 'trading') { saveRun(); renderAll(); }
    }
  }
  element('pauseNote').style.display = view.paused && run && run.phase === 'trading' && !view.overlay ? 'grid' : 'none';
  drawChart();
  requestAnimationFrame(frame);
}

function start() {
  try {
    const preferences = JSON.parse(localStorage.getItem(PREFERENCES_KEY)) || {};
    sound.muted = !!preferences.muted;
    view.speedIndex = preferences.speedIndex || 0;
  } catch (error) { /* defaults */ }
  if (new URLSearchParams(location.search).has('mute')) sound.muted = true;
  try { const saved = localStorage.getItem(SAVE_KEY); view.run = saved ? loadRun(saved) : null; } catch (error) { view.run = null; }
  if (!view.run) view.run = newRun();
  showTitle();
  renderAll();
  document.addEventListener('click', handleClick);
  document.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('resize', renderAll);
  requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') start();
</script>
