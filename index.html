}
// A bought card is shuffled into the draw pile.
function buyReelCard(run, reelIndex) {
  const cardId = run.shop.reels[reelIndex];
  if (!cardId || run.shop.sold[reelIndex] || !canSpend(run, cardPrice(run, cardId))) return false;
  run.cash -= cardPrice(run, cardId);
  run.shop.sold[reelIndex] = true;
  run.deck.push(cardId);
  const random = makeRandom(mixSeed(run.seed, run.day, run.deck.length, 41));
  run.drawPile.splice(Math.floor(random() * (run.drawPile.length + 1)), 0, cardId);
  return true;
}
// Selling one copy: it leaves the deck and whichever pile holds it.
function sellCard(run, cardId) {
  if (run.deck.length <= MINIMUM_PLAYER_DECK || !run.deck.includes(cardId)) return false;
  run.deck.splice(run.deck.indexOf(cardId), 1);
  for (const pile of [run.drawPile, run.discardPile, run.hand]) {
    const index = pile.indexOf(cardId);
    if (index >= 0) { pile.splice(index, 1); break; }
  }
  run.cash += cardSellPrice(run, cardId);
  return true;
}

// ── 7.2 Saving: the whole run is plain data. The market maker's closes are rebuilt on load.
function serialiseRun(run) {
  return JSON.stringify({ ...run, today: run.today ? { ...run.today, closeForecast: null } : null });
}
function loadRun(text) {
  const run = JSON.parse(text);
  if (!run || run.version !== SAVE_VERSION) return null;
  if (run.today) refreshForecast(run);
  return run;
}

// ═══════════════════════════════════════ § 8 SOUND ═══════════════════════════════════════
const sound = { context: null, muted: false };
function playTone(frequency, seconds, { type = 'triangle', volume = 0.05, slideTo = null, delay = 0 } = {}) {
  if (sound.muted) return;
  try {
    sound.context = sound.context || new (window.AudioContext || window.webkitAudioContext)();
    const context = sound.context, start = context.currentTime + delay;
    const oscillator = context.createOscillator(), gain = context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, start + seconds);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  } catch (error) { /* no audio available */ }
}
const sounds = {
  tick(move) { playTone(move >= 0 ? 660 : 440, 0.05, { volume: 0.012, type: 'sine' }); },
  bigCard(rising) { playTone(rising ? 520 : 300, 0.35, { volume: 0.06, slideTo: rising ? 1040 : 120, type: 'sawtooth' }); },
  card() { playTone(740, 0.06, { volume: 0.035, type: 'square' }); },
  trade() { playTone(880, 0.09, { volume: 0.05, type: 'square' }); playTone(1320, 0.1, { volume: 0.035, delay: 0.05 }); },
  manipulation() { playTone(300, 0.3, { volume: 0.05, slideTo: 900, type: 'sawtooth' }); },
  bad() { playTone(220, 0.4, { volume: 0.07, slideTo: 90, type: 'sawtooth' }); },
  warning() { [880, 660, 880, 660].forEach((frequency, index) => playTone(frequency, 0.1, { volume: 0.04, type: 'square', delay: index * 0.12 })); },
  cash(gained) { (gained ? [523, 659, 784, 1047] : [392, 330, 262]).forEach((frequency, index) => playTone(frequency, 0.14, { volume: 0.05, delay: index * 0.08 })); },
  buy() { playTone(980, 0.1, { volume: 0.04 }); playTone(1470, 0.12, { volume: 0.03, delay: 0.06 }); },
  reelTick() { playTone(1100, 0.025, { volume: 0.015, type: 'square' }); },
  reelStop() { playTone(180, 0.09, { volume: 0.07, type: 'square' }); },
  denied() { playTone(160, 0.12, { volume: 0.04, type: 'square' }); },
};

// ═══════════════════════════════════════ § 9 CHART ═══════════════════════════════════════
// Everything the screen keeps that is not part of the saved run.
const view = {
  run: null, speedIndex: 0, paused: false, overlay: null,
  popups: [], lastEquity: null, freshTick: -1, freshHand: 0,     // chart popups, P&L flash, newest chip, newest hand cards
  drag: null,                                                     // the card being dragged or carried (§ 12.1)
  handSpin: false,                                                // a redraw is spinning the hand
  deckSelling: false,                                             // the deck window sells cards (opened from the shop)
};
const element = id => document.getElementById(id);
const chartFont = (weight, size) => `${weight} ${size}px JetBrains Mono, Menlo, monospace`;

function fitCanvas(canvas) {
  const pixelRatio = window.devicePixelRatio || 1, bounds = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(bounds.width * pixelRatio) || canvas.height !== Math.round(bounds.height * pixelRatio)) {
    canvas.width = Math.round(bounds.width * pixelRatio);
    canvas.height = Math.round(bounds.height * pixelRatio);
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  return { context, width: bounds.width, height: bounds.height };
}

// The chart, left to right: the past week (thin) and today (live). Lines mark each stock trade's liquidation price
// and each option's strike, and a ceiling or floor for as long as it holds.
function drawChart() {
  const { context, width, height } = fitCanvas(element('chart'));
  context.clearRect(0, 0, width, height);
  const run = view.run;
  if (!run || !run.today) return;
  const chart = chartLayout(run, context, width, height);
  drawGrid(chart);
  drawAverage(chart);
  drawHistory(chart);
  drawTradeLevels(chart);
  drawPins(chart);
  drawToday(chart);
  drawPopups(chart);
}
function chartLayout(run, context, width, height) {
  const today = run.today, states = today.schedule.states;
  const history = run.market.history;
  const left = 20, right = width - 96, top = 64, bottom = height - 26;
  const historyEnd = left + (right - left) * CHART_HISTORY_SHARE;
  const prices = history.flatMap(day => day.prices).concat(states.slice(0, today.tick + 1).map(state => state.price), chartLevels(run));
  let low = Math.min(...prices), high = Math.max(...prices);
  if (high / low < 1.06) { const middle = Math.sqrt(high * low); low = middle / 1.03; high = middle * 1.03; }   // never zoom in too far
  const margin = 0.05 * Math.log(high / low);
  const logLow = Math.log(low) - margin, logHigh = Math.log(high) + margin;
  return {
    run, today, context, history, left, right, top, bottom, height, historyEnd,
    openPrice: states[0].price, price: currentPrice(today),
    xOfPastTick: (dayIndex, tick) => left + (historyEnd - left) * (dayIndex * TICKS_PER_DAY + tick) / (Math.max(1, history.length) * TICKS_PER_DAY),
    xOfTodayTick: tick => historyEnd + (right - historyEnd) * tick / TICKS_PER_DAY,
    yOfPrice: price => bottom - (bottom - top) * (Math.log(Math.max(price, 1e-12)) - logLow) / (logHigh - logLow),
  };
}
// Price levels the chart keeps in view: liquidation prices and strikes not too far from the price.
function chartLevels(run) {
  const price = currentPrice(run.today);
  return tradeLevels(run).map(level => level.price).filter(level => level > price / 3 && level < price * 3);
}
// Every horizontal line for your trades: { price, colour, label }.
function tradeLevels(run) {
  const levels = [];
  for (const trade of run.today.trades) {
    if (trade.kind === 'stock' && tradeLeverageNow(run, trade) > 1.0001)
      levels.push({ price: liquidationPrice(trade), colour: CHART_COLOURS.liquidation, label: `#${trade.number} liq` });
    if (trade.kind !== 'stock') levels.push({ price: trade.strikePrice, colour: trade.kind === 'call' ? CHART_COLOURS.up : CHART_COLOURS.down, label: `#${trade.number} K` });
  }
  return levels;
}

function drawLine(context, fromX, fromY, toX, toY, colour, { width = 1, dashed = false, alpha = 1 } = {}) {
  context.strokeStyle = colour; context.lineWidth = width; context.globalAlpha = alpha;
  context.setLineDash(dashed ? [5, 5] : []);
  context.beginPath(); context.moveTo(fromX, fromY); context.lineTo(toX, toY); context.stroke();
  context.setLineDash([]); context.globalAlpha = 1;
}
function drawDot(context, screenX, screenY, radius, colour) {
  context.fillStyle = colour;
  context.beginPath(); context.arc(screenX, screenY, radius, 0, Math.PI * 2); context.fill();
}
function drawText(context, text, screenX, screenY, colour, { weight = 800, size = 14, align = 'left', alpha = 1 } = {}) {
  context.fillStyle = colour; context.font = chartFont(weight, size); context.globalAlpha = alpha;
  context.textAlign = align; context.textBaseline = 'middle';
  context.fillText(text, screenX, screenY);
  context.globalAlpha = 1;
}
function drawPath(context, points, colour, width) {
  context.strokeStyle = colour; context.lineWidth = width; context.lineJoin = 'round';
  context.beginPath();
  points.forEach(([screenX, screenY], index) => (index === 0 ? context.moveTo(screenX, screenY) : context.lineTo(screenX, screenY)));
  context.stroke();
}
// Day boundaries (with each past day's number), today's open (dashed).
function drawGrid({ context, history, top, bottom, right, historyEnd, xOfPastTick, yOfPrice, openPrice, run }) {
  history.forEach((day, dayIndex) => {
    if (dayIndex > 0) drawLine(context, xOfPastTick(dayIndex, 0), top - 10, xOfPastTick(dayIndex, 0), bottom + 10, CHART_COLOURS.grid);
    if (day.day >= 1) drawText(context, 'day ' + day.day, xOfPastTick(dayIndex, TICKS_PER_DAY / 2), bottom + 14, CHART_COLOURS.openPrice, { size: 10, weight: 700, align: 'center' });
  });
  drawLine(context, historyEnd, top - 10, historyEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawText(context, 'today · day ' + run.day, (historyEnd + right) / 2, bottom + 14, CHART_COLOURS.label, { size: 10, weight: 700, align: 'center' });
  drawLine(context, historyEnd, yOfPrice(openPrice), right, yOfPrice(openPrice), CHART_COLOURS.openPrice, { dashed: true });
}
function drawHistory({ context, history, xOfPastTick, xOfTodayTick, yOfPrice, openPrice }) {
  const points = [];
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) points.push([xOfPastTick(dayIndex, tick), yOfPrice(day.prices[tick])]);
  });
  points.push([xOfTodayTick(0), yOfPrice(openPrice)]);
  drawPath(context, points, CHART_COLOURS.history, 1.5);
}
// The moving average the price is pulled toward: a soft gold line through the past week and today.
function drawAverage({ context, history, today, xOfPastTick, xOfTodayTick, yOfPrice }) {
  const points = [];
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) points.push([xOfPastTick(dayIndex, tick), yOfPrice(day.averages[tick])]);
  });
  today.schedule.states.slice(0, today.tick + 1).forEach((state, tick) => points.push([xOfTodayTick(tick), yOfPrice(state.averagePrice)]));
  context.globalAlpha = 0.45;
  drawPath(context, points, CHART_COLOURS.accent, 2);
  context.globalAlpha = 1;
  if (points.length) drawText(context, 'avg', points[points.length - 1][0] + 8, points[points.length - 1][1] + 12, CHART_COLOURS.accent, { size: 10, alpha: 0.6 });
}
// Liquidation prices and strikes, labelled at the right edge (labels never overlap).
function drawTradeLevels({ run, context, historyEnd, right, top, bottom, yOfPrice }) {
  const labelYs = [];
  for (const level of tradeLevels(run)) {
    const levelY = yOfPrice(level.price);
    if (levelY < top - 20 || levelY > bottom + 20) continue;
    drawLine(context, historyEnd, levelY, right, levelY, level.colour, { dashed: true, alpha: 0.8 });
    let labelY = levelY;
    for (const used of labelYs) if (Math.abs(labelY - used) < 16) labelY = used + (labelY >= used ? 16 : -16);
    labelYs.push(labelY);
    drawText(context, `${level.label} ${formatPlain(level.price)}`, right + 6, labelY, level.colour, { size: 11 });
  }
}
// A ceiling or floor: a thick blue bar from now for as many ticks as it still holds.
function drawPins({ today, context, xOfTodayTick, yOfPrice }) {
  const market = marketNow(today);
  for (const [ticks, price, name] of [[market.ceilingTicksLeft, market.ceilingPrice, 'ceiling'], [market.floorTicksLeft, market.floorPrice, 'floor']]) {
    if (ticks <= 0) continue;
    const fromX = xOfTodayTick(today.tick), toX = xOfTodayTick(Math.min(TICKS_PER_DAY, today.tick + ticks)), pinY = yOfPrice(price);
    drawLine(context, fromX, pinY, toX, pinY, CHART_COLOURS.pin, { width: 4 });
    drawText(context, `${name} ${ticks}`, toX, pinY + (name === 'ceiling' ? -12 : 12), CHART_COLOURS.pin, { size: 11, align: 'right' });
  }
}
// Today's path: green above the open, red below. Then the current price.
function drawToday({ context, today, height, historyEnd, right, xOfTodayTick, yOfPrice, openPrice, price }) {
  const points = today.schedule.states.slice(0, today.tick + 1).map((state, tick) => [xOfTodayTick(tick), yOfPrice(state.price)]);
  for (const [colour, clipTop, clipBottom] of [[CHART_COLOURS.up, 0, yOfPrice(openPrice)], [CHART_COLOURS.down, yOfPrice(openPrice), height]]) {
    context.save();
    context.beginPath(); context.rect(historyEnd, clipTop, right - historyEnd + 4, clipBottom - clipTop); context.clip();
    drawPath(context, points, colour, 2.6);
    context.restore();
  }
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price), leftHalf = today.tick < TICKS_PER_DAY / 2;
  drawDot(context, currentX, currentY, 5.5, price >= openPrice ? CHART_COLOURS.up : CHART_COLOURS.down);
  drawText(context, formatPlain(price), currentX + (leftHalf ? 12 : -12), currentY - 18, CHART_COLOURS.average, { size: 15, align: leftHalf ? 'left' : 'right' });
}
// Popups (+$ / −$, messages) rise and fade above the current price; the newest sits lowest.
function drawPopups({ context, today, left, right, top, xOfTodayTick, yOfPrice, price }) {
  const now = performance.now() / 1000;
  view.popups = view.popups.filter(popup => now - popup.born < POPUP_SECONDS).slice(-POPUPS_SHOWN);
  view.popups.forEach((popup, index) => {
    const age = (now - popup.born) / POPUP_SECONDS;
    const stackOffset = (view.popups.length - 1 - index) * (popup.size + 6);
    const textX = clamp(xOfTodayTick(today.tick), left + 140, right - 140);
    const textY = Math.max(top + 10, yOfPrice(price) - 46 - stackOffset - age * 30);
    drawText(context, popup.text, textX, textY, popup.colour, { size: popup.size, align: 'center', alpha: 1 - age });
  });
}
function addPopup(text, colour, size = 18) { view.popups.push({ text, colour, size, born: performance.now() / 1000 }); }
function shakeChart(strength) {
  const box = element('chartBox');
  box.classList.remove('shake', 'shakeBig');
  void box.offsetWidth;                                        // restart the animation
  box.classList.add(strength >= 2 ? 'shakeBig' : 'shake');
}

// ═══════════════════════════════════════ § 10 PANELS ═══════════════════════════════════════
const colourClass = value => (value >= 0 ? 'up' : 'down');
const ROMAN = ['', 'I', 'II', 'III'];

// ── 10.1 A player card's face. Glyphs are drawn in a 100 × 100 box.
// A stock chart going up: a faint baseline, a wobbly rising line, an arrowhead on its last (45°) leg.
const TREND_UP = '<line x1="4" y1="94" x2="96" y2="94" stroke="currentColor" stroke-width="3" opacity=".3"/>'
  + '<polyline points="6,84 22,64 34,72 52,40 60,48 84,24" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>'
  + '<polygon points="96,12 77,17 91,31" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
const GLYPHS = {
  trendUp:   TREND_UP,
  trendDown: '<g transform="translate(0 100) scale(1 -1)">' + TREND_UP.replace('y1="94" x2="96" y2="94"', 'y1="6" x2="96" y2="6"') + '</g>',
  hype:     '<polyline points="6,80 30,62 50,14 70,62 94,80" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  bash:     '<polyline points="6,20 30,38 50,86 70,38 94,20" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  turmoil:  '<polyline points="4,50 14,18 24,80 34,10 46,88 58,16 70,84 82,24 96,50" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>',
  calm:     '<path d="M4 50 C 20 40, 30 40, 50 50 S 80 60, 96 50" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>',
  ceiling:  '<rect x="6" y="14" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,90 30,60 46,72 66,34 80,44 92,30" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  floor:    '<rect x="6" y="77" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,10 30,40 46,28 66,66 80,56 92,70" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  dividend: '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/><text x="50" y="66" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-weight="800" font-size="46" fill="currentColor">$</text>',
  topUp:    '<rect x="14" y="56" width="72" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 8 V44 M32 26 H68" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>',
};
function cardArt(card) {
  if (card.kind) return `<svg viewBox="0 0 100 100">${GLYPHS[card.family === 'long' ? 'trendUp' : 'trendDown']}</svg>`;
  if (card.glyph) return `<svg viewBox="0 0 100 100">${GLYPHS[card.glyph]}</svg>`;
  return `<div class="big">${card.smallFace ? `<small>${card.smallFace}</small>` : ''}${card.face}</div>`;
}
// extra: { card (for a closing card: cardInfo), classes, action, argument, handIndex, detail, tip, retained } for the
// card's element. Leverage cards show only their face.
function playerCardHtml(cardId, extra = {}) {
  const card = extra.card || PLAYER_CARDS[cardId], heat = cardHeat(cardId);
  const tip = extra.tip === undefined ? card.sentence : extra.tip;
  const action = extra.action ? `data-action="${extra.action}" data-argument="${extra.argument}"`
    : extra.handIndex !== undefined ? `data-hand-index="${extra.handIndex}"` : '';
  const label = card.family === 'leverage' ? '' : `<div class="name">${card.name}</div><div class="detail">${extra.detail || card.detail}</div>`;
  return `<div class="playerCard ${card.family} ${extra.classes || ''}" ${action} data-tip="${tip}">
    <div class="family">${card.family === 'manip' ? 'MANIP' : card.family.toUpperCase()}</div><div class="tier">${ROMAN[card.tier]}</div>
    ${heat ? `<div class="heatTag">🔥${heat}</div>` : ''}${extra.retained ? '<div class="retainTag">RETAIN</div>' : ''}
    <div class="glyph">${cardArt(card)}</div>${label}</div>`;
}
function tradeName(cardId) {
  const card = PLAYER_CARDS[cardId];
  return card.kind === 'stock' ? (card.side > 0 ? 'LONG' : 'SHORT') + ' STOCK' : card.kind.toUpperCase();
}

// ── 10.2 What a card in the hand does right now: the line under its name and its hover text (with today's prices and
// the leverage waiting).
function liveDetail(run, cardId) {
  const card = cardInfo(run, cardId);
  if (isClosingCard(cardId)) {
    const trade = run.today.trades[closingTradeIndex(run, cardId)];
    return trade ? `#${trade.number} · ${formatSignedMoney(tradeProfit(run, trade))}` : card.detail;
  }
  if (!isTradeCard(cardId)) return card.detail;
  const outcome = tradeCardOutcome(run, cardId);
  const amount = card.kind === 'stock' ? `${formatCount(outcome.quantity)} stock` : `K ${formatPlain(outcome.strikePrice)}`;
  return `${formatMoney(outcome.cost)} · ${amount}`;
}
function liveTip(run, cardId) {
  const card = cardInfo(run, cardId), today = run.today;
  if (isClosingCard(cardId)) {
    const trade = today.trades[closingTradeIndex(run, cardId)];
    return trade ? `Close #${trade.number}: ${formatMoney(tradeValue(run, trade))} (${formatSignedMoney(tradeProfit(run, trade))})` : card.sentence;
  }
  if (card.family === 'leverage') {
    const before = pendingLeverage(run), after = leverageOf(run, today.pendingLeverage.concat(cardId));
    if (before === 1 && after === 2) return 'Next trade: double risk & reward';
    return `Next trade ×${formatLeverage(after)}`;
  }
  if (card.target === 'trade') {
    const trade = newestTrade(run);
    if (!trade) return card.sentence;
    return card.effect === 'double' ? `#${trade.number}: double risk & reward` : `#${trade.number}: +${formatMoney(topUpCost(run, trade, card.share))} margin`;
  }
  if (!isTradeCard(cardId)) return card.sentence;
  const outcome = tradeCardOutcome(run, cardId);
  const quantity = formatCount(outcome.quantity), cost = formatMoney(outcome.cost);
  const leverage = outcome.leverage > 1 ? ` · ×${formatLeverage(outcome.leverage)}` : '';
  if (card.kind === 'stock') {
    const liquidation = outcome.liquidationPrice ? ` · liquidated at ${formatPlain(outcome.liquidationPrice)}` : '';
    return `${card.side > 0 ? 'Buy' : 'Short'} ${quantity} stock · ${cost}${leverage}${liquidation}`;
  }
  const K = formatPlain(outcome.strikePrice), payoffText = card.kind === 'call' ? `max(S − ${K}, 0)` : `max(${K} − S, 0)`;
  return `${quantity} ${card.kind}s · ${cost}${leverage} · each pays ${payoffText}`;
}

// ── 10.3 The chart's top right: cash, today's P&L, heat, the deck, the menu.
function renderHud() {
  const run = view.run, today = run.today, equity = totalEquity(run), profit = equity - today.startEquity;
  const heat = Math.round(100 * run.heat / HEAT_LIMIT);
  element('hud').innerHTML = `
    <div class="hudBox" data-tip="Cash"><small>cash</small><b>${formatMoney(run.cash)}</b></div>
    <div class="hudBox" data-tip="Today, open trades at their value now"><small>p&l</small><b class="${colourClass(profit)}" id="profitValue">${formatSignedMoney(profit)}</b></div>
    <div class="hudBox" data-tip="100% at the close: SEC investigation${run.investigationDaysLeft ? ` (${run.investigationDaysLeft} days left)` : ''}"><small>heat</small><b class="heat">${heat}%</b></div>
    <button class="button" data-action="openDeck" data-tip="Your cards and the market deck">🂠</button>
    <button class="button" data-action="menu" data-tip="Menu">☰</button>`;
  if (view.lastEquity !== null && Math.abs(equity - view.lastEquity) > Math.abs(view.lastEquity) * EQUITY_FLASH_CHANGE)
    element('profitValue').classList.add(equity > view.lastEquity ? 'flashUp' : 'flashDown');
  view.lastEquity = equity;
}

// ── 10.4 The hand. Cards are dragged up to play them (§ 12.1). A redraw spins it like the shop's reels.
function renderHand() {
  if (view.handSpin) return;                                   // the reels are spinning (spinHand)
  const run = view.run, firstFresh = run.hand.length - view.freshHand;
  element('hand').innerHTML = run.hand.map((cardId, index) => handCardHtml(run, cardId, index, index >= firstFresh)).join('')
    || '<span class="emptyHand">no cards in hand</span>';
  view.freshHand = 0;
}
// A card in the hand: dimmed when it can't be played, its live line and hover text, RETAIN when a redraw keeps it.
function handCardHtml(run, cardId, index, fresh = false) {
  const blocked = cardBlockedReason(run, cardId), retained = isRetained(run, cardId);
  const classes = [blocked ? 'locked' : '', view.drag && view.drag.handIndex === index ? 'dragging' : '', fresh ? 'fresh' : ''].join(' ');
  const tip = liveTip(run, cardId) + (blocked ? ` (${blocked})` : '');
  return playerCardHtml(cardId, { card: cardInfo(run, cardId), classes, handIndex: index, detail: liveDetail(run, cardId), tip, retained });
}
// A redraw: every card of the hand becomes a reel that runs past cards of your deck and stops on the new card.
// Retained cards (keptPositions) stand still.
function spinHand(previousHand, keptPositions) {
  const run = view.run;
  view.handSpin = true;
  element('hand').innerHTML = run.hand.map((cardId, index) => keptPositions.includes(index)
    ? handCardHtml(run, cardId, index)
    : `<div class="reelWindow handReel"><div class="reelStrip" data-position="${index}"></div></div>`).join('');
  let longest = 0;
  element('hand').querySelectorAll('.reelStrip').forEach(strip => {
    const index = Number(strip.dataset.position), seconds = REEL_SPIN_SECONDS + index * HAND_SPIN_STAGGER;
    longest = Math.max(longest, seconds);
    spinStrip(strip, previousHand[index] || run.hand[index], run.deck, run.hand[index], seconds);
  });
  playReelTicks();
  setTimeout(() => { view.handSpin = false; renderAll(); }, longest * 1000 + 120);
}

// ── 10.5 The buttons. Before the open: REDRAW, OPEN. During the day: REDRAW, speed, skip to the close, pause.
function renderActions() {
  const run = view.run, redrawBlocked = redrawBlockedReason(run);
  const redraw = `<button class="button ${redrawBlocked || view.handSpin ? 'locked' : ''}" data-action="redraw"
    data-tip="${redrawBlocked || 'New hand (RETAIN stays). Costs more each time today.'}">🎰 REDRAW · $${redrawPrice(run).toLocaleString('en-US')}</button>`;
  if (run.phase === 'preopen') {
    element('actions').innerHTML = `${redraw}<span class="gap"></span><button class="button primary suggest" data-action="openMarket">OPEN ▶</button>`;
    return;
  }
  element('actions').innerHTML = `${redraw}<span class="gap"></span>
    <button class="button" data-action="speed" data-tip="Speed" style="width:74px">${GAME_SPEEDS[view.speedIndex]}×</button>
    <button class="button" data-action="skipToClose" data-tip="Play the rest of the day instantly">⏭ CLOSE</button>
    <button class="button" data-action="pause" data-tip="Pause" style="width:56px">${view.paused ? '▶' : '⏸'}</button>`;
}

// ── 10.6 The chart's corner: the last market card, then what is in force (the leverage waiting, the close coming,
// a Turmoil or Calm, pushes still to come, dividends, the boss rule, an investigation). Ceilings and floors are on the chart.
function renderCorner() {
  const run = view.run, today = run.today, market = marketNow(today);
  const last = today.tick > 0 ? today.schedule.cards[today.tick] : [];
  const chips = last.map(cardId => {
    const card = MARKET_CARDS[cardId], sign = card.category === 'move' ? (card.move > 0 ? 'pos' : 'neg') : '';
    return `<span class="chip ${card.category} ${sign} ${marketCardImpact(cardId) === 2 ? 'extreme' : ''} ${view.freshTick === today.tick ? 'fresh' : ''}" data-tip="${marketCardSentence(cardId)}">${marketCardText(cardId)}</span>`;
  });
  const badge = (text, tip, colour = '') => `<span class="chip badge ${colour}" data-tip="${tip}">${text}</span>`;
  if (today.pendingLeverage.length) chips.push(badge(`next trade ×${formatLeverage(pendingLeverage(run))}`, 'Leverage for your next trade'));
  if (run.phase === 'trading' && ticksLeft(run) <= CLOSE_WARNING_TICKS && today.trades.length)
    chips.push(badge(`all trades close in ${Math.ceil(ticksLeft(run) * SECONDS_PER_TICK)}s`, 'Open trades close at the close', 'alarm'));
  if (market.allDayMultiplier !== 1) chips.push(badge(`moves ×${Math.round(market.allDayMultiplier * 100) / 100}`, 'Every move until the close', 'orange'));
  const pushesLeft = market.pendingPushes.length;
  if (pushesLeft) {
    const total = Math.exp(market.pendingPushes.reduce((sum, push) => sum + push, 0)) - 1;
    chips.push(badge(`${total >= 0 ? '▲' : '▼'} ${formatPercent(total, 0)}`, `Still to come over ${pushesLeft} ticks`, 'orange'));
  }
  if (today.dividendShare) chips.push(badge(`dividends ${Math.round(today.dividendShare * 100)}%`, 'At the close'));
  if (today.bossRule) chips.push(badge('meeting: ' + BOSS_RULES[today.bossRule].face, BOSS_RULES[today.bossRule].sentence, 'orange'));
  if (today.investigation) chips.push(badge('SEC', 'Investigation: no heat cards, no leverage', 'orange'));
  element('corner').innerHTML = chips.join('');
}

function renderAll() {
  if (!view.run || !view.run.today) return;
  renderHud();
  renderHand();
  renderActions();
  renderCorner();
}

// ═══════════════════════════════════════ § 11 OVERLAYS ═══════════════════════════════════════
function showOverlay(name, html) {
  view.overlay = name;
  element('overlay').innerHTML = html;
  element('overlay').classList.toggle('show', !!name);
}
function hideOverlay() {
  view.overlay = null;
  view.deckSelling = false;
  element('overlay').classList.remove('show');
  element('overlay').innerHTML = '';
}
// "Meeting 1 · day 10: $1,312 · no options" for the next meeting from that day on.
function meetingLine(run, fromDay) {
  const meeting = nextMeeting(run, fromDay);
  return `meeting ${meeting.number} · day ${meeting.day}: ${formatMoney(meeting.target)} · ${BOSS_RULES[meeting.rule].face}`;
}

// ── 11.1 Title, menu, day result, game over
function readRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || { bestEquity: 0, longestRun: 0 }; }
  catch (error) { return { bestEquity: 0, longestRun: 0 }; }
}
function writeRecords(run) {
  const records = readRecords();
  records.bestEquity = Math.max(records.bestEquity, run.peakEquity);
  records.longestRun = Math.max(records.longestRun, run.day);
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (error) { /* storage blocked */ }
}
function showTitle() {
  let saved = null;
  try { saved = localStorage.getItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
  const records = readRecords();
  showOverlay('title', `
    <div class="dialog">
      <div class="title">INSIDER</div>
      <div class="note">the price is a deck of cards · rig it</div>
      ${records.bestEquity ? `<div class="note">best ${formatMoney(records.bestEquity)} · longest ${records.longestRun} days</div>` : ''}
      <div class="menuButtons">
        ${saved ? '<button class="button primary" data-action="continueRun">CONTINUE</button>' : ''}
        <button class="button ${saved ? '' : 'primary'}" data-action="newRun">NEW RUN</button>
      </div>
    </div>`);
}
function showMenu() {
  view.paused = true;
  const run = view.run;
  showOverlay('menu', `
    <div class="dialog">
      <h1>Paused</h1>
      <div class="note">day ${run.day} · ${meetingLine(run, run.day)}</div>
      <div class="menuButtons">
        <button class="button primary" data-action="resume">RESUME</button>
        <button class="button" data-action="sound">${sound.muted ? 'SOUND OFF' : 'SOUND ON'}</button>
        <button class="button" data-action="toTitle">TITLE</button>
      </div>
    </div>`);
}
function showResult() {
  const run = view.run, result = run.lastResult, meeting = result.meeting;
  const profit = result.endEquity - result.startEquity;
  const notes = [];
  if (result.split !== 1) notes.push(`<div class="note gold">${result.split < 1 ? `${Math.round(1 / result.split)}:1 split: the stock costs ${Math.round(1 / result.split)}× less` : `1:${Math.round(result.split)} reverse split: the stock costs ${Math.round(result.split)}× more`} tomorrow</div>`);
  if (result.dividends) notes.push(`<div class="note gold">dividends ${formatSignedMoney(result.dividends)}</div>`);
  if (result.heatAdded > 0) notes.push(`<div class="note heat">🔥 +${Math.round(result.heatAdded)}% heat: abnormal day</div>`);
  if (result.investigationNote === 'opened') notes.push(`<div class="note heat">🚨 SEC investigation: ${INVESTIGATION_DAYS} clean days</div>`);
  if (result.investigationNote === 'cleared') notes.push('<div class="note up">Investigation closed</div>');
  if (meeting) notes.push(`<div class="note ${meeting.passed ? 'up' : 'down'}">Meeting ${meeting.number}: ${formatMoney(meeting.target)} ${meeting.passed ? '✓' : '✗'}</div>`);
  if (meeting && meeting.passed && meeting.final) notes.push('<div class="note gold">🏆 Last meeting passed. Play on for bigger numbers.</div>');
  if (!run.gameOverReason) notes.push(`<div class="note">next ${meetingLine(run, run.day + 1)}</div>`);
  const reasons = { sold: 'sold', liquidated: 'liquidated', 'the close': 'at the close' };
  const trades = result.closedTrades.map(closed => `
    <div class="line"><span>#${closed.number} ${tradeName(closed.cardId)}${closed.leverage > 1 ? ' ×' + formatLeverage(closed.leverage) : ''} <span class="dim">${reasons[closed.reason]}</span></span>
    <span class="${colourClass(closed.profit)}">${formatSignedMoney(closed.profit)}</span></div>`).join('');
  showOverlay('result', `
    <div class="dialog">
      <h1>Day ${result.day} · ${MARKET_NAME}</h1>
      <div class="note">${formatPrice(result.openPrice)} → ${formatPrice(result.closePrice)} <span class="${colourClass(result.closePrice - result.openPrice)}">${formatPercent(result.closePrice / result.openPrice - 1)}</span></div>
      <div class="huge ${colourClass(profit)}" id="countUp">${formatSignedMoney(0)}</div>
      <div class="note">cash ${formatMoney(result.endEquity)}</div>
      ${trades ? `<div class="closedTrades">${trades}</div>` : ''}
      ${notes.join('')}
      <div class="menuButtons"><button class="button primary" data-action="afterResult">${run.gameOverReason ? 'CONTINUE' : 'SHOP'}</button></div>
    </div>`);
  countUp(element('countUp'), profit);
}
// Balatro-style count-up of the day's P&L.
function countUp(target, finalValue) {
  const started = performance.now(), seconds = 0.9;
  const step = () => {
    if (!target.isConnected) return;
    const progress = Math.min(1, (performance.now() - started) / 1000 / seconds);
    target.textContent = formatSignedMoney(finalValue * (1 - Math.pow(1 - progress, 3)));
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function showGameOver() {
  const run = view.run;
  writeRecords(run);
  showOverlay('gameover', `
    <div class="dialog">
      <h1>Fund closed</h1>
      <div class="note">${run.gameOverReason === 'meeting' ? 'The investors pulled their money.' : 'No money left to trade.'}</div>
      <div class="huge gold">${run.day} days</div>
      <div class="note">peak ${formatMoney(run.peakEquity)} · meetings ${run.meetingsPassed}</div>
      <div class="menuButtons"><button class="button primary" data-action="newRun">NEW RUN</button></div>
    </div>`);
  try { localStorage.removeItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
}

// ── 11.2 The deck window: your cards (grouped, with how many you own) and the market deck (left in the draw pile /
// in the deck). Opened from the shop it sells cards.
function showDeck() {
  const run = view.run, selling = view.deckSelling;
  const owned = {};
  for (const cardId of run.deck) owned[cardId] = (owned[cardId] || 0) + 1;
  const canSell = selling && run.deck.length > MINIMUM_PLAYER_DECK;
  const yourCards = PLAYER_CARD_ORDER.filter(cardId => owned[cardId]).map(cardId => `
    <div class="ownedCard">
      ${playerCardHtml(cardId, canSell ? { action: 'sellCard', argument: cardId, tip: `Sell one for ${formatMoney(cardSellPrice(run, cardId))}` } : {})}
      <span>×${owned[cardId]}${selling ? ` <span class="sellPrice">${formatMoney(cardSellPrice(run, cardId))}</span>` : ''}</span>
    </div>`).join('');
  const marketLeft = countCards(run.phase === 'shop' ? run.market.drawPile : drawPileAfter(run.today.schedule, run.today.tick));
  const marketCards = MARKET_CARD_ORDER.map(cardId => {
    const card = MARKET_CARDS[cardId], sign = card.category === 'move' ? (card.move > 0 ? 'pos' : 'neg') : '';
    return `<div class="marketCount" data-tip="${marketCardSentence(cardId)}"><span class="chip ${card.category} ${sign}">${marketCardText(cardId)}</span>
      <span>${marketLeft[cardId]}<small> / ${run.market.deck[cardId]}</small></span></div>`;
  }).join('');
  showOverlay('deck', `
    <div class="dialog fullScreen">
      <div class="dialogHead">
        <h1>${selling ? 'Sell a card' : 'Your cards'} · ${run.deck.length}</h1>
        ${selling ? `<span class="slot"><small>cash</small><b>${formatMoney(run.cash)}</b></span>` : ''}
        <span class="slot"><small>draw / hand / discard</small><b>${run.drawPile.length} / ${run.hand.length} / ${run.discardPile.length}</b></span>
        <span class="spacer"></span>
        <button class="button" data-action="${selling ? 'backToShop' : 'closeOverlay'}">${selling ? '← SHOP' : 'CLOSE'}</button>
      </div>
      ${selling && !canSell ? `<div class="note">You keep at least ${MINIMUM_PLAYER_DECK} cards.</div>` : ''}
      <div class="cardGrid">${yourCards}</div>
      <div class="sectionName">the market deck · ${MARKET_NAME} · left in the draw pile / in the deck</div>
      <div class="marketGrid">${marketCards}</div>
    </div>`);
}

// ── 11.3 The shop: four reels, each with one card and its price. SPIN rerolls them all, like a slot machine.
function showShop(spinFrom = null) {
  const run = view.run, shop = run.shop;
  const reels = SHOP_REELS.map((reel, reelIndex) => {
    const cardId = shop.reels[reelIndex], price = cardPrice(run, cardId), sold = shop.sold[reelIndex];
    return `<div class="reel ${sold ? 'sold' : ''}" id="reel${reelIndex}">
      <div class="reelName">${reel.name}</div>
      <div class="reelWindow" data-sentence="${PLAYER_CARDS[cardId].sentence}">
        <div class="reelStrip">${playerCardHtml(cardId, { action: 'buyReel', argument: reelIndex, tip: '' })}</div><div class="reelSold">SOLD</div></div>
      <div class="reelPrice ${!sold && !canSpend(run, price) ? 'poor' : ''}">${formatMoney(price)}</div>
      <button class="button ${sold || !canSpend(run, price) ? 'locked' : ''}" data-action="buyReel" data-argument="${reelIndex}">${sold ? 'SOLD' : 'BUY'}</button>
    </div>`;
  }).join('');
  const spin = spinPrice(run);
  showOverlay('shop', `
    <div class="dialog">
      <div class="dialogHead">
        <h1>Shop</h1>
        <span class="slot" data-tip="The shop keeps ${formatMoney(shopReserve(run))} for tomorrow's first stock"><small>to spend</small><b>${formatMoney(Math.max(0, run.cash - shopReserve(run)))}</b></span>
        <span class="slot"><small>your deck</small><b>${run.deck.length}</b></span>
        <span class="spacer"></span>
        <button class="button primary" data-action="nextDay">DAY ${run.day + 1} ▶</button>
      </div>
      <div class="note" style="text-align:left">${meetingLine(run, run.day + 1)}</div>
      <div class="reels">${reels}</div>
      <div class="spinRow">
        <button class="button primary ${!canSpend(run, spin) ? 'locked' : ''}" data-action="spin">🎰 SPIN · ${formatMoney(spin)}</button>
        <button class="button" data-action="sellCards" data-tip="Sell cards for half their price">SELL A CARD</button>
      </div>
      <div id="selectedSentence"></div>
    </div>`);
  if (spinFrom) animateReels(spinFrom);
}
// The spin: each reel runs past random cards from its pool and stops on its new card, left to right.
function animateReels(previousReels) {
  const run = view.run;
  SHOP_REELS.forEach((reel, reelIndex) => {
    spinStrip(document.querySelector(`#reel${reelIndex} .reelStrip`), previousReels[reelIndex], reelPool(reelIndex), run.shop.reels[reelIndex],
      REEL_SPIN_SECONDS + reelIndex * REEL_STOP_STAGGER, { action: 'buyReel', argument: reelIndex, tip: '' });
  });
  playReelTicks();
}
// One reel: from the card shown, past REEL_SPIN_CARDS random cards of the pool, to the landing card (with landingExtra
// on its element), in this many seconds, with a clunk when it stops.
function spinStrip(strip, fromCardId, pool, landingCardId, seconds, landingExtra = { tip: '' }) {
  const passing = Array.from({ length: REEL_SPIN_CARDS }, () => pool[Math.floor(Math.random() * pool.length)]);
  strip.innerHTML = [fromCardId, ...passing].map(cardId => playerCardHtml(cardId, { tip: '' })).join('') + playerCardHtml(landingCardId, landingExtra);
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(0)';
  void strip.offsetHeight;                                     // start from the top before animating
  strip.style.transition = `transform ${seconds}s cubic-bezier(.15,.7,.25,1.06)`;
  strip.style.transform = `translateY(${-(REEL_SPIN_CARDS + 1) * REEL_CARD_STEP}px)`;
  setTimeout(() => { if (strip.isConnected) sounds.reelStop(); }, seconds * 1000);
}
function playReelTicks() { for (let click = 0; click < 10; click++) setTimeout(sounds.reelTick, click * 80); }

// ═══════════════════════════════════════ § 12 INPUT ═══════════════════════════════════════
function saveRun() {
  try { if (view.run) localStorage.setItem(SAVE_KEY, serialiseRun(view.run)); } catch (error) { /* storage blocked */ }
}
function savePreferences() {
  try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify({ muted: sound.muted, speedIndex: view.speedIndex })); } catch (error) { /* storage blocked */ }
}

// ── 12.1 Dragging (like Slay the Spire). Press a card in the hand and drag it up: above the hand it plays when you let
// go. A click without dragging picks the card up: it follows the mouse until the next click (right click puts it
// back). view.drag = { handIndex, offsetX, offsetY, startX, startY, moved, carrying }.
function inPlayZone(screenY) { return screenY < element('hand').getBoundingClientRect().top - 4; }
function startDrag(event, handIndex) {
  const bounds = event.target.closest('[data-hand-index]').getBoundingClientRect();
  view.drag = { handIndex, offsetX: event.clientX - bounds.left, offsetY: event.clientY - bounds.top,
    startX: event.clientX, startY: event.clientY, moved: false, carrying: false };
  const cardId = view.run.hand[handIndex];
  element('dragGhost').innerHTML = playerCardHtml(cardId, { card: cardInfo(view.run, cardId), tip: '', detail: liveDetail(view.run, cardId), retained: isRetained(view.run, cardId) });
  element('dragGhost').style.display = 'block';
  element('tooltip').style.display = 'none';
  const playZone = element('playZone');
  playZone.style.height = (element('hand').offsetTop - 24) + 'px';
  playZone.classList.add('show');
  moveDrag(event.clientX, event.clientY);
  renderAll();
}
function moveDrag(screenX, screenY) {
  const drag = view.drag, run = view.run, cardId = run.hand[drag.handIndex];
  if (Math.hypot(screenX - drag.startX, screenY - drag.startY) > DRAG_THRESHOLD) drag.moved = true;
  const ghost = element('dragGhost'), ready = inPlayZone(screenY), blocked = cardBlockedReason(run, cardId);
  ghost.style.transform = `translate(${screenX - drag.offsetX}px, ${screenY - drag.offsetY}px)`;
  ghost.classList.toggle('ready', ready && !blocked);
  element('playZone').classList.toggle('ready', ready && !blocked);
  element('playZoneLabel').textContent = blocked || (ready ? liveTip(run, cardId) : 'DRAG UP TO PLAY');
}
function endDrag(screenY) {
  const handIndex = view.drag.handIndex;
  clearDrag();
  if (inPlayZone(screenY)) playHandCard(handIndex);
  renderAll();
}
function clearDrag() {
  view.drag = null;
  element('dragGhost').style.display = 'none';
  element('dragGhost').classList.remove('ready');
  element('playZone').classList.remove('show', 'ready');
}
function handlePointerMove(event) { if (view.drag) moveDrag(event.clientX, event.clientY); }
function handlePointerUp(event) {
  const drag = view.drag;
  if (!drag || drag.carrying) return;
  if (drag.moved) endDrag(event.clientY);
  else drag.carrying = true;                                   // a click: the card is picked up and follows the mouse
}
// Playing a dropped card, with its sound, shake and popup.
function playHandCard(handIndex) {
  const run = view.run, card = cardInfo(run, run.hand[handIndex]), result = playCard(run, handIndex);
  if (result.error) { sounds.denied(); addPopup(result.error, CHART_COLOURS.label, 14); return; }
  if (result.kind === 'sold') {
    sounds.cash(result.profit >= 0);
    addPopup(result.line, result.profit >= 0 ? CHART_COLOURS.up : CHART_COLOURS.down, 22);
  } else {
    if (result.kind === 'market') sounds.manipulation(); else sounds.trade();
    addPopup(result.line, CHART_COLOURS.accent, 17);
  }
  if (card.family === 'manip') shakeChart(card.tier >= 3 ? 2 : 1);
  saveRun();
}

// ── 12.2 Buttons. Every clickable element names its action in data-action (and an optional data-argument).
const ACTIONS = {
  newRun() { view.run = newRun(); resetViewForDay(); hideOverlay(); saveRun(); },
  continueRun() {
    let run = null;
    try { run = loadRun(localStorage.getItem(SAVE_KEY)); } catch (error) { run = null; }
    if (!run) { ACTIONS.newRun(); return; }
    view.run = run; resetViewForDay(); hideOverlay();
    if (run.phase === 'trading') showMenu();
    else if (run.phase === 'result') showResult();
    else if (run.phase === 'shop') showShop();
  },
  toTitle() { saveRun(); view.paused = false; showTitle(); },
  resume() { view.paused = false; hideOverlay(); },
  menu() { if (view.overlay === 'menu') ACTIONS.resume(); else if (!view.overlay && view.run) showMenu(); },
  closeOverlay() { hideOverlay(); },
  speed() { view.speedIndex = (view.speedIndex + 1) % GAME_SPEEDS.length; savePreferences(); },
  sound() { sound.muted = !sound.muted; savePreferences(); if (view.overlay === 'menu') showMenu(); },
  pause() { if (view.run.phase === 'trading') view.paused = !view.paused; },
  openDeck() { if (!view.overlay) { view.deckSelling = false; showDeck(); } },
  redraw() {
    const run = view.run, previousHand = run.hand.slice();
    const keptPositions = view.handSpin ? false : redrawHand(run);
    if (!keptPositions) { sounds.denied(); return; }
    saveRun();
    spinHand(previousHand, keptPositions);
  },
  openMarket() {
    if (view.run.phase !== 'preopen') return;
    openTheMarket(view.run);
    view.paused = false;
    saveRun();
  },
  skipToClose() { while (view.run.phase === 'trading') runOneTick(true); },
  afterResult() {
    if (view.run.gameOverReason) { showGameOver(); return; }
    openShop(view.run);
    saveRun();
    showShop();
  },
  nextDay() { startNextDay(view.run); resetViewForDay(); hideOverlay(); saveRun(); },
  buyReel(reelIndex) {
    if (!buyReelCard(view.run, reelIndex)) { sounds.denied(); return; }
    sounds.buy(); saveRun(); showShop();
  },
  spin() {
    const previous = view.run.shop.reels.slice();
    if (!spinReels(view.run)) { sounds.denied(); return; }
    saveRun(); showShop(previous);
  },
  sellCards() { view.deckSelling = true; showDeck(); },
  sellCard(cardId) {
    if (!sellCard(view.run, cardId)) { sounds.denied(); return; }
    sounds.buy(); saveRun(); view.deckSelling = true; showDeck();
  },
  backToShop() { view.deckSelling = false; showShop(); },
};
const NUMBER_ARGUMENT_ACTIONS = ['buyReel'];
function resetViewForDay() { view.lastEquity = null; view.freshHand = view.run.hand.length; if (view.drag) clearDrag(); }

// Actions fire on the press, not the release: the screen is redrawn every tick, and a redraw between press and release
// would swallow a click.
function handlePress(event) {
  if (view.drag && view.drag.carrying) {                       // a carried card: this click plays it (right click: back)
    if (event.button === 0) endDrag(event.clientY); else { clearDrag(); renderAll(); }
    return;
  }
  if (event.button !== 0) return;
  const handCard = event.target.closest('#hand [data-hand-index]');
  if (handCard && !view.overlay && !view.handSpin) { startDrag(event, Number(handCard.dataset.handIndex)); return; }
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.classList.contains('locked')) { sounds.denied(); return; }
  const action = ACTIONS[target.dataset.action];
  if (!action) return;
  const argument = target.dataset.argument;
  action(NUMBER_ARGUMENT_ACTIONS.includes(target.dataset.action) ? Number(argument) : argument);
  if (!view.overlay || view.overlay === 'menu') renderAll();
}
// Instant tooltips for anything with data-tip; in the shop the line under the reels explains the card under the mouse.
function handleMouseMove(event) {
  if (view.drag) return;                                       // no tooltips while a card is held
  const sentenceHolder = event.target.closest('[data-sentence]');
  if (sentenceHolder && element('selectedSentence')) element('selectedSentence').textContent = sentenceHolder.dataset.sentence;
  const tooltip = element('tooltip'), target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) { tooltip.style.display = 'none'; return; }
  tooltip.textContent = target.dataset.tip;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, event.clientX + 14) + 'px';
  tooltip.style.top = Math.max(8, Math.min(window.innerHeight - tooltip.offsetHeight - 8, event.clientY - tooltip.offsetHeight - 12)) + 'px';
}

// ═══════════════════════════════════════ § 13 START ═══════════════════════════════════════
// One tick of the live day, with its sound, shake and popup. quiet = skipping to the close.
function runOneTick(quiet) {
  const run = view.run, equityBefore = totalEquity(run);
  const outcome = advanceTick(run);
  view.freshTick = run.today.tick;
  if (!quiet) {
    const impact = Math.max(0, ...outcome.cards.map(marketCardImpact));
    const priceNow = currentPrice(run.today), priceBefore = run.today.schedule.states[run.today.tick - 1].price;
    if (impact > 0) { shakeChart(impact); sounds.bigCard(priceNow >= priceBefore); }
    else sounds.tick(priceNow - priceBefore);
    const change = totalEquity(run) - equityBefore;
    if (Math.abs(change) > Math.max(1, Math.abs(equityBefore) * POPUP_CHANGE))
      addPopup(formatSignedMoney(change), change > 0 ? CHART_COLOURS.up : CHART_COLOURS.down, impact === 2 ? 26 : 18);
    if (outcome.closeWarning) { sounds.warning(); addPopup('ALL TRADES CLOSE AT THE CLOSE', CHART_COLOURS.down, 20); }
  }
  if (outcome.liquidated) { sounds.bad(); addPopup(outcome.liquidated > 1 ? `${outcome.liquidated} trades liquidated` : 'Liquidated!', CHART_COLOURS.liquidation, 22); }
  if (outcome.closed) {
    if (view.drag) clearDrag();
    const result = closeDay(run);
    saveRun();
    sounds.cash(result.endEquity >= result.startEquity);
    renderAll();
    showResult();
  }
}
// The clock stops while a window is open, the game is paused, a card is held or the hand spins.
function clockRuns(run) { return run && run.phase === 'trading' && !view.paused && !view.overlay && !view.drag && !view.handSpin; }
let lastFrameTime = null;
function frame(time) {
  const seconds = lastFrameTime === null ? 0 : Math.min(0.25, (time - lastFrameTime) / 1000);
  lastFrameTime = time;
  const run = view.run;
  if (clockRuns(run)) {
    const today = run.today;
    today.tickClock += seconds * GAME_SPEEDS[view.speedIndex];
    if (today.tickClock >= SECONDS_PER_TICK) {
      today.tickClock -= SECONDS_PER_TICK;
      runOneTick(false);
      if (run.phase === 'trading') { saveRun(); renderAll(); }
    }
  }
  element('pauseNote').style.display = view.paused && run && run.phase === 'trading' && !view.overlay ? 'grid' : 'none';
  drawChart();
  requestAnimationFrame(frame);
}
function start() {
  document.documentElement.style.setProperty('--cardWidth', CARD_WIDTH + 'px');
  document.documentElement.style.setProperty('--cardHeight', CARD_HEIGHT + 'px');
  try {
    const preferences = JSON.parse(localStorage.getItem(PREFERENCES_KEY)) || {};
    sound.muted = !!preferences.muted;
    view.speedIndex = preferences.speedIndex || 0;
  } catch (error) { /* defaults */ }
  if (new URLSearchParams(location.search).has('mute')) sound.muted = true;
  try { const saved = localStorage.getItem(SAVE_KEY); view.run = saved ? loadRun(saved) : null; } catch (error) { view.run = null; }
  if (!view.run) view.run = newRun();
  resetViewForDay();
  showTitle();
  renderAll();
  document.addEventListener('pointerdown', handlePress);
  document.addEventListener('pointermove', handlePointerMove);
  document.addEventListener('pointerup', handlePointerUp);
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('resize', renderAll);
  requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') start();
</script>
