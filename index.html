<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#151920;--panel2:#1d232c;--line:#2c3440;--ink:#edf1f5;--dim:#8592a3;--faint:#4a5563;
  --up:#3ddc84;--down:#ff5a5f;--vol:#6cb6ff;--event:#ffc94d;--heat:#ff8a3d;--accent:#ffc94d;
  --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px var(--sans);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .heat{color:var(--heat)} .gold{color:var(--accent)}

#app{position:fixed;inset:0;display:grid;grid-template-columns:310px 1fr;gap:18px;padding:18px}

/* the side menu: the only place with numbers */
#side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;min-height:0}
#brand{font:800 14px var(--mono);letter-spacing:.3em;color:var(--accent)}
.sideHead{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.sideHead b{font-size:15px}
.clock{font:800 24px var(--mono)}
.label{font:700 10px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between}
.value{font-size:22px;font-weight:800;margin-top:2px}
.line{font-size:13px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.rule{border-top:1px solid var(--line);margin-top:14px}
.heatBar{height:6px;border-radius:3px;background:#2a2016;overflow:hidden;margin-top:6px}
.heatBar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff5a3d)}
.sideButtons{margin-top:auto;display:flex;gap:8px;padding-top:14px}
.sideButtons .button{flex:1}
.flashUp{animation:flashUp .45s} .flashDown{animation:flashDown .45s}
@keyframes flashUp{0%{color:var(--up);transform:scale(1.06)}}
@keyframes flashDown{0%{color:var(--down);transform:scale(1.06)}}

/* the main column: chart, then the buttons to press */
#mainColumn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:0}
#chartBox{position:relative;width:100%;max-width:980px;height:clamp(240px,46vh,480px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#chart{width:100%;height:100%;display:block}
#lastCards{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
#pauseNote{position:absolute;inset:0;display:none;place-items:center;font:800 32px var(--mono);letter-spacing:.3em;color:var(--accent);background:rgba(0,0,0,.45);pointer-events:none}
.shake{animation:shake .35s} .shakeBig{animation:shakeBig .6s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shakeBig{10%{transform:translate(-12px,5px)}25%{transform:translate(11px,-6px)}40%{transform:translate(-9px,4px)}55%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}
#actions{display:flex;gap:10px;align-items:center;justify-content:center;height:70px;width:100%;max-width:980px}
/* the hand of plays */
#hand{display:flex;gap:10px;align-items:stretch;justify-content:center;height:128px;width:100%;max-width:980px}
.focus{display:flex;flex-direction:column;justify-content:center;align-items:center;width:70px;font:700 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;gap:6px}
.focus .pips{font-size:18px;letter-spacing:2px;color:var(--accent)}
.play{width:150px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:0 4px 0 #050608;transition:transform .08s}
.play:hover{transform:translateY(-6px);border-color:var(--accent)}
.play .playTop{display:flex;justify-content:space-between;font:800 11px var(--mono)}
.play .cost{color:var(--accent)} .play .playHeat{color:var(--heat)}
.play .playName{font:800 14px var(--sans)}
.play .playText{font:600 11px var(--sans);color:var(--dim);line-height:1.3}
.play.locked{opacity:.4;cursor:default;transform:none}
.emptyHand{align-self:center;color:var(--faint);font:600 12px var(--mono)}
#actions .gap{width:18px}

.button{font:800 13px var(--sans);letter-spacing:.06em;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel2);padding:12px 18px;cursor:pointer;white-space:nowrap}
.button:hover{filter:brightness(1.2)} .button:active{transform:translateY(2px);border-bottom-width:1px}
.button.primary{background:#3b3014;border-color:#8a6d22;color:#ffe08a;padding:14px 30px;font-size:15px}
.button.locked{opacity:.35;cursor:default;filter:none}
.button.suggest{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,201,77,.3),0 0 24px rgba(255,201,77,.35)}}
.toggle{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:700 12px var(--sans)}
.toggle.on{background:#2b3a52;border-color:var(--vol);color:#d3e8ff}
.toggle.locked{opacity:.35;cursor:default}

/* card chips (the last card drawn, the deck window, the deck picker) */
.chip{flex:none;height:30px;min-width:46px;padding:0 8px;border-radius:7px;display:inline-grid;place-items:center;font:700 12px var(--mono);border:1px solid;background:var(--panel2)}
.chip.price.pos{color:var(--up);border-color:#1f6b43} .chip.price.neg{color:var(--down);border-color:#7a2b2e}
.chip.modifier{color:#c9a6ff;border-color:#5a3f80}
.chip.vol{color:var(--vol);border-color:#2a4f78}
.chip.rule{color:var(--accent);border-color:#8a6d22}
.chip.move.pos{color:var(--up);border-color:#1f6b43} .chip.move.neg{color:var(--down);border-color:#7a2b2e}
.chip.multiplier{color:var(--accent);border-color:#8a6d22;background:#2a2514}
.chip.extreme{box-shadow:0 0 0 2px currentColor inset}
.chip.future{border-style:dashed;opacity:.75}
.chip.fresh{animation:pop .3s}
@keyframes pop{0%{transform:translateY(-10px) scale(1.35)}}

/* overlays */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
#overlay.soft{background:rgba(5,6,8,.45);backdrop-filter:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 30px;box-shadow:0 10px 0 #050608;text-align:center;max-width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font:800 26px var(--sans)}
.card .title{font:800 54px var(--mono);letter-spacing:.3em;color:var(--accent);margin:8px 0 2px}
.card .huge{font:800 56px var(--mono);margin:6px 0;font-variant-numeric:tabular-nums}
.card .note{color:var(--dim);margin:5px 0;font-family:var(--mono)}
.menuButtons{display:flex;gap:12px;justify-content:center;margin-top:18px}

/* the trade menu: one question at a time */
.tradeCard{width:560px;text-align:left}
.tradeCard h1{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.tradeCard h1 small{font:600 13px var(--mono);color:var(--dim)}
.choiceRow{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-top:7px;cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
.choiceRow .main{font-weight:800;font-size:15px;white-space:nowrap}
.choiceRow .detail{white-space:nowrap}
.choiceRow .detail{margin-left:auto;color:var(--dim);font-size:12px}
.choiceRow.locked{opacity:.35;cursor:default}
.openChip{height:28px;padding:0 6px;border-radius:7px;border:1px solid currentColor;background:var(--panel);display:inline-flex;align-items:center;gap:3px;font-size:15px;cursor:pointer;flex:none}
.openChip:hover{filter:brightness(1.3)}
.positionBox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0 4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.slider{width:100%;accent-color:var(--accent);margin:18px 0 6px;height:26px}
.sliderEnds{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--faint)}
.amount{font:800 20px var(--mono);text-align:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.amountNote{font:600 12px var(--mono);text-align:center;color:var(--dim);height:18px}
.tradeCard .confirm{width:100%;margin-top:16px}

/* the deck window */
.card.fullScreen{width:calc(100vw - 48px);height:calc(100vh - 48px);display:flex;flex-direction:column}
.deckGrid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr;gap:14px;margin-top:18px;min-height:0}
.deckCard{border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:10px;font:700 14px var(--mono)}
.deckCard .chip{height:40px;min-width:70px;font-size:16px}
.deckCard .count{font-size:26px} .deckCard .count small{color:var(--faint);font-size:14px}
.deckCard.gone{opacity:.3}
/* offered cards: a big card per choice, its border in its rarity's colour */
.offerRow{display:flex;gap:18px;justify-content:center;margin-top:16px}
.offerCard{width:190px;min-height:230px;border-radius:16px;background:var(--panel2);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px;cursor:pointer;box-shadow:0 6px 0 #050608;transition:transform .08s;text-align:center}
.offerCard:hover{transform:translateY(-6px)}
.offerCard .chip{height:44px;min-width:76px;font-size:20px}
.offerCard .cardName{font:800 17px var(--sans)}
.offerCard .cardText{font:600 13px var(--sans);color:var(--dim);flex:1}
.offerCard .cardEffect{font:800 14px var(--mono)}
.offerCard .rarity{font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.choice.small{width:118px}

/* shop and deck picker cards */
.shopHead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.shopHead h1{margin:0}
.spacer{flex:1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;font-family:var(--mono)}
.slot small{font:600 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.shopRows{display:grid;gap:10px;text-align:left}
.shopRow{display:flex;gap:10px;align-items:center}
.shopRow .rowName{width:72px;font:700 11px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.choice{width:118px;height:118px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;box-shadow:0 4px 0 #050608;transition:transform .08s;position:relative;text-align:center;padding:4px}
.choice .icon{font-size:30px;line-height:1.1}
.choice .nm{font:700 12px var(--sans)}
.choice .chipLine{font:700 11px var(--mono);color:var(--dim)}
.choice .price{font:700 12px var(--mono);color:var(--accent)}
.choice .price.poor{color:var(--down)}
.choice.owned{opacity:.45} .choice.owned .price{color:var(--up)}
.choice.locked{opacity:.35}
#selectedSentence{height:24px;margin-top:14px;color:var(--ink);font-size:15px}
.marginLine{font-size:13px}
#tooltip{position:fixed;z-index:20;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:600 12px var(--sans);display:none;max-width:260px}
</style></head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="mainColumn">
    <div id="chartBox"><canvas id="chart"></canvas><div id="lastCards"></div><div id="pauseNote">PAUSED</div></div>
    <div id="hand"></div>
    <div id="actions"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="tooltip"></div>
<script id="game">
"use strict";
/* INSIDER — a trading roguelike. A stock's price is a deck of cards: every quarter second one card is drawn. Move
   cards move the price (up +1%, BEAR −50%); repeat, reverse, double and halve act on the moves around them, and
   the deck you build decides how those combine. The deck starts fair, so the edge has to come from you: insider tips
   you use before the open (they raise SEC heat), the cards you add and remove (by chance, in the shop), and the
   leverage and options you unlock. Trading money and shop money are the same cash. Every day prices inflate 1%,
   every 10 days the investors want to see a target, and the run ends when you have no money left to trade.

   File guide (search "§ 1" etc.):
   § 1 SETTINGS        every tunable number, card, ticker, tip and shop price
   § 2 HELPERS         number formatting, seeded random numbers, shuffling
   § 3 DECKS           card labels, deck sizes, turning a deck into a pile of cards
   § 4 MARKET          one tick of the market, the day's schedule, the market maker's forecast
   § 5 ACCOUNT         values and equity, margin, stock trades, option trades, expiry
   § 6 INSIDER & HEAT  what each tip reveals, heat, investigations
   § 7 RUN             markets, days, the close, meetings, the shop catalogue, deck edits, saving
   § 8 SOUND           small synthesised effects
   § 9 CHART           last week, today and the forecast (top 10%, average, bottom 10%)
   § 10 PANELS         the side menu, the action buttons, the last card drawn
   § 11 OVERLAYS       title, menu, day result, game over, deck window, trade menu, shop, deck picker
   § 12 INPUT          actions, mouse, tooltips (the game is mouse only)
   § 13 START          main loop and start-up (only in a browser; tools/ load §1-§7 headless) */

// ═══════════════════════════════════════ § 1 SETTINGS ═══════════════════════════════════════
const SAVE_KEY = 'insider.save.v1';             // the running game (written every tick, so quitting mid-day resumes there)
const SAVE_VERSION = 7;                         // saves from other versions are not resumed
const RECORDS_KEY = 'insider.records.v1';       // best equity and longest run, kept across runs
const PREFERENCES_KEY = 'insider.preferences.v1'; // sound and speed

// 1.1 The run
const STARTING_CASH = 1000;
const INFLATION_PER_DAY = 0.01;                 // shop prices grow ×(1.01)^(day−1); stocks gain 1% overnight
const BASE_OPEN_PRICE = 100;                    // a stock opens day 1 at this price (after a week of history)
const MINIMUM_CASH_TO_TRADE = 10;               // × inflation: below this after the close the run is over

// 1.2 The trading day
const TICKS_PER_DAY = 90;                       // one card (or one event) per tick
const SECONDS_PER_TICK = 0.25;                  // at 1× speed: a day lasts about 22 seconds
const GAME_SPEEDS = [1, 2, 4];

// 1.3 Cards. Move cards move the price by move × σ (σ = volatility, 1 at every open); vol cards multiply σ.
// Modifiers act on the moves around them:
//   repeat   the last move again (as it really happened)          reverse  the last move, the other way
//   double   the next move counts ×2 (stacks)                     halve    the next move counts ×½ (stacks)
// Rule cards change the game for the rest of the day (until the close):
//   +1% all day / −1% all day   every move after it gets +1% / −1% (stacks)
//   ×2 all day / ½ all day      every card move after it counts double / half (stacks)
//   no buying / no selling      the market maker stops buying from you / selling to you (§ 5.5)
//   draw 3                      three more cards hit at once
// rarity decides how often a card is offered in the shop (CARD_RARITIES).
const CARD_TYPES = {
  up:      { category: 'move', move: +0.01, rarity: 'common' },
  down:    { category: 'move', move: -0.01, rarity: 'common' },
  UP:      { category: 'move', move: +0.05, rarity: 'common' },
  DOWN:    { category: 'move', move: -0.05, rarity: 'common' },
  bull:    { category: 'move', move: +0.10, rarity: 'uncommon' },
  bear:    { category: 'move', move: -0.10, rarity: 'uncommon' },
  BULL:    { category: 'move', move: +0.50, rarity: 'rare' },
  BEAR:    { category: 'move', move: -0.50, rarity: 'rare' },
  volup:   { category: 'vol', factor: 1.01, rarity: 'common' },
  voldown: { category: 'vol', factor: 0.99, rarity: 'common' },
  volUP:   { category: 'vol', factor: 1.05, rarity: 'common' },
  volDOWN: { category: 'vol', factor: 0.95, rarity: 'common' },
  volbull: { category: 'vol', factor: 1.10, rarity: 'uncommon' },
  volbear: { category: 'vol', factor: 0.90, rarity: 'uncommon' },
  volBULL: { category: 'vol', factor: 1.50, rarity: 'rare' },
  volBEAR: { category: 'vol', factor: 0.50, rarity: 'rare' },
  repeat:  { category: 'modifier', rarity: 'uncommon', face: '↻',  sentence: 'The last move again.' },
  reverse: { category: 'modifier', rarity: 'uncommon', face: '⇄',  sentence: 'The last move, the other way.' },
  double:  { category: 'modifier', rarity: 'uncommon', face: '×2', sentence: 'The next move counts double. Stacks.' },
  halve:   { category: 'modifier', rarity: 'uncommon', face: '½',  sentence: 'The next move counts half. Stacks.' },
  plusAllDay:   { category: 'rule', rarity: 'rare',     face: '+1% all day', sentence: 'Every move after it, until the close, gets +1%. Stacks.' },
  minusAllDay:  { category: 'rule', rarity: 'rare',     face: '−1% all day', sentence: 'Every move after it, until the close, gets −1%. Stacks.' },
  doubleAllDay: { category: 'rule', rarity: 'rare',     face: '×2 all day',  sentence: 'Every card move after it, until the close, counts double. Stacks.' },
  halveAllDay:  { category: 'rule', rarity: 'rare',     face: '½ all day',   sentence: 'Every card move after it, until the close, counts half. Stacks.' },
  noBuying:     { category: 'rule', rarity: 'uncommon', face: 'no buying',   sentence: 'Market maker troubles: until the close you cannot buy (no long trades, no closing shorts).' },
  noSelling:    { category: 'rule', rarity: 'uncommon', face: 'no selling',  sentence: 'Market maker troubles: until the close you cannot sell (no short trades, no closing longs).' },
  drawThree:    { category: 'rule', rarity: 'uncommon', face: 'draw 3',      sentence: 'Three more cards hit at once.' },
  // cards that only some market types have (assetClasses); the others can be in any deck
  dividend:  { category: 'rule', rarity: 'uncommon', assetClasses: ['stock'], face: 'dividend', sentence: 'Pays 1% of the price per share you hold long; a short position pays it.' },
  tripleNext:{ category: 'modifier', rarity: 'rare', assetClasses: ['stock'], face: '×3', sentence: 'The next move counts triple (results day). Stacks.' },
  jumpUp:    { category: 'move', move: +0.20, rarity: 'uncommon', assetClasses: ['commodity'] },
  jumpDown:  { category: 'move', move: -0.20, rarity: 'uncommon', assetClasses: ['commodity'] },
  storage:   { category: 'rule', rarity: 'uncommon', assetClasses: ['commodity'], face: '−0.3% all day', sentence: 'Storage costs: every move after it, until the close, gets −0.3%. Stacks.' },
  growth:    { category: 'rule', rarity: 'uncommon', assetClasses: ['etf'], face: '+0.3% all day', sentence: 'Every move after it, until the close, gets +0.3%. Stacks.' },
  halfBack:  { category: 'modifier', rarity: 'uncommon', assetClasses: ['etf', 'commodity'], face: '½ back', sentence: 'The price moves halfway back to the open.' },
};
const CARD_ORDER = Object.keys(CARD_TYPES);
const PRICE_MOVE_FLOOR = -0.9;                  // no single move takes more than 90% off the price
const VOLATILITY_MINIMUM = 0.25, VOLATILITY_MAXIMUM = 4;
const ALL_DAY_BONUS = 0.01;                     // what +1% all day / −1% all day add to every move
const SMALL_ALL_DAY_BONUS = 0.003;              // what storage (−) and growth (+) add to every move
const DIVIDEND_SHARE = 0.01;                    // per share, as a share of the price
const DRAW_THREE_EXTRA_CARDS = 3;
const BIG_CARD_MOVE = 0.10;                     // moves this big (and vol factors this far from 1) shake the chart

// 1.4 Markets. Each is its own deck; its type (stock, commodity, ETF) decides which special cards it can be offered
// and how wild it starts every day (openVolatility = σ at the open). NOVA is the first; the others are bought.
const TICKERS = {
  NOVA: { name: 'Nova', icon: '💻', assetClass: 'stock', openVolatility: 1, price: 0,
    sentence: 'A tech stock: every card has its mirror; dividends and results days can be added.', deck: {
    up: 100, down: 100, UP: 100, DOWN: 100, bull: 10, bear: 10, BULL: 1, BEAR: 1,
    volup: 100, voldown: 100, volUP: 100, volDOWN: 100, volbull: 10, volbear: 10, volBULL: 1, volBEAR: 1 } },
  MART: { name: 'Mart', icon: '🛒', assetClass: 'stock', openVolatility: 0.8, price: 900,
    sentence: 'A store chain: steady, pays dividends.', deck: {
    up: 150, down: 140, UP: 60, DOWN: 60, bull: 8, bear: 8, volup: 80, voldown: 90, volUP: 30, volDOWN: 30, dividend: 12 } },
  GOLD: { name: 'Gold', icon: '🥇', assetClass: 'commodity', openVolatility: 1.4, price: 1500,
    sentence: 'A commodity: wild, no dividends, and it snaps back.', deck: {
    up: 80, down: 80, UP: 80, DOWN: 80, bull: 15, bear: 15, BULL: 1, BEAR: 1, volup: 60, voldown: 60, volUP: 60, volDOWN: 60,
    volbull: 10, volbear: 10, reverse: 25, halfBack: 10 } },
  OIL:  { name: 'Oil', icon: '🛢', assetClass: 'commodity', openVolatility: 1.8, price: 2500,
    sentence: 'A commodity: the wildest market, with ±20% jumps and storage costs.', deck: {
    up: 60, down: 60, UP: 80, DOWN: 80, bull: 25, bear: 25, BULL: 2, BEAR: 2, volup: 50, voldown: 50, volUP: 60, volDOWN: 60,
    volbull: 15, volbear: 15, jumpUp: 6, jumpDown: 6, storage: 5, double: 10 } },
  WRLD: { name: 'World', icon: '🌍', assetClass: 'etf', openVolatility: 0.5, price: 700,
    sentence: 'A world ETF: calm, slow growth, pulls back to the open.', deck: {
    up: 220, down: 200, UP: 20, DOWN: 20, bull: 2, bear: 2, volup: 60, voldown: 60, growth: 10, halfBack: 15, halve: 20 } },
};
const STARTING_TICKER = 'NOVA';

// 1.5 Costs: the only costs in the game are transaction costs

// ═══════════════════════════════════════ § 2 HELPERS ═══════════════════════════════════════
// Money and big numbers: plain below 10 000, then K/M/B/T, then scientific notation.
function formatMoney(value) {
  if (Math.abs(value) < 0.005) value = 0;                  // no "−$0.00"
  const sign = value < 0 ? '−' : '';
  const size = Math.abs(value);
  if (size < 100) return sign + '$' + size.toFixed(2);
  if (size < 1e4) return sign + '$' + Math.round(size).toLocaleString('en-US');
  const units = [[1e15, 'Q'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  if (size >= 1e18) return sign + '$' + size.toExponential(2).replace('e+', 'e');
  for (const [unit, letter] of units) if (size >= unit) return sign + '$' + (size / unit).toFixed(size / unit < 100 ? 2 : 1) + letter;
  return sign + '$' + size.toFixed(0);
}
function formatPrice(price) { return price < 1e4 ? '$' + price.toFixed(2) : formatMoney(price); }
function formatSignedMoney(value) { return (value >= 0 ? '+' : '') + formatMoney(value); }
function formatPercent(fraction, digits = 1) { return (fraction >= 0 ? '+' : '−') + Math.abs(fraction * 100).toFixed(digits) + '%'; }
function formatCount(value) {
  if (Math.abs(value) < 1000) return value.toFixed(Math.abs(value) < 10 ? 2 : 1);
  return formatMoney(value).replace('$', '');
}

// Seeded random numbers: the same seed gives the same numbers, so a day's shuffle is the same after a reload.
// makeRandom is a standard small generator (mulberry32) and mixSeed a standard hash (FNV-1a); their details
// do not matter for the game.
function makeRandom(seed) {
  let counter = seed >>> 0;
  return function random() {                                // a number from 0 up to (not including) 1
    counter = (counter + 0x6D2B79F5) >>> 0;
    let scrambled = Math.imul(counter ^ (counter >>> 15), 1 | counter);
    scrambled = (scrambled + Math.imul(scrambled ^ (scrambled >>> 7), 61 | scrambled)) ^ scrambled;
    return ((scrambled ^ (scrambled >>> 14)) >>> 0) / 4294967296;
  };
}
function mixSeed(...numbers) {
  let hash = 2166136261;
  for (const number of numbers) { hash ^= number >>> 0; hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
}
function shuffleInPlace(list, random) {
  for (let index = list.length - 1; index > 0; index--) {
    const other = Math.floor(random() * (index + 1));
    [list[index], list[other]] = [list[other], list[index]];
  }
  return list;
}
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function inflationIndex(day) { return Math.pow(1 + INFLATION_PER_DAY, day - 1); }

// ═══════════════════════════════════════ § 3 DECKS ═══════════════════════════════════════
// The text on a card chip: "+5%" for a move, "σ+5%" for a vol card, the face of a modifier or rule card.
function cardValueText(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.category === 'move') return (card.move > 0 ? '+' : '−') + Math.abs(card.move * 100) + '%';
  if (card.category === 'vol') return 'σ' + (card.factor > 1 ? '+' : '−') + Math.round(Math.abs(card.factor - 1) * 100) + '%';
  return card.face;
}
// The card's name on screen: its id for moves, vol cards and modifiers (up, BULL, volUP, repeat …); a rule card's
// face says what it does ("+1% all day").
function cardLabel(cardId) { return CARD_TYPES[cardId].category === 'rule' ? CARD_TYPES[cardId].face : cardId; }
function hasOwnName(cardId) { return CARD_TYPES[cardId].category !== 'rule'; }
function cardSentence(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.category === 'move') return `The price moves ${cardValueText(cardId)} × σ.`;
  if (card.category === 'vol') return `σ ${card.factor > 1 ? '+' : '−'}${Math.round(Math.abs(card.factor - 1) * 100)}%: every later move is that much ${card.factor > 1 ? 'bigger' : 'smaller'}.`;
  return card.sentence;
}
// Does this card shake the chart? 2 = a 50% move, 1 = a 10% move or a modifier.
function cardImpact(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.category === 'move') return Math.abs(card.move) >= 0.5 ? 2 : Math.abs(card.move) >= BIG_CARD_MOVE ? 1 : 0;
  if (card.category === 'vol') return Math.abs(card.factor - 1) >= 0.5 ? 2 : Math.abs(card.factor - 1) >= BIG_CARD_MOVE ? 1 : 0;
  return card.category === 'rule' ? 2 : 1;
}
function deckSize(deck) { return CARD_ORDER.reduce((total, cardId) => total + (deck[cardId] || 0), 0); }
// All the cards of a deck as one list of ids, ready to shuffle.
function deckToCardList(deck) {
  const cardList = [];
  for (const cardId of CARD_ORDER) for (let copy = 0; copy < (deck[cardId] || 0); copy++) cardList.push(cardId);
  return cardList;
}
function countCards(cardList) {
  const counts = {};
  for (const cardId of CARD_ORDER) counts[cardId] = 0;
  for (const cardId of cardList) counts[cardId]++;
  return counts;
}

// ═══════════════════════════════════════ § 4 MARKET ═══════════════════════════════════════
// The market state: the price, σ, the open price, the last move as it really happened (for repeat and reverse),
// the multiplier waiting for the next move, the day's rules (bonus and multiplier on every move, no buying, no
// selling, a cap on moves) and how many ticks are frozen. One tick draws one card through drawCard() (draw 3 draws
// more; a frozen tick draws none). The same rules run the real day and the market maker's simulations, so the
// forecast is exactly as fair as the game. Every rule ends at the close (freshMarketState).
function freshMarketState(openPrice, openVolatility = 1, bossRule = null) {
  const market = { price: openPrice, dayOpenPrice: openPrice, volatility: openVolatility, lastMove: 0, nextMoveMultiplier: 1,
    allDayBonus: 0, allDayMultiplier: 1, noBuying: false, noSelling: false, moveCap: Infinity, frozenTicksLeft: 0 };
  if (bossRule === 'noSelling') market.noSelling = true;
  if (bossRule === 'noBuying') market.noBuying = true;
  if (bossRule === 'minusAllDay') market.allDayBonus = -ALL_DAY_BONUS;
  if (bossRule === 'doubleAllDay') market.allDayMultiplier = 2;
  if (bossRule === 'circuitBreaker') market.moveCap = CIRCUIT_BREAKER_CAP;
  return market;
}
// A move: card moves are × σ × the day's multiplier; then the waiting multiplier, then the day's bonus, then the cap.
function applyMove(market, move, isCardMove) {
  const scaledMove = isCardMove ? move * market.volatility * market.allDayMultiplier : move;
  const actualMove = clamp(scaledMove * market.nextMoveMultiplier + market.allDayBonus, Math.max(PRICE_MOVE_FLOOR, -market.moveCap), market.moveCap);
  market.price *= 1 + actualMove;
  market.lastMove = actualMove;
  market.nextMoveMultiplier = 1;
}
function applyCard(market, cardId, drawCard, cardsApplied) {
  const card = CARD_TYPES[cardId];
  cardsApplied.push(cardId);
  if (card.category === 'move') applyMove(market, card.move, true);
  else if (card.category === 'vol') market.volatility = clamp(market.volatility * card.factor, VOLATILITY_MINIMUM, VOLATILITY_MAXIMUM);
  else if (cardId === 'repeat') applyMove(market, market.lastMove, false);
  else if (cardId === 'reverse') applyMove(market, -market.lastMove, false);
  else if (cardId === 'halfBack') applyMove(market, (market.dayOpenPrice / market.price - 1) / 2, false);   // halfway back to the open
  else if (cardId === 'double') market.nextMoveMultiplier *= 2;
  else if (cardId === 'halve') market.nextMoveMultiplier /= 2;
  else if (cardId === 'tripleNext') market.nextMoveMultiplier *= 3;
  else if (cardId === 'plusAllDay') market.allDayBonus += ALL_DAY_BONUS;
  else if (cardId === 'minusAllDay') market.allDayBonus -= ALL_DAY_BONUS;
  else if (cardId === 'growth') market.allDayBonus += SMALL_ALL_DAY_BONUS;
  else if (cardId === 'storage') market.allDayBonus -= SMALL_ALL_DAY_BONUS;
  else if (cardId === 'doubleAllDay') market.allDayMultiplier *= 2;
  else if (cardId === 'halveAllDay') market.allDayMultiplier /= 2;
  else if (cardId === 'noBuying') market.noBuying = true;
  else if (cardId === 'noSelling') market.noSelling = true;
  else if (cardId === 'drawThree')
    for (let extra = 0; extra < DRAW_THREE_EXTRA_CARDS; extra++) applyCard(market, drawCard(), drawCard, cardsApplied);
  // 'dividend' pays the account (§ 7, advanceTick)
}
// One tick: one card (more after a draw 3, none while frozen). Returns the cards drawn.
function tickMarket(market, drawCard) {
  const cardsApplied = [];
  if (market.frozenTicksLeft > 0) { market.frozenTicksLeft--; return cardsApplied; }
  applyCard(market, drawCard(), drawCard, cardsApplied);
  return cardsApplied;
}

// The deck is dealt from a draw pile: the shuffled cards not drawn yet. It lasts several days (NOVA: 844 cards at
// 90 a day); when it runs out a fresh shuffle of the whole deck replaces it, in the middle of a day if need be.
// The day is fixed in advance as a schedule (states[tick], cards[tick], …): insider plays read it, the live day replays
// it one tick per quarter second. A play that changes the market rebuilds the rest of the day (continueSchedule).
// schedule.drawPiles holds the piles used from the last rebuild on; pilePositions[tick] = [which pile, how many of its
// cards are drawn]; drawnBefore[tick] = cards drawn today up to that tick.
function scheduleDay(drawPile, deck, market, random) {
  const start = { states: [], cards: [[]], drawPiles: [], pilePositions: [], drawnBefore: [0] };
  return continueSchedule(start, 0, market, drawPile, deck, random);
}
// Keep the schedule up to fromTick, put this market state at fromTick, and deal the rest of the day from this pile.
function continueSchedule(schedule, fromTick, market, drawPile, deck, random) {
  const drawPiles = [drawPile.slice()];
  let drawPileIndex = 0, cardsTakenFromPile = 0, cardsDrawnToday = schedule.drawnBefore[fromTick];
  const drawCard = () => {
    if (cardsTakenFromPile >= drawPiles[drawPileIndex].length) {          // the pile is empty: shuffle the whole deck
      drawPiles.push(shuffleInPlace(deckToCardList(deck), random));
      drawPileIndex++;
      cardsTakenFromPile = 0;
    }
    cardsDrawnToday++;
    return drawPiles[drawPileIndex][cardsTakenFromPile++];
  };
  const result = {
    states: schedule.states.slice(0, fromTick).concat([{ ...market }]), cards: schedule.cards.slice(0, fromTick + 1),
    drawPiles, pilePositions: schedule.pilePositions.slice(0, fromTick).concat([[0, 0]]), drawnBefore: schedule.drawnBefore.slice(0, fromTick + 1),
  };
  const state = { ...market };
  for (let tick = fromTick + 1; tick <= TICKS_PER_DAY; tick++) {
    result.cards.push(tickMarket(state, drawCard));
    result.states.push({ ...state });
    result.pilePositions.push([drawPileIndex, cardsTakenFromPile]);
    result.drawnBefore.push(cardsDrawnToday);
  }
  return result;
}
// The cards still in the draw pile after this tick (what the market maker counts on).
function drawPileAfter(schedule, tick) {
  const [drawPileIndex, cardsTaken] = schedule.pilePositions[tick];
  return schedule.drawPiles[drawPileIndex].slice(cardsTaken);
}
// Overnight the price grows with inflation; σ, the day's rules and a waiting multiplier end (freshMarketState).
function nextOpenPrice(closePrice) { return closePrice * (1 + INFLATION_PER_DAY); }

// The market maker knows which cards are left in the draw pile and what the whole deck holds, but not the order. It
// plays out the rest of today and the next daysAhead days many times, with the same tickMarket as the real day.
// Returns closesByDay[k][path]: the close k days from today (k = 0 is today's close).
function simulateForecast(market, remainingDrawPile, deck, ticksLeftToday, daysAhead, paths, random, openVolatility = 1) {
  const wholeDeck = deckToCardList(deck);
  const closesByDay = Array.from({ length: daysAhead + 1 }, () => []);
  for (let path = 0; path < paths; path++) {
    const marketState = { ...market };
    let cardsLeft = remainingDrawPile.slice();
    const drawCard = () => {                       // a random card from what is left; a fresh deck when the pile is empty
      if (cardsLeft.length === 0) cardsLeft = wholeDeck.slice();
      const index = Math.floor(random() * cardsLeft.length);
      const card = cardsLeft[index];
      cardsLeft[index] = cardsLeft[cardsLeft.length - 1];
      cardsLeft.pop();
      return card;
    };
    for (let day = 0; day <= daysAhead; day++) {
      if (day > 0) Object.assign(marketState, freshMarketState(nextOpenPrice(marketState.price), openVolatility));
      const ticks = day === 0 ? ticksLeftToday : TICKS_PER_DAY;
      for (let tick = 0; tick < ticks; tick++) tickMarket(marketState, drawCard);
      closesByDay[day].push(marketState.price);
    }
  }
  return closesByDay;
}

// What one option pays when exercised at price S: max(S − K, 0) for a call, max(K − S, 0) for a put.
function payoff(type, strikePrice, price) { return Math.max(0, type === 'call' ? price - strikePrice : strikePrice - price); }
// The value of an option held to expiry: its average payoff over the simulated closes.
function averagePayoff(closes, type, strikePrice) {
  let total = 0;
  for (const closePrice of closes) total += payoff(type, strikePrice, closePrice);
  return total / closes.length;
}

// ═══════════════════════════════════════ § 5 ACCOUNT ═══════════════════════════════════════
// What you own. run.cash can go negative (money borrowed on margin) and grows when you short stock or options (you
// receive the money). run.today.shares is the stock position: positive = long, negative = short. Each option position is
// { type: 'call' | 'put', direction: 'long' | 'short', strikePrice, quantity, premiumTotal, expiryDay }, where premiumTotal is what was paid
// (long) or received (short). Positions are held overnight; options expire at the close of their expiryDay.

// ── 5.1 Prices and values
function currentPrice(today) { return today.schedule.states[today.tick].price; }
function accountLeverage(run) { return LEVERAGE_TIERS[run.leverageTier]; }
// New trades are capped at 1× during an investigation. The margin call keeps using the account's own leverage,
// so positions carried into an investigation are not liquidated by the cap itself.
function maximumLeverage(run) { return run.today && run.today.investigation ? 1 : accountLeverage(run); }

// One option is worth the higher of exercising it now (its payoff at today's price) and holding it to expiry (the
// forecast's average payoff at the expiry day's close). At the close of its last day only exercising is left.
function valueOfOneOption(run, type, strikePrice, expiryDay) {
  const today = run.today, daysLeft = expiryDay - run.day;
  const exerciseNow = payoff(type, strikePrice, currentPrice(today));
  const lastMoment = daysLeft <= 0 && today.tick >= TICKS_PER_DAY;
  if (lastMoment || !today.forecast) return exerciseNow;
  const holdToExpiry = averagePayoff(today.forecast[clamp(daysLeft, 0, FORECAST_DAYS_AHEAD)], type, strikePrice);
  return Math.max(exerciseNow, holdToExpiry);
}
// For an option position: optionWorth is what its options are worth (never negative). optionBuyIn and optionValueNow
// carry the sign of the position: + for long, − for short (a short option is money received, and a debt now).
function directionSign(option) { return option.direction === 'short' ? -1 : 1; }
function optionWorth(run, option) { return valueOfOneOption(run, option.type, option.strikePrice, option.expiryDay) * option.quantity; }
function optionBuyIn(option) { return directionSign(option) * option.premiumTotal; }
function optionValueNow(run, option) { return directionSign(option) * optionWorth(run, option); }
function daysToExpiry(run, option) { return option.expiryDay - run.day; }

// Equity: cash plus everything at its value now.
function totalEquity(run) {
  if (!run.today) return run.cash;
  const optionsValue = run.today.options.reduce((total, option) => total + optionValueNow(run, option), 0);
  return run.cash + run.today.shares * currentPrice(run.today) + optionsValue;
}
function hasPositions(run) { return run.today.shares !== 0 || run.today.options.length > 0; }

// ── 5.2 Margin. One rule for everything you hold.
// Exposure = what is at stake: the stock's value, what long options are worth, and short options counted like a
// short of that many shares. Buying power = equity × leverage − exposure: every trade (stock or option) uses it.
// Margin call: when equity falls below exposure × MAINTENANCE_SHARE ÷ leverage, everything is closed.
function exposure(run) {
  const today = run.today, price = currentPrice(today);
  let total = Math.abs(today.shares * price);
  for (const option of today.options) total += option.direction === 'long' ? optionWorth(run, option) : option.quantity * price;
  return total;
}
function buyingPower(run) { return Math.max(0, Math.max(0, totalEquity(run)) * maximumLeverage(run) - exposure(run)); }
// The equity below which a margin call closes everything (for this exposure).
function marginCallEquity(run, exposureNow = exposure(run)) { return exposureNow * MAINTENANCE_SHARE / accountLeverage(run); }

// Run after every tick.
function checkMargin(run) {
  if (exposure(run) === 0 || totalEquity(run) >= marginCallEquity(run)) return null;
  closeEverything(run, true);
  return 'Margin call!';
}

// ── 5.5 The day's trading rules (from rule cards): a buy is a long trade or closing a short, a sell the other way.
function rulesNow(run) { return run.today.schedule.states[run.today.tick]; }
function buyingBlocked(run) { return rulesNow(run).noBuying; }
function sellingBlocked(run) { return rulesNow(run).noSelling; }
// Why a trade in this direction (+1 buy, −1 sell) is not possible now, or null.
function blockedReason(run, buyOrSell) {
  if (buyOrSell > 0 && buyingBlocked(run)) return 'No buying today';
  if (buyOrSell < 0 && sellingBlocked(run)) return 'No selling today';
  return null;
}

// ── 5.3 Stock trades
// Move the stock position to newShares at the current price, paying the transaction cost. The entry price is the
// average price paid for the shares now held; it resets when the position closes or turns around.
function setShares(run, newShares) {
  const today = run.today, price = currentPrice(today);
  const change = newShares - today.shares;
  if (change === 0) return 0;
  run.cash -= change * price + Math.abs(change) * price * STOCK_TRANSACTION_COST;
  const sameDirection = today.shares !== 0 && Math.sign(newShares) === Math.sign(today.shares);
  const growing = Math.abs(newShares) > Math.abs(today.shares);
  if (newShares === 0) today.averageEntryPrice = 0;
  else if (!sameDirection) today.averageEntryPrice = price;
  else if (growing) today.averageEntryPrice = (today.averageEntryPrice * today.shares + price * change) / newShares;
  today.shares = newShares;
  today.tradeCount++;
  return change;
}
// How many shares can still be bought (direction +1) or shorted (−1) with the buying power left.
// How many shares can be bought (+1) or shorted (−1): turning a position around first frees what it uses.
function sharesAvailable(run, direction) {
  const price = currentPrice(run.today), shares = run.today.shares;
  const freedByClosing = Math.sign(shares) === -direction ? Math.abs(shares) : 0;
  return buyingPower(run) / price / (1 + STOCK_TRANSACTION_COST) + 2 * freedByClosing;
}
// Buy (+1) or short (−1) this fraction of the shares available. Returns the share change, or why nothing happened.
function tradeStock(run, direction, fraction) {
  const blocked = blockedReason(run, direction);
  if (blocked) return blocked;
  const change = direction * fraction * sharesAvailable(run, direction);
  if (Math.abs(change) * currentPrice(run.today) < SMALLEST_TRADE) return 'Nothing to trade';
  setShares(run, run.today.shares + change);
  return change;
}
function closeStock(run) { return setShares(run, 0); }
// Close this fraction (0..1) of the stock position, long or short.
function closeStockPart(run, fraction) {
  const blocked = blockedReason(run, -Math.sign(run.today.shares));
  if (blocked) return blocked;
  return setShares(run, fraction >= 1 ? 0 : run.today.shares * (1 - fraction));
}

// ── 5.4 Option trades
function optionPositionId(direction, type) { return direction + type[0].toUpperCase() + type.slice(1); }   // 'long', 'call' → 'longCall'
function optionsAllowed(run, direction, type) {
  return run.unlocked[optionPositionId(direction, type)] && !run.today.investigation && run.today.bossRule !== 'noOptions'
    && run.today.tick < TICKS_PER_DAY;
}
function strikeOffsets(type) { return type === 'call' ? CALL_STRIKE_OFFSETS : PUT_STRIKE_OFFSETS; }
function newExpiryDay(run) { return run.day + OPTION_EXPIRY_DAYS; }
// The prices of one option: buyPrice = what you pay to go long, sellPrice = what you receive to go short.
function optionPrices(run, type, strikePrice, expiryDay = newExpiryDay(run)) {
  const fairValue = valueOfOneOption(run, type, strikePrice, expiryDay);
  return { fairValue, buyPrice: fairValue * (1 + OPTION_TRANSACTION_COST), sellPrice: fairValue * (1 - OPTION_TRANSACTION_COST) };
}
function isWorthless(premium, run) { return premium <= currentPrice(run.today) * WORTHLESS_OPTION; }
// How many options can be shorted: like shorting that many shares.
function optionsAvailableToShort(run) { return buyingPower(run) / currentPrice(run.today); }
// A new option position joins an open one of the same option (same type, direction, strike price and expiry).
function addOption(run, newOption) {
  const same = run.today.options.find(option => option.type === newOption.type && option.direction === newOption.direction
    && option.expiryDay === newOption.expiryDay && Math.abs(option.strikePrice - newOption.strikePrice) < 1e-9);
  if (same) { same.quantity += newOption.quantity; same.premiumTotal += newOption.premiumTotal; }
  else run.today.options.push(newOption);
  run.today.tradeCount++;
}
// Long options for this fraction of buying power (leverage included). Returns the quantity, or why nothing happened.
function buyOption(run, type, strikePrice, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'long', type)) return 'Options locked';
  if (buyingBlocked(run)) return 'No buying today';
  const { buyPrice } = optionPrices(run, type, strikePrice, expiryDay);
  if (isWorthless(buyPrice, run)) return 'Worth nothing at that strike';
  const cashToSpend = fraction * buyingPower(run) / (1 + OPTION_TRANSACTION_COST);
  if (cashToSpend < SMALLEST_TRADE) return 'No buying power left';
  run.cash -= cashToSpend;
  addOption(run, { type, direction: 'long', strikePrice, quantity: cashToSpend / buyPrice, premiumTotal: cashToSpend, expiryDay });
  return cashToSpend / buyPrice;
}
// Short options for this fraction of what is available: the premium comes in now, the payoff is owed when exercised.
function writeOption(run, type, strikePrice, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'short', type)) return 'Options locked';
  if (sellingBlocked(run)) return 'No selling today';
  const { sellPrice } = optionPrices(run, type, strikePrice, expiryDay);
  if (isWorthless(sellPrice, run)) return 'Worth nothing at that strike';
  const quantity = fraction * optionsAvailableToShort(run);
  if (quantity * sellPrice < SMALLEST_TRADE) return 'No margin left';
  run.cash += quantity * sellPrice;
  addOption(run, { type, direction: 'short', strikePrice, quantity, premiumTotal: quantity * sellPrice, expiryDay });
  return quantity;
}
// The cash from closing this fraction of an option position: long is sold at its worth −cost, short costs its worth +cost.
function cashFromClosingOption(run, option, fraction) {
  const worth = optionWorth(run, option) * fraction;
  return option.direction === 'long' ? worth * (1 - OPTION_TRANSACTION_COST) : -worth * (1 + OPTION_TRANSACTION_COST);
}
// Close this fraction (0..1, default all) of an option position.
// forced = a margin call, which closes whatever the day's rules say.
function closeOption(run, optionIndex, fraction = 1, forced = false) {
  const option = run.today.options[optionIndex];
  if (!option) return 0;
  const blocked = forced ? null : blockedReason(run, -directionSign(option));
  if (blocked) return blocked;
  const cashChange = cashFromClosingOption(run, option, fraction);
  run.cash += cashChange;
  if (fraction >= 1) run.today.options.splice(optionIndex, 1);
  else { option.quantity *= 1 - fraction; option.premiumTotal *= 1 - fraction; }
  return cashChange;
}
// Close every position the day's rules allow (all of them when forced, for a margin call).
function closeEverything(run, forced = false) {
  if (forced || !blockedReason(run, -Math.sign(run.today.shares))) closeStock(run);
  for (let index = run.today.options.length - 1; index >= 0; index--) closeOption(run, index, 1, forced);
}
// At the close: options on their last day pay out (long) or are paid (short). The stock is held overnight.
function expireOptions(run) {
  const today = run.today, closePrice = currentPrice(today);
  const expiring = today.options.filter(option => option.expiryDay <= run.day);
  for (const option of expiring) run.cash += directionSign(option) * payoff(option.type, option.strikePrice, closePrice) * option.quantity;
  today.options = today.options.filter(option => option.expiryDay > run.day);
  return expiring.length;
}

// ═══════════════════════════════════════ § 6 THE PLAYBOOK & HEAT ═══════════════════════════════════════
// ── 6.1 The hand: every morning HAND_SIZE plays are dealt from the playbook (seeded, so a reload deals the same),
// with FOCUS_PER_DAY focus to spend (1 on a '1 focus' boss day).
function dealHand(run) {
  const random = makeRandom(mixSeed(run.seed, run.day, 41));
  const shuffled = shuffleInPlace(run.playbook.slice(), random);
  run.today.hand = shuffled.slice(0, HAND_SIZE);
  run.today.focus = run.today.bossRule === 'oneFocus' ? 1 : FOCUS_PER_DAY;
  run.today.effects = { hedge: false, trailingStop: false, bestPrice: null, pyramid: false };
}
// Why this card in the hand cannot be played now, or null.
function playBlockedReason(run, handIndex) {
  const today = run.today, play = PLAYS[today.hand[handIndex]];
  if (!play) return 'No such play';
  if (today.tick >= TICKS_PER_DAY) return 'The market is closed';
  if (play.cost > today.focus) return 'Not enough focus';
  if (play.heat > 0 && today.investigation) return 'Not during an investigation';
  if (['doubleDown', 'turnAround', 'hedge', 'trailingStop', 'pyramid'].includes(today.hand[handIndex]) && today.shares === 0) return 'You hold no stock';
  return null;
}
// The next two market cards, for Pick 1 of 2 to choose from.
function nextTwoCards(run) { return remainingDrawPile(run.today).slice(0, 2); }

// Play a card from the hand. Returns a short line for the screen, or { error }. Pick 1 of 2 needs choice (0 or 1).
function playCard(run, handIndex, choice = null) {
  const blocked = playBlockedReason(run, handIndex);
  if (blocked) return { error: blocked };
  const today = run.today, playId = today.hand[handIndex], play = PLAYS[playId];
  if (playId === 'pickOfTwo' && choice === null) return { error: 'Choose a card' };
  const line = PLAY_EFFECTS[playId](run, choice);
  if (line && line.error) return line;
  today.hand.splice(handIndex, 1);
  today.focus -= play.cost;
  run.heat += play.heat;
  today.tickerLocked = true;
  return line;
}

// ── 6.2 What each play does. Plays on the market rebuild the rest of the day from the changed state (6.3).
const PLAY_EFFECTS = {
  peek(run) { const today = run.today; today.revealedUpTo = Math.max(today.revealedUpTo, today.schedule.drawnBefore[today.tick] + PEEK_CARDS); return 'PEEK 3'; },
  rumour(run) {
    const today = run.today, closePrice = today.schedule.states[TICKS_PER_DAY].price;
    today.insights.rumour = { direction: closePrice >= currentPrice(today) ? 'up' : 'down', fromPrice: currentPrice(today) };
    return 'RUMOUR: closes ' + (today.insights.rumour.direction === 'up' ? 'higher ▲' : 'lower ▼');
  },
  insiderCall(run) { const today = run.today; today.insights.exactClose = { closePrice: today.schedule.states[TICKS_PER_DAY].price }; return 'INSIDER CALL'; },
  pickOfTwo(run, choice) {
    changeMarket(run, (market, drawPile) => {
      const [first, second] = drawPile.splice(0, 2);
      drawPile.unshift(choice === 0 ? first : second);
      drawPile.push(choice === 0 ? second : first);
    });
    return 'PICKED';
  },
  skip(run) { changeMarket(run, (market, drawPile) => drawPile.push(drawPile.shift())); return 'SKIPPED'; },
  flip(run) { changeMarket(run, market => { market.nextMoveMultiplier *= -1; }); return 'FLIP'; },
  freeze(run) { changeMarket(run, market => { market.frozenTicksLeft += FREEZE_TICKS; }); return 'FREEZE'; },
  pushUp(run) { changeMarket(run, market => { market.price *= 1 + PUSH_MOVE; }); return 'PUSH +2%'; },
  pushDown(run) { changeMarket(run, market => { market.price *= 1 - PUSH_MOVE; }); return 'PUSH −2%'; },
  stack(run) { changeMarket(run, market => { market.nextMoveMultiplier *= 2; }); return 'STACK ×2'; },
  dampen(run) { changeMarket(run, market => { market.nextMoveMultiplier /= 2; }); return 'DAMPEN ½'; },
  doubleDown(run) {
    const today = run.today, direction = Math.sign(today.shares);
    const added = Math.min(Math.abs(today.shares), sharesAvailable(run, direction));
    const blocked = blockedReason(run, direction);
    if (blocked || added <= 0) return { error: blocked || 'No buying power left' };
    setShares(run, today.shares + direction * added);
    return 'DOUBLE DOWN';
  },
  turnAround(run) {
    const today = run.today, shares = today.shares;
    const blocked = blockedReason(run, -Math.sign(shares));
    if (blocked) return { error: blocked };
    setShares(run, 0);
    setShares(run, -Math.sign(shares) * Math.min(Math.abs(shares), sharesAvailable(run, -Math.sign(shares))));
    return 'TURNED AROUND';
  },
  hedge(run) { run.today.effects.hedge = true; return 'HEDGED'; },
  trailingStop(run) { run.today.effects.trailingStop = true; run.today.effects.bestPrice = currentPrice(run.today); return 'TRAILING STOP'; },
  pyramid(run) { run.today.effects.pyramid = true; return 'PYRAMID'; },
};

// ── 6.3 Changing the market mid-day: change a copy of the state now and the cards left, then deal the rest of the
// day again (the reshuffles get a new seed each time, so nothing can be replayed).
function changeMarket(run, change) {
  const today = run.today, market = { ...today.schedule.states[today.tick] }, drawPile = remainingDrawPile(today);
  change(market, drawPile);
  today.marketChanges = (today.marketChanges || 0) + 1;
  const random = makeRandom(mixSeed(run.seed, run.day, tickerNumber(today.ticker), today.marketChanges, 7));
  today.schedule = continueSchedule(today.schedule, today.tick, market, drawPile, run.decks[today.ticker], random);
  refreshForecast(run);
}

// ── 6.4 Plays on your position, checked after every tick (priceBefore = the price a tick ago).
function applyPositionEffects(run, priceBefore) {
  const today = run.today, effects = today.effects, price = currentPrice(today), direction = Math.sign(today.shares);
  if (direction === 0) return null;
  const inFavour = direction * (price - priceBefore) > 0;
  if (effects.hedge && !inFavour && price !== priceBefore) {          // the hedge pays back half of the first loss
    run.cash += Math.abs(today.shares * (price - priceBefore)) / 2;
    effects.hedge = false;
    return 'HEDGE paid half';
  }
  if (effects.pyramid && inFavour) {
    const added = Math.min(Math.abs(today.shares) * PYRAMID_SHARE, sharesAvailable(run, direction));
    if (added > 0 && !blockedReason(run, direction)) setShares(run, today.shares + direction * added);
  }
  if (effects.trailingStop) {
    effects.bestPrice = direction > 0 ? Math.max(effects.bestPrice, price) : Math.min(effects.bestPrice, price);
    const turned = direction > 0 ? price <= effects.bestPrice * (1 - TRAILING_STOP_SHARE) : price >= effects.bestPrice * (1 + TRAILING_STOP_SHARE);
    if (turned && !blockedReason(run, -direction)) { closeStock(run); effects.trailingStop = false; return 'TRAILING STOP hit'; }
  }
  return null;
}

// ── 6.5 Heat: plays like Push and Rumour add it, so do deck changes and suspiciously good days.
// Heat from a suspiciously good day.
function abnormalProfitHeat(dayReturn) {
  if (dayReturn <= ABNORMAL_RETURN) return 0;
  return Math.min(HEAT_ABNORMAL_CAP, (dayReturn - ABNORMAL_RETURN) * HEAT_PER_ABNORMAL_RETURN);
}
// At the close: add the day's heat and open or end an investigation. Returns 'opened', 'cleared' or null.
function updateHeat(run, dayReturn) {
  run.heat += abnormalProfitHeat(dayReturn);
  if (run.today.investigation) {
    run.investigationDaysLeft--;
    if (run.investigationDaysLeft > 0) return null;
    run.heat = HEAT_AFTER_INVESTIGATION;
    return 'cleared';
  }
  if (run.heat < HEAT_LIMIT) return null;
  run.investigationDaysLeft = INVESTIGATION_DAYS;
  return 'opened';
}

// The market opens: the day's trading starts.
function openTheMarket(run) {
  run.phase = 'trading';
  run.today.tickerLocked = true;
}

// ═══════════════════════════════════════ § 7 RUN ═══════════════════════════════════════
// Each stock has a market that lives across days: { drawPile (cards not drawn yet), history (the last HISTORY_DAYS days
// as { day, prices }), lastClose }. Every owned stock trades every day; you trade one of them.
function newRun(seed = Math.floor(Math.random() * 2 ** 31)) {
  const decks = {};
  for (const tickerId in TICKERS) {
    decks[tickerId] = { ...TICKERS[tickerId].deck };
    for (const cardId of CARD_ORDER) decks[tickerId][cardId] = decks[tickerId][cardId] || 0;
  }
  const unlocked = {};
  for (const positionId in OPTION_POSITIONS) unlocked[positionId] = false;
  const run = {
    version: SAVE_VERSION, seed, day: 1, phase: 'preopen',
    cash: STARTING_CASH, peakEquity: STARTING_CASH, heat: 0, investigationDaysLeft: 0,
    unlocked, leverageTier: 0, tickersOwned: [STARTING_TICKER], ticker: STARTING_TICKER,
    decks, markets: {}, removalsDone: 0, packsBought: 0, cardOffer: null,
    playbook: STARTING_PLAYBOOK.slice(), playsLearned: 0, playsForgotten: 0,
    forecastBought: false, meetingsPassed: 0, lastResult: null, gameOverReason: null, today: null,
  };
  createMarket(run, STARTING_TICKER);
  prepareDay(run);
  return run;
}

function tickerNumber(tickerId) { return Object.keys(TICKERS).indexOf(tickerId); }
// The boss rule of a meeting day (seeded per meeting, so it can be shown days ahead), or null on other days.
function bossRuleOn(run, day) {
  if (day % MEETING_EVERY_DAYS !== 0) return null;
  const ruleIds = Object.keys(BOSS_RULES);
  return ruleIds[mixSeed(run.seed, day / MEETING_EVERY_DAYS, 13) % ruleIds.length];
}
function dayRandom(run, tickerId) { return makeRandom(mixSeed(run.seed, run.day, tickerNumber(tickerId), 0)); }

// A stock joins the run with a week of history already played (from its own draw pile), scaled so that its next open
// is BASE_OPEN_PRICE × inflation. Bought in the shop after a close, its history runs up to that day.
function createMarket(run, tickerId) {
  const deck = run.decks[tickerId], random = makeRandom(mixSeed(run.seed, run.day, tickerNumber(tickerId), 99));
  let drawPile = shuffleInPlace(deckToCardList(deck), random), price = 1;
  const history = [];
  const lastHistoryDay = run.phase === 'preopen' ? run.day - 1 : run.day;
  for (let back = HISTORY_DAYS - 1; back >= 0; back--) {
    const schedule = scheduleDay(drawPile, deck, freshMarketState(price, TICKERS[tickerId].openVolatility), random);
    history.push({ day: lastHistoryDay - back, prices: schedule.states.map(marketState => marketState.price) });
    drawPile = drawPileAfter(schedule, TICKS_PER_DAY);
    price = nextOpenPrice(schedule.states[TICKS_PER_DAY].price);
  }
  const scale = BASE_OPEN_PRICE * inflationIndex(run.day) / price;
  for (const day of history) day.prices = day.prices.map(value => value * scale);
  run.markets[tickerId] = { drawPile, history, lastClose: history[history.length - 1].prices[TICKS_PER_DAY] };
}
// A stock's day, dealt from its draw pile.
function scheduleMarketDay(run, tickerId) {
  const market = run.markets[tickerId];
  const open = freshMarketState(nextOpenPrice(market.lastClose), TICKERS[tickerId].openVolatility, bossRuleOn(run, run.day));
  return scheduleDay(market.drawPile, run.decks[tickerId], open, dayRandom(run, tickerId));
}
// After the close: the draw pile moves on and the day joins the history.
function commitMarketDay(run, tickerId, schedule) {
  const market = run.markets[tickerId];
  market.drawPile = drawPileAfter(schedule, TICKS_PER_DAY);
  market.history.push({ day: run.day, prices: schedule.states.map(marketState => marketState.price) });
  market.history = market.history.slice(-HISTORY_DAYS);
  market.lastClose = schedule.states[TICKS_PER_DAY].price;
}

// Fix today's schedule for the traded stock. Positions carry over from yesterday (in the same stock).
function prepareDay(run) {
  const yesterday = run.today, carry = yesterday && yesterday.ticker === run.ticker;
  run.today = {
    ticker: run.ticker, tick: 0, schedule: scheduleMarketDay(run, run.ticker),
    shares: carry ? yesterday.shares : 0, averageEntryPrice: carry ? yesterday.averageEntryPrice : 0, options: carry ? yesterday.options : [],
    tradeCount: 0, tickerLocked: false, insights: {}, revealedUpTo: 0, investigation: run.investigationDaysLeft > 0,
    bossRule: bossRuleOn(run, run.day), marketChanges: 0,
    startEquity: 0, tickClock: 0, forecast: null, forecastSummary: null,
  };
  run.phase = 'preopen';
  dealHand(run);
  refreshForecast(run);
  run.today.startEquity = totalEquity(run);
}
function remainingDrawPile(today) { return drawPileAfter(today.schedule, today.tick); }
// The market maker's forecast from this tick to the close FORECAST_DAYS_AHEAD days from now.
function refreshForecast(run) {
  const today = run.today;
  const random = makeRandom(mixSeed(run.seed, run.day, today.tick, 5));
  today.forecast = simulateForecast(today.schedule.states[today.tick], remainingDrawPile(today), run.decks[today.ticker],
    TICKS_PER_DAY - today.tick, FORECAST_DAYS_AHEAD, FORECAST_PATHS, random, TICKERS[today.ticker].openVolatility);
  today.forecastSummary = summariseForecast(today.forecast[FORECAST_DAYS_AHEAD]);
}
// The three numbers the chart shows: bottom 10%, average and top 10% of the simulated closes.
function summariseForecast(closes) {
  const sorted = Float64Array.from(closes).sort();
  let total = 0;
  for (const closePrice of sorted) total += closePrice;
  return {
    low: sorted[Math.floor(sorted.length * FORECAST_LOW_QUANTILE)],
    average: total / sorted.length,
    high: sorted[Math.floor(sorted.length * FORECAST_HIGH_QUANTILE)],
  };
}
// Only before the open, and only without positions (they belong to the stock they were traded in).
function switchTicker(run, tickerId) {
  if (!run.tickersOwned.includes(tickerId) || run.phase !== 'preopen' || run.today.tickerLocked || hasPositions(run)) return false;
  run.ticker = tickerId;
  prepareDay(run);
  return true;
}

// One tick of the live day. Returns what happened so the screen can react.
function advanceTick(run) {
  const today = run.today, priceBefore = currentPrice(today);
  today.tick++;
  const cards = today.schedule.cards[today.tick];
  if (today.tick % FORECAST_EVERY_TICKS === 0 || today.tick >= TICKS_PER_DAY) refreshForecast(run);
  const dividendCash = payDividends(run, cards);
  const effectLine = applyPositionEffects(run, priceBefore);

}
// A dividend card pays DIVIDEND_SHARE of the price per share held long; a short position pays it.
function payDividends(run, cards) {
  const cash = cards.filter(cardId => cardId === 'dividend').length * run.today.shares * currentPrice(run.today) * DIVIDEND_SHARE;
  run.cash += cash;
  return cash;
}

// Meeting n is held at the close of day n × MEETING_EVERY_DAYS. Its target is STARTING_CASH × inflation × the
// listed multiple; meetings after the list grow ×MEETING_GROWTH_AFTER_LAST each.
function meetingTarget(run, meetingNumber) {

  const listed = MEETING_MULTIPLES[Math.min(meetingNumber, MEETING_MULTIPLES.length) - 1];
  const extra = Math.pow(MEETING_GROWTH_AFTER_LAST, Math.max(0, meetingNumber - MEETING_MULTIPLES.length));
  return STARTING_CASH * inflationIndex(day) * listed * extra;
}
function nextMeetingNumber(run) { return Math.ceil(run.day / MEETING_EVERY_DAYS); }
// If today is a meeting day: { number, target, passed, final }, else null.
function holdMeeting(run, equity) {

  const number = run.day / MEETING_EVERY_DAYS, target = meetingTarget(run, number);
  const meeting = { number, target, passed: equity >= target, final: number === MEETING_MULTIPLES.length };
  if (meeting.passed) run.meetingsPassed = number;

}

// The close: options expire, every stock moves on a day, heat is added, the meeting is held if it is due, and the
// run ends if there is no money left or the meeting failed.
function closeDay(run) {

    if (tickerId !== today.ticker) commitMarketDay(run, tickerId, scheduleMarketDay(run, tickerId));

  const endEquity = totalEquity(run);
  const dayReturn = (endEquity - today.startEquity) / Math.max(1e-9, today.startEquity);   // (guards a zero start)
  const heatBefore = run.heat;
  const investigationNote = updateHeat(run, dayReturn);
  const meeting = holdMeeting(run, endEquity);
  run.peakEquity = Math.max(run.peakEquity, endEquity);
  if (endEquity < MINIMUM_CASH_TO_TRADE * inflationIndex(run.day + 1)) run.gameOverReason = 'broke';
  else if (meeting && !meeting.passed) run.gameOverReason = 'meeting';
  run.lastResult = {
    day: run.day, ticker: today.ticker, openPrice: today.schedule.states[0].price, closePrice: currentPrice(today),
    startEquity: today.startEquity, endEquity, dayReturn, expired,
    heatAdded: run.heat - heatBefore, investigationNote, meeting,
  };
  run.phase = 'result';
  return run.lastResult;
}

function startNextDay(run) {
  run.day++;
  run.heat = Math.max(0, run.heat - HEAT_DECAY_PER_DAY);
  prepareDay(run);
}

// ── 7.1 The shop catalogue. Every shop item: icon, name, a short line (shortText), one full sentence, a price, and
// either owned / a deck edit (applied to a card in the deck picker, § 11) / a plain purchase (buyShopItem).
function deckBatchSize(doneSoFar) { return Math.max(DECK_BATCH_MINIMUM, DECK_BATCH_FIRST - doneSoFar); }
function shopCatalogue(run) {
  const inflation = inflationIndex(run.day);
  return [...deckItems(run, inflation), ...playItems(run, inflation), ...tradingItems(run, inflation), ...stockItems(run, inflation)];
}
function deckItems(run, inflation) {
  const removeBatch = deckBatchSize(run.removalsDone);
  return [
    { id: 'pack', row: 'deck', icon: '➕', name: 'Add a card', shortText: `pick 1 of ${CARD_OFFER_SIZE}`,
      sentence: `${CARD_OFFER_SIZE} random cards: add one of them to ${run.ticker}'s deck, or none.`,
      price: CARD_PACK_PRICE * Math.pow(CARD_PACK_PRICE_GROWTH, run.packsBought) * inflation },
    { id: 'remove', row: 'deck', icon: '🗑', name: 'Remove a card', shortText: `−${removeBatch} of 1 of ${CARD_OFFER_SIZE}`,
      sentence: `${CARD_OFFER_SIZE} cards drawn at random from ${run.ticker}'s deck: remove ${removeBatch} copies of one. Next time ${deckBatchSize(run.removalsDone + 1)}.`,
      price: REMOVE_PRICE * Math.pow(REMOVE_PRICE_GROWTH, run.removalsDone) * inflation },
  ];
}
function tradingItems(run, inflation) {
  const shopItems = [];
  for (const [positionId, position] of Object.entries(OPTION_POSITIONS))
    shopItems.push({ id: 'unlock:' + positionId, row: 'trading', icon: position.icon, name: position.name, shortText: OPTION_EXPIRY_DAYS + '-day option',
      sentence: `${position.name}: ${position.formula} per option. S = the price when exercised (any time, at the latest after ${OPTION_EXPIRY_DAYS} trading days), K = the strike you choose.`,
      price: position.price * inflation, owned: run.unlocked[positionId] });
  const now = LEVERAGE_TIERS[run.leverageTier], next = LEVERAGE_TIERS[run.leverageTier + 1];
  if (next) shopItems.push({ id: 'leverage', row: 'trading', icon: '⚙', name: `Leverage ${next}×`, shortText: `${now}× → ${next}×`,
    sentence: `Buying power becomes ${next}× your equity. Margin call when you lose half your margin.`,
    price: LEVERAGE_PRICES[run.leverageTier + 1] * inflation });
  else shopItems.push({ id: 'leverage', row: 'trading', icon: '⚙', name: 'Leverage max', shortText: `${now}×`, sentence: 'The highest leverage there is.', price: 0, owned: true });
  return shopItems;
}
function playItems(run, inflation) {
  return [
    { id: 'learn', row: 'plays', icon: '📘', name: 'Learn a play', shortText: `pick 1 of ${CARD_OFFER_SIZE}`,
      sentence: `${CARD_OFFER_SIZE} random plays: add one to your playbook (${run.playbook.length} now), or none.`,
      price: LEARN_PRICE * Math.pow(LEARN_PRICE_GROWTH, run.playsLearned) * inflation },
    { id: 'forget', row: 'plays', icon: '✂️', name: 'Forget a play', shortText: 'pick any',
      sentence: `Take one play out of your playbook: your hand of ${HAND_SIZE} gets the others more often.`,
      price: FORGET_PRICE * Math.pow(FORGET_PRICE_GROWTH, run.playsForgotten) * inflation },
    { id: 'forecast', row: 'plays', icon: '🔮', name: 'Forecast', shortText: '7 days ahead',
      sentence: 'The chart shows the top 10%, the average and the bottom 10% close in 7 trading days, from the cards left.',
      price: FORECAST_PRICE * inflation, owned: run.forecastBought },
  ];
}
function stockItems(run, inflation) {
  return Object.keys(TICKERS).filter(tickerId => TICKERS[tickerId].price > 0).map(tickerId => {
    const ticker = TICKERS[tickerId];
    return { id: 'ticker:' + tickerId, row: 'markets', icon: ticker.icon, name: `${ticker.name}`, shortText: `${ticker.assetClass} · σ ${ticker.openVolatility}`,
      sentence: `${ticker.name}: ${ticker.sentence} Pick it before the open, when you hold nothing.`,
      price: ticker.price * inflation, owned: run.tickersOwned.includes(tickerId) };
  });
}
// Buy a plain item (not a deck edit). Returns true when bought.
function buyShopItem(run, shopItem) {
  if (shopItem.owned || run.cash < shopItem.price) return false;
  const [type, which] = shopItem.id.split(':');
  if (type === 'unlock') run.unlocked[which] = true;
  else if (type === 'leverage') run.leverageTier++;
  else if (type === 'learn') { run.cardOffer = { kind: 'learn', cards: randomPlayOffer(run) }; run.playsLearned++; }
  else if (type === 'forget') { if (run.playbook.length <= HAND_SIZE) return false; run.cardOffer = { kind: 'forget', cards: [...new Set(run.playbook)] }; run.playsForgotten++; }
  else if (type === 'ticker') { run.tickersOwned.push(which); createMarket(run, which); }
  else if (type === 'forecast') run.forecastBought = true;
  else if (type === 'pack') { run.cardOffer = { kind: 'pack', cards: randomCardOffer(run, 'pack') }; run.packsBought++; }
  else if (type === 'remove') {
    const cards = removalOffer(run);
    if (!cards.length) return false;
    run.cardOffer = { kind: 'remove', cards };
  }
  else return false;
  run.cash -= shopItem.price;
  return true;
}

// ── 7.2 Deck changes: card offers. An offer is CARD_OFFER_SIZE card ids; run.cardOffer = { kind: 'pack' | 'remove',
// cards } is open until a card is picked or it is skipped.
// Offers are seeded, so reloading the game never re-rolls them.
function offerRandom(run, salt) { return makeRandom(mixSeed(run.seed, run.day, run.packsBought, run.removalsDone, salt)); }
// Different cards, each picked with the given weights.
function weightedPicks(weights, count, random) {
  const remaining = { ...weights }, picks = [];
  while (picks.length < count) {
    const total = Object.values(remaining).reduce((sum, weight) => sum + weight, 0);
    if (total <= 0) break;
    let roll = random() * total;
    for (const [cardId, weight] of Object.entries(remaining)) {
      roll -= weight;
      if (roll < 0) { picks.push(cardId); delete remaining[cardId]; break; }
    }
  }
  return picks;
}
// Cards to add: any card this market's type can hold, weighted by its rarity.
function randomCardOffer(run, salt) {
  const weights = {}, assetClass = TICKERS[run.ticker].assetClass;
  for (const cardId of CARD_ORDER) {
    const classes = CARD_TYPES[cardId].assetClasses;
    if (!classes || classes.includes(assetClass)) weights[cardId] = CARD_RARITIES[CARD_TYPES[cardId].rarity].weight;
  }
  return weightedPicks(weights, CARD_OFFER_SIZE, offerRandom(run, salt === 'pack' ? 1 : 2));
}
// Cards to remove: drawn from the traded stock's deck, weighted by how many copies it holds.
function removalOffer(run) {
  const deck = run.decks[run.ticker], weights = {};
  for (const cardId of CARD_ORDER) if (deck[cardId] > 0 && deckSize(deck) - removalCount(run, cardId) >= MINIMUM_DECK_SIZE) weights[cardId] = deck[cardId];
  return weightedPicks(weights, CARD_OFFER_SIZE, offerRandom(run, 3));
}
// Plays to learn, weighted by rarity.
function randomPlayOffer(run) {
  const weights = {};
  for (const playId in PLAYS) weights[playId] = CARD_RARITIES[PLAYS[playId].rarity].weight;
  return weightedPicks(weights, CARD_OFFER_SIZE, offerRandom(run, 5 + run.playsLearned));
}
function copiesAdded(cardId) { return CARD_RARITIES[CARD_TYPES[cardId].rarity].copies; }
function removalCount(run, cardId) { return Math.min(run.decks[run.ticker][cardId], deckBatchSize(run.removalsDone)); }
// Taking an offered card. A deck change also changes the draw pile at once: removed cards come out of it where
// they are still in it, added cards are shuffled in.
function addCardToDeck(run, cardId) {
  const copies = copiesAdded(cardId), market = run.markets[run.ticker];
  run.decks[run.ticker][cardId] += copies;
  addToDrawPile(market, cardId, copies, offerRandom(run, 4));

}

}
// Pick one card of the open offer. null skips the offer.
function pickOfferedCard(run, cardId) {

  if (cardId !== null) {
    if (offer.kind === 'remove') removeCardFromDeck(run, cardId);
    else if (offer.kind === 'pack') addCardToDeck(run, cardId);
    else if (offer.kind === 'learn') run.playbook.push(cardId);
    else if (offer.kind === 'forget') run.playbook.splice(run.playbook.indexOf(cardId), 1);

}
// Take up to `copies` of this card out of the draw pile (the first ones found: the pile is shuffled anyway).
function removeFromDrawPile(market, cardId, copies) {

  for (const card of market.drawPile) {
    if (card === cardId && removed < copies) removed++;
