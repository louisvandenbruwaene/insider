  const clock = run.phase === 'preopen' ? '<span class="dim">pre-open</span>' : `${minutes}:${seconds}`;
  const inTrades = equity - run.cash, profitToday = equity - today.startEquity;
  const meetingNumber = nextMeetingNumber(run), meetingDay = meetingNumber * MEETING_EVERY_DAYS, target = meetingTarget(run, meetingNumber);
  const bossRule = BOSS_RULES[bossRuleOn(run, meetingDay)];
  const investigation = run.investigationDaysLeft > 0 ? ` · SEC ${run.investigationDaysLeft}d` : '';
  element('side').innerHTML = `
    <div id="brand">INSIDER</div>
    <div class="sideHead"><b>DAY ${run.day} · ${MARKET_NAME}</b><span class="clock">${clock}</span></div>
    <div class="label"><span>price</span></div><div class="value">${formatPrice(currentPrice(today))}</div>
    <div class="label">cash</div><div class="value">${formatMoney(run.cash)}</div>
    <div class="label"><span>in trades</span><span>${today.trades.length || ''}</span></div>
    <div class="line"><span>${today.trades.length ? formatMoney(inTrades) : '<span class="dim">—</span>'}</span></div>
    <div class="rule"></div>
    <div class="label">equity</div><div class="value ${colourClass(profitToday)}" id="equityValue">${formatMoney(equity)}</div>
    <div class="line ${colourClass(profitToday)}"><span>today</span><span>${formatSignedMoney(profitToday)}</span></div>
    <div class="label" data-tip="SEC heat: ending a day at ${HEAT_LIMIT} starts an investigation (no heat cards, no leverage)"><span>heat</span><span class="heat">${Math.round(run.heat)} / ${HEAT_LIMIT}${investigation}</span></div>
    <div class="heatBar"><i style="width:${clamp(run.heat / HEAT_LIMIT, 0, 1) * 100}%"></i></div>
    <div class="label" data-tip="Equity at the close of that day must reach this, under that day's rule"><span>meeting · day ${meetingDay}</span></div>
    <div class="line"><span class="${equity >= target ? 'up' : 'gold'}">${formatMoney(target)}</span><span class="heat" data-tip="${bossRule.sentence}">${bossRule.face}</span></div>
    <div class="sideButtons">
      <button class="button" data-action="openDeck" data-tip="Your cards and the market deck">🂠 DECK</button>
      <button class="button" data-action="menu" data-tip="Menu">☰</button>
    </div>`;
  if (view.lastEquity !== null && Math.abs(equity - view.lastEquity) > Math.abs(view.lastEquity) * EQUITY_FLASH_CHANGE)
    element('equityValue').classList.add(equity > view.lastEquity ? 'flashUp' : 'flashDown');
  view.lastEquity = equity;
}

// ── 10.3 The table: open trades (value, P&L, leverage, liquidation, CLOSE), then the bench when a trade is being built.
function renderTable() {
  const run = view.run, today = run.today;
  const tiles = today.trades.map((trade, index) => tradeTileHtml(run, trade, index)).join('');
  element('openTrades').innerHTML = tiles || `<span class="tableNote">${marketOpen(run) ? 'click a trade card to start a trade' : ''}</span>`;
  const bench = element('bench');
  bench.classList.toggle('show', benchBusy(today));
  bench.innerHTML = benchBusy(today) ? benchHtml(run) : '';
}
function tradeTileHtml(run, trade, index) {
  const card = PLAYER_CARDS[trade.cardId], profit = tradeProfit(run, trade), leverage = tradeLeverageNow(run, trade);
  const levelLine = trade.kind === 'stock'
    ? (leverage > 1.0001 ? `<span>liq</span><span class="heat">${formatPlain(liquidationPrice(trade))}</span>` : '<span>no liq</span>')
    : `<span>K ${formatPlain(trade.strikePrice)}</span><span>${trade.kind}</span>`;
  const targetable = view.targeting !== null;
  return `<div class="tradeTile ${card.family} ${targetable ? 'target' : ''}" ${targetable ? `data-action="targetTrade" data-argument="${index}"` : ''}
      data-tip="#${trade.number} ${tradeName(trade.cardId)}: money in ${formatMoney(trade.cashIn)}, now ${formatMoney(tradeValue(run, trade))}">
    <div class="tileTop"><span>${tradeName(trade.cardId)}</span><span>×${formatLeverage(leverage)}</span></div>
    <div class="tileValue">${formatMoney(tradeValue(run, trade))}</div>
    <div class="tileLine ${colourClass(profit)}"><span>${formatSignedMoney(profit)}</span></div>
    <div class="tileLine dim">${levelLine}</div>
    ${targetable ? '' : `<button class="tileClose" data-action="closeTrade" data-argument="${index}">CLOSE</button>`}
  </div>`;
}
function leverageChainText(chain) {
  return ['1'].concat(chain.steps.map(step => `${PLAYER_CARDS[step.cardId].face} = ${formatLeverage(step.leverage)}`)).join(' → ');
}
function benchHtml(run) {
  const bench = run.today.bench, preview = benchPreview(run, view.stakePercent / 100);
  const cards = [bench.tradeCard, ...bench.leverageCards].map((cardId, position) =>
    playerCardHtml(cardId, { action: 'returnBenchCard', argument: position, tip: position === 0 ? 'Back to the hand (with the leverage cards)' : 'Back to the hand' }))
    .join('<span class="arrow">→</span>');
  return `<div class="benchCards">${cards}</div>
    <div class="benchReadout">${benchReadoutHtml(run, preview)}
      <input class="slider" type="range" min="0" max="100" step="${SLIDER_STEP_PERCENT}" value="${view.stakePercent}" id="stakeSlider">
      <div class="benchButtons">
        <button class="button primary ${preview.reason ? 'locked' : 'suggest'}" data-action="openBenchTrade" ${preview.reason ? `data-tip="${preview.reason}"` : ''}>OPEN TRADE</button>
        <button class="button" data-action="clearBench" data-tip="All cards back to the hand">✕</button>
      </div></div>`;
}
// The bench's numbers (redrawn on their own while the slider is dragged).
function benchReadoutHtml(run, preview) {
  const chain = preview.chain, capped = chain.steps.length && chain.leverage < chain.steps[chain.steps.length - 1].leverage;
  const optionLine = preview.strikePrice ? `<div>K <b>${formatPlain(preview.strikePrice)}</b> · <b class="gold">${formatPrice(preview.unitPrice)}</b> per option</div>` : '';
  const liquidation = preview.liquidationPrice
    ? `liq <b class="heat">${formatPlain(preview.liquidationPrice)}</b> (${formatPercent(preview.liquidationPrice / currentPrice(run.today) - 1)})`
    : (preview.card.kind === 'stock' ? 'no liquidation' : chain.leverage > 1 ? `liq when the option loses ${formatPercent(-1 / chain.leverage)}` : 'can lose only the stake');
  return `<div id="benchNumbers">
    <div>leverage <b class="gold">${leverageChainText(chain)}</b>${capped ? ` <span class="heat">capped ${formatLeverage(chain.leverage)}</span>` : ''}</div>
    ${optionLine}
    <div>stake <b>${formatMoney(preview.stake)}</b> <span class="dim">(${view.stakePercent}% of cash, fee ${formatMoney(preview.fee)})</span></div>
    <div>position <b>${formatMoney(preview.position)}</b> · ${liquidation}</div></div>`;
}
function refreshBenchReadout() {
  const holder = element('benchNumbers');
  if (!holder) return;
  const preview = benchPreview(view.run, view.stakePercent / 100);
  holder.outerHTML = benchReadoutHtml(view.run, preview);
  const openButton = document.querySelector('[data-action="openBenchTrade"]');
  if (openButton) openButton.classList.toggle('locked', !!preview.reason);
}

// ── 10.4 The hand, and what is left of the day (trades, redraws)
function renderHand() {
  const run = view.run, today = run.today;
  element('handInfo').innerHTML = `
    <div data-tip="Trade cards you can still play today">trades<b>${today.tradesLeft}</b></div>
    <div data-tip="Pick cards, discard them, draw as many">redraws<b>${today.redrawsLeft}</b></div>
    <div data-tip="Cards in your draw pile / discard pile">piles<b style="font-size:13px">${run.drawPile.length} / ${run.discardPile.length}</b></div>`;
  const firstFresh = run.hand.length - view.freshHand;
  element('hand').innerHTML = run.hand.map((cardId, index) => {
    const picked = (view.redrawing && view.redrawing.has(index)) || view.targeting === index;
    const blocked = view.redrawing ? null : cardBlockedReason(run, cardId);
    const classes = [blocked ? 'locked' : '', picked ? 'picked' : '', index >= firstFresh ? 'fresh' : ''].join(' ');
    return playerCardHtml(cardId, { classes, action: 'handCard', argument: index, tip: blocked ? `${PLAYER_CARDS[cardId].sentence} (${blocked})` : undefined });
  }).join('') || '<span class="emptyHand">no cards in hand</span>';
  view.freshHand = 0;
}

// ── 10.5 The buttons. Before the open: REDRAW, OPEN. During the day: REDRAW, CLOSE ALL, speed, skip to the close, pause.
function renderActions() {
  const run = view.run, today = run.today;
  if (view.redrawing) {
    element('actions').innerHTML = `
      <button class="button primary ${view.redrawing.size ? 'suggest' : 'locked'}" data-action="confirmRedraw">REDRAW ${view.redrawing.size}</button>
      <button class="button" data-action="cancelRedraw">CANCEL</button>`;
    return;
  }
  if (view.targeting !== null) {
    element('actions').innerHTML = `<span class="tableNote">click an open trade</span><button class="button" data-action="cancelTargeting">CANCEL</button>`;
    return;
  }
  const redraw = `<button class="button ${today.redrawsLeft > 0 && !benchBusy(today) && marketOpen(run) ? '' : 'locked'}" data-action="startRedraw"
    data-tip="Pick cards, discard them, draw as many (${today.redrawsLeft} left today)">REDRAW</button>`;
  if (run.phase === 'preopen') {
    element('actions').innerHTML = `${redraw}<span class="gap"></span><button class="button primary ${benchBusy(today) ? 'locked' : 'suggest'}" data-action="openMarket">OPEN ▶</button>`;
    return;
  }
  element('actions').innerHTML = `${redraw}
    <button class="button" style="visibility:${today.trades.length ? 'visible' : 'hidden'}" data-action="closeAll">CLOSE ALL</button>
    <span class="gap"></span>
    <button class="button" data-action="speed" data-tip="Speed" style="width:74px">${GAME_SPEEDS[view.speedIndex]}×</button>
    <button class="button ${benchBusy(today) ? 'locked' : ''}" data-action="skipToClose" data-tip="Play the rest of the day instantly">⏭ CLOSE</button>
    <button class="button" data-action="pause" data-tip="Pause" style="width:56px">${view.paused ? '▶' : '⏸'}</button>`;
}

// ── 10.6 The chart's corner: the last market card, then what is in force (σ, pushes waiting, ceiling, floor,
// dividends, the boss rule, an investigation).
function renderCorner() {
  const run = view.run, today = run.today, market = marketNow(today);
  const last = today.tick > 0 ? today.schedule.cards[today.tick] : [];
  const chips = last.map(cardId => {
    const card = MARKET_CARDS[cardId], sign = card.category === 'move' ? (card.move > 0 ? 'pos' : 'neg') : '';
    return `<span class="chip ${card.category} ${sign} ${marketCardImpact(cardId) === 2 ? 'extreme' : ''} ${view.freshTick === today.tick ? 'fresh' : ''}" data-tip="${marketCardSentence(cardId)}">${marketCardText(cardId)}</span>`;
  });
  const badge = (text, tip, colour = '') => `<span class="chip badge ${colour}" data-tip="${tip}">${text}</span>`;
  if (market.volatility !== 1) chips.push(badge('σ ' + market.volatility.toFixed(2), 'Every market card move is × σ', 'blue'));
  const pushesLeft = market.pendingPushes.length;
  if (pushesLeft) {
    const total = Math.exp(market.pendingPushes.reduce((sum, push) => sum + push, 0)) - 1;
    const nextPush = market.pendingPushes[0];
    chips.push(badge(`${nextPush >= 0 ? 'pushing ▲' : 'pushing ▼'} ${pushesLeft}`, `Hype and bash still to come: ${formatPercent(total)} in all over ${pushesLeft} ticks`, 'orange'));
  }
  if (market.ceilingTicksLeft > 0) chips.push(badge(`ceiling ${market.ceilingTicksLeft}`, `The price cannot rise above ${formatPlain(market.ceilingPrice)}`, 'blue'));
  if (market.floorTicksLeft > 0) chips.push(badge(`floor ${market.floorTicksLeft}`, `The price cannot fall below ${formatPlain(market.floorPrice)}`, 'blue'));
  if (today.dividendShare) chips.push(badge(`dividends ${Math.round(today.dividendShare * 100)}%`, 'Paid at the close on long stock and calls (short stock pays)'));
  if (today.bossRule) chips.push(badge(BOSS_RULES[today.bossRule].face, BOSS_RULES[today.bossRule].sentence, 'orange'));
  if (today.investigation) chips.push(badge('SEC investigation', 'No heat cards, no leverage', 'orange'));
  element('corner').innerHTML = chips.join('');
}

function renderAll() {
  if (!view.run || !view.run.today) return;
  renderSide();
  renderTable();
  renderHand();
  renderActions();
  renderCorner();
  const slider = element('stakeSlider');
  if (slider) slider.addEventListener('input', () => { view.stakePercent = Number(slider.value); refreshBenchReadout(); });
}

// ── 11.1 Title, menu, day result, game over
function readRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || { bestEquity: 0, longestRun: 0 }; }
  catch (error) { return { bestEquity: 0, longestRun: 0 }; }
}
function writeRecords(run) {
  const records = readRecords();
  records.bestEquity = Math.max(records.bestEquity, run.peakEquity);
  records.longestRun = Math.max(records.longestRun, run.day);
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (error) { /* storage blocked */ }
}
function showTitle() {
  let saved = null;
  try { saved = localStorage.getItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
  const records = readRecords();
  showOverlay('title', `
    <div class="dialog">
      <div class="title">INSIDER</div>
      <div class="note">the price is a deck of cards · rig it</div>
      ${records.bestEquity ? `<div class="note">best ${formatMoney(records.bestEquity)} · longest ${records.longestRun} days</div>` : ''}
      <div class="menuButtons">
        ${saved ? '<button class="button primary" data-action="continueRun">CONTINUE</button>' : ''}
        <button class="button ${saved ? '' : 'primary'}" data-action="newRun">NEW RUN</button>
      </div>

}
function showMenu() {
  view.paused = true;
  showOverlay('menu', `
    <div class="dialog">
      <h1>Paused</h1>
      <div class="menuButtons">
        <button class="button primary" data-action="resume">RESUME</button>
        <button class="button" data-action="sound">${sound.muted ? 'SOUND OFF' : 'SOUND ON'}</button>
        <button class="button" data-action="toTitle">TITLE</button>
      </div>
    </div>`);
}
function showResult() {
  const run = view.run, result = run.lastResult, meeting = result.meeting;
  const profit = result.endEquity - result.startEquity;
  const notes = [];
  if (result.dividends) notes.push(`<div class="note gold">dividends ${formatSignedMoney(result.dividends)}</div>`);
  if (result.heatAdded > 0) notes.push(`<div class="note heat">🔥 +${Math.round(result.heatAdded)} heat: abnormal day</div>`);
  if (result.investigationNote === 'opened') notes.push(`<div class="note heat">🚨 SEC investigation: ${INVESTIGATION_DAYS} clean days</div>`);
  if (result.investigationNote === 'cleared') notes.push('<div class="note up">Investigation closed</div>');
  if (meeting) notes.push(`<div class="note ${meeting.passed ? 'up' : 'down'}">Meeting ${meeting.number}: ${formatMoney(meeting.target)} ${meeting.passed ? '✓' : '✗'}</div>`);
  if (meeting && meeting.passed && meeting.final) notes.push('<div class="note gold">🏆 Last meeting passed. Play on for bigger numbers.</div>');
  const trades = result.closedTrades.map(closed => `
    <div class="line"><span>${tradeName(closed.cardId)} ×${formatLeverage(closed.leverage)} <span class="dim">${closed.reason === 'liquidated' ? 'liquidated' : ''}</span></span>
    <span class="${colourClass(closed.profit)}">${formatSignedMoney(closed.profit)}</span></div>`).join('');
  showOverlay('result', `
    <div class="dialog">
      <h1>Day ${result.day} · ${MARKET_NAME}</h1>
      <div class="note">${formatPrice(result.openPrice)} → ${formatPrice(result.closePrice)} <span class="${colourClass(result.closePrice - result.openPrice)}">${formatPercent(result.closePrice / result.openPrice - 1)}</span></div>
      <div class="huge ${colourClass(profit)}" id="countUp">${formatSignedMoney(0)}</div>
      <div class="note">equity ${formatMoney(result.endEquity)}</div>
      ${trades ? `<div class="closedTrades">${trades}</div>` : ''}
      ${notes.join('')}
      <div class="menuButtons"><button class="button primary" data-action="afterResult">${run.gameOverReason ? 'CONTINUE' : 'SHOP'}</button></div>
    </div>`);
  countUp(element('countUp'), profit);
}
// Balatro-style count-up of the day's P&L.
function countUp(target, finalValue) {
  const started = performance.now(), seconds = 0.9;
  const step = () => {
    if (!target.isConnected) return;
    const progress = Math.min(1, (performance.now() - started) / 1000 / seconds);
    target.textContent = formatSignedMoney(finalValue * (1 - Math.pow(1 - progress, 3)));
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function showGameOver() {
  const run = view.run;
  writeRecords(run);
  showOverlay('gameover', `
    <div class="dialog">
      <h1>Fund closed</h1>
      <div class="note">${run.gameOverReason === 'meeting' ? 'The investors pulled their money.' : 'No money left to trade.'}</div>
      <div class="huge gold">${run.day} days</div>
      <div class="note">peak ${formatMoney(run.peakEquity)} · meetings ${run.meetingsPassed}</div>
      <div class="menuButtons"><button class="button primary" data-action="newRun">NEW RUN</button></div>
    </div>`);
  try { localStorage.removeItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
}

// ── 11.2 The deck window: your cards (grouped, with how many you own) and the market deck (left in the draw pile /
// in the deck). Opened from the shop it sells cards.
function showDeck() {
  const run = view.run, selling = view.deckSelling;
  const owned = {};
  for (const cardId of run.deck) owned[cardId] = (owned[cardId] || 0) + 1;
  const canSell = selling && run.deck.length > MINIMUM_PLAYER_DECK;
  const yourCards = PLAYER_CARD_ORDER.filter(cardId => owned[cardId]).map(cardId => `
    <div class="ownedCard">
      ${playerCardHtml(cardId, canSell ? { action: 'sellCard', argument: cardId, tip: `Sell one for ${formatMoney(cardSellPrice(run, cardId))}` } : {})}
      <span>×${owned[cardId]}${selling ? ` <span class="sellPrice">${formatMoney(cardSellPrice(run, cardId))}</span>` : ''}</span>
    </div>`).join('');
  const marketLeft = countCards(run.today && run.phase !== 'shop' ? drawPileAfter(run.today.schedule, run.today.tick) : run.market.drawPile);
  const marketCards = MARKET_CARD_ORDER.map(cardId => {
    const card = MARKET_CARDS[cardId], sign = card.category === 'move' ? (card.move > 0 ? 'pos' : 'neg') : '';
    return `<div class="marketCount" data-tip="${marketCardSentence(cardId)}"><span class="chip ${card.category} ${sign}">${marketCardText(cardId)}</span>
      <span>${marketLeft[cardId]}<small> / ${run.market.deck[cardId]}</small></span></div>`;
  }).join('');
  showOverlay('deck', `
    <div class="dialog fullScreen">
      <div class="dialogHead">
        <h1>${selling ? 'Sell a card' : 'Your cards'} · ${run.deck.length}</h1>
        ${selling ? `<span class="slot"><small>cash</small><b>${formatMoney(run.cash)}</b></span>` : ''}
        <span class="slot"><small>draw / hand / discard</small><b>${run.drawPile.length} / ${run.hand.length} / ${run.discardPile.length}</b></span>
        <span class="spacer"></span>
        <button class="button" data-action="${selling ? 'backToShop' : 'closeOverlay'}">${selling ? '← SHOP' : 'CLOSE'}</button>
      </div>
      ${selling && !canSell ? `<div class="note">You keep at least ${MINIMUM_PLAYER_DECK} cards.</div>` : ''}
      <div class="cardGrid">${yourCards}</div>
      <div class="sectionName">the market deck · ${MARKET_NAME} · left in the draw pile / in the deck</div>
      <div class="marketGrid">${marketCards}</div>
    </div>`);
}

// ── 11.3 The shop: four reels, each with one card and its price. SPIN rerolls them all, like a slot machine.
function showShop(spinFrom = null) {
  const run = view.run, shop = run.shop;
  const reels = SHOP_REELS.map((reel, reelIndex) => {
    const cardId = shop.reels[reelIndex], price = cardPrice(run, cardId), sold = shop.sold[reelIndex];
    return `<div class="reel ${sold ? 'sold' : ''}" id="reel${reelIndex}">
      <div class="reelName">${reel.name}</div>
      <div class="reelWindow" data-sentence="${PLAYER_CARDS[cardId].sentence}">
        <div class="reelStrip">${playerCardHtml(cardId, { action: 'buyReel', argument: reelIndex, tip: '' })}</div><div class="reelSold">SOLD</div></div>
      <div class="reelPrice ${!sold && run.cash < price ? 'poor' : ''}">${formatMoney(price)}</div>
      <button class="button ${sold || run.cash < price ? 'locked' : ''}" data-action="buyReel" data-argument="${reelIndex}">${sold ? 'SOLD' : 'BUY'}</button>
    </div>`;
  }).join('');
  const spin = spinPrice(run);
  showOverlay('shop', `
    <div class="dialog">
      <div class="dialogHead">
        <h1>Shop</h1>
        <span class="slot"><small>cash</small><b>${formatMoney(run.cash)}</b></span>
        <span class="slot"><small>your deck</small><b>${run.deck.length}</b></span>
        <span class="spacer"></span>
        <button class="button primary" data-action="nextDay">DAY ${run.day + 1} ▶</button>
      </div>
      <div class="reels">${reels}</div>
      <div class="spinRow">
        <button class="button primary ${run.cash < spin ? 'locked' : ''}" data-action="spin">SPIN · ${formatMoney(spin)}</button>
        <button class="button" data-action="sellCards" data-tip="Sell cards for half their price">SELL A CARD</button>
      </div>
      <div id="selectedSentence"></div>
    </div>`);
  if (spinFrom) animateReels(spinFrom);
}
// The spin: each reel runs past random cards from its pool and stops on its new card, left to right.
function animateReels(previousReels) {
  const run = view.run;
  SHOP_REELS.forEach((reel, reelIndex) => {
    const strip = document.querySelector(`#reel${reelIndex} .reelStrip`), pool = reelPool(reelIndex);
    const passing = Array.from({ length: REEL_SPIN_CARDS }, () => pool[Math.floor(Math.random() * pool.length)]);
    strip.innerHTML = [previousReels[reelIndex], ...passing, run.shop.reels[reelIndex]]
      .map((cardId, position) => playerCardHtml(cardId, position === REEL_SPIN_CARDS + 1 ? { action: 'buyReel', argument: reelIndex, tip: '' } : { tip: '' })).join('');
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;                                   // start from the top before animating
    const seconds = REEL_SPIN_SECONDS + reelIndex * REEL_STOP_STAGGER;
    strip.style.transition = `transform ${seconds}s cubic-bezier(.15,.7,.25,1.06)`;
    strip.style.transform = `translateY(${-(REEL_SPIN_CARDS + 1) * REEL_CARD_STEP}px)`;
    setTimeout(() => { if (strip.isConnected) sounds.reelStop(); }, seconds * 1000);
  });
  for (let click = 0; click < 10; click++) setTimeout(sounds.reelTick, click * 80);
}

// ═══════════════════════════════════════ § 12 INPUT ═══════════════════════════════════════
// The game is played with the mouse only: every clickable element names its action in data-action.
function saveRun() {
  try { if (view.run) localStorage.setItem(SAVE_KEY, serialiseRun(view.run)); } catch (error) { /* storage blocked */ }
}
function savePreferences() {
  try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify({ muted: sound.muted, speedIndex: view.speedIndex })); } catch (error) { /* storage blocked */ }
}
function showPlayResult(line, playedSound = sounds.card) {
  if (line && line.error) { sounds.denied(); addPopup(line.error, CHART_COLOURS.label, 14); }
  else { playedSound(); addPopup(line, CHART_COLOURS.accent, 17); }
  saveRun();
}
function defaultStakePercent(run) {
  return clamp(Math.floor(100 / Math.max(1, run.today.tradesLeft) / SLIDER_STEP_PERCENT) * SLIDER_STEP_PERCENT, SLIDER_STEP_PERCENT, 100);
}
// A click on a card in the hand: pick it for a redraw, put it on the bench, aim it at a trade, or play it.
function clickHandCard(handIndex) {
  const run = view.run, cardId = run.hand[handIndex];
  if (!cardId) return;
  if (view.redrawing) { view.redrawing.has(handIndex) ? view.redrawing.delete(handIndex) : view.redrawing.add(handIndex); return; }
  if (view.targeting === handIndex) { view.targeting = null; return; }
  const blocked = cardBlockedReason(run, cardId), card = PLAYER_CARDS[cardId];
  if (blocked) { sounds.denied(); addPopup(blocked, CHART_COLOURS.label, 14); return; }
  if (isTradeCard(cardId)) {
    run.hand.splice(handIndex, 1);
    run.today.bench.tradeCard = cardId;
    view.stakePercent = defaultStakePercent(run);
    sounds.card();
  } else if (card.family === 'leverage') {
    run.hand.splice(handIndex, 1);
    run.today.bench.leverageCards.push(cardId);
    sounds.card();
  } else if (card.target === 'trade') {
    view.targeting = handIndex;
  } else {
    showPlayResult(playMarketCard(run, handIndex), HEAT_EFFECTS.includes(card.effect) ? sounds.manipulation : sounds.card);
    if (card.family === 'manip') shakeChart(card.tier >= 3 ? 2 : 1);
  }
  saveRun();
}

const ACTIONS = {
  newRun() { view.run = newRun(); resetViewForDay(); hideOverlay(); saveRun(); },
  continueRun() {
    let run = null;
    try { run = loadRun(localStorage.getItem(SAVE_KEY)); } catch (error) { run = null; }
    if (!run) { ACTIONS.newRun(); return; }
    view.run = run; resetViewForDay(); hideOverlay();
    if (run.phase === 'trading') showMenu();
    else if (run.phase === 'result') showResult();
    else if (run.phase === 'shop') showShop();
  },
  toTitle() { saveRun(); view.paused = false; showTitle(); },
  resume() { view.paused = false; hideOverlay(); },
  menu() { if (view.overlay === 'menu') ACTIONS.resume(); else if (!view.overlay && view.run) showMenu(); },
  closeOverlay() { hideOverlay(); },
  speed() { view.speedIndex = (view.speedIndex + 1) % GAME_SPEEDS.length; savePreferences(); },
  sound() { sound.muted = !sound.muted; savePreferences(); if (view.overlay === 'menu') showMenu(); },
  pause() { if (view.run.phase === 'trading') view.paused = !view.paused; },
  openDeck() { if (!view.overlay) { view.deckSelling = false; showDeck(); } },
  handCard(handIndex) { clickHandCard(handIndex); },
  returnBenchCard(position) { returnBenchCard(view.run, position); sounds.card(); saveRun(); },
  clearBench() { clearBench(view.run); saveRun(); },
  openBenchTrade() {
    const trade = openBenchTrade(view.run, view.stakePercent / 100);
    if (typeof trade === 'string') { sounds.denied(); addPopup(trade, CHART_COLOURS.label, 14); return; }
    sounds.trade();
    addPopup(`#${trade.number} ${tradeName(trade.cardId)} ×${formatLeverage(trade.leverageAtOpen)}`, CHART_COLOURS.accent, 17);
    saveRun();
  },
  closeTrade(tradeIndex) {
    const closed = closeTrade(view.run, tradeIndex);
    if (!closed) return;
    sounds.cash(closed.profit >= 0);
    addPopup(formatSignedMoney(closed.profit), closed.profit >= 0 ? CHART_COLOURS.up : CHART_COLOURS.down, 22);
    saveRun();
  },
  closeAll() { if (marketOpen(view.run)) { closeAllTrades(view.run); sounds.trade(); saveRun(); } },
  targetTrade(tradeIndex) {
    const handIndex = view.targeting;
    view.targeting = null;
    showPlayResult(playTradeCard(view.run, handIndex, tradeIndex), sounds.trade);
  },
  cancelTargeting() { view.targeting = null; },
  startRedraw() { const today = view.run.today; if (today.redrawsLeft > 0 && !benchBusy(today) && marketOpen(view.run)) { view.targeting = null; view.redrawing = new Set(); } },
  cancelRedraw() { view.redrawing = null; },
  confirmRedraw() {
    const picked = [...view.redrawing];
    view.redrawing = null;
    if (redrawCards(view.run, picked)) { view.freshHand = picked.length; sounds.card(); saveRun(); }
  },
  openMarket() {
    if (view.run.phase !== 'preopen' || benchBusy(view.run.today)) return;
    openTheMarket(view.run);
    view.paused = false;
    saveRun();
  },
  skipToClose() { if (!benchBusy(view.run.today)) { view.targeting = null; view.redrawing = null; while (view.run.phase === 'trading') runOneTick(true); } },
  afterResult() {
    if (view.run.gameOverReason) { showGameOver(); return; }
    openShop(view.run);
    saveRun();
    showShop();
  },
  nextDay() { startNextDay(view.run); resetViewForDay(); hideOverlay(); saveRun(); },
  buyReel(reelIndex) {
    if (!buyReelCard(view.run, reelIndex)) { sounds.denied(); return; }
    sounds.buy(); saveRun(); showShop();
  },
  spin() {
    const previous = view.run.shop.reels.slice();
    if (!spinReels(view.run)) { sounds.denied(); return; }
    saveRun(); showShop(previous);
  },
  sellCards() { view.deckSelling = true; showDeck(); },
  sellCard(cardId) {
    if (!sellCard(view.run, cardId)) { sounds.denied(); return; }
    sounds.buy(); saveRun(); view.deckSelling = true; showDeck();
  },
  backToShop() { view.deckSelling = false; showShop(); },
};
const NUMBER_ARGUMENT_ACTIONS = ['handCard', 'returnBenchCard', 'closeTrade', 'targetTrade', 'buyReel'];
function resetViewForDay() { view.lastEquity = null; view.targeting = null; view.redrawing = null; view.freshHand = view.run.hand.length; }

// Actions fire on the press, not the release: the table and the hand are redrawn every tick, and a redraw between
// press and release would swallow a click.
function handlePress(event) {
  if (event.button !== 0) return;
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.classList.contains('locked') && target.dataset.action !== 'handCard') { sounds.denied(); return; }
  const action = ACTIONS[target.dataset.action];
  if (!action) return;
  const argument = target.dataset.argument;
  action(NUMBER_ARGUMENT_ACTIONS.includes(target.dataset.action) ? Number(argument) : argument);
  if (!view.overlay || view.overlay === 'menu') renderAll();
}
// Instant tooltips for anything with data-tip; in the shop the line under the reels explains the card under the mouse.
function handleMouseMove(event) {
  const sentenceHolder = event.target.closest('[data-sentence]');
  if (sentenceHolder && element('selectedSentence')) element('selectedSentence').textContent = sentenceHolder.dataset.sentence;
  const tooltip = element('tooltip'), target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) { tooltip.style.display = 'none'; return; }
  tooltip.textContent = target.dataset.tip;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, event.clientX + 14) + 'px';
  tooltip.style.top = Math.min(window.innerHeight - tooltip.offsetHeight - 8, event.clientY + 16) + 'px';
}

// ═══════════════════════════════════════ § 13 START ═══════════════════════════════════════
// One tick of the live day, with its sound, shake and popup. quiet = skipping to the close.
function runOneTick(quiet) {
  const run = view.run, equityBefore = totalEquity(run);
  const outcome = advanceTick(run);
  view.freshTick = run.today.tick;
  if (!quiet) {
    const impact = Math.max(0, ...outcome.cards.map(marketCardImpact));
    const priceNow = currentPrice(run.today), priceBefore = run.today.schedule.states[run.today.tick - 1].price;
    if (impact > 0) { shakeChart(impact); sounds.bigCard(priceNow >= priceBefore); }
    else sounds.tick(priceNow - priceBefore);
    const change = totalEquity(run) - equityBefore;
    if (Math.abs(change) > Math.max(1, Math.abs(equityBefore) * POPUP_CHANGE))
      addPopup(formatSignedMoney(change), change > 0 ? CHART_COLOURS.up : CHART_COLOURS.down, impact === 2 ? 26 : 18);
  }
  if (outcome.liquidated) { sounds.bad(); addPopup(outcome.liquidated > 1 ? `${outcome.liquidated} trades liquidated` : 'Liquidated!', CHART_COLOURS.liquidation, 22); }
  if (outcome.closed) {
    const result = closeDay(run);
    saveRun();
    sounds.cash(result.endEquity >= result.startEquity);
    renderAll();
    showResult();
  }
}
// The clock stops while a window is open, the game is paused, or you are building a trade, aiming or redrawing.
function clockRuns(run) {
  return run && run.phase === 'trading' && !view.paused && !view.overlay && !benchBusy(run.today) && view.targeting === null && !view.redrawing;
}
let lastFrameTime = null;
function frame(time) {
  const seconds = lastFrameTime === null ? 0 : Math.min(0.25, (time - lastFrameTime) / 1000);
  lastFrameTime = time;
  const run = view.run;
  if (clockRuns(run)) {
    const today = run.today;
    today.tickClock += seconds * GAME_SPEEDS[view.speedIndex];
    if (today.tickClock >= SECONDS_PER_TICK) {
      today.tickClock -= SECONDS_PER_TICK;
      runOneTick(false);
      if (run.phase === 'trading') { saveRun(); renderAll(); }
    }
  }
  element('pauseNote').style.display = view.paused && run && run.phase === 'trading' && !view.overlay ? 'grid' : 'none';
  drawChart();
  requestAnimationFrame(frame);
}
function start() {
  document.documentElement.style.setProperty('--cardWidth', CARD_WIDTH + 'px');
  document.documentElement.style.setProperty('--cardHeight', CARD_HEIGHT + 'px');
  try {
    const preferences = JSON.parse(localStorage.getItem(PREFERENCES_KEY)) || {};
    sound.muted = !!preferences.muted;
    view.speedIndex = preferences.speedIndex || 0;
  } catch (error) { /* defaults */ }
  if (new URLSearchParams(location.search).has('mute')) sound.muted = true;
  try { const saved = localStorage.getItem(SAVE_KEY); view.run = saved ? loadRun(saved) : null; } catch (error) { view.run = null; }
  if (!view.run) view.run = newRun();
  resetViewForDay();
  showTitle();
  renderAll();
  document.addEventListener('pointerdown', handlePress);
  document.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('resize', renderAll);
  requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') start();
</script>
</body></html>
