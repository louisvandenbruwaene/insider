<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#151920;--panel2:#1d232c;--line:#2c3440;--ink:#edf1f5;--dim:#8592a3;--faint:#4a5563;
  --up:#3ddc84;--down:#ff5a5f;--vol:#6cb6ff;--heat:#ff8a3d;--accent:#ffc94d;
  --long:#3ddc84;--short:#ff5a5f;--leverage:#ffc94d;--special:#6cb6ff;--manip:#ff8a3d;
  --cardWidth:104px;--cardHeight:146px;
  --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px var(--sans);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .heat{color:var(--heat)} .gold{color:var(--accent)}

#app{position:fixed;inset:0;display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px}

/* the side menu */
#side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;min-height:0;overflow:hidden}
#brand{font:800 14px var(--mono);letter-spacing:.3em;color:var(--accent)}
.sideHead{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.sideHead b{font-size:15px}
.clock{font:800 24px var(--mono)}
.label{font:700 10px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between}
.value{font-size:22px;font-weight:800;margin-top:2px}
.line{font-size:13px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.rule{border-top:1px solid var(--line);margin-top:14px}
.heatBar{height:6px;border-radius:3px;background:#2a2016;overflow:hidden;margin-top:6px}
.heatBar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff5a3d)}
.sideButtons{margin-top:auto;display:flex;gap:8px;padding-top:14px}
.sideButtons .button{flex:1}
.flashUp{animation:flashUp .45s} .flashDown{animation:flashDown .45s}
@keyframes flashUp{0%{color:var(--up);transform:scale(1.06)}}
@keyframes flashDown{0%{color:var(--down);transform:scale(1.06)}}

/* the main column: chart, the table (open trades and the bench), the hand, the buttons */
#mainColumn{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;min-height:0}
#chartBox{position:relative;width:100%;max-width:1060px;flex:1;min-height:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#chart{width:100%;height:100%;display:block}
#corner{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#corner .chip{pointer-events:auto}
#pauseNote{position:absolute;inset:0;display:none;place-items:center;font:800 32px var(--mono);letter-spacing:.3em;color:var(--accent);background:rgba(0,0,0,.45);pointer-events:none}
.shake{animation:shake .35s} .shakeBig{animation:shakeBig .6s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shakeBig{10%{transform:translate(-12px,5px)}25%{transform:translate(11px,-6px)}40%{transform:translate(-9px,4px)}55%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}

#table{display:flex;gap:16px;align-items:center;width:100%;max-width:1060px;height:calc(var(--cardHeight) + 12px);flex:none}
#openTrades{flex:1;display:flex;gap:10px;align-items:center;min-width:0;overflow:hidden;height:100%}
.tableNote{color:var(--faint);font:600 12px var(--mono)}
.tradeTile{--c:var(--ink);width:150px;height:118px;flex:none;border-radius:12px;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);padding:8px 10px;display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;position:relative}
.tradeTile.long{--c:var(--long)} .tradeTile.short{--c:var(--short)}
.tradeTile .tileTop{display:flex;justify-content:space-between;font:800 11px var(--mono);color:var(--c)}
.tradeTile .tileValue{font:800 18px var(--mono);margin-top:4px}
.tradeTile .tileLine{font-size:11px;display:flex;justify-content:space-between}
.tradeTile .tileClose{margin-top:auto;font:800 10px var(--mono);letter-spacing:.1em;padding:4px 0;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.tradeTile .tileClose:hover{border-color:var(--accent)}
.tradeTile.target{cursor:pointer;animation:glow 1s ease-in-out infinite}
#bench{display:none;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;height:100%}
#bench.show{display:flex}
.benchCards{display:flex;align-items:center;gap:4px}
.benchCards .arrow{font:800 14px var(--mono);color:var(--dim)}
.benchCards .playerCard{width:calc(var(--cardWidth) * .8);height:calc(var(--cardHeight) * .8);padding:5px 4px}
.benchCards .playerCard .glyph svg{width:40px;height:40px} .benchCards .playerCard .big{font-size:24px}
.benchReadout{font:500 12px var(--mono);line-height:1.65;width:270px;font-variant-numeric:tabular-nums}
.benchReadout b{font-weight:800}
.benchReadout .slider{width:100%;accent-color:var(--accent);margin:2px 0;height:18px}
.benchButtons{display:flex;gap:8px;margin-top:2px}
.benchButtons .button{padding:8px 14px}
.benchButtons .primary{flex:1}

#handRow{display:flex;gap:14px;align-items:flex-end;width:100%;max-width:1060px;height:calc(var(--cardHeight) + 16px);flex:none}
#handInfo{width:84px;flex:none;align-self:center;display:flex;flex-direction:column;gap:10px;font:700 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;text-align:center}
#handInfo b{display:block;font:800 18px var(--mono);color:var(--accent);letter-spacing:0}
#hand{flex:1;display:flex;gap:8px;align-items:flex-end;justify-content:center;min-width:0}
#actions{display:flex;gap:10px;align-items:center;justify-content:center;height:52px;width:100%;max-width:1060px;flex:none}
#actions .gap{width:18px}
.emptyHand{align-self:center;color:var(--faint);font:600 12px var(--mono)}

/* a player card */
.playerCard{--c:var(--ink);position:relative;width:var(--cardWidth);height:var(--cardHeight);border-radius:11px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--panel2)),var(--panel) 70%);
  border:2px solid color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 5px 0 #050608,0 8px 16px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;padding:7px 6px;overflow:hidden;cursor:pointer;transition:transform .1s}
.playerCard.long{--c:var(--long)} .playerCard.short{--c:var(--short)} .playerCard.leverage{--c:var(--leverage)}
.playerCard.special{--c:var(--special)} .playerCard.manip{--c:var(--manip)}
.playerCard .family{font:800 8px var(--mono);letter-spacing:.18em;color:var(--c);align-self:flex-start}
.playerCard .tier{position:absolute;top:7px;right:8px;font:800 9px var(--mono);color:var(--c)}
.playerCard .glyph{flex:1;display:grid;place-items:center;width:100%}
.playerCard .glyph svg{width:52px;height:52px;color:var(--c);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent))}
.playerCard .big{font:800 31px var(--mono);color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent);line-height:1;text-align:center}
.playerCard .big small{display:block;font-size:12px;opacity:.8;margin-bottom:2px}
.playerCard .name{font:800 12px var(--mono);letter-spacing:.04em}
.playerCard .detail{font:500 9.5px var(--mono);color:var(--dim);margin-top:2px;min-height:12px;white-space:nowrap}
.playerCard .heatTag{position:absolute;top:18px;right:7px;font:700 9px var(--mono);color:var(--heat)}
#hand .playerCard:hover{transform:translateY(-8px)}
.playerCard.locked{opacity:.38;cursor:default} #hand .playerCard.locked:hover{transform:none}
.playerCard.picked{transform:translateY(-14px);box-shadow:0 0 0 3px var(--accent),0 8px 16px rgba(0,0,0,.4)}
.playerCard.fresh{animation:dealt .35s}
@keyframes dealt{0%{transform:translateY(40px) scale(.8);opacity:0}}

.button{font:800 13px var(--sans);letter-spacing:.06em;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel2);padding:12px 18px;cursor:pointer;white-space:nowrap}
.button:hover{filter:brightness(1.2)} .button:active{transform:translateY(2px);border-bottom-width:1px}
.button.primary{background:#3b3014;border-color:#8a6d22;color:#ffe08a;padding:14px 30px;font-size:15px}
.button.locked{opacity:.35;cursor:default;filter:none}
.button.suggest{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,201,77,.3),0 0 24px rgba(255,201,77,.35)}}

/* market card chips (the chart's corner, the deck window) */
.chip{flex:none;height:28px;min-width:44px;padding:0 8px;border-radius:7px;display:inline-grid;place-items:center;font:700 12px var(--mono);border:1px solid;background:var(--panel2)}
.chip.move.pos{color:var(--up);border-color:#1f6b43} .chip.move.neg{color:var(--down);border-color:#7a2b2e}
.chip.vol{color:var(--vol);border-color:#2a4f78}
.chip.badge{color:var(--accent);border-color:#8a6d22;background:#2a2514}
.chip.badge.blue{color:var(--vol);border-color:#2a4f78;background:#14202e}
.chip.badge.orange{color:var(--heat);border-color:#7a4a22;background:#2a1d12}
.chip.extreme{box-shadow:0 0 0 2px currentColor inset}
.chip.fresh{animation:pop .3s}
@keyframes pop{0%{transform:translateY(-10px) scale(1.35)}}

/* overlays */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 30px;box-shadow:0 10px 0 #050608;text-align:center;max-width:100%;max-height:100%;overflow:auto}
.dialog h1{margin:0 0 6px;font:800 26px var(--sans)}
.dialog .title{font:800 54px var(--mono);letter-spacing:.3em;color:var(--accent);margin:8px 0 2px}
.dialog .huge{font:800 56px var(--mono);margin:6px 0;font-variant-numeric:tabular-nums}
.dialog .note{color:var(--dim);margin:5px 0;font-family:var(--mono)}
.menuButtons{display:flex;gap:12px;justify-content:center;margin-top:18px}
.closedTrades{margin:12px auto 0;font:500 13px var(--mono);font-variant-numeric:tabular-nums;width:340px;text-align:left}
.closedTrades .line{height:22px}
.dialog.fullScreen{width:calc(100vw - 48px);height:calc(100vh - 48px);display:flex;flex-direction:column;text-align:left}
.dialogHead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.dialogHead h1{margin:0}
.spacer{flex:1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;font-family:var(--mono)}
.slot small{font:600 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.sectionName{font:700 11px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:16px 0 8px}
.cardGrid{display:flex;flex-wrap:wrap;gap:12px}
.ownedCard{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--mono)}
.ownedCard .sellPrice{color:var(--accent)}
.marketGrid{display:flex;flex-wrap:wrap;gap:10px}
.marketCount{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 13px var(--mono)}
.marketCount small{color:var(--faint)}

/* the shop: four reels */
.reels{display:flex;gap:18px;justify-content:center;margin-top:12px}
.reel{display:flex;flex-direction:column;align-items:center;gap:8px}
.reelName{font:800 10px var(--mono);letter-spacing:.2em;color:var(--dim)}
.reelWindow{width:calc(var(--cardWidth) + 20px);height:calc(var(--cardHeight) + 16px);border-radius:14px;background:#090b0e;border:1px solid var(--line);overflow:hidden;position:relative;
  box-shadow:inset 0 12px 16px -8px #000,inset 0 -12px 16px -8px #000}
.reelStrip{position:absolute;left:10px;top:0;display:flex;flex-direction:column}
.reelStrip .playerCard{margin:8px 0}
.reelSold{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);font:800 16px var(--mono);letter-spacing:.2em;color:var(--dim)}
.reel.sold .reelSold{display:grid}
.reelPrice{font:800 14px var(--mono);color:var(--accent)} .reelPrice.poor{color:var(--down)}
.spinRow{display:flex;gap:12px;justify-content:center;margin-top:18px}
#selectedSentence{height:22px;margin-top:14px;color:var(--ink);font-size:15px;text-align:center}
#tooltip{position:fixed;z-index:20;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:600 12px var(--sans);display:none;max-width:280px}
</style></head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="mainColumn">
    <div id="chartBox"><canvas id="chart"></canvas><div id="corner"></div><div id="pauseNote">PAUSED</div></div>
    <div id="table"><div id="openTrades"></div><div id="bench"></div></div>
    <div id="handRow"><div id="handInfo"></div><div id="hand"></div></div>
    <div id="actions"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="tooltip"></div>
<script id="game">
"use strict";
/* INSIDER — a trading roguelike deckbuilder. The stock's price is a deck of cards: every quarter second one card is
   drawn and moves it. You hold a second deck: your own cards. A trade is a trade card (long or short stock, a call or
   a put) with leverage cards stacked on it in order (+n, ×n, (L + 1)^n). Special cards double or top up an open trade,
   pay dividends or pin the price under a ceiling or above a floor; manipulation cards hype, bash, shake or calm the
   market. The market maker prices options fairly from the market deck, but only learns of a manipulation once it is
   played: the order you play your cards in is the edge. Every trade is closed at the close. The shop is four slot
   machine reels. Prices inflate 1% a day, every 10 days the investors want a target, and the run ends when there is
   no money left to trade.

   File guide (search "§ 1" etc.):
   § 1 SETTINGS        every tunable number, the market deck, your cards, the shop
   § 2 HELPERS         number formatting, seeded random numbers, shuffling
   § 3 MARKET          one tick of the market, the day's schedule, the market maker
   § 4 YOUR DECK       drawing, redrawing, the leverage chain
   § 5 TRADES          opening, value, liquidation, closing, double, top-up, dividends
   § 6 MARKET CARDS    manipulation, ceiling and floor, heat and the SEC
   § 7 RUN             days, the close, meetings, the shop reels, saving
   § 8 SOUND           small synthesised effects
   § 9 CHART           last week, today, your liquidation prices and strikes, ceilings and floors
   § 10 PANELS         the side menu, open trades, the bench, the hand, the buttons, the chart's corner
   § 11 OVERLAYS       title, menu, day result, game over, deck window, shop
   § 12 INPUT          actions, mouse, tooltips (the game is mouse only)
   § 13 START          main loop and start-up (only in a browser; tools/ load §1-§7 headless) */

// ═══════════════════════════════════════ § 1 SETTINGS ═══════════════════════════════════════
const SAVE_KEY = 'insider.save.v1';             // the running game (written every tick, so quitting mid-day resumes there)
const SAVE_VERSION = 8;                         // saves from other versions are not resumed
const RECORDS_KEY = 'insider.records.v1';       // best equity and longest run, kept across runs
const PREFERENCES_KEY = 'insider.preferences.v1'; // sound and speed

// 1.1 The run
const STARTING_CASH = 1000;
const INFLATION_PER_DAY = 0.01;                 // shop prices grow ×(1.01)^(day−1); the stock gains 1% overnight
const BASE_OPEN_PRICE = 100;                    // the stock opens day 1 at this price (after a week of history)
const MINIMUM_CASH_TO_TRADE = 10;               // × inflation: below this after the close the run is over

// 1.2 The trading day
const TICKS_PER_DAY = 90;                       // one market card per tick
const SECONDS_PER_TICK = 0.25;                  // at 1× speed: a day lasts about 22 seconds
const GAME_SPEEDS = [1, 2, 4];
const HISTORY_DAYS = 5;                         // the chart shows the previous days

// 1.3 The market deck. Move cards move the price by move × σ (σ = volatility, 1 at every open); vol cards multiply σ.
const MARKET_NAME = 'NOVA';
const MARKET_CARDS = {
  up:      { category: 'move', move: +0.01 },
  down:    { category: 'move', move: -0.01 },
  UP:      { category: 'move', move: +0.05 },
  DOWN:    { category: 'move', move: -0.05 },
  bull:    { category: 'move', move: +0.10 },
  bear:    { category: 'move', move: -0.10 },
  BULL:    { category: 'move', move: +0.50 },
  BEAR:    { category: 'move', move: -0.50 },
  volup:   { category: 'vol', factor: 1.01 },
  voldown: { category: 'vol', factor: 0.99 },
  volUP:   { category: 'vol', factor: 1.05 },
  volDOWN: { category: 'vol', factor: 0.95 },
  volbull: { category: 'vol', factor: 1.10 },
  volbear: { category: 'vol', factor: 0.90 },
  volBULL: { category: 'vol', factor: 1.50 },
  volBEAR: { category: 'vol', factor: 0.50 },
};
const MARKET_CARD_ORDER = Object.keys(MARKET_CARDS);
const MARKET_DECK = { up: 100, down: 100, UP: 100, DOWN: 100, bull: 10, bear: 10, BULL: 1, BEAR: 1,
  volup: 100, voldown: 100, volUP: 100, volDOWN: 100, volbull: 10, volbear: 10, volBULL: 1, volBEAR: 1 };
const PRICE_MOVE_FLOOR = -0.9;                  // no single move takes more than 90% off the price
const VOLATILITY_MINIMUM = 0.1, VOLATILITY_MAXIMUM = 8;
const BIG_CARD_MOVE = 0.10;                     // moves this big (and vol factors this far from 1) shake the chart

// 1.4 Trading
const TRADE_FEE = 0.01;                         // the only cost: every trade costs 1% of its stake when it opens
const SMALLEST_STAKE = 1;                       // no trade with less money in it
const MINIMUM_OPTION_PRICE = 0.0005;            // the market maker sells no option for less than this share of S
const MAXIMUM_LEVERAGE = 1e9;
const SLIDER_STEP_PERCENT = 5;                  // the stake slider (share of cash) moves in these steps
const FORECAST_PATHS = 800;                     // the market maker plays out the rest of the day this many times, every tick

// 1.5 Your cards. family: long / short (trade cards), leverage, special, manip(ulation). tier 1-3 = rarity and price.
//   Trades:    stock (P&L per share = S − entry, or entry − S short); options expire at today's close, K = strikeShare × S
//   Leverage:  applied left to right to L (starting at 1): add L + n, multiply L × n, power (L + 1)^n
//   Special:   double / topUp act on an open trade; dividends pay at the close; ceiling / floor pin the price for some ticks
//   Manip:     hype / bash push the price, then back; turmoil / calm multiply σ until the close
const PLAYER_CARDS = {};
function defineCard(cardId, card) { PLAYER_CARDS[cardId] = card; }
const STRIKES = [[1, 'S', 1], [0.75, '3S/4', 1], [0.5, 'S/2', 2], [0.25, 'S/4', 3]];   // [K ÷ S, label, tier]
defineCard('longStock',  { family: 'long',  kind: 'stock', side: +1, tier: 1, name: 'STOCK', detail: 'S − entry', sentence: 'Long the stock: profit = shares × (S − entry price).' });
defineCard('shortStock', { family: 'short', kind: 'stock', side: -1, tier: 1, name: 'STOCK', detail: 'entry − S', sentence: 'Short the stock: profit = shares × (entry price − S).' });
for (const [share, label, tier] of STRIKES)
  defineCard('call' + share * 100, { family: 'long', kind: 'call', side: +1, strikeShare: share, tier, name: 'CALL', detail: 'K = ' + label,
    sentence: `A call that expires at the close, K = ${label} (S = the price now): pay the premium, get max(S − K, 0).` });
for (const [share, label, tier] of STRIKES)
  defineCard('put' + share * 100, { family: 'short', kind: 'put', side: +1, strikeShare: share, tier, name: 'PUT', detail: 'K = ' + label,
    sentence: `A put that expires at the close, K = ${label} (S = the price now): pay the premium, get max(K − S, 0).` });
for (const [amount, tier] of [[1, 1], [4, 2], [9, 3]])
  defineCard('add' + amount, { family: 'leverage', operation: 'add', amount, tier, name: 'ADD', face: '+' + amount, detail: 'L + ' + amount, sentence: `Leverage L becomes L + ${amount}.` });
for (const [amount, tier] of [[2, 1], [5, 2], [10, 3]])
  defineCard('times' + amount, { family: 'leverage', operation: 'times', amount, tier, name: 'MULTIPLY', face: '×' + amount, detail: 'L × ' + amount, sentence: `Leverage L becomes L × ${amount}.` });
for (const [amount, tier] of [[2, 2], [5, 3], [10, 3]])
  defineCard('power' + amount, { family: 'leverage', operation: 'power', amount, tier, name: 'POWER', face: '^' + amount, smallFace: '+1 &', detail: `(L + 1)^${amount}`, sentence: `Leverage L becomes (L + 1)^${amount}.` });
defineCard('double', { family: 'special', effect: 'double', target: 'trade', tier: 2, name: 'DOUBLE', face: '2×', detail: 'open trade ×2',
  sentence: 'Play on an open trade: its position doubles with the same money in it, so its liquidation price comes twice as close.' });
for (const [share, tier] of [[0.5, 1], [1, 2], [2, 3]])
  defineCard('topUp' + tier, { family: 'special', effect: 'topUp', target: 'trade', share, tier, name: 'TOP-UP', glyph: 'topUp', detail: `+${share * 100}% margin`,
    sentence: `Play on an open trade: put ${share * 100}% of its stake in again, from cash, so its liquidation price moves away.` });
for (const [share, tier] of [[0.01, 1], [0.03, 2], [0.08, 3]])
  defineCard('dividends' + tier, { family: 'special', effect: 'dividends', share, tier, name: 'DIVIDENDS', glyph: 'dividend', detail: `${Math.round(share * 100)}% at the close`,

// ═══════════════════════════════════════ § 2 HELPERS ═══════════════════════════════════════
// Money and big numbers: plain below 10 000, then K/M/B/T, then scientific notation.
function formatMoney(value) {
  if (Math.abs(value) < 0.005) value = 0;                  // no "−$0.00"
  const sign = value < 0 ? '−' : '';
  const size = Math.abs(value);
  if (size < 100) return sign + '$' + size.toFixed(2);
  if (size < 1e4) return sign + '$' + Math.round(size).toLocaleString('en-US');
  const units = [[1e15, 'Q'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  if (size >= 1e18) return sign + '$' + size.toExponential(2).replace('e+', 'e');
  for (const [unit, letter] of units) if (size >= unit) return sign + '$' + (size / unit).toFixed(size / unit < 100 ? 2 : 1) + letter;
  return sign + '$' + size.toFixed(0);
}
function formatPrice(price) { return price < 1e4 ? '$' + price.toFixed(2) : formatMoney(price); }
function formatSignedMoney(value) { return (value >= 0 ? '+' : '') + formatMoney(value); }
function formatPercent(fraction, digits = 1) { return (fraction >= 0 ? '+' : '−') + Math.abs(fraction * 100).toFixed(digits) + '%'; }
function formatLeverage(leverage) {
  if (leverage < 100) return String(Math.round(leverage * 100) / 100);
  if (leverage < 1e6) return Math.round(leverage).toLocaleString('en-US');
  return leverage.toExponential(1).replace('e+', 'e');
}

// Seeded random numbers: the same seed gives the same numbers, so a shuffle is the same after a reload.
// makeRandom is a standard small generator (mulberry32) and mixSeed a standard hash (FNV-1a).
function makeRandom(seed) {
  let counter = seed >>> 0;
  return function random() {                                // a number from 0 up to (not including) 1
    counter = (counter + 0x6D2B79F5) >>> 0;
    let scrambled = Math.imul(counter ^ (counter >>> 15), 1 | counter);
    scrambled = (scrambled + Math.imul(scrambled ^ (scrambled >>> 7), 61 | scrambled)) ^ scrambled;
    return ((scrambled ^ (scrambled >>> 14)) >>> 0) / 4294967296;
  };
}
function mixSeed(...numbers) {
  let hash = 2166136261;
  for (const number of numbers) { hash ^= number >>> 0; hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
}
function shuffleInPlace(list, random) {
  for (let index = list.length - 1; index > 0; index--) {
    const other = Math.floor(random() * (index + 1));
    [list[index], list[other]] = [list[other], list[index]];
  }
  return list;
}
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function inflationIndex(day) { return Math.pow(1 + INFLATION_PER_DAY, day - 1); }

// ═══════════════════════════════════════ § 3 MARKET ═══════════════════════════════════════
// ── 3.1 Market cards: their chip text and sentence, deck sizes, the deck as a list
function marketCardText(cardId) {
  const card = MARKET_CARDS[cardId];
  if (card.category === 'move') return (card.move > 0 ? '+' : '−') + Math.abs(card.move * 100) + '%';
  return 'σ' + (card.factor > 1 ? '+' : '−') + Math.round(Math.abs(card.factor - 1) * 100) + '%';
}
function marketCardSentence(cardId) {
  const card = MARKET_CARDS[cardId];
  if (card.category === 'move') return `${cardId}: the price moves ${marketCardText(cardId)} × σ.`;
  return `${cardId}: σ ${card.factor > 1 ? '+' : '−'}${Math.round(Math.abs(card.factor - 1) * 100)}%, every later move is that much ${card.factor > 1 ? 'bigger' : 'smaller'}.`;
}
// Does this card shake the chart? 2 = a 50% move, 1 = a 10% move.
function marketCardImpact(cardId) {
  const card = MARKET_CARDS[cardId];
  const size = card.category === 'move' ? Math.abs(card.move) : Math.abs(card.factor - 1);
  return size >= 0.5 ? 2 : size >= BIG_CARD_MOVE ? 1 : 0;
}
function deckToCardList(deck) {
  const cardList = [];
  for (const cardId of MARKET_CARD_ORDER) for (let copy = 0; copy < (deck[cardId] || 0); copy++) cardList.push(cardId);
  return cardList;
}
function countCards(cardList) {
  const counts = {};
  for (const cardId of MARKET_CARD_ORDER) counts[cardId] = 0;
  for (const cardId of cardList) counts[cardId]++;
  return counts;
}

// ── 3.2 One tick. The market state: the price, σ, the open, the boss rule's bonus, multiplier and cap, the pushes
// waiting from hype and bash (pendingPushes[0] is next tick's, as a log move), and a ceiling or floor with the ticks
// it still holds. The same rules run the real day and the market maker's simulations, so its prices are exactly as
// fair as the game. Arrays in the state are never changed in place (states are copied shallowly).
function freshMarketState(openPrice, bossRule = null) {
  return { price: openPrice, dayOpenPrice: openPrice, volatility: 1,
    allDayBonus: bossRule === 'bearMarket' ? -BEAR_MARKET_DRIFT : 0, allDayMultiplier: bossRule === 'doubleAllDay' ? 2 : 1,
    moveCap: bossRule === 'circuitBreaker' ? CIRCUIT_BREAKER_CAP : null,      // null = no cap (JSON keeps null, not Infinity)
    pendingPushes: [], ceilingPrice: 0, ceilingTicksLeft: 0, floorPrice: 0, floorTicksLeft: 0 };
}
function applyMarketCard(market, cardId) {
  const card = MARKET_CARDS[cardId];
  if (card.category === 'vol') { market.volatility = clamp(market.volatility * card.factor, VOLATILITY_MINIMUM, VOLATILITY_MAXIMUM); return; }
  const move = card.move * market.volatility * market.allDayMultiplier + market.allDayBonus;
  const cap = market.moveCap === null ? Infinity : market.moveCap;
  market.price *= 1 + clamp(move, Math.max(PRICE_MOVE_FLOOR, -cap), cap);
}
// One tick: one market card, then a waiting push, then the ceiling and the floor. Returns the cards drawn.
function tickMarket(market, drawCard) {
  const cardId = drawCard();
  applyMarketCard(market, cardId);
  if (market.pendingPushes.length > 0) {
    market.price *= Math.exp(market.pendingPushes[0]);
    market.pendingPushes = market.pendingPushes.slice(1);
  }
  if (market.ceilingTicksLeft > 0) { market.price = Math.min(market.price, market.ceilingPrice); market.ceilingTicksLeft--; }
  if (market.floorTicksLeft > 0) { market.price = Math.max(market.price, market.floorPrice); market.floorTicksLeft--; }
  return [cardId];
}

// ── 3.3 The day's schedule. The market deck is dealt from a draw pile that lasts several days (844 cards at 90 a
// day); when it runs out a fresh shuffle of the whole deck replaces it. The day is fixed in advance (states[tick],
// cards[tick]) and the live day replays it one tick per quarter second. A market card you play rebuilds the rest of
// the day from the changed state (continueSchedule). pilePositions[tick] = [which pile, how many of its cards are drawn].
function scheduleDay(drawPile, deck, market, random) {
  return continueSchedule({ states: [], cards: [[]], pilePositions: [] }, 0, market, drawPile, deck, random);
}
function continueSchedule(schedule, fromTick, market, drawPile, deck, random) {
  const drawPiles = [drawPile.slice()];
  let pileIndex = 0, cardsTaken = 0;
  const drawCard = () => {
    if (cardsTaken >= drawPiles[pileIndex].length) { drawPiles.push(shuffleInPlace(deckToCardList(deck), random)); pileIndex++; cardsTaken = 0; }
    return drawPiles[pileIndex][cardsTaken++];
  };
  const result = {
    states: schedule.states.slice(0, fromTick).concat([{ ...market }]), cards: schedule.cards.slice(0, fromTick + 1),
    drawPiles, pilePositions: schedule.pilePositions.slice(0, fromTick).concat([[0, 0]]),
  };
  const state = { ...market };
  for (let tick = fromTick + 1; tick <= TICKS_PER_DAY; tick++) {
    result.cards.push(tickMarket(state, drawCard));
    result.states.push({ ...state });
    result.pilePositions.push([pileIndex, cardsTaken]);
  }
  return result;
}
// The cards still in the draw pile after this tick (what the market maker counts on).
function drawPileAfter(schedule, tick) {
  const [pileIndex, cardsTaken] = schedule.pilePositions[tick];
  return schedule.drawPiles[pileIndex].slice(cardsTaken);
}
function nextOpenPrice(closePrice) { return closePrice * (1 + INFLATION_PER_DAY); }

// ── 3.4 The market maker knows which cards are left in the draw pile and what the whole deck holds, but not their
// order, and it knows every manipulation already played (they are in the market state). It plays out the rest of
// the day many times with the same tickMarket. Returns today's simulated closes.
function simulateCloses(market, remainingDrawPile, deck, ticksLeft, paths, random) {
  const wholeDeck = deckToCardList(deck), closes = new Float64Array(paths);
  for (let path = 0; path < paths; path++) {
    const state = { ...market };
    let cardsLeft = remainingDrawPile.slice();
    const drawCard = () => {                       // a random card from what is left; a fresh deck when the pile is empty
      if (cardsLeft.length === 0) cardsLeft = wholeDeck.slice();
      const index = Math.floor(random() * cardsLeft.length), card = cardsLeft[index];
      cardsLeft[index] = cardsLeft[cardsLeft.length - 1];
      cardsLeft.pop();
      return card;
    };
    for (let tick = 0; tick < ticksLeft; tick++) tickMarket(state, drawCard);
    closes[path] = state.price;
  }
  return closes;
}
// What one option pays when exercised at price S: max(S − K, 0) for a call, max(K − S, 0) for a put.
function payoff(type, strikePrice, price) { return Math.max(0, type === 'call' ? price - strikePrice : strikePrice - price); }
function averagePayoff(closes, type, strikePrice) {
  let total = 0;
  for (const closePrice of closes) total += payoff(type, strikePrice, closePrice);
  return total / closes.length;
}

// ═══════════════════════════════════════ § 4 YOUR DECK ═══════════════════════════════════════
// run.deck lists every card you own. Each is in exactly one place: run.drawPile, run.hand, run.discardPile or
// today.bench (a trade being built). Played cards go to the discard pile, and so does the rest of the hand at the
// close; the discard pile is shuffled into a new draw pile when the draw pile is empty.
function isTradeCard(cardId) { return !!PLAYER_CARDS[cardId].kind; }
function isOption(cardId) { const kind = PLAYER_CARDS[cardId].kind; return kind === 'call' || kind === 'put'; }
function cardHeat(cardId) { const card = PLAYER_CARDS[cardId]; return HEAT_EFFECTS.includes(card.effect) ? HEAT_BY_TIER[card.tier] : 0; }

function drawPlayerCards(run, count) {
  for (let drawn = 0; drawn < count; drawn++) {
    if (run.drawPile.length === 0) {
      if (run.discardPile.length === 0) return;
      run.reshuffles++;
      run.drawPile = shuffleInPlace(run.discardPile, makeRandom(mixSeed(run.seed, run.reshuffles, 21)));
      run.discardPile = [];
    }
    run.hand.push(run.drawPile.pop());
  }
}
// Redraw: these hand positions go to the discard pile and as many cards are drawn.
function redrawCards(run, handIndices) {
  const today = run.today;
  if (today.redrawsLeft <= 0 || handIndices.length === 0 || benchBusy(today)) return false;
  const chosen = new Set(handIndices);
  run.discardPile.push(...run.hand.filter((cardId, index) => chosen.has(index)));
  run.hand = run.hand.filter((cardId, index) => !chosen.has(index));
  drawPlayerCards(run, chosen.size);
  today.redrawsLeft--;
  return true;
}

// The leverage chain of a trade being built: L starts at 1 and each card changes it in turn.
// Returns { steps: [{ cardId, leverage }], leverage } with the cap of a boss day or an investigation applied at the end.
function applyLeverageCard(leverage, cardId) {
  const card = PLAYER_CARDS[cardId];
  if (card.operation === 'add') return leverage + card.amount;
  if (card.operation === 'times') return leverage * card.amount;
  return Math.pow(leverage + 1, card.amount);
}
function leverageCap(run) {
  if (run.today.investigation) return 1;
  return run.today.bossRule === 'leverageCap' ? BOSS_LEVERAGE_CAP : MAXIMUM_LEVERAGE;
}
function leverageChain(run, leverageCards) {
  const steps = [];
  let leverage = 1;
  for (const cardId of leverageCards) { leverage = Math.min(MAXIMUM_LEVERAGE, applyLeverageCard(leverage, cardId)); steps.push({ cardId, leverage }); }
  return { steps, leverage: Math.min(leverage, leverageCap(run)) };
}

// ═══════════════════════════════════════ § 5 TRADES ═══════════════════════════════════════
// A trade: { number, cardId, leverageCards, kind: 'stock' | 'call' | 'put', side (+1 long, −1 short stock; options
// are always bought), strikePrice, quantity (shares or options), referenceUnitPrice, margin, cashIn, leverageAtOpen }.
// The trade is worth margin + side × quantity × (unit price now − referenceUnitPrice): the money in it plus what it
// made. When that reaches 0 it is liquidated: the money in it is gone, never more (the broker takes a gap).
// Double and top-up reset the reference: margin = the trade's value then, reference = the unit price then.
function currentPrice(today) { return today.schedule.states[today.tick].price; }
function marketNow(today) { return today.schedule.states[today.tick]; }

// ── 5.1 Option prices. One option is worth the higher of exercising now and the market maker's average payoff at the
// close (only exercising is left at the close). The market maker never sells one below MINIMUM_OPTION_PRICE × S.
function optionUnitValue(today, type, strikePrice) {
  const exerciseNow = payoff(type, strikePrice, currentPrice(today));
  if (today.tick >= TICKS_PER_DAY || !today.closeForecast) return exerciseNow;
  return Math.max(exerciseNow, averagePayoff(today.closeForecast, type, strikePrice));
}
function optionBuyPrice(today, type, strikePrice) { return Math.max(optionUnitValue(today, type, strikePrice), currentPrice(today) * MINIMUM_OPTION_PRICE); }
function strikeFor(today, cardId) { return PLAYER_CARDS[cardId].strikeShare * currentPrice(today); }

// ── 5.2 Value
function unitPriceNow(run, trade) { return trade.kind === 'stock' ? currentPrice(run.today) : optionUnitValue(run.today, trade.kind, trade.strikePrice); }
function rawTradeValue(run, trade) { return trade.margin + trade.side * trade.quantity * (unitPriceNow(run, trade) - trade.referenceUnitPrice); }
function tradeValue(run, trade) { return Math.max(0, rawTradeValue(run, trade)); }
function tradeProfit(run, trade) { return tradeValue(run, trade) - trade.cashIn; }
function tradeLeverageNow(run, trade) {
  const value = tradeValue(run, trade);
  return value > 0 ? trade.quantity * unitPriceNow(run, trade) / value : Infinity;
}
// The stock price at which a stock trade is liquidated. (A leveraged option is liquidated when the option has lost
// margin ÷ quantity of its price.)
function liquidationPrice(trade) { return Math.max(0, trade.referenceUnitPrice - trade.side * trade.margin / trade.quantity); }
function totalEquity(run) {
  if (!run.today) return run.cash;
  return run.cash + run.today.trades.reduce((total, trade) => total + tradeValue(run, trade), 0);
}
function benchBusy(today) { return !!today.bench.tradeCard; }

// ── 5.3 Opening the trade on the bench. stakeShare = the share of cash (0..1) put in, the fee on top.
// Returns everything the bench shows; .reason says why it cannot open.
function benchPreview(run, stakeShare) {
  const today = run.today, bench = today.bench, tradeCardId = bench.tradeCard;
  if (!tradeCardId) return { reason: 'No trade card' };
  const card = PLAYER_CARDS[tradeCardId], chain = leverageChain(run, bench.leverageCards);
  const stake = Math.max(0, stakeShare * run.cash / (1 + TRADE_FEE)), fee = stake * TRADE_FEE;
  const strikePrice = card.kind === 'stock' ? null : strikeFor(today, tradeCardId);
  const unitPrice = card.kind === 'stock' ? currentPrice(today) : optionBuyPrice(today, card.kind, strikePrice);
  const quantity = stake * chain.leverage / unitPrice;
  const preview = { tradeCardId, card, chain, stake, fee, strikePrice, unitPrice, quantity, position: stake * chain.leverage };
  preview.liquidationPrice = card.kind === 'stock' && chain.leverage > 1 ? unitPrice * (1 - card.side / chain.leverage) : null;
  preview.reason = today.tick >= TICKS_PER_DAY ? 'The market is closed' : stake < SMALLEST_STAKE ? 'No cash to trade' : null;
  return preview;
}
function openBenchTrade(run, stakeShare) {
  const today = run.today, preview = benchPreview(run, stakeShare);
  if (preview.reason) return preview.reason;
  run.cash -= preview.stake + preview.fee;
  const trade = {
    number: today.nextTradeNumber++, cardId: preview.tradeCardId, leverageCards: today.bench.leverageCards.slice(),
    kind: preview.card.kind, side: preview.card.kind === 'stock' ? preview.card.side : 1, strikePrice: preview.strikePrice,
    quantity: preview.quantity, referenceUnitPrice: preview.unitPrice, margin: preview.stake, cashIn: preview.stake + preview.fee,
    leverageAtOpen: preview.chain.leverage,
  };
  today.trades.push(trade);
  run.discardPile.push(trade.cardId, ...trade.leverageCards);
  today.bench = { tradeCard: null, leverageCards: [] };
  today.tradesLeft--;
  return trade;
}
// Taking the bench apart: its cards go back to the hand.
function clearBench(run) {
  const bench = run.today.bench;
  if (bench.tradeCard) run.hand.push(bench.tradeCard, ...bench.leverageCards);
  run.today.bench = { tradeCard: null, leverageCards: [] };
}
function returnBenchCard(run, benchPosition) {
  const bench = run.today.bench;
  if (benchPosition === 0) { clearBench(run); return; }
  run.hand.push(...bench.leverageCards.splice(benchPosition - 1, 1));
}

// ── 5.4 Closing. reason: 'closed' (by you), 'liquidated', 'the close'.
function closeTrade(run, tradeIndex, reason = 'closed') {
  const today = run.today, trade = today.trades[tradeIndex];
  if (!trade) return null;
  const value = tradeValue(run, trade);
  run.cash += value;
  today.trades.splice(tradeIndex, 1);
  const closed = { cardId: trade.cardId, leverage: trade.leverageAtOpen, strikePrice: trade.strikePrice, profit: value - trade.cashIn, reason };
  today.closedTrades.push(closed);
  return closed;
}
function closeAllTrades(run, reason = 'closed') {
  for (let index = run.today.trades.length - 1; index >= 0; index--) closeTrade(run, index, reason);
}
// Every tick: trades worth nothing are liquidated. Returns how many.
function liquidateTrades(run) {
  let count = 0;
  for (let index = run.today.trades.length - 1; index >= 0; index--)
    if (rawTradeValue(run, run.today.trades[index]) <= 0) { closeTrade(run, index, 'liquidated'); count++; }
  return count;
}

// ── 5.5 Cards that act on an open trade
function rebaseTrade(run, trade) { trade.margin = tradeValue(run, trade); trade.referenceUnitPrice = unitPriceNow(run, trade); }
function doubleTrade(run, trade) { rebaseTrade(run, trade); trade.quantity *= 2; }
function topUpTrade(run, trade, share) {
  const extra = Math.min(run.cash, share * trade.cashIn);
  if (extra <= 0) return 0;
  run.cash -= extra;
  trade.margin += extra;
  trade.cashIn += extra;
  return extra;
}
// At the close, before the trades close: dividends are paid into each trade (a short stock trade pays them).
function payDividends(run) {
  const today = run.today;
  if (!today.dividendShare) return 0;
  let total = 0;
  for (const trade of today.trades) {
    if (trade.kind === 'put') continue;
    const dividend = trade.side * today.dividendShare * trade.quantity * unitPriceNow(run, trade);
    trade.margin += dividend;
    total += dividend;
  }
  return total;
}

// ═══════════════════════════════════════ § 6 MARKET CARDS & HEAT ═══════════════════════════════════════
// ── 6.1 Why a card in the hand cannot be played now, or null.
function marketOpen(run) { return (run.phase === 'preopen' || run.phase === 'trading') && run.today.tick < TICKS_PER_DAY; }
function cardBlockedReason(run, cardId) {
  const today = run.today, card = PLAYER_CARDS[cardId];
  if (!marketOpen(run)) return 'The market is closed';
  if (isTradeCard(cardId)) {
    if (benchBusy(today)) return 'Finish the trade on the bench first';
    if (today.tradesLeft <= 0) return 'No trades left today';
    if (today.bossRule === 'noOptions' && isOption(cardId)) return 'No options today';
    if (today.bossRule === 'noLongs' && card.family === 'long') return 'No longs today';
    if (today.bossRule === 'noShorts' && card.family === 'short') return 'No shorts today';
    if (run.cash < SMALLEST_STAKE * (1 + TRADE_FEE)) return 'No cash to trade';
    return null;
  }
  if (card.family === 'leverage') {
    if (today.investigation) return 'No leverage during an investigation';
    return benchBusy(today) ? null : 'Put a trade card on the bench first';
  }
  if (benchBusy(today)) return 'Finish the trade on the bench first';
  if (cardHeat(cardId) > 0 && today.investigation) return 'Not during an investigation';
  if (card.target === 'trade' && today.trades.length === 0) return 'No open trade';
  if (card.effect === 'topUp' && run.cash <= 0) return 'No cash';
  return null;
}

// ── 6.2 Playing a card from the hand that acts on the market (or on the day). Returns a short line, or { error }.
function playMarketCard(run, handIndex) {
  const cardId = run.hand[handIndex], card = PLAYER_CARDS[cardId];
  const blocked = cardBlockedReason(run, cardId);
  if (blocked) return { error: blocked };
  if (card.effect === 'dividends') run.today.dividendShare += card.share;
  else changeMarket(run, market => MARKET_CARD_EFFECTS[card.effect](market, card));
  run.hand.splice(handIndex, 1);
  run.discardPile.push(cardId);
  run.heat += cardHeat(cardId);
  return `${card.name} ${card.detail}`;
}
const MARKET_CARD_EFFECTS = {
  hype(market, card) { market.pendingPushes = addPushes(market.pendingPushes, card.move); },
  volatility(market, card) { market.volatility = clamp(market.volatility * card.factor, VOLATILITY_MINIMUM, VOLATILITY_MAXIMUM); },
  ceiling(market, card) { market.ceilingPrice = market.price; market.ceilingTicksLeft = Math.max(market.ceilingTicksLeft, card.ticks); },
  floor(market, card) { market.floorPrice = market.price; market.floorTicksLeft = Math.max(market.floorTicksLeft, card.ticks); },
};
// A hype of +move: HYPE_TICKS pushes up that add up to ×(1 + move), then as many back down. Adds to pushes waiting.
function addPushes(pendingPushes, move) {
  const step = Math.log(1 + move) / HYPE_TICKS, pushes = pendingPushes.slice();
  for (let tick = 0; tick < 2 * HYPE_TICKS; tick++) pushes[tick] = (pushes[tick] || 0) + (tick < HYPE_TICKS ? step : -step);
  return pushes;
}
// Play a card on an open trade (double, top-up).
function playTradeCard(run, handIndex, tradeIndex) {
  const cardId = run.hand[handIndex], card = PLAYER_CARDS[cardId], trade = run.today.trades[tradeIndex];
  const blocked = cardBlockedReason(run, cardId) || (trade ? null : 'No such trade');
  if (blocked) return { error: blocked };
  if (card.effect === 'double') doubleTrade(run, trade);
  else if (topUpTrade(run, trade, card.share) <= 0) return { error: 'No cash' };
  run.hand.splice(handIndex, 1);
  run.discardPile.push(cardId);
  return `${card.name} #${trade.number}`;
}
// Changing the market mid-day: change a copy of the state now, then deal the rest of the day again (the reshuffles
// get a new seed each time, so nothing can be replayed) and let the market maker see it.
function changeMarket(run, change) {
  const today = run.today, market = { ...marketNow(today) };
  change(market);
  today.marketChanges++;
  const random = makeRandom(mixSeed(run.seed, run.day, today.marketChanges, 7));
  today.schedule = continueSchedule(today.schedule, today.tick, market, drawPileAfter(today.schedule, today.tick), run.market.deck, random);
  refreshForecast(run);
}

// ── 6.3 Heat: manipulation, ceiling and floor cards add it, and so do suspiciously good days.
function abnormalProfitHeat(dayReturn) {
  if (dayReturn <= ABNORMAL_RETURN) return 0;
  return Math.min(HEAT_ABNORMAL_CAP, (dayReturn - ABNORMAL_RETURN) * HEAT_PER_ABNORMAL_RETURN);
}
// At the close: add the day's heat and open or end an investigation. Returns 'opened', 'cleared' or null.
function updateHeat(run, dayReturn) {
  run.heat += abnormalProfitHeat(dayReturn);
  if (run.today.investigation) {
    run.investigationDaysLeft--;
    if (run.investigationDaysLeft > 0) return null;
    run.heat = HEAT_AFTER_INVESTIGATION;
    return 'cleared';
  }
  if (run.heat < HEAT_LIMIT) return null;
  run.investigationDaysLeft = INVESTIGATION_DAYS;
  return 'opened';
}

// ═══════════════════════════════════════ § 7 RUN ═══════════════════════════════════════
// run.market = { deck, drawPile (market cards not drawn yet), history (the last HISTORY_DAYS days as { day, prices }),
// lastClose }.
function newRun(seed = Math.floor(Math.random() * 2 ** 31)) {
  const run = {
    version: SAVE_VERSION, seed, day: 1, phase: 'preopen',
    cash: STARTING_CASH, peakEquity: STARTING_CASH, heat: 0, investigationDaysLeft: 0,
    market: null, deck: STARTING_DECK.slice(), drawPile: [], hand: [], discardPile: [], reshuffles: 0,
    shop: null, meetingsPassed: 0, lastResult: null, gameOverReason: null, today: null,
  };
  run.drawPile = shuffleInPlace(run.deck.slice(), makeRandom(mixSeed(seed, 0, 21)));
  createMarket(run);
  prepareDay(run);
  return run;
}
// The boss rule of a meeting day (seeded per meeting, so it can be shown days ahead), or null on other days.
function bossRuleOn(run, day) {
  if (day % MEETING_EVERY_DAYS !== 0) return null;
  const ruleIds = Object.keys(BOSS_RULES);
  return ruleIds[mixSeed(run.seed, day / MEETING_EVERY_DAYS, 13) % ruleIds.length];
}
// The stock starts with a few days of history already played, scaled so that day 1 opens at BASE_OPEN_PRICE.
function createMarket(run) {
  const deck = { ...MARKET_DECK }, random = makeRandom(mixSeed(run.seed, 99));
  let drawPile = shuffleInPlace(deckToCardList(deck), random), price = 1;
  const history = [];
  for (let back = HISTORY_DAYS; back >= 1; back--) {
    const schedule = scheduleDay(drawPile, deck, freshMarketState(price), random);
    history.push({ day: 1 - back, prices: schedule.states.map(state => state.price) });
    drawPile = drawPileAfter(schedule, TICKS_PER_DAY);
    price = nextOpenPrice(schedule.states[TICKS_PER_DAY].price);
  }
  const scale = BASE_OPEN_PRICE / price;
  for (const day of history) day.prices = day.prices.map(value => value * scale);
  run.market = { deck, drawPile, history, lastClose: history[history.length - 1].prices[TICKS_PER_DAY] };
}
// Fix today's schedule, draw up to a full hand.
function prepareDay(run) {
  const bossRule = bossRuleOn(run, run.day);
  const open = freshMarketState(nextOpenPrice(run.market.lastClose), bossRule);
  run.today = {
    tick: 0, schedule: scheduleDay(run.market.drawPile, run.market.deck, open, makeRandom(mixSeed(run.seed, run.day, 0))),
    trades: [], closedTrades: [], nextTradeNumber: 1, bench: { tradeCard: null, leverageCards: [] },
    tradesLeft: bossRule === 'oneTrade' ? 1 : TRADES_PER_DAY, redrawsLeft: REDRAWS_PER_DAY, dividendShare: 0,
    bossRule, investigation: run.investigationDaysLeft > 0, marketChanges: 0,
    startEquity: run.cash, tickClock: 0, closeForecast: null,
  };
  run.phase = 'preopen';
  drawPlayerCards(run, HAND_SIZE);
  refreshForecast(run);
}
// The market maker's closes from this tick (its random numbers do not depend on the tick, which keeps its prices
// steady from one tick to the next).
function refreshForecast(run) {
  const today = run.today;
  const random = makeRandom(mixSeed(run.seed, run.day, today.marketChanges, 5));
  today.closeForecast = simulateCloses(marketNow(today), drawPileAfter(today.schedule, today.tick), run.market.deck,
    TICKS_PER_DAY - today.tick, FORECAST_PATHS, random);
}
function openTheMarket(run) { if (run.phase === 'preopen') run.phase = 'trading'; }

// One tick of the live day. Returns what happened so the screen can react.
function advanceTick(run) {
  const today = run.today;
  today.tick++;
  refreshForecast(run);
  const liquidated = liquidateTrades(run);
  return { cards: today.schedule.cards[today.tick], liquidated, closed: today.tick >= TICKS_PER_DAY };
}

// Meeting n is held at the close of day n × MEETING_EVERY_DAYS.
function meetingTarget(run, meetingNumber) {
  const day = meetingNumber * MEETING_EVERY_DAYS;
  const listed = MEETING_MULTIPLES[Math.min(meetingNumber, MEETING_MULTIPLES.length) - 1];
  const extra = Math.pow(MEETING_GROWTH_AFTER_LAST, Math.max(0, meetingNumber - MEETING_MULTIPLES.length));
  return STARTING_CASH * inflationIndex(day) * listed * extra;
}
function nextMeetingNumber(run) { return Math.ceil(run.day / MEETING_EVERY_DAYS); }
function holdMeeting(run, equity) {
  if (run.day % MEETING_EVERY_DAYS !== 0) return null;
  const number = run.day / MEETING_EVERY_DAYS, target = meetingTarget(run, number);
  const meeting = { number, target, passed: equity >= target, final: number === MEETING_MULTIPLES.length };
  if (meeting.passed) run.meetingsPassed = number;
  return meeting;
}

// The close: dividends, every trade closed, the market moves on, heat, the meeting, and the end of the run if there
// is no money left or the meeting failed.
function closeDay(run) {
  const today = run.today;
  clearBench(run);
  run.discardPile.push(...run.hand);
  run.hand = [];
  const dividends = payDividends(run);
  closeAllTrades(run, 'the close');
  const market = run.market;
  market.drawPile = drawPileAfter(today.schedule, TICKS_PER_DAY);
  market.history.push({ day: run.day, prices: today.schedule.states.map(state => state.price) });
  market.history = market.history.slice(-HISTORY_DAYS);
  market.lastClose = currentPrice(today);

  const endEquity = run.cash, dayReturn = (endEquity - today.startEquity) / Math.max(1e-9, today.startEquity);
  const heatBefore = run.heat;
  const investigationNote = updateHeat(run, dayReturn);
  const meeting = holdMeeting(run, endEquity);
  run.peakEquity = Math.max(run.peakEquity, endEquity);
  if (endEquity < MINIMUM_CASH_TO_TRADE * inflationIndex(run.day + 1)) run.gameOverReason = 'broke';
  else if (meeting && !meeting.passed) run.gameOverReason = 'meeting';
  run.lastResult = {
    day: run.day, openPrice: today.schedule.states[0].price, closePrice: market.lastClose, startEquity: today.startEquity, endEquity,
    dayReturn, dividends, closedTrades: today.closedTrades, heatAdded: run.heat - heatBefore, investigationNote, meeting,
  };
  run.phase = 'result';
  return run.lastResult;
}
function startNextDay(run) {
  run.day++;
  run.heat = Math.max(0, run.heat - HEAT_DECAY_PER_DAY);
  run.shop = null;
  prepareDay(run);
}

// ── 7.1 The shop: four reels. run.shop = { reels: [cardId × 4], sold: [bool × 4], spins }. Each reel lands on a tier
// (TIER_ODDS), then on one of its cards of that tier (or of a lower tier when it holds none).
function cardPrice(run, cardId) { return TIER_PRICES[PLAYER_CARDS[cardId].tier] * inflationIndex(run.day); }
function cardSellPrice(run, cardId) { return cardPrice(run, cardId) * SELL_SHARE; }
function spinPrice(run) { return (SPIN_PRICE + SPIN_PRICE_STEP * run.shop.spins) * inflationIndex(run.day); }
function reelPool(reelIndex) { return PLAYER_CARD_ORDER.filter(cardId => SHOP_REELS[reelIndex].holds(PLAYER_CARDS[cardId])); }
function landReel(reelIndex, random) {
  const pool = reelPool(reelIndex), roll = random() * 100;
  let tier = roll < TIER_ODDS[3] ? 3 : roll < TIER_ODDS[3] + TIER_ODDS[2] ? 2 : 1;
  let cards = [];
  for (; tier >= 1 && cards.length === 0; tier--) cards = pool.filter(cardId => PLAYER_CARDS[cardId].tier === tier);
  return cards[Math.floor(random() * cards.length)];
}
function rollReels(run) {
  const random = makeRandom(mixSeed(run.seed, run.day, run.shop.spins, 31));
  run.shop.reels = SHOP_REELS.map((reel, reelIndex) => landReel(reelIndex, random));
  run.shop.sold = SHOP_REELS.map(() => false);
}
function openShop(run) {
  run.phase = 'shop';
  if (!run.shop) { run.shop = { reels: [], sold: [], spins: 0 }; rollReels(run); }
}
function spinReels(run) {
  const price = spinPrice(run);
  if (run.cash < price) return false;
  run.cash -= price;
  run.shop.spins++;
  rollReels(run);
  return true;
}
// A bought card is shuffled into the draw pile.
function buyReelCard(run, reelIndex) {
  const cardId = run.shop.reels[reelIndex];
  if (!cardId || run.shop.sold[reelIndex] || run.cash < cardPrice(run, cardId)) return false;
  run.cash -= cardPrice(run, cardId);
  run.shop.sold[reelIndex] = true;
  run.deck.push(cardId);
  const random = makeRandom(mixSeed(run.seed, run.day, run.deck.length, 41));
  run.drawPile.splice(Math.floor(random() * (run.drawPile.length + 1)), 0, cardId);
  return true;
}
// Selling one copy: it leaves the deck and whichever pile holds it.
function sellCard(run, cardId) {
  if (run.deck.length <= MINIMUM_PLAYER_DECK || !run.deck.includes(cardId)) return false;
  run.deck.splice(run.deck.indexOf(cardId), 1);
  for (const pile of [run.drawPile, run.discardPile, run.hand]) {
    const index = pile.indexOf(cardId);
    if (index >= 0) { pile.splice(index, 1); break; }
  }
  run.cash += cardSellPrice(run, cardId);
  return true;
}

// ── 7.2 Saving: the whole run is plain data. The market maker's closes are rebuilt on load.
function serialiseRun(run) {
  return JSON.stringify({ ...run, today: run.today ? { ...run.today, closeForecast: null } : null });
}
function loadRun(text) {
  const run = JSON.parse(text);
  if (!run || run.version !== SAVE_VERSION) return null;
  if (run.today) refreshForecast(run);
  return run;
}

// ═══════════════════════════════════════ § 8 SOUND ═══════════════════════════════════════
const sound = { context: null, muted: false };
function playTone(frequency, seconds, { type = 'triangle', volume = 0.05, slideTo = null, delay = 0 } = {}) {
  if (sound.muted) return;
  try {
    sound.context = sound.context || new (window.AudioContext || window.webkitAudioContext)();
    const context = sound.context, start = context.currentTime + delay;
    const oscillator = context.createOscillator(), gain = context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, start + seconds);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + seconds + 0.02);
  } catch (error) { /* no audio available */ }
}
const sounds = {
  tick(move) { playTone(move >= 0 ? 660 : 440, 0.05, { volume: 0.012, type: 'sine' }); },
  bigCard(rising) { playTone(rising ? 520 : 300, 0.35, { volume: 0.06, slideTo: rising ? 1040 : 120, type: 'sawtooth' }); },
  card() { playTone(740, 0.06, { volume: 0.035, type: 'square' }); },
  trade() { playTone(880, 0.09, { volume: 0.05, type: 'square' }); playTone(1320, 0.1, { volume: 0.035, delay: 0.05 }); },
  manipulation() { playTone(300, 0.3, { volume: 0.05, slideTo: 900, type: 'sawtooth' }); },
  bad() { playTone(220, 0.4, { volume: 0.07, slideTo: 90, type: 'sawtooth' }); },
  cash(gained) { (gained ? [523, 659, 784, 1047] : [392, 330, 262]).forEach((frequency, index) => playTone(frequency, 0.14, { volume: 0.05, delay: index * 0.08 })); },
  buy() { playTone(980, 0.1, { volume: 0.04 }); playTone(1470, 0.12, { volume: 0.03, delay: 0.06 }); },
  reelTick() { playTone(1100, 0.025, { volume: 0.015, type: 'square' }); },
  reelStop() { playTone(180, 0.09, { volume: 0.07, type: 'square' }); },
  denied() { playTone(160, 0.12, { volume: 0.04, type: 'square' }); },
};

// ═══════════════════════════════════════ § 9 CHART ═══════════════════════════════════════
// Everything the screen keeps that is not part of the saved run.
const view = {
  run: null, speedIndex: 0, paused: false, overlay: null,
  popups: [], lastEquity: null, freshTick: -1, freshHand: 0,     // chart popups, equity flash, newest chip, newest hand cards
  stakePercent: 100,                                              // the bench's stake slider (share of cash)
  targeting: null,                                                // the hand position of a card waiting for an open trade
  redrawing: null,                                                // the hand positions picked for a redraw (a Set), or null
  deckSelling: false,                                             // the deck window sells cards (opened from the shop)
};
const element = id => document.getElementById(id);
const chartFont = (weight, size) => `${weight} ${size}px JetBrains Mono, Menlo, monospace`;

function fitCanvas(canvas) {
  const pixelRatio = window.devicePixelRatio || 1, bounds = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(bounds.width * pixelRatio) || canvas.height !== Math.round(bounds.height * pixelRatio)) {
    canvas.width = Math.round(bounds.width * pixelRatio);
    canvas.height = Math.round(bounds.height * pixelRatio);
  }
  const context = canvas.getContext('2d');
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  return { context, width: bounds.width, height: bounds.height };
}

// The chart, left to right: the previous days (thin) and today (live). Lines mark each stock trade's liquidation
// price, each option's strike, the trade on the bench, and a ceiling or floor for as long as it holds.
function drawChart() {
  const { context, width, height } = fitCanvas(element('chart'));
  context.clearRect(0, 0, width, height);
  const run = view.run;
  if (!run || !run.today) return;
  const chart = chartLayout(run, context, width, height);
  drawGrid(chart);
  drawHistory(chart);
  drawTradeLevels(chart);
  drawPins(chart);
  drawToday(chart);
  drawPopups(chart);
}
function chartLayout(run, context, width, height) {
  const today = run.today, states = today.schedule.states;
  const history = run.market.history;
  const left = 20, right = width - 90, top = 44, bottom = height - 22;
  const historyEnd = left + (right - left) * CHART_HISTORY_SHARE;
  const prices = history.flatMap(day => day.prices).concat(states.slice(0, today.tick + 1).map(state => state.price), chartLevels(run));
  let low = Math.min(...prices), high = Math.max(...prices);
  if (high / low < 1.06) { const middle = Math.sqrt(high * low); low = middle / 1.03; high = middle * 1.03; }   // never zoom in too far
  const margin = 0.05 * Math.log(high / low);
  const logLow = Math.log(low) - margin, logHigh = Math.log(high) + margin;
  return {
    run, today, context, history, left, right, top, bottom, height, historyEnd,
    openPrice: states[0].price, price: currentPrice(today),
    xOfPastTick: (dayIndex, tick) => left + (historyEnd - left) * (dayIndex * TICKS_PER_DAY + tick) / (Math.max(1, history.length) * TICKS_PER_DAY),
    xOfTodayTick: tick => historyEnd + (right - historyEnd) * tick / TICKS_PER_DAY,
    yOfPrice: price => bottom - (bottom - top) * (Math.log(Math.max(price, 1e-12)) - logLow) / (logHigh - logLow),
  };
}
// Price levels the chart keeps in view: liquidation prices close to the price, strikes, the bench's liquidation.
function chartLevels(run) {
  const levels = [], price = currentPrice(run.today);
  const near = level => level > price / 3 && level < price * 3;
  for (const level of tradeLevels(run)) if (near(level.price)) levels.push(level.price);
  return levels;
}
// Every horizontal line for your trades: { price, colour, label }.
function tradeLevels(run) {
  const today = run.today, levels = [];
  for (const trade of today.trades) {
    if (trade.kind === 'stock' && tradeLeverageNow(run, trade) > 1.0001)
      levels.push({ price: liquidationPrice(trade), colour: CHART_COLOURS.liquidation, label: `#${trade.number} liq` });
    if (trade.kind !== 'stock') levels.push({ price: trade.strikePrice, colour: trade.kind === 'call' ? CHART_COLOURS.up : CHART_COLOURS.down, label: `#${trade.number} K` });
  }
  if (benchBusy(today)) {
    const preview = benchPreview(run, view.stakePercent / 100);
    if (preview.liquidationPrice) levels.push({ price: preview.liquidationPrice, colour: CHART_COLOURS.accent, label: 'liq' });
    if (preview.strikePrice) levels.push({ price: preview.strikePrice, colour: CHART_COLOURS.accent, label: 'K' });
  }
  return levels;
}

function drawLine(context, fromX, fromY, toX, toY, colour, { width = 1, dashed = false, alpha = 1 } = {}) {
  context.strokeStyle = colour; context.lineWidth = width; context.globalAlpha = alpha;
  context.setLineDash(dashed ? [5, 5] : []);
  context.beginPath(); context.moveTo(fromX, fromY); context.lineTo(toX, toY); context.stroke();
  context.setLineDash([]); context.globalAlpha = 1;
}
function drawDot(context, screenX, screenY, radius, colour) {
  context.fillStyle = colour;
  context.beginPath(); context.arc(screenX, screenY, radius, 0, Math.PI * 2); context.fill();
}
function drawText(context, text, screenX, screenY, colour, { weight = 800, size = 14, align = 'left', alpha = 1 } = {}) {
  context.fillStyle = colour; context.font = chartFont(weight, size); context.globalAlpha = alpha;
  context.textAlign = align; context.textBaseline = 'middle';
  context.fillText(text, screenX, screenY);
  context.globalAlpha = 1;
}
function drawPath(context, points, colour, width) {
  context.strokeStyle = colour; context.lineWidth = width; context.lineJoin = 'round';
  context.beginPath();
  points.forEach(([screenX, screenY], index) => (index === 0 ? context.moveTo(screenX, screenY) : context.lineTo(screenX, screenY)));
  context.stroke();
}
function drawGrid({ context, history, top, bottom, right, historyEnd, xOfPastTick, yOfPrice, openPrice }) {
  for (let dayIndex = 1; dayIndex < history.length; dayIndex++) drawLine(context, xOfPastTick(dayIndex, 0), top - 10, xOfPastTick(dayIndex, 0), bottom + 10, CHART_COLOURS.grid);
  drawLine(context, historyEnd, top - 10, historyEnd, bottom + 10, CHART_COLOURS.openPrice);
  drawLine(context, historyEnd, yOfPrice(openPrice), right, yOfPrice(openPrice), CHART_COLOURS.openPrice, { dashed: true });
}
function drawHistory({ context, history, xOfPastTick, xOfTodayTick, yOfPrice, openPrice }) {
  const points = [];
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) points.push([xOfPastTick(dayIndex, tick), yOfPrice(day.prices[tick])]);
  });
  points.push([xOfTodayTick(0), yOfPrice(openPrice)]);
  drawPath(context, points, CHART_COLOURS.history, 1.5);
}
// Liquidation prices and strikes, labelled at the right edge (labels never overlap).
function drawTradeLevels({ run, context, historyEnd, right, top, bottom, yOfPrice }) {
  const labelYs = [];
  for (const level of tradeLevels(run)) {
    const levelY = yOfPrice(level.price);
    if (levelY < top - 20 || levelY > bottom + 20) continue;
    drawLine(context, historyEnd, levelY, right, levelY, level.colour, { dashed: true, alpha: 0.8 });
    let labelY = levelY;
    for (const used of labelYs) if (Math.abs(labelY - used) < 16) labelY = used + (labelY >= used ? 16 : -16);
    labelYs.push(labelY);
    drawText(context, `${level.label} ${formatPlain(level.price)}`, right + 6, labelY, level.colour, { size: 11 });
  }
}
// A ceiling or floor: a thick blue bar from now for as many ticks as it still holds.
function drawPins({ today, context, xOfTodayTick, yOfPrice }) {
  const market = marketNow(today);
  for (const [ticksLeft, price, name] of [[market.ceilingTicksLeft, market.ceilingPrice, 'ceiling'], [market.floorTicksLeft, market.floorPrice, 'floor']]) {
    if (ticksLeft <= 0) continue;
    const fromX = xOfTodayTick(today.tick), toX = xOfTodayTick(Math.min(TICKS_PER_DAY, today.tick + ticksLeft)), pinY = yOfPrice(price);
    drawLine(context, fromX, pinY, toX, pinY, CHART_COLOURS.pin, { width: 4 });
    drawText(context, `${name} ${ticksLeft}`, toX, pinY + (name === 'ceiling' ? -12 : 12), CHART_COLOURS.pin, { size: 11, align: 'right' });
  }
}
// Today's path: green above the open, red below. Then the current price.
function drawToday({ context, today, height, historyEnd, right, xOfTodayTick, yOfPrice, openPrice, price }) {
  const points = today.schedule.states.slice(0, today.tick + 1).map((state, tick) => [xOfTodayTick(tick), yOfPrice(state.price)]);
  for (const [colour, clipTop, clipBottom] of [[CHART_COLOURS.up, 0, yOfPrice(openPrice)], [CHART_COLOURS.down, yOfPrice(openPrice), height]]) {
    context.save();
    context.beginPath(); context.rect(historyEnd, clipTop, right - historyEnd + 4, clipBottom - clipTop); context.clip();
    drawPath(context, points, colour, 2.6);
    context.restore();
  }
  const currentX = xOfTodayTick(today.tick), currentY = yOfPrice(price);
  drawDot(context, currentX, currentY, 5.5, price >= openPrice ? CHART_COLOURS.up : CHART_COLOURS.down);
  drawText(context, formatPlain(price), currentX + (today.tick < TICKS_PER_DAY / 2 ? 12 : -12), currentY - 18, CHART_COLOURS.average,
    { size: 15, align: today.tick < TICKS_PER_DAY / 2 ? 'left' : 'right' });
}
// Popups (+$ / −$, messages) rise and fade above the current price; the newest sits lowest.
function drawPopups({ context, today, left, right, top, xOfTodayTick, yOfPrice, price }) {
  const now = performance.now() / 1000;
  view.popups = view.popups.filter(popup => now - popup.born < POPUP_SECONDS).slice(-POPUPS_SHOWN);
  view.popups.forEach((popup, index) => {
    const age = (now - popup.born) / POPUP_SECONDS;
    const stackOffset = (view.popups.length - 1 - index) * (popup.size + 6);
    const textX = clamp(xOfTodayTick(today.tick), left + 90, right - 90);
    const textY = Math.max(top + 10, yOfPrice(price) - 46 - stackOffset - age * 30);
    drawText(context, popup.text, textX, textY, popup.colour, { size: popup.size, align: 'center', alpha: 1 - age });
  });
}
function addPopup(text, colour, size = 18) { view.popups.push({ text, colour, size, born: performance.now() / 1000 }); }
function shakeChart(strength) {
  const box = element('chartBox');
  box.classList.remove('shake', 'shakeBig');
  void box.offsetWidth;                                        // restart the animation
  box.classList.add(strength >= 2 ? 'shakeBig' : 'shake');
}
function formatPlain(price) {
  if (price < 10) return price.toFixed(2);
  if (price < 1000) return price.toFixed(price < 100 ? 1 : 0);
  return formatMoney(price).replace('$', '');
}

// ═══════════════════════════════════════ § 10 PANELS ═══════════════════════════════════════
const colourClass = value => (value >= 0 ? 'up' : 'down');
const ROMAN = ['', 'I', 'II', 'III'];

// ── 10.1 A player card's face. Glyphs are drawn in a 100 × 100 box.
const BOLT_UP = '<path d="M60 4 L86 38 L69 38 L59 55 L74 55 L34 97 L45 63 L30 63 L47 38 L34 38 Z" fill="currentColor"/>';
const GLYPHS = {
  boltUp:   BOLT_UP,
  boltDown: '<g transform="translate(0 100) scale(1 -1)">' + BOLT_UP + '</g>',
  hype:     '<polyline points="6,80 30,62 50,14 70,62 94,80" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  bash:     '<polyline points="6,20 30,38 50,86 70,38 94,20" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>',
  turmoil:  '<polyline points="4,50 14,18 24,80 34,10 46,88 58,16 70,84 82,24 96,50" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>',
  calm:     '<path d="M4 50 C 20 40, 30 40, 50 50 S 80 60, 96 50" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>',
  ceiling:  '<rect x="6" y="14" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,90 30,60 46,72 66,34 80,44 92,30" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  floor:    '<rect x="6" y="77" width="88" height="9" rx="4" fill="currentColor"/><polyline points="8,10 30,40 46,28 66,66 80,56 92,70" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>',
  dividend: '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8"/><text x="50" y="66" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-weight="800" font-size="46" fill="currentColor">$</text>',
  topUp:    '<rect x="14" y="56" width="72" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 8 V44 M32 26 H68" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>',
};
function cardArt(card) {
  if (card.kind) return `<svg viewBox="0 0 100 100">${GLYPHS[card.family === 'long' ? 'boltUp' : 'boltDown']}</svg>`;
  if (card.glyph) return `<svg viewBox="0 0 100 100">${GLYPHS[card.glyph]}</svg>`;
  return `<div class="big">${card.smallFace ? `<small>${card.smallFace}</small>` : ''}${card.face}</div>`;
}
// extra: { classes, action, argument, tip } for the card's element.
function playerCardHtml(cardId, extra = {}) {
  const card = PLAYER_CARDS[cardId], heat = cardHeat(cardId);
  const tip = extra.tip === undefined ? card.sentence : extra.tip;
  const action = extra.action ? `data-action="${extra.action}" data-argument="${extra.argument}"` : '';
  return `<div class="playerCard ${card.family} ${extra.classes || ''}" ${action} data-tip="${tip}">
    <div class="family">${card.family === 'manip' ? 'MANIP' : card.family.toUpperCase()}</div><div class="tier">${ROMAN[card.tier]}</div>
    ${heat ? `<div class="heatTag">🔥${heat}</div>` : ''}

function tradeName(cardId) {
  const card = PLAYER_CARDS[cardId];
  return card.kind === 'stock' ? (card.side > 0 ? 'LONG' : 'SHORT') + ' STOCK' : card.name;
}

// ── 10.2 The side menu: day, clock, cash, open trades, equity, heat, the next meeting.
function renderSide() {
  const run = view.run, today = run.today, equity = totalEquity(run);
  const secondsLeft = (TICKS_PER_DAY - today.tick) * SECONDS_PER_TICK;
