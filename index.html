// ── The trade menu. One question per step. The first step lists the trades: long / short stock, long / short call,
// long / short put. Open trades sit as small icons on their own row (a long put on LONG PUT); a key letter or click
// opens one, which shows itself and offers ADD (more of the same: direction, K, expiry) or CLOSE (part or all).
// After a trade the menu returns to this first step, so the game stays paused until Esc.
// Picking the row itself starts a new trade: a new option asks for K, then the amount.
// Steps: 'action' → ('strike') → 'amount' for a new trade; 'action' → 'position' → 'amount' for an open one.
// trade.action is 'long' / 'short' for stock and 'longOption' / 'shortOption' (with kind, strike, expiryDay) for
// options; trade.mode is 'new', 'add' or 'reduce'; trade.position is { type: 'stock' } or { type: 'lot', index }.
function openTrade() {
  if (!tradingOpen()) return;
  view.trade = { step: 'action', mode: 'new', action: null, kind: null, strike: null, expiryDay: null, position: null, percent: SLIDER_DEFAULT_PERCENT, selection: 0 };
  showTrade();
}
function lotPosition(lot) { return OPTION_POSITIONS[optionPositionId(lot.side, lot.kind)]; }
function selectedLot() { const position = view.trade.position; return position && position.type === 'lot' ? view.run.today.optionLots[position.index] : null; }

// The rows of the current step: { main, detail, locked, tip, open, pick() }.
function tradeRows() {
  const run = view.run, trade = view.trade, today = run.today, price = currentPrice(today);
  if (trade.step === 'action') {
    // the open trades of each row: { icon, label, profit, open() }
    const openOf = (rowId) => {
      const trades = [];
      if (today.shares !== 0 && rowId === (today.shares > 0 ? 'longStock' : 'shortStock'))
        trades.push({ icon: STOCK_ICON, hover: 'average price = ' + formatFull(today.averageEntry) + ', S = ' + formatFull(price), profit: today.shares * (price - today.averageEntry), open: () => goTo('position', { position: { type: 'stock' } }) });
      today.optionLots.forEach((lot, index) => {
        if (optionPositionId(lot.side, lot.kind) === rowId)
          trades.push({ icon: lotPosition(lot).icon, hover: 'K = ' + formatFull(lot.strike) + ', S = ' + formatFull(price), profit: lotValue(run, lot) - lotBuyIn(lot), open: () => goTo('position', { position: { type: 'lot', index } }) });
      });
      return trades;
    };
    const optionRow = (side, kind) => {
      const position = OPTION_POSITIONS[optionPositionId(side, kind)];
      return {
        main: position.name.toUpperCase(), detail: position.formula, openTrades: openOf(optionPositionId(side, kind)),
        locked: !run.unlocked[optionPositionId(side, kind)] || today.investigation,
        tip: today.investigation ? 'No options during an investigation' : position.name + ' is unlocked in the shop',
        pick: () => goTo('strike', { action: side + 'Option', kind, mode: 'new', expiryDay: newExpiryDay(run) }),
      };
    };
    return [
      { main: 'LONG STOCK', detail: 'P&L = S − entry price', openTrades: openOf('longStock'), pick: () => goTo('amount', { action: 'long', mode: 'new' }) },
      { main: 'SHORT STOCK', detail: 'P&L = entry price − S', openTrades: openOf('shortStock'), pick: () => goTo('amount', { action: 'short', mode: 'new' }) },
      optionRow('long', 'call'), optionRow('short', 'call'), optionRow('long', 'put'), optionRow('short', 'put'),
    ];
  }
  if (trade.step === 'strike') return strikeOffsets(trade.kind).map(offset => {
    const strike = price * (1 + offset), terms = optionTerms(run, trade.kind, strike);
    const buying = trade.action === 'longOption';
    const worthless = (buying ? terms.askPrice : terms.bidPrice) <= price * 1e-6;
    // only K and the price of one option: what you pay (long) or receive (short)
    const premium = buying ? terms.askPrice : terms.bidPrice;
    return { main: 'K ' + formatPlain(strike), detail: '<span class="gold" style="font-size:15px">' + formatPrice(premium) + '</span>', locked: worthless, tip: 'Worth nothing at this strike', pick: () => goTo('amount', { strike }) };
  });
  if (trade.step === 'position') {
    const lot = selectedLot();
    const addTo = lot
      ? { action: lot.side + 'Option', kind: lot.kind, strike: lot.strike, expiryDay: lot.expiryDay, mode: 'add' }
      : { action: today.shares > 0 ? 'long' : 'short', mode: 'add' };
    return [
      { main: 'ADD', detail: 'more of the same', locked: !!lot && !optionsAllowed(run, lot.side, lot.kind), tip: 'No options during an investigation', pick: () => goTo('amount', addTo) },
      { main: 'CLOSE', detail: 'part or all of it', pick: () => goTo('amount', { mode: 'reduce' }) },
    ];
  }
  return [];
}
function goTo(step, changes) {
  Object.assign(view.trade, changes, { step, selection: 0, message: null });
  if (step === 'amount') view.trade.percent = view.trade.mode === 'reduce' ? 100 : SLIDER_DEFAULT_PERCENT;
  showTrade();
}
// The open trade shown at the top of the 'position' step: x × price = buy-in, its value now and the P&L.
function positionDetails() {
  const run = view.run, today = run.today, price = currentPrice(today), lot = selectedLot();
  const block = (title, first, buyIn, valueNow) => '<div class="positionBox"><div class="line"><span class="gold">' + title + '</span></div>' +
    '<div class="line"><span>' + first + '</span><span>= ' + formatMoney(buyIn) + '</span></div>' +
    '<div class="line ' + colourClass(valueNow - buyIn) + '"><span>now ' + formatMoney(valueNow) + '</span><span>' + formatSignedMoney(valueNow - buyIn) + '</span></div></div>';
  if (!lot) return block('Stock ' + today.ticker, formatSignedCount(today.shares) + ' × ' + formatPrice(today.averageEntry), today.shares * today.averageEntry, today.shares * price);
  const perOption = lot.paid / lot.quantity;
  return block(lotPosition(lot).name + ' · K ' + formatPlain(lot.strike) + ' · ' + daysToExpiry(run, lot) + ' days left',
    formatSignedCount(lotSign(lot) * lot.quantity) + ' × ' + formatPrice(perOption), lotBuyIn(lot), lotValue(run, lot));
}

// The amount step: what the slider's percentage buys right now.
function tradePreview() {
  const run = view.run, trade = view.trade, today = run.today, price = currentPrice(today), fraction = trade.percent / 100;
  if (trade.mode === 'reduce') {
    const lot = selectedLot();
    if (!lot) {
      const shares = today.shares * fraction;
      return {
        amount: formatSignedCount(-shares) + ' × ' + formatPrice(price) + ' = ' + formatMoney(-shares * price),
        note: 'P&L on these ' + formatSignedMoney(shares * (price - today.averageEntry)),
        confirm: 'CLOSE ' + trade.percent + '%', empty: Math.abs(shares) * price < 0.01,
        run: () => reduceStock(run, fraction),
      };
    }
    const quantity = lot.quantity * fraction, cash = lotCloseCash(run, lot, fraction);
    return {
      amount: formatSignedCount(-lotSign(lot) * quantity) + ' × ' + formatPrice(Math.abs(cash) / Math.max(quantity, 1e-12)) + ' = ' + formatMoney(cash),
      note: 'P&L on these ' + formatSignedMoney(cash + lotBuyIn(lot) * -fraction),
      confirm: 'CLOSE ' + trade.percent + '%', empty: quantity * price < 1e-6,
      run: () => closeLot(run, trade.position.index, fraction),
    };
  }
  if (trade.action === 'long' || trade.action === 'short') {
    const direction = trade.action === 'long' ? 1 : -1, room = stockRoom(run, direction);
    const shares = direction * fraction * room;
    return {
      amount: formatSignedCount(shares) + ' × ' + formatPrice(price) + ' = ' + formatMoney(shares * price),
      note: (direction > 0 ? 'of buying power ' + formatMoney(room * price) : 'of the largest short ' + formatMoney(room * price)) + (maximumLeverage(run) > 1 ? ' · ' + maximumLeverage(run) + '×' : ''),
      confirm: direction > 0 ? 'LONG STOCK' : 'SHORT STOCK', empty: room * price < 0.01,
      run: () => tradeStock(run, direction, fraction),
    };
  }
  const terms = optionTerms(run, trade.kind, trade.strike, trade.expiryDay), name = trade.kind.toUpperCase();
  const series = 'K ' + formatPlain(trade.strike) + ' · ' + (trade.expiryDay - run.day) + ' days';
  if (trade.action === 'longOption') {
    const spend = fraction * freeCash(run), quantity = spend / terms.askPrice;
    return {
      amount: formatSignedCount(quantity) + ' × ' + formatPrice(terms.askPrice) + ' = ' + formatMoney(spend),
      note: series + ' · you pay ' + formatPrice(terms.askPrice) + ' per option',
      confirm: 'LONG ' + name, empty: spend < 0.01, run: () => buyOption(run, trade.kind, trade.strike, fraction, trade.expiryDay),
    };
  }
  const quantity = fraction * writeRoom(run);
  return {
    amount: formatSignedCount(-quantity) + ' × ' + formatPrice(terms.bidPrice) + ' = ' + formatMoney(-quantity * terms.bidPrice),
    note: series + ' · you receive ' + formatPrice(terms.bidPrice) + ' per option',
    confirm: 'SHORT ' + name, empty: quantity * terms.bidPrice < 0.01, run: () => writeOption(run, trade.kind, trade.strike, fraction, trade.expiryDay),
  };
}

function showTrade() {
  const run = view.run, trade = view.trade, price = currentPrice(run.today);
  const position = trade.kind ? OPTION_POSITIONS[optionPositionId(trade.action === 'longOption' ? 'long' : 'short', trade.kind)] : null;
  const titles = { action: 'Trade', strike: position ? position.name + ': choose K' : '', position: 'Open trade',
    amount: trade.mode === 'reduce' ? 'How much to close?' : trade.mode === 'add' ? 'How much to add?' : 'How much?' };
  let html = '<div class="card tradeCard"><h1>' + titles[trade.step] + '<small>' + run.today.ticker + ' ' + formatPrice(price) + '</small></h1>';
  if (trade.step === 'action' && trade.message) html += '<div class="amountNote gold" style="text-align:left">' + trade.message + '</div>';
  if (trade.step === 'position' || (trade.step === 'amount' && trade.mode !== 'new')) html += positionDetails();
  if (trade.step === 'strike') html += '<div class="amountNote" style="text-align:left;display:flex;justify-content:space-between"><span>' + position.formula + '</span><span>' + (trade.action === 'longOption' ? 'premium you pay' : 'premium you get') + '</span></div>' +
    '<div class="amountNote" style="text-align:left">S = the price when you exercise: any time, at the latest after ' + OPTION_EXPIRY_DAYS + ' trading days</div>';
  if (trade.step === 'amount') {
    const preview = tradePreview();
    html += '<input class="slider" type="range" min="0" max="100" step="' + SLIDER_STEP_PERCENT + '" value="' + trade.percent + '" id="tradeSlider">' +
      '<div class="sliderEnds"><span>0%</span><span class="gold" style="font-size:14px">' + trade.percent + '%</span><span>100%</span></div>' +
      '<div class="amount">' + preview.amount + '</div><div class="amountNote">' + preview.note + '</div>' +
      '<button class="button primary confirm ' + (preview.empty ? 'locked' : '') + '" data-action="confirmTrade">' + preview.confirm + '<kbd>ENTER</kbd></button>';
  } else {
    let openIndex = 0;
    tradeRows().forEach((row, index) => {
      const icons = (row.openTrades || []).map(open => {
        const letter = OPEN_TRADE_KEYS[openIndex];
        return '<span class="openChip ' + colourClass(open.profit) + '" data-action="openTradeIcon" data-argument="' + openIndex++ + '" data-tip="' + open.hover + '">' + open.icon + '<kbd>' + letter + '</kbd></span>';
      }).join('');
      html += '<div class="choiceRow ' + (index === trade.selection ? 'selected ' : '') + (row.locked && !icons ? 'locked' : '') + '" data-action="tradeRow" data-argument="' + index + '"' + (row.locked ? ' data-tip="' + row.tip + '"' : '') + '>' +
        '<span class="number">' + (index + 1) + '</span><span class="main">' + row.main + '</span>' + icons + '<span class="detail">' + row.detail + '</span></div>';
    });
  }
  html += '<div class="keys">' + (trade.step === 'amount' ? '<span class="key">← →</span> amount' : '<span class="key">1–' + Math.max(1, tradeRows().length) + '</span> new' + (trade.step === 'action' && openTradeIcons().length ? ' <span class="key">a' + (openTradeIcons().length > 1 ? '–' + OPEN_TRADE_KEYS[openTradeIcons().length - 1] : '') + '</span> open trade' : '')) + ' <span class="key">Esc</span> back</div></div>';
  showOverlay('trade', html, true);
  const slider = element('tradeSlider');
  if (slider) slider.addEventListener('input', () => { view.trade.percent = Number(slider.value); refreshAmount(); });
}
// Update only the numbers under the slider while it is dragged (redrawing would drop the drag).
function refreshAmount() {
  const preview = tradePreview(), card = element('overlay');
  card.querySelector('.sliderEnds .gold').textContent = view.trade.percent + '%';
  card.querySelector('.amount').textContent = preview.amount;
  card.querySelector('.amountNote').textContent = preview.note;
  card.querySelector('.confirm').classList.toggle('locked', preview.empty);
  card.querySelector('.confirm').innerHTML = preview.confirm + '<kbd>ENTER</kbd>';
}
// All open trades in the order their icons are drawn (row by row), so key letters and clicks agree.
function openTradeIcons() { return tradeRows().flatMap(row => row.openTrades || []); }
function openTradeIcon(index) {
  const open = openTradeIcons()[index];
  if (open) open.open(); else sounds.denied();
}
function pickTradeRow(index) {
  const row = tradeRows()[index];
  if (!row || row.locked) { sounds.denied(); return; }
  row.pick();
}
function tradeBack() {
  const trade = view.trade;
  const previous = { action: null, strike: 'action', position: 'action',
    amount: trade.mode !== 'new' ? 'position' : trade.strike !== null ? 'strike' : 'action' }[trade.step];
  if (!previous) { hideOverlay(); renderAll(); return; }
  if (previous === 'action') Object.assign(trade, { strike: null, position: null, mode: 'new' });
  if (previous === 'strike') trade.strike = null;
  goTo(previous, {});
}
function confirmTrade() {
  const preview = tradePreview();
  if (preview.empty) { sounds.denied(); return; }
  const outcome = preview.run();
  finishTrade(outcome, preview.confirm);
}
// After a trade from the menu, the menu goes back to its first step (the game stays paused until Esc) and says
// what was done. CLOSE ALL from the action bar has no menu to return to.
function finishTrade(outcome, label) {
  const failed = typeof outcome === 'string';
  if (failed) sounds.denied(); else sounds.trade(1);
  addFloater(failed ? outcome : label, failed ? CHART_COLOURS.label : CHART_COLOURS.insight, failed ? 14 : 16);
  saveRun(); renderAll();
  if (view.trade) {
    Object.assign(view.trade, { step: 'action', mode: 'new', action: null, kind: null, strike: null, expiryDay: null, position: null, selection: 0,
      message: failed ? outcome : '✓ ' + label });
    showTrade();
  }
}

// ── The shop: icon cards in rows, the full sentence only for the selected card, arrows move by position.
const SHOP_ROWS = ['deck', 'trading', 'insider', 'stocks'];
function showShop() {
  const run = view.run, items = shopCatalogue(run);
  view.shopItems = items;
  view.shopSelection = clamp(view.shopSelection, 0, items.length - 1);
  let html = '<div class="card" style="text-align:left"><div class="shopHead"><h1>Shop</h1><span class="slot"><small>cash</small><b>' + formatMoney(run.cash) + '</b></span>' +
    '<span class="slot"><small>prices</small><b>×' + inflationIndex(run.day).toFixed(2) + '</b></span><span class="spacer"></span>' +
    '<button class="button primary" data-action="nextDay">DAY ' + (run.day + 1) + ' ▶<kbd>SPACE</kbd></button></div><div class="shopRows">';
  for (const rowId of SHOP_ROWS) {
    html += '<div class="shopRow"><span class="rowName">' + rowId + '</span>';
    items.forEach((item, index) => {
      if (item.row !== rowId) return;
      const poor = !item.owned && run.cash < item.price;
      html += '<div class="choice ' + (index === view.shopSelection ? 'selected ' : '') + (item.owned ? 'owned' : '') + '" data-action="shopItem" data-argument="' + index + '">' +
        '<span class="icon">' + item.icon + '</span><span class="nm">' + item.name + '</span><span class="chipLine">' + item.chips + '</span>' +
        '<span class="price ' + (poor ? 'poor' : '') + '" ' + (poor ? 'data-tip="Needs ' + formatMoney(item.price - run.cash) + ' more"' : '') + '>' + (item.owned ? '✓ owned' : formatMoney(item.price)) + '</span></div>';
    });
    html += '</div>';
  }
  html += '</div><div id="selectedSentence">' + (items[view.shopSelection] ? items[view.shopSelection].sentence : '') + '</div></div>';
  showOverlay('shop', html);
}
function chooseShopItem(index) {
  const run = view.run, item = view.shopItems[index];
  view.shopSelection = index;
  if (!item) return;
  if (item.owned || run.cash < item.price) { sounds.denied(); showShop(); return; }
  if (item.picker) { view.pickerItem = item; view.pickerTicker = run.ticker; view.pickerSelection = 0; showPicker(); return; }
  if (buyShopItem(run, item)) { sounds.buy(); saveRun(); }
  showShop();
}

// The deck picker: which card (in which deck) a remove / add / event card goes to.
function pickerCards(run) {
  const item = view.pickerItem;
  if (item.picker.startsWith('event:')) return [item.picker.slice(6)];
  return CARD_ORDER.filter(cardId => item.picker === 'add' ? CARD_TYPES[cardId].kind !== 'event' : run.decks[view.pickerTicker][cardId] > 0);
}
function showPicker() {
  const run = view.run, item = view.pickerItem, deck = run.decks[view.pickerTicker];
  const cards = pickerCards(run);
  view.pickerCardsShown = cards;
  view.pickerSelection = clamp(view.pickerSelection, 0, cards.length - 1);
  let html = '<div class="card"><div class="shopHead"><h1>' + item.icon + ' ' + item.name + '</h1><span class="slot"><small>price</small><b>' + formatMoney(item.price) + '</b></span><span class="spacer"></span>' +
    run.tickersOwned.map(tickerId => '<button class="toggle ' + (tickerId === view.pickerTicker ? 'on' : '') + '" data-action="pickerTicker" data-argument="' + tickerId + '">' + TICKERS[tickerId].icon + ' ' + tickerId + ' · ' + deckSize(run.decks[tickerId]) + '</button>').join('') + '</div>';
  html += '<div class="shopRows"><div class="shopRow" style="flex-wrap:wrap;max-width:1040px">';
  cards.forEach((cardId, index) => {
    const allowed = deckEditAllowed(run, item, view.pickerTicker, cardId);
    const after = item.picker === 'remove' ? deck[cardId] - Math.min(deck[cardId], deckBatchSize(run.removalsDone)) : item.picker === 'add' ? deck[cardId] + deckBatchSize(run.additionsDone) : deck[cardId] + 1;
    html += '<div class="choice ' + (index === view.pickerSelection ? 'selected ' : '') + (allowed ? '' : 'locked') + '" data-action="pickCard" data-argument="' + index + '">' +
      chipHtml(cardId) + '<span class="nm">' + cardLabel(cardId) + '</span><span class="chipLine">' + deck[cardId] + ' → ' + after + '</span></div>';
  });
  const selected = cards[view.pickerSelection];
  const share = selected ? deck[selected] / deckSize(deck) : 0;
  html += '</div></div><div id="selectedSentence">' + (selected ? cardLabel(selected) + ' is ' + (share * 100).toFixed(1) + '% of ' + view.pickerTicker + '. Heat +' + HEAT_PER_DECK_EDIT + '.' + (deckEditAllowed(run, item, view.pickerTicker, selected) ? '' : ' Not possible (deck minimum ' + MINIMUM_DECK_SIZE + ').') : '') + '</div>' +
    '<div class="keys"><span class="key">Enter</span> apply <span class="key">Tab</span> deck <span class="key">Esc</span> back</div></div>';
  showOverlay('picker', html);
}
function pickCard(index) {
  const run = view.run, cardId = view.pickerCardsShown[index];
  view.pickerSelection = index;
  if (!cardId || !applyDeckEdit(run, view.pickerItem, view.pickerTicker, cardId)) { sounds.denied(); showPicker(); return; }
  sounds.buy(); saveRun();
  showShop();
}

// Arrow keys move to the nearest card in that direction, by where the cards sit on screen.
function moveSelectionByPosition(selector, currentIndex, dx, dy) {
  const cards = [...document.querySelectorAll(selector)];
  if (!cards.length) return currentIndex;
  const from = cards[currentIndex].getBoundingClientRect();
  const fromX = from.left + from.width / 2, fromY = from.top + from.height / 2;
  let best = currentIndex, bestScore = Infinity;
  cards.forEach((card, index) => {
    if (index === currentIndex) return;
    const box = card.getBoundingClientRect(), x = box.left + box.width / 2, y = box.top + box.height / 2;
    const along = dx ? (x - fromX) * dx : (y - fromY) * dy, across = dx ? Math.abs(y - fromY) : Math.abs(x - fromX);
    if (along <= 4) return;
    const score = along + across * 3;
    if (score < bestScore) { bestScore = score; best = index; }
  });
  if (best === currentIndex && dx) {   // wrap along the row
    const row = cards.map((card, index) => [card.getBoundingClientRect(), index]).filter(([box]) => Math.abs(box.top - from.top) < 10);
    row.sort((a, b) => a[0].left - b[0].left);
    best = (dx > 0 ? row[0] : row[row.length - 1])[1];
  }
  return best;
}

// ═══════════════════════════════════════ § 12 INPUT ═══════════════════════════════════════
function saveRun() { try { if (view.run) localStorage.setItem(SAVE_KEY, serialiseRun(view.run)); } catch (error) { /* storage blocked */ } }
function savePreferences() { try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify({ muted: sound.muted, speedIndex: view.speedIndex })); } catch (error) { /* storage blocked */ } }
function tradingOpen() { const run = view.run; return run && (run.phase === 'preopen' || run.phase === 'trading') && run.today.tick < TICKS_PER_DAY; }

const ACTIONS = {
  newRun() { view.run = newRun(); view.lastEquity = null; hideOverlay(); saveRun(); },
  continueRun() {
    const run = loadRun(localStorage.getItem(SAVE_KEY));
    if (!run) { ACTIONS.newRun(); return; }
    view.run = run; view.lastEquity = null; hideOverlay();
    if (run.phase === 'trading') showMenu();
    else if (run.phase === 'result') showResult();
    else if (run.phase === 'shop') showShop();
  },
  toTitle() { saveRun(); view.paused = false; showTitle(); },
  resume() { view.paused = false; hideOverlay(); },
  menu() { if (view.overlay === 'menu') ACTIONS.resume(); else if (!view.overlay && view.run) showMenu(); },
  closeOverlay() { hideOverlay(); },
  speed() { view.speedIndex = (view.speedIndex + 1) % GAME_SPEEDS.length; savePreferences(); },
  sound() { sound.muted = !sound.muted; savePreferences(); if (view.overlay === 'menu') showMenu(); },
  pause() { if (view.run.phase === 'trading') view.paused = !view.paused; },
  openDeck() { if (!view.overlay) showDeck(); },
  openTrade() { openTrade(); },
  tradeRow(index) { pickTradeRow(index); },
  openTradeIcon(index) { openTradeIcon(index); },
  confirmTrade() { confirmTrade(); },
  closeEverything() { if (tradingOpen() && hasPositions(view.run) && !view.trade) finishTrade(closeEverything(view.run), 'ALL CLOSED'); },
  tip(tipId) { if (useTip(view.run, tipId)) { sounds.tip(); saveRun(); } else sounds.denied(); },
  ticker(tickerId) { if (switchTicker(view.run, tickerId)) saveRun(); else sounds.denied(); },
  openMarket() { if (view.run.phase === 'preopen') { view.run.phase = 'trading'; view.run.today.tickerLocked = true; view.paused = false; saveRun(); } },
  skipToClose() { while (view.run.phase === 'trading') runOneTick(true); },
  afterResult() {
    if (view.run.gameOverReason) { showGameOver(); return; }
    view.run.phase = 'shop'; saveRun(); showShop();
  },
  nextDay() { startNextDay(view.run); view.lastEquity = null; hideOverlay(); saveRun(); },
  shopItem(index) { chooseShopItem(index); },
  pickCard(index) { pickCard(index); },
  pickerTicker(tickerId) { view.pickerTicker = tickerId; view.pickerSelection = 0; showPicker(); },
};
const NUMBER_ARGUMENT_ACTIONS = ['tradeRow', 'openTradeIcon', 'shopItem', 'pickCard'];

// Mouse: every clickable element names its action in data-action (and an optional data-argument).
function handleClick(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.classList.contains('locked')) { sounds.denied(); return; }
  const action = ACTIONS[target.dataset.action];
  if (!action) return;
  const argument = target.dataset.argument;
  action(NUMBER_ARGUMENT_ACTIONS.includes(target.dataset.action) ? Number(argument) : argument);
  if (!view.overlay || view.overlay === 'menu') renderAll();
}

function handleKey(event) {
  const key = event.key;
  if (event.metaKey || event.ctrlKey || !view.run) return;
  const overlay = view.overlay;
  if (overlay === 'trade') {
    const trade = view.trade;
    if (key === 'Escape') tradeBack();
    else if (trade.step === 'amount') {
      if (key === 'ArrowLeft' || key === 'ArrowRight') { trade.percent = clamp(trade.percent + (key === 'ArrowRight' ? 1 : -1) * SLIDER_STEP_PERCENT, 0, 100); element('tradeSlider').value = trade.percent; refreshAmount(); }
      else if (key === 'Enter') confirmTrade();
    } else {
      const rows = tradeRows();
      if (/^[1-9]$/.test(key)) pickTradeRow(Number(key) - 1);
      else if (trade.step === 'action' && key.length === 1 && OPEN_TRADE_KEYS.includes(key.toLowerCase())) openTradeIcon(OPEN_TRADE_KEYS.indexOf(key.toLowerCase()));
      else if (key === 'ArrowDown' || key === 'ArrowUp') { trade.selection = (trade.selection + (key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length; showTrade(); }
      else if (key === 'Enter') pickTradeRow(trade.selection);
    }
    event.preventDefault(); return;
  }
  if (overlay === 'shop' || overlay === 'picker') {
    const isShop = overlay === 'shop';
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (arrows[key]) {
      const [dx, dy] = arrows[key];
      if (isShop) { view.shopSelection = moveSelectionByPosition('.choice', view.shopSelection, dx, dy); showShop(); }
      else { view.pickerSelection = moveSelectionByPosition('.choice', view.pickerSelection, dx, dy); showPicker(); }
      event.preventDefault(); return;
    }
    if (key === 'Enter') { isShop ? chooseShopItem(view.shopSelection) : pickCard(view.pickerSelection); return; }
    if (key === 'Escape' && !isShop) { showShop(); return; }
    if (key === 'Tab' && !isShop) { const owned = view.run.tickersOwned; view.pickerTicker = owned[(owned.indexOf(view.pickerTicker) + 1) % owned.length]; showPicker(); event.preventDefault(); return; }
    if (key === ' ' && isShop) { ACTIONS.nextDay(); renderAll(); event.preventDefault(); }
    return;
  }
  const confirmKey = key === ' ' || key === 'Enter';
  if (overlay === 'title') { if (confirmKey) { (localStorage.getItem(SAVE_KEY) ? ACTIONS.continueRun : ACTIONS.newRun)(); renderAll(); } return; }
  if (overlay === 'result') { if (confirmKey) { ACTIONS.afterResult(); event.preventDefault(); } return; }
  if (overlay === 'gameover') { if (confirmKey) { ACTIONS.newRun(); renderAll(); event.preventDefault(); } return; }
  if (overlay === 'menu') { if (key === 'Escape' || key === ' ') { ACTIONS.resume(); renderAll(); } return; }
  if (overlay === 'deck') { if (key === 'Escape' || key.toLowerCase() === 'd') hideOverlay(); return; }
  const keyActions = {
    t: ACTIONS.openTrade, x: ACTIONS.closeEverything, d: ACTIONS.openDeck, k: ACTIONS.skipToClose,
    f: ACTIONS.speed, m: ACTIONS.sound, Escape: ACTIONS.menu,
    ' ': () => (view.run.phase === 'preopen' ? ACTIONS.openMarket() : ACTIONS.pause()),
  };
  const handler = keyActions[key.length === 1 ? key.toLowerCase() : key];
  if (handler) { handler(); event.preventDefault(); if (!view.overlay || view.overlay === 'menu') renderAll(); }
}

// Instant tooltips for anything with data-tip.
function handleMouseMove(event) {
  const tooltip = element('tooltip'), target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) { tooltip.style.display = 'none'; return; }
  tooltip.textContent = target.dataset.tip;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, event.clientX + 14) + 'px';
  tooltip.style.top = Math.min(window.innerHeight - tooltip.offsetHeight - 8, event.clientY + 16) + 'px';
}

// ═══════════════════════════════════════ § 13 START ═══════════════════════════════════════
// One tick of the live day, with its sound and shake. quiet = skipping to the close.
function runOneTick(quiet) {
  const run = view.run, before = totalEquity(run);
  const outcome = advanceTick(run);
  view.freshTick = run.today.tick;
  if (!quiet) {
    const drama = Math.max(0, ...outcome.cards.map(cardDrama));
    const priceNow = currentPrice(run.today), priceBefore = run.today.schedule.states[run.today.tick - 1].price;
    if (drama > 0) { shakeChart(drama); sounds.bigCard(priceNow >= priceBefore); }
    else if (outcome.cards.length) sounds.tick(priceNow - priceBefore);
    const change = totalEquity(run) - before;
    if (Math.abs(change) > Math.max(1, Math.abs(before) * 0.01)) addFloater(formatSignedMoney(change), change > 0 ? CHART_COLOURS.up : CHART_COLOURS.down, drama === 2 ? 26 : 18);
  }
  if (outcome.message) { sounds.bad(); addFloater(outcome.message, CHART_COLOURS.stop, 22); }
  if (outcome.closed) {
    const result = closeDay(run);
    saveRun();
    sounds.cash(result.endEquity >= result.startEquity);
    renderAll();
    showResult();
  }
}

let lastFrameTime = null;
function frame(time) {
  const seconds = lastFrameTime === null ? 0 : Math.min(0.25, (time - lastFrameTime) / 1000);
  lastFrameTime = time;
  const run = view.run;
  if (run && run.phase === 'trading' && !view.paused && !view.overlay) {
    const today = run.today, scaled = seconds * GAME_SPEEDS[view.speedIndex];
    if (today.haltSecondsLeft > 0) today.haltSecondsLeft = Math.max(0, today.haltSecondsLeft - scaled);
    else today.tickClock += scaled;
    if (today.tickClock >= SECONDS_PER_TICK) {
      today.tickClock -= SECONDS_PER_TICK;
      runOneTick(false);
      if (run.phase === 'trading') { saveRun(); renderAll(); }
    }
  }
  element('pauseNote').style.display = view.paused && run && run.phase === 'trading' && !view.overlay ? 'grid' : 'none';
  drawChart();
  requestAnimationFrame(frame);
}

function start() {
  try { const preferences = JSON.parse(localStorage.getItem(PREFERENCES_KEY)) || {}; sound.muted = !!preferences.muted; view.speedIndex = preferences.speedIndex || 0; } catch (error) { /* defaults */ }
  if (new URLSearchParams(location.search).has('mute')) sound.muted = true;
  try { const saved = localStorage.getItem(SAVE_KEY); view.run = saved ? loadRun(saved) : null; } catch (error) { view.run = null; }
  if (!view.run) view.run = newRun();
  showTitle();
  renderAll();
  document.addEventListener('click', handleClick);
  document.addEventListener('keydown', handleKey);
  document.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('resize', renderAll);
  requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') start();
