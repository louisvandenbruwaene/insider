<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#151920;--panel2:#1d232c;--line:#2c3440;--ink:#edf1f5;--dim:#8592a3;--faint:#4a5563;
  --up:#3ddc84;--down:#ff5a5f;--vol:#6cb6ff;--event:#ffc94d;--heat:#ff8a3d;--accent:#ffc94d;
  --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px var(--sans);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)} .heat{color:var(--heat)} .gold{color:var(--accent)}

#app{position:fixed;inset:0;display:grid;grid-template-columns:310px 1fr;gap:18px;padding:18px}

/* the side menu: the only place with numbers */
#side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;min-height:0}
#brand{font:800 14px var(--mono);letter-spacing:.3em;color:var(--accent)}
.sideHead{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.sideHead b{font-size:15px}
.clock{font:800 24px var(--mono)}
.label{font:700 10px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:14px;display:flex;justify-content:space-between}
.value{font-size:22px;font-weight:800;margin-top:2px}
.line{font-size:13px;height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.rule{border-top:1px solid var(--line);margin-top:14px}
.heatBar{height:6px;border-radius:3px;background:#2a2016;overflow:hidden;margin-top:6px}
.heatBar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff5a3d)}
.sideButtons{margin-top:auto;display:flex;gap:8px;padding-top:14px}
.sideButtons .button{flex:1}
.flashUp{animation:flashUp .45s} .flashDown{animation:flashDown .45s}
@keyframes flashUp{0%{color:var(--up);transform:scale(1.06)}}
@keyframes flashDown{0%{color:var(--down);transform:scale(1.06)}}

/* the main column: chart, then the buttons to press */
#mainColumn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-width:0}
#chartBox{position:relative;width:100%;max-width:980px;height:clamp(260px,54vh,520px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#chart{width:100%;height:100%;display:block}
#lastCards{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
#pauseNote{position:absolute;inset:0;display:none;place-items:center;font:800 32px var(--mono);letter-spacing:.3em;color:var(--accent);background:rgba(0,0,0,.45);pointer-events:none}
.shake{animation:shake .35s} .shakeBig{animation:shakeBig .6s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shakeBig{10%{transform:translate(-12px,5px)}25%{transform:translate(11px,-6px)}40%{transform:translate(-9px,4px)}55%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}
#actions{display:flex;gap:10px;align-items:center;justify-content:center;height:70px;width:100%;max-width:980px}
#actions .gap{width:18px}

.button{font:800 13px var(--sans);letter-spacing:.06em;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel2);padding:12px 18px;cursor:pointer;white-space:nowrap}
.button:hover{filter:brightness(1.2)} .button:active{transform:translateY(2px);border-bottom-width:1px}
.button.primary{background:#3b3014;border-color:#8a6d22;color:#ffe08a;padding:14px 30px;font-size:15px}
.button.locked{opacity:.35;cursor:default;filter:none}
.button kbd{font:600 10px var(--mono);opacity:.55;margin-left:6px}
.button.suggest{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,201,77,.3),0 0 24px rgba(255,201,77,.35)}}
.tipButton{width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;align-content:center;cursor:pointer;position:relative;font:700 10px var(--mono);color:var(--heat)}
.tipButton .icon{font-size:20px;line-height:1.1}
.tipButton.used{border-color:var(--accent);background:#2e2812}
.tipButton.locked,.tipButton.cooling,.tipButton.unavailable{opacity:.3;cursor:default}
.tipButton .cd{position:absolute;top:2px;right:4px;color:var(--dim)}
.toggle{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:700 12px var(--sans)}
.toggle.on{background:#2b3a52;border-color:var(--vol);color:#d3e8ff}
.toggle.locked{opacity:.35;cursor:default}

/* card chips (the last card drawn, the deck window, the deck picker) */
.chip{flex:none;height:30px;min-width:46px;padding:0 8px;border-radius:7px;display:inline-grid;place-items:center;font:700 12px var(--mono);border:1px solid;background:var(--panel2)}
.chip.price.pos{color:var(--up);border-color:#1f6b43} .chip.price.neg{color:var(--down);border-color:#7a2b2e}
.chip.vol{color:var(--vol);border-color:#2a4f78} .chip.event{color:var(--event);border-color:#7a5f1f}
.chip.extreme{box-shadow:0 0 0 2px currentColor inset}
.chip.future{border-style:dashed;opacity:.75}
.chip.fresh{animation:pop .3s}
@keyframes pop{0%{transform:translateY(-10px) scale(1.35)}}

/* overlays */
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
#overlay.soft{background:rgba(5,6,8,.45);backdrop-filter:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 30px;box-shadow:0 10px 0 #050608;text-align:center;max-width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font:800 26px var(--sans)}
.card .title{font:800 54px var(--mono);letter-spacing:.3em;color:var(--accent);margin:8px 0 2px}
.card .huge{font:800 56px var(--mono);margin:6px 0;font-variant-numeric:tabular-nums}
.card .note{color:var(--dim);margin:5px 0;font-family:var(--mono)}
.menuButtons{display:flex;gap:12px;justify-content:center;margin-top:18px}
.key{font:600 12px var(--mono);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 7px;background:var(--panel2)}
.keys{margin-top:16px;display:flex;gap:8px;justify-content:center;align-items:center;color:var(--dim)}

/* the trade menu: one question at a time */
.tradeCard{width:560px;text-align:left}
.tradeCard h1{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.tradeCard h1 small{font:600 13px var(--mono);color:var(--dim)}
.choiceRow{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-top:7px;cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
.choiceRow .number{color:var(--faint);width:12px}
.choiceRow .main{font-weight:800;font-size:15px;white-space:nowrap}
.choiceRow .detail{white-space:nowrap}
.choiceRow .detail{margin-left:auto;color:var(--dim);font-size:12px}
.choiceRow.selected{border-color:var(--accent);background:#2a2514}
.choiceRow.locked{opacity:.35;cursor:default}
.openChip{height:28px;padding:0 6px;border-radius:7px;border:1px solid currentColor;background:var(--panel);display:inline-flex;align-items:center;gap:3px;font-size:15px;cursor:pointer;flex:none}
.openChip kbd{font:700 10px var(--mono)}
.openChip:hover{filter:brightness(1.3)}
.positionBox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0 4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.slider{width:100%;accent-color:var(--accent);margin:18px 0 6px;height:26px}
.sliderEnds{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--faint)}
.amount{font:800 20px var(--mono);text-align:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.amountNote{font:600 12px var(--mono);text-align:center;color:var(--dim);height:18px}
.tradeCard .confirm{width:100%;margin-top:16px}

/* the deck window */
.card.fullScreen{width:calc(100vw - 48px);height:calc(100vh - 48px);display:flex;flex-direction:column}
.deckGrid{flex:1;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr;gap:14px;margin-top:18px;min-height:0}
.deckCard{border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:10px;font:700 14px var(--mono)}
.deckCard .chip{height:40px;min-width:70px;font-size:16px}
.deckCard .count{font-size:26px} .deckCard .count small{color:var(--faint);font-size:14px}
.deckCard.gone{opacity:.3}

/* shop and deck picker cards */
.shopHead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.shopHead h1{margin:0}
.spacer{flex:1}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;font-family:var(--mono)}
.slot small{font:600 10px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.shopRows{display:grid;gap:10px;text-align:left}
.shopRow{display:flex;gap:10px;align-items:center}
.shopRow .rowName{width:72px;font:700 11px var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.choice{width:118px;height:118px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;box-shadow:0 4px 0 #050608;transition:transform .08s;position:relative;text-align:center;padding:4px}
.choice .icon{font-size:30px;line-height:1.1}
.choice .nm{font:700 12px var(--sans)}
.choice .chipLine{font:700 11px var(--mono);color:var(--dim)}
.choice .price{font:700 12px var(--mono);color:var(--accent)}
.choice .price.poor{color:var(--down)}
.choice.selected{border-color:var(--accent);transform:translateY(-5px);box-shadow:0 9px 0 #050608,0 0 18px rgba(255,201,77,.25)}
.choice.owned{opacity:.45} .choice.owned .price{color:var(--up)}
.choice.locked{opacity:.35}
#selectedSentence{height:24px;margin-top:14px;color:var(--ink);font-size:15px}
#tooltip{position:fixed;z-index:20;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:600 12px var(--sans);display:none;max-width:260px}
</style></head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="mainColumn">
    <div id="chartBox"><canvas id="chart"></canvas><div id="lastCards"></div><div id="pauseNote">PAUSED</div></div>
    <div id="actions"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="tooltip"></div>
<script id="game">
"use strict";
/* INSIDER — a trading roguelike. A stock's price is a deck of cards: every second one card is drawn and moves the
   price (up +1%, BEAR −50%) or its volatility σ (volUP: every later move is 5% bigger). The deck is fair, so the
   edge has to come from you: insider tips you use before the open (they raise SEC heat), cards you strip out of or
   add to the deck in the shop, and the leverage and options you unlock. Trading money and shop money are the same
   cash. Every day prices inflate 1%, every 10 days the investors want to see a target, and the run ends when you
   have no money left to trade.

   File guide (search "§ 1" etc.):
   § 1 SETTINGS        every tunable number, card, ticker, tip and shop price
   § 2 HELPERS         number formatting, seeded random numbers, shuffling
   § 3 DECKS           card labels, deck sizes, turning a deck into a pile of cards
   § 4 MARKET          one tick of the market, the day's schedule, the market maker's forecast
   § 5 ACCOUNT         equity, stock trades, bought and written options, margin calls, the close
   § 6 INSIDER & HEAT  what each tip reveals, heat, investigations
   § 7 RUN             new run, days, meetings, the shop catalogue, saving
   § 8 SOUND           small synthesised effects
   § 9 CHART           the price path and the forecast (top 10%, average, bottom 10%)
   § 10 PANELS         the side menu, the action buttons, the last card drawn
   § 11 OVERLAYS       title, menu, day result, game over, deck window, trade menu, shop, deck picker
   § 12 INPUT          mouse actions, keyboard, tooltips
   § 13 START          main loop and start-up (only in a browser; tools/ load §1-§7 headless) */

// ═══════════════════════════════════════ § 1 SETTINGS ═══════════════════════════════════════
const SAVE_KEY = 'insider.save.v1';             // the running game (written every tick, so quitting mid-day resumes there)
const RECORDS_KEY = 'insider.records.v1';       // best equity and longest run, kept across runs
const PREFERENCES_KEY = 'insider.preferences.v1'; // sound and speed

// 1.1 The run
const STARTING_CASH = 1000;
const INFLATION_PER_DAY = 0.01;                 // shop prices grow ×(1.01)^(day−1); stocks gain 1% overnight
const BASE_OPEN_PRICE = 100;                    // a stock opens day 1 at this price (after a week of history)
const MINIMUM_CASH_TO_TRADE = 10;               // × inflation: below this after the close the run is over

// 1.2 The trading day
const TICKS_PER_DAY = 90;                       // one card (or one event) per tick
const SECONDS_PER_TICK = 1;                     // at 1× speed
const GAME_SPEEDS = [1, 2, 4];
const HALT_SECONDS = 10;                        // a Halt card freezes the price this long (you can still trade)

// 1.3 Cards. Price cards move the price by move × σ. Vol cards multiply σ by factor. σ starts each day at 1.
const CARD_TYPES = {
  up:       { kind: 'price', move: +0.01 },
  down:     { kind: 'price', move: -0.01 },
  UP:       { kind: 'price', move: +0.05 },
  DOWN:     { kind: 'price', move: -0.05 },
  bull:     { kind: 'price', move: +0.10 },
  bear:     { kind: 'price', move: -0.10 },
  BULL:     { kind: 'price', move: +0.50 },
  BEAR:     { kind: 'price', move: -0.50 },
  volup:    { kind: 'vol', factor: 1.01 },
  voldown:  { kind: 'vol', factor: 0.99 },
  volUP:    { kind: 'vol', factor: 1.05 },
  volDOWN:  { kind: 'vol', factor: 0.95 },
  volbull:  { kind: 'vol', factor: 1.10 },
  volbear:  { kind: 'vol', factor: 0.90 },
  volBULL:  { kind: 'vol', factor: 1.50 },
  volBEAR:  { kind: 'vol', factor: 0.50 },
  earnings: { kind: 'event', icon: '📊', name: 'Earnings', sentence: 'The next 3 cards all hit the price in the same second.' },
  fed:      { kind: 'event', icon: '🏛', name: 'Fed speech', sentence: 'σ is doubled for the next 15 ticks.' },
  halt:     { kind: 'event', icon: '⏸', name: 'Halt', sentence: 'The price freezes for 10 seconds. You can still trade.' },
  momentum: { kind: 'event', icon: '🔁', name: 'Momentum', sentence: 'Repeats the last price move.' },
  squeeze:  { kind: 'event', icon: '🚀', name: 'Squeeze', sentence: 'Shorts are forced to buy: price +25% × σ.' },
};
const CARD_ORDER = ['up', 'down', 'UP', 'DOWN', 'bull', 'bear', 'BULL', 'BEAR',
  'volup', 'voldown', 'volUP', 'volDOWN', 'volbull', 'volbear', 'volBULL', 'volBEAR',
  'earnings', 'fed', 'halt', 'momentum', 'squeeze'];
const EVENT_CARDS = ['earnings', 'fed', 'halt', 'momentum', 'squeeze'];
const PRICE_MOVE_FLOOR = -0.9;                  // no single move takes more than 90% off the price
const SIGMA_MINIMUM = 0.25, SIGMA_MAXIMUM = 4;
const EARNINGS_EXTRA_CARDS = 3;
const FED_TICKS = 15, FED_SIGMA_MULTIPLIER = 2;
const SQUEEZE_MOVE = 0.25;
const BIG_CARD_MOVE = 0.10;                     // price moves this big (or vol factors this far from 1) shake the chart

// 1.4 Tickers: each stock is its own deck. NOVA is the starting stock; the others are bought in the shop.
const MIRRORED = (small, medium, large, huge) => ({ small, medium, large, huge });
function buildDeck(price, vol) {
  return {
    up: price.small, down: price.small, UP: price.medium, DOWN: price.medium,
    bull: price.large, bear: price.large, BULL: price.huge, BEAR: price.huge,
    volup: vol.small, voldown: vol.small, volUP: vol.medium, volDOWN: vol.medium,
    volbull: vol.large, volbear: vol.large, volBULL: vol.huge, volBEAR: vol.huge,
    earnings: 0, fed: 0, halt: 0, momentum: 0, squeeze: 0,
  };
}
const TICKERS = {
  NOVA: { name: 'Nova Corp', icon: '◆', sentence: 'The starting stock: every card has its mirror.',
          deck: buildDeck(MIRRORED(100, 100, 10, 1), MIRRORED(100, 100, 10, 1)) },
  UTIL: { name: 'Util Power', icon: '⚡', sentence: 'A calm utility: mostly 1% moves, no BULL or BEAR.',
          deck: buildDeck(MIRRORED(200, 30, 2, 0), MIRRORED(200, 30, 2, 0)) },
  BIOX: { name: 'Biox Labs', icon: '🧬', sentence: 'A biotech on trial news: 10% and 50% moves are common.',
          deck: buildDeck(MIRRORED(40, 60, 30, 5), MIRRORED(40, 60, 30, 5)) },
};
const STARTING_TICKER = 'NOVA';

// 1.5 Costs: the only costs in the game are transaction costs
const STOCK_TRANSACTION_COST = 0.001;           // 0.1% of the traded value
const OPTION_TRANSACTION_COST = 0.03;           // options are bought 3% above and sold 3% below fair value

// 1.6 The trade menu
const SLIDER_DEFAULT_PERCENT = 50;              // the amount slider starts here …
const SLIDER_STEP_PERCENT = 5;                  // … and moves in these steps (← → keys too)
const CALL_STRIKE_OFFSETS = [-0.1, 0, 0.05, 0.1, 0.2, 0.35, 0.5, 1];      // strikes offered, vs the current price
const PUT_STRIKE_OFFSETS = [0.1, 0, -0.05, -0.1, -0.2, -0.35, -0.5, -0.75];
const LEVERAGE_TIERS = [1, 2, 5, 10, 25, 100];  // buying power = equity × leverage
const LEVERAGE_PRICES = [0, 250, 1500, 8000, 50000, 500000];
const MAINTENANCE_SHARE = 0.5;                  // margin call when equity < exposure × this ÷ leverage

// 1.7 The market maker prices options fairly from the cards left in the deck
const FORECAST_PATHS = 600;                     // simulated futures per forecast
const FORECAST_DAYS_AHEAD = 7;                  // the forecast runs to the close 7 trading days after today
const FORECAST_EVERY_TICKS = 3;                 // re-run it this often during the day (and before every trade)
const FORECAST_LOW_QUANTILE = 0.1;              // the chart shows the bottom 10%, the average and the top 10% close
const FORECAST_HIGH_QUANTILE = 0.9;
const OPTION_EXPIRY_DAYS = 7;                   // options expire at the close 7 trading days after they are traded
const HISTORY_DAYS = 7;                         // the chart shows the previous week

// 1.8 Insider tips: used before the open, each adds heat and then rests for some days
const INSIDER_TIPS = {
  rumour:     { icon: '👂', name: 'Rumour',     heat: 10, cooldownDays: 1, price: 0,     short: '▲ / ▼',   sentence: 'Tells you if the stock closes above or below the open.' },
  analyst:    { icon: '📝', name: 'Analyst',    heat: 20, cooldownDays: 2, price: 700,   short: '±3%',     sentence: 'The close lies inside a band 6% wide.' },
  peek:       { icon: '👁', name: 'Peek',       heat: 25, cooldownDays: 2, price: 1200,  short: '10 cards', sentence: 'Shows the first 10 cards of the day, in order.' },
  volatility: { icon: '〰', name: 'Vol tip',    heat: 15, cooldownDays: 2, price: 500,   short: 'σ path',   sentence: 'Draws the day\'s σ over the chart.' },
  exactClose: { icon: '🎯', name: 'The Call',   heat: 60, cooldownDays: 5, price: 20000, short: 'close',    sentence: 'The exact closing price.' },
};
const TIP_ORDER = ['rumour', 'analyst', 'peek', 'volatility', 'exactClose'];
const STARTING_TIPS = ['rumour'];
const ANALYST_BAND = 0.03;                      // the band reaches this far either side of its centre
const PEEK_CARDS = 10;

// 1.9 Heat and the SEC
const HEAT_LIMIT = 100;                         // reaching it at the close starts an investigation
const HEAT_DECAY_PER_DAY = 12;
const ABNORMAL_RETURN = 0.25;                   // a day above +25% draws attention …
const HEAT_PER_ABNORMAL_RETURN = 40;            // … this much heat per +100% above it …
const HEAT_ABNORMAL_CAP = 50;                   // … at most this much in one day
const HEAT_PER_DECK_EDIT = 4;                   // rigging the deck is noticed too
const INVESTIGATION_DAYS = 3;                   // no tips, no options, leverage 1×
const HEAT_AFTER_INVESTIGATION = 50;

// 1.10 Investor meetings: at the close of every 10th day equity must reach STARTING_CASH × inflation × the multiple
const MEETING_EVERY_DAYS = 10;
const MEETING_MULTIPLES = [1.2, 2, 5, 20, 100, 800, 1e4, 2e5, 1e7, 1e9];
const MEETING_GROWTH_AFTER_LAST = 30;           // the endless meetings after the last one grow ×30 each

// 1.11 The shop (all prices × inflation)
const DECK_BATCH_FIRST = 10;                    // the first remove takes 10 cards, the next 9, … down to 1
const DECK_BATCH_MINIMUM = 1;
const REMOVE_PRICE = 100, ADD_PRICE = 100;
const DECK_EDIT_PRICE_GROWTH = 1.6;             // each remove (or add) costs this much more than the last
const MINIMUM_DECK_SIZE = 150;                  // a deck is never thinned below this
const EVENT_CARD_PRICES = { earnings: 250, fed: 200, halt: 150, momentum: 300, squeeze: 400 };
const EVENT_PRICE_GROWTH = 1.3;                 // each copy bought costs this much more
// The four option positions, each bought separately in the shop (shorting stock needs no unlock).
// P&L per option. S = the stock price when the option is exercised (any time up to expiry, OPTION_EXPIRY_DAYS
// trading days after the trade), K = the strike, premium = the option's price (paid long, received short).
const OPTION_POSITIONS = {
  longCall:  { side: 'long',  kind: 'call', name: 'Long call',  icon: '📈', price: 300, formula: 'P&L = max(S − K, 0) − premium' },
  shortCall: { side: 'short', kind: 'call', name: 'Short call', icon: '🧾', price: 400, formula: 'P&L = premium − max(S − K, 0)' },
  longPut:   { side: 'long',  kind: 'put',  name: 'Long put',   icon: '🛡', price: 300, formula: 'P&L = max(K − S, 0) − premium' },
  shortPut:  { side: 'short', kind: 'put',  name: 'Short put',  icon: '🪙', price: 400, formula: 'P&L = premium − max(K − S, 0)' },
};
const TICKER_PRICES = { UTIL: 800, BIOX: 1500 };

// 1.12 Look
const CHART_COLOURS = { up: '#3ddc84', down: '#ff5a5f', average: '#edf1f5', open: '#3a4350', label: '#8592a3', grid: '#1e242d', history: '#6b7686',
  entry: '#ffc94d', stop: '#ff8a3d', insight: '#ffc94d', sigma: '#6cb6ff' };
const CHART_HISTORY_SHARE = 0.34;               // share of the chart's width for the previous week …
const CHART_TODAY_SHARE = 0.42;                 // … for today (the rest is the forecast fan)
const CHART_HISTORY_STEP = 3;                   // draw every 3rd tick of past days
const SIDE_LOTS_SHOWN = 3;
const STOCK_ICON = '📦';                         // marks the open stock position in the trade menu (options use their own icon)
const OPEN_TRADE_KEYS = 'abcdefghijklmnopqrstuvwxyz'; // keys that open the open trades' icons, in order                      // option lots listed in the side menu
const FLOATER_SECONDS = 1.2;                    // P&L pops and messages over the chart fade in this time
const FLOATERS_SHOWN = 3;                       // at most this many at once, stacked

// ═══════════════════════════════════════ § 2 HELPERS ═══════════════════════════════════════
// Money and big numbers: plain below 10 000, then K/M/B/T, then scientific notation.
function formatMoney(value) {
  const sign = value < 0 ? '−' : '';
  const size = Math.abs(value);
  if (size < 100) return sign + '$' + size.toFixed(2);
  if (size < 1e4) return sign + '$' + Math.round(size).toLocaleString('en-US');
  const units = [[1e15, 'Q'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  if (size >= 1e18) return sign + '$' + size.toExponential(2).replace('e+', 'e');
  for (const [unit, letter] of units) if (size >= unit) return sign + '$' + (size / unit).toFixed(size / unit < 100 ? 2 : 1) + letter;
  return sign + '$' + size.toFixed(0);
}
function formatPrice(price) { return price < 1e4 ? '$' + price.toFixed(2) : formatMoney(price); }
function formatSignedMoney(value) { return (value >= 0 ? '+' : '') + formatMoney(value); }
function formatPercent(fraction, digits = 1) { return (fraction >= 0 ? '+' : '−') + Math.abs(fraction * 100).toFixed(digits) + '%'; }
function formatCount(value) {
  if (Math.abs(value) < 1000) return value.toFixed(Math.abs(value) < 10 ? 2 : 1);
  return formatMoney(value).replace('$', '');
}

// Seeded random numbers (mulberry32), so a day's shuffle is the same after a reload.
function makeRandom(seed) {
  let state = seed >>> 0;
  return function random() {
    state = (state + 0x6D2B79F5) >>> 0;
    let mixed = Math.imul(state ^ (state >>> 15), 1 | state);
    mixed = (mixed + Math.imul(mixed ^ (mixed >>> 7), 61 | mixed)) ^ mixed;
    return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
  };
}
function mixSeed(...numbers) {
  let hash = 2166136261;
  for (const number of numbers) { hash ^= number >>> 0; hash = Math.imul(hash, 16777619); }
  return hash >>> 0;
}
function shuffleInPlace(list, random) {
  for (let index = list.length - 1; index > 0; index--) {
    const other = Math.floor(random() * (index + 1));
    [list[index], list[other]] = [list[other], list[index]];
  }
  return list;
}
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function inflationIndex(day) { return Math.pow(1 + INFLATION_PER_DAY, day - 1); }

// ═══════════════════════════════════════ § 3 DECKS ═══════════════════════════════════════
// The short text on a card chip: "+5%" for price cards, "σ+5%" for vol cards, the icon for events.
function cardValueText(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.kind === 'price') return (card.move > 0 ? '+' : '−') + Math.abs(card.move * 100) + '%';
  if (card.kind === 'vol') return 'σ' + (card.factor > 1 ? '+' : '−') + Math.round(Math.abs(card.factor - 1) * 100) + '%';
  return card.icon;
}
function cardLabel(cardId) { return CARD_TYPES[cardId].kind === 'event' ? CARD_TYPES[cardId].name : cardId; }
// Is this card dramatic enough to shake the chart? (2 = a BULL/BEAR-sized shock)
function cardDrama(cardId) {
  const card = CARD_TYPES[cardId];
  if (card.kind === 'price') return Math.abs(card.move) >= 0.5 ? 2 : Math.abs(card.move) >= BIG_CARD_MOVE ? 1 : 0;
  if (card.kind === 'vol') return Math.abs(card.factor - 1) >= 0.5 ? 2 : Math.abs(card.factor - 1) >= BIG_CARD_MOVE ? 1 : 0;
  return 1;
}
function deckSize(deck) { return CARD_ORDER.reduce((total, cardId) => total + (deck[cardId] || 0), 0); }
// All the cards of a deck as one list of ids, ready to shuffle.
function deckToPile(deck) {
  const pile = [];
  for (const cardId of CARD_ORDER) for (let copy = 0; copy < (deck[cardId] || 0); copy++) pile.push(cardId);
  return pile;
}
function countCards(pile) {
  const counts = {};
  for (const cardId of CARD_ORDER) counts[cardId] = 0;
  for (const cardId of pile) counts[cardId]++;
  return counts;
}

// ═══════════════════════════════════════ § 4 MARKET ═══════════════════════════════════════
// The market state is { price, sigma, fedTicksLeft, lastPriceMove }. One tick draws one card (an Earnings card draws
// three more) through drawCard(), which returns a card id or null when the pile is empty. The same function runs the
// real day and the market maker's simulations, so the forecast is exactly as fair as the game.
function applyPriceMove(market, rawMove) {
  const sigma = market.sigma * (market.fedTicksLeft > 0 ? FED_SIGMA_MULTIPLIER : 1);
  market.price *= 1 + Math.max(PRICE_MOVE_FLOOR, rawMove * sigma);
  market.lastPriceMove = rawMove;
}
function applyCard(market, cardId, drawCard, cardsApplied) {
  const card = CARD_TYPES[cardId];
  cardsApplied.push(cardId);
  if (card.kind === 'price') applyPriceMove(market, card.move);
  else if (card.kind === 'vol') market.sigma = clamp(market.sigma * card.factor, SIGMA_MINIMUM, SIGMA_MAXIMUM);
  else if (cardId === 'earnings') {
    for (let extra = 0; extra < EARNINGS_EXTRA_CARDS; extra++) {
      const next = drawCard();
      if (next !== null) applyCard(market, next, drawCard, cardsApplied);
    }
  }
  else if (cardId === 'fed') market.fedTicksLeft = FED_TICKS + 1;
  else if (cardId === 'momentum') applyPriceMove(market, market.lastPriceMove);
  else if (cardId === 'squeeze') applyPriceMove(market, SQUEEZE_MOVE);
  // 'halt' does nothing to the price: the live day pauses on it
}
function tickMarket(market, drawCard) {
  if (market.fedTicksLeft > 0) market.fedTicksLeft--;
  const cardsApplied = [];
  const cardId = drawCard();
  if (cardId !== null) applyCard(market, cardId, drawCard, cardsApplied);
  return cardsApplied;
}

// The deck is dealt from a shoe: the shuffled cards not drawn yet. The shoe lasts several days (NOVA: 844 cards at
// 90 a day); when it runs out a fresh shuffle of the whole deck replaces it, in the middle of a day if need be.
// The whole day is fixed at the open: insider tips read this schedule, the live day replays it one tick per second.
// schedule.shoes holds the shoe the day starts with (and a fresh one if it ran out); positions[tick] = [shoe, index].
function scheduleDay(shoe, deck, openPrice, random) {
  const shoes = [shoe.slice()];
  let shoeIndex = 0, position = 0, drawn = 0;
  const drawCard = () => {
    if (position >= shoes[shoeIndex].length) { shoes.push(shuffleInPlace(deckToPile(deck), random)); shoeIndex++; position = 0; }
    drawn++;
    return shoes[shoeIndex][position++];
  };
  const market = { price: openPrice, sigma: 1, fedTicksLeft: 0, lastPriceMove: 0 };
  const schedule = { states: [{ ...market }], cards: [[]], shoes, positions: [[0, 0]], drawnBefore: [0] };
  for (let tick = 1; tick <= TICKS_PER_DAY; tick++) {
    schedule.cards.push(tickMarket(market, drawCard));
    schedule.states.push({ ...market });
    schedule.positions.push([shoeIndex, position]);
    schedule.drawnBefore.push(drawn);
  }
  return schedule;
}
// The cards still in the shoe after this tick (what the market maker counts on).
function shoeAfter(schedule, tick) {
  const [shoeIndex, position] = schedule.positions[tick];
  return schedule.shoes[shoeIndex].slice(position);
}
// Overnight the price grows with inflation; σ, the Fed and momentum reset.
function nextOpenPrice(close) { return close * (1 + INFLATION_PER_DAY); }

// The market maker knows which cards are left in the shoe and what the whole deck holds, but not the order. It
// plays out the rest of today and the next daysAhead days many times, with the same tickMarket as the real day.
// Returns closesByDay[k][path]: the close k days from today (k = 0 is today's close).
function simulateForecast(market, remainingShoe, deck, ticksLeftToday, daysAhead, paths, random) {
  const fullDeck = deckToPile(deck);
  const closesByDay = Array.from({ length: daysAhead + 1 }, () => []);
  for (let path = 0; path < paths; path++) {
    const state = { ...market };
    let pool = remainingShoe.slice();
    const drawCard = () => {                       // a random card from what is left; a fresh deck when the shoe is empty
      if (pool.length === 0) pool = fullDeck.slice();
      const index = Math.floor(random() * pool.length);
      const card = pool[index];
      pool[index] = pool[pool.length - 1];
      pool.pop();
      return card;
    };
    for (let day = 0; day <= daysAhead; day++) {
      if (day > 0) Object.assign(state, { price: nextOpenPrice(state.price), sigma: 1, fedTicksLeft: 0, lastPriceMove: 0 });
      const ticks = day === 0 ? ticksLeftToday : TICKS_PER_DAY;
      for (let tick = 0; tick < ticks; tick++) tickMarket(state, drawCard);
      closesByDay[day].push(state.price);
    }
  }
  return closesByDay;
}

// Value of an option held to expiry: its average payoff over the simulated closes.
function quoteOption(closes, kind, strike) {
  let payoffTotal = 0;
  for (const close of closes) payoffTotal += Math.max(0, kind === 'call' ? close - strike : strike - close);
  return { fairValue: payoffTotal / closes.length };
}

// ═══════════════════════════════════════ § 5 ACCOUNT ═══════════════════════════════════════
// Cash can go negative (money borrowed on margin) and grows when you short or write options (you receive the money).
// Positions are held overnight. The stock position is a signed share count. Option lots are { kind: call|put,
// side: long|short, strike, quantity, paid, expiryDay } where paid is what was paid (long) or received (short); they
// expire at the close of expiryDay. Bought options are paid from free cash and give no buying power; written
// options count as exposure like a short of the same number of shares.
function currentPrice(today) { return today.schedule.states[today.tick].price; }
// New trades are capped at 1× during an investigation; the margin call keeps using the account's own leverage, so
// positions carried into an investigation are not liquidated by the cap itself.
function maximumLeverage(run) { return run.today && run.today.investigation ? 1 : accountLeverage(run); }
function accountLeverage(run) { return LEVERAGE_TIERS[run.leverageTier]; }
function lotSign(lot) { return lot.side === 'short' ? -1 : 1; }
function intrinsicValue(lot, price) { return Math.max(0, lot.kind === 'call' ? price - lot.strike : lot.strike - price); }
// What the lot is worth to its holder right now. Options can be exercised at any time, so the value is the higher
// of exercising now (max(S − K, 0) for a call, max(K − S, 0) for a put) and holding to expiry (the forecast's
// average payoff at the expiry day's close).
function lotMarketValue(run, lot) {
  return optionValue(run, lot.kind, lot.strike, lot.expiryDay) * lot.quantity;
}
function optionValue(run, kind, strike, expiryDay) {
  const today = run.today, price = currentPrice(today), daysLeft = expiryDay - run.day;
  const exerciseNow = Math.max(0, kind === 'call' ? price - strike : strike - price);
  if ((daysLeft <= 0 && today.tick >= TICKS_PER_DAY) || !today.forecast) return exerciseNow;
  const holdToExpiry = quoteOption(today.forecast[clamp(daysLeft, 0, FORECAST_DAYS_AHEAD)], kind, strike).fairValue;
  return Math.max(exerciseNow, holdToExpiry);
}
function daysToExpiry(run, lot) { return lot.expiryDay - run.day; }
function lotValue(run, lot) { return lotSign(lot) * lotMarketValue(run, lot); }            // negative for written lots
function lotBuyIn(lot) { return lotSign(lot) * lot.paid; }                                  // negative for written lots
function writtenLots(run) { return run.today.optionLots.filter(lot => lot.side === 'short'); }
function writtenLiability(run) { return writtenLots(run).reduce((total, lot) => total + lotMarketValue(run, lot), 0); }
function writtenNotional(run) { return writtenLots(run).reduce((total, lot) => total + lot.quantity, 0) * currentPrice(run.today); }
function marginEquity(run) { return run.cash + run.today.shares * currentPrice(run.today) - writtenLiability(run); }
function exposure(run) { return Math.abs(run.today.shares * currentPrice(run.today)) + writtenNotional(run); }
function totalEquity(run) {
  if (!run.today) return run.cash;
  return run.cash + run.today.shares * currentPrice(run.today) + run.today.optionLots.reduce((total, lot) => total + lotValue(run, lot), 0);
}
function buyingPower(run) { return Math.max(0, marginEquity(run)) * maximumLeverage(run) / (1 + STOCK_TRANSACTION_COST); }
// Cash not needed as margin: what options can be bought with.
function freeCash(run) { return Math.max(0, marginEquity(run) - exposure(run) / maximumLeverage(run)); }
function hasPositions(run) { return run.today.shares !== 0 || run.today.optionLots.length > 0; }

// Move the stock position to newShares at the current price, paying the transaction cost.
function setShares(run, newShares) {
  const today = run.today, price = currentPrice(today);
  const change = newShares - today.shares;
  if (Math.abs(change) * price < 1e-9) return 0;
  run.cash -= change * price + Math.abs(change) * price * STOCK_TRANSACTION_COST;
  const sameDirection = today.shares !== 0 && Math.sign(newShares) === Math.sign(today.shares);
  if (newShares === 0) today.averageEntry = 0;
  else if (sameDirection && Math.abs(newShares) > Math.abs(today.shares))
    today.averageEntry = (today.averageEntry * today.shares + price * change) / newShares;
  else if (!sameDirection) today.averageEntry = price;
  today.shares = newShares;
  today.tradeCount++;
  return change;
}
// How many shares can still be bought (direction +1) or sold / shorted (−1).
function stockRoom(run, direction) {
  const today = run.today, price = currentPrice(today);
  const largestPosition = Math.max(0, buyingPower(run) - writtenNotional(run)) / price;
  if (direction > 0) return Math.max(0, largestPosition - today.shares);
  return Math.max(0, largestPosition + today.shares);
}
// Buy or sell this fraction of the room. Returns the share change, or a reason it did not happen.
function tradeStock(run, direction, fraction) {
  const change = direction * fraction * stockRoom(run, direction);
  if (Math.abs(change) * currentPrice(run.today) < 0.01) return 'Nothing to trade';
  setShares(run, run.today.shares + change);
  return change;
}
function closeStock(run) { return setShares(run, 0); }

function optionPositionId(side, kind) { return side + kind[0].toUpperCase() + kind.slice(1); }   // 'long', 'call' → 'longCall'
function optionsAllowed(run, side, kind) { return run.unlocked[optionPositionId(side, kind)] && !run.today.investigation && run.today.tick < TICKS_PER_DAY; }
function strikeOffsets(kind) { return kind === 'call' ? CALL_STRIKE_OFFSETS : PUT_STRIKE_OFFSETS; }
// What one option at this strike and expiry costs to buy (ask) or brings in when written (bid). New options
// expire OPTION_EXPIRY_DAYS trading days from today; adding to an open lot uses that lot's expiry.
function newExpiryDay(run) { return run.day + OPTION_EXPIRY_DAYS; }
function optionTerms(run, kind, strike, expiryDay = newExpiryDay(run)) {
  const fairValue = optionValue(run, kind, strike, expiryDay);
  return { fairValue, askPrice: fairValue * (1 + OPTION_TRANSACTION_COST), bidPrice: fairValue * (1 - OPTION_TRANSACTION_COST) };
}
// How many options can be written: like shorting that many shares.
function writeRoom(run) { return Math.max(0, (Math.max(0, marginEquity(run)) * maximumLeverage(run) - exposure(run)) / currentPrice(run.today)); }
function addLot(run, newLot) {
  const lots = run.today.optionLots;
  const same = lots.find(lot => lot.kind === newLot.kind && lot.side === newLot.side && lot.expiryDay === newLot.expiryDay && Math.abs(lot.strike - newLot.strike) < 1e-9);
  if (same) { same.quantity += newLot.quantity; same.paid += newLot.paid; }
  else lots.push(newLot);
  run.today.tradeCount++;
}
// Buy options with this fraction of free cash. Returns the quantity, or a reason.
function buyOption(run, kind, strike, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'long', kind)) return 'Options locked';
  const terms = optionTerms(run, kind, strike, expiryDay);
  if (terms.askPrice <= currentPrice(run.today) * 1e-6) return 'No chance at that strike';
  const spend = fraction * freeCash(run);
  if (spend < 0.01) return 'No free cash';
  const quantity = spend / terms.askPrice;
  run.cash -= spend;
  addLot(run, { kind, side: 'long', strike, quantity, paid: spend, expiryDay });
  return quantity;
}
// Write (sell) options for this fraction of the room: the premium comes in now, the payout is owed at the close.
function writeOption(run, kind, strike, fraction, expiryDay = newExpiryDay(run)) {
  if (!optionsAllowed(run, 'short', kind)) return 'Options locked';
  const terms = optionTerms(run, kind, strike, expiryDay);
  if (terms.bidPrice <= currentPrice(run.today) * 1e-6) return 'Worth nothing at that strike';
  const quantity = fraction * writeRoom(run);
  if (quantity * terms.bidPrice < 0.01) return 'No margin left';
  run.cash += quantity * terms.bidPrice;
  addLot(run, { kind, side: 'short', strike, quantity, paid: quantity * terms.bidPrice, expiryDay });
  return quantity;
}
// Close (part of) a lot: a long lot is sold at fair value −cost, a short lot is closed at fair value +cost.
function lotCloseCash(run, lot, fraction) {
  const value = lotMarketValue(run, lot) * fraction;
  return lot.side === 'long' ? value * (1 - OPTION_TRANSACTION_COST) : -value * (1 + OPTION_TRANSACTION_COST);
}
function closeLot(run, lotIndex, fraction = 1) {
  const lot = run.today.optionLots[lotIndex];
  if (!lot) return 0;
  const cashChange = lotCloseCash(run, lot, fraction);
  run.cash += cashChange;
  if (fraction >= 0.9999) run.today.optionLots.splice(lotIndex, 1);
  else { lot.quantity *= 1 - fraction; lot.paid *= 1 - fraction; }
  return cashChange;
}
// Close (part of) the stock position, long or short.
function reduceStock(run, fraction) { return setShares(run, fraction >= 0.9999 ? 0 : run.today.shares * (1 - fraction)); }
function closeEverything(run) {
  closeStock(run);
  while (run.today.optionLots.length) closeLot(run, 0);
}

// Run after every tick: when equity falls below the maintenance margin everything is closed.
function checkMargin(run) {
  if (exposure(run) === 0) return null;
  if (marginEquity(run) >= exposure(run) * MAINTENANCE_SHARE / accountLeverage(run)) return null;
  closeStock(run);
  for (let index = run.today.optionLots.length - 1; index >= 0; index--)
    if (run.today.optionLots[index].side === 'short') closeLot(run, index);
  return 'Margin call!';
}

// The close: options that expire today pay (or cost) what they are worth. The stock is held overnight.
function expireOptions(run) {
  const today = run.today, close = currentPrice(today);
  const expiring = today.optionLots.filter(lot => lot.expiryDay <= run.day);
  for (const lot of expiring) run.cash += lotSign(lot) * intrinsicValue(lot, close) * lot.quantity;
  today.optionLots = today.optionLots.filter(lot => lot.expiryDay > run.day);
  return expiring.length;
}

// ═══════════════════════════════════════ § 6 INSIDER & HEAT ═══════════════════════════════════════
// Every tip reads today's schedule, which is fixed at the open. Tips tell you about today only; the forecast
// (§ 4) is about the week ahead.
function revealTip(run, tipId) {
  const today = run.today, schedule = today.schedule;
  const open = schedule.states[0].price, close = schedule.states[TICKS_PER_DAY].price;
  const random = makeRandom(mixSeed(run.seed, run.day, 77));
  if (tipId === 'rumour') return { direction: close >= open ? 'up' : 'down' };
  if (tipId === 'analyst') {
    const centre = close * (1 + (random() * 2 - 1) * ANALYST_BAND);
    return { low: centre * (1 - ANALYST_BAND), high: centre * (1 + ANALYST_BAND) };
  }
  if (tipId === 'peek') return { cards: schedule.cards.flat().slice(0, PEEK_CARDS) };
  if (tipId === 'volatility') return { sigmas: schedule.states.map(state => state.sigma * (state.fedTicksLeft > 0 ? FED_SIGMA_MULTIPLIER : 1)) };
  if (tipId === 'exactClose') return { close };
  return {};
}
function tipStatus(run, tipId) {
  const tip = run.tips[tipId];
  if (!tip.owned) return 'locked';
  if (run.today && run.today.insights[tipId]) return 'used';
  if (tip.cooldownLeft > 0) return 'cooling';
  if (!run.today || run.today.tick > 0 || run.today.investigation) return 'unavailable';
  return 'ready';
}
function useTip(run, tipId) {
  if (tipStatus(run, tipId) !== 'ready') return false;
  run.today.insights[tipId] = revealTip(run, tipId);
  run.tips[tipId].cooldownLeft = INSIDER_TIPS[tipId].cooldownDays + 1;   // +1: the count drops the same night
  run.heat += INSIDER_TIPS[tipId].heat;
  run.today.tickerLocked = true;
  return true;
}
// Heat from a suspiciously good day.
function abnormalProfitHeat(dayReturn) {
  if (dayReturn <= ABNORMAL_RETURN) return 0;
  return Math.min(HEAT_ABNORMAL_CAP, (dayReturn - ABNORMAL_RETURN) * HEAT_PER_ABNORMAL_RETURN);
}

// ═══════════════════════════════════════ § 7 RUN ═══════════════════════════════════════
// Each stock has a market that lives across days: { shoe (cards not drawn yet), history (the last HISTORY_DAYS days
// as { day, prices }), lastClose }. Every owned stock trades every day; you trade one of them.
function newRun(seed = Math.floor(Math.random() * 2 ** 31)) {
  const decks = {};
  for (const tickerId in TICKERS) decks[tickerId] = { ...TICKERS[tickerId].deck };
  const tips = {};
  for (const tipId of TIP_ORDER) tips[tipId] = { owned: STARTING_TIPS.includes(tipId), cooldownLeft: 0 };
  const run = {
    version: 2, seed, day: 1, cash: STARTING_CASH, heat: 0, investigationDaysLeft: 0,
    unlocked: Object.fromEntries(Object.keys(OPTION_POSITIONS).map(positionId => [positionId, false])),
    leverageTier: 0, tickersOwned: [STARTING_TICKER], ticker: STARTING_TICKER, decks, tips, markets: {},
    removalsDone: 0, additionsDone: 0, eventCopiesBought: Object.fromEntries(EVENT_CARDS.map(cardId => [cardId, 0])),
    meetingsPassed: 0, phase: 'preopen', lastResult: null, gameOverReason: null, peakEquity: STARTING_CASH,
    today: null,
  };
  createMarket(run, STARTING_TICKER);
  prepareDay(run);
  return run;
}

function dayRandom(run, tickerId, salt = 0) { return makeRandom(mixSeed(run.seed, run.day, Object.keys(TICKERS).indexOf(tickerId), salt)); }

// A stock joins the run with a week of history already played (from its own shoe), scaled so that its next open
// is BASE_OPEN_PRICE × inflation. Bought in the shop after a close, its history runs up to that day.
function createMarket(run, tickerId) {
  const deck = run.decks[tickerId], random = makeRandom(mixSeed(run.seed, run.day, Object.keys(TICKERS).indexOf(tickerId), 99));
  let shoe = shuffleInPlace(deckToPile(deck), random), price = 1;

    history.push({ day: lastHistoryDay - back, prices: schedule.states.map(state => state.price) });
    shoe = shoeAfter(schedule, TICKS_PER_DAY);
    price = nextOpenPrice(schedule.states[TICKS_PER_DAY].price);

  for (const day of history) day.prices = day.prices.map(value => value * scale);
  run.markets[tickerId] = { shoe, history, lastClose: history[history.length - 1].prices[TICKS_PER_DAY] };
}
// After the close: the shoe moves on and the day joins the history.
function commitMarketDay(run, tickerId, schedule) {

  market.history = market.history.slice(-HISTORY_DAYS);

// Fix today's schedule for the traded stock from its shoe. Positions carry over from yesterday.
function prepareDay(run) {

    ticker: run.ticker, tick: 0,
    schedule: scheduleDay(market.shoe, run.decks[run.ticker], nextOpenPrice(market.lastClose), dayRandom(run, run.ticker)),
    shares: carry ? previous.shares : 0, averageEntry: carry ? previous.averageEntry : 0, optionLots: carry ? previous.optionLots : [],
    tradeCount: 0, tickerLocked: false, insights: {}, investigation: run.investigationDaysLeft > 0,

  run.ticker = tickerId;

// One tick of the live day. Returns what happened so the screen can react.
function advanceTick(run) {

  if (cards.includes('halt')) today.haltSecondsLeft = HALT_SECONDS;
  if (today.tick % FORECAST_EVERY_TICKS === 0 || today.tick >= TICKS_PER_DAY) refreshForecast(run);
  const message = checkMargin(run);
  return { cards, message, closed: today.tick >= TICKS_PER_DAY };
}

function meetingTarget(run, meetingNumber) {
  const day = meetingNumber * MEETING_EVERY_DAYS;
  const listed = MEETING_MULTIPLES[Math.min(meetingNumber, MEETING_MULTIPLES.length) - 1];
  const extra = Math.pow(MEETING_GROWTH_AFTER_LAST, Math.max(0, meetingNumber - MEETING_MULTIPLES.length));

// the run goes on. Equity counts open positions at their value.
function closeDay(run) {

    if (tickerId === today.ticker) continue;
    const market = run.markets[tickerId];
    commitMarketDay(run, tickerId, scheduleDay(market.shoe, run.decks[tickerId], nextOpenPrice(market.lastClose), dayRandom(run, tickerId)));
  }

  const heatBefore = run.heat;
  run.heat += abnormalProfitHeat(dayReturn);
  let investigationNote = null;
  if (today.investigation) {
    run.investigationDaysLeft--;
    if (run.investigationDaysLeft === 0) { run.heat = HEAT_AFTER_INVESTIGATION; investigationNote = 'cleared'; }
  } else if (run.heat >= HEAT_LIMIT) {
    run.investigationDaysLeft = INVESTIGATION_DAYS;

  }

    day: run.day, ticker: today.ticker,
    open: today.schedule.states[0].price, close: currentPrice(today),
    startEquity: today.startEquity, endEquity, dayReturn, expired,
    heatAdded: run.heat - heatBefore, investigationNote, meeting: null,
  };
  if (run.day % MEETING_EVERY_DAYS === 0) {
    const number = run.day / MEETING_EVERY_DAYS;
    const target = meetingTarget(run, number);
    result.meeting = { number, target, passed: endEquity >= target, final: number === MEETING_MULTIPLES.length };
    if (result.meeting.passed) run.meetingsPassed = number;

  else if (result.meeting && !result.meeting.passed) run.gameOverReason = 'meeting';

}

function startNextDay(run) {
  run.day++;
  run.heat = Math.max(0, run.heat - HEAT_DECAY_PER_DAY);
  for (const tipId of TIP_ORDER) run.tips[tipId].cooldownLeft = Math.max(0, run.tips[tipId].cooldownLeft - 1);
  prepareDay(run);
}

// ── The shop catalogue. Every item: icon, name, a few symbols, one full sentence, a price, and what buying does.
function deckBatchSize(doneSoFar) { return Math.max(DECK_BATCH_MINIMUM, DECK_BATCH_FIRST - doneSoFar); }

  items.push({ id: 'remove', row: 'deck', icon: '🗑', name: 'Remove ' + removeBatch, chips: '−' + removeBatch + ' of one card',
    sentence: 'Take ' + removeBatch + ' copies of one card out of a deck. Next time ' + deckBatchSize(run.removalsDone + 1) + '.',
    price: REMOVE_PRICE * Math.pow(DECK_EDIT_PRICE_GROWTH, run.removalsDone) * inflation, picker: 'remove' });
  items.push({ id: 'add', row: 'deck', icon: '➕', name: 'Add ' + addBatch, chips: '+' + addBatch + ' of one card',
    sentence: 'Put ' + addBatch + ' more copies of one card into a deck. Next time ' + deckBatchSize(run.additionsDone + 1) + '.',
    price: ADD_PRICE * Math.pow(DECK_EDIT_PRICE_GROWTH, run.additionsDone) * inflation, picker: 'add' });
  for (const cardId of EVENT_CARDS) {
    const card = CARD_TYPES[cardId];
    items.push({ id: 'event:' + cardId, row: 'deck', icon: card.icon, name: card.name, chips: '+1 card',
      sentence: card.sentence + ' (Added to one deck.)',
      price: EVENT_CARD_PRICES[cardId] * Math.pow(EVENT_PRICE_GROWTH, run.eventCopiesBought[cardId]) * inflation, picker: 'event:' + cardId });
  }
  for (const [positionId, position] of Object.entries(OPTION_POSITIONS))
    items.push({ id: 'unlock:' + positionId, row: 'trading', icon: position.icon, name: position.name, chips: OPTION_EXPIRY_DAYS + '-day option',
      sentence: position.name + ': ' + position.formula + ' per option. S = the price when exercised (any time, at the latest after ' + OPTION_EXPIRY_DAYS + ' trading days), K = the strike you choose.',
      price: position.price * inflation, owned: run.unlocked[positionId] });
  const nextTier = run.leverageTier + 1;
  if (nextTier < LEVERAGE_TIERS.length)
    items.push({ id: 'leverage', row: 'trading', icon: '⚙', name: 'Leverage ' + LEVERAGE_TIERS[nextTier] + '×', chips: LEVERAGE_TIERS[run.leverageTier] + '× → ' + LEVERAGE_TIERS[nextTier] + '×',
      sentence: 'Buying power becomes ' + LEVERAGE_TIERS[nextTier] + '× your equity. Margin call when you lose half your margin.',
      price: LEVERAGE_PRICES[nextTier] * inflation });
  else items.push({ id: 'leverage', row: 'trading', icon: '⚙', name: 'Leverage max', chips: LEVERAGE_TIERS[run.leverageTier] + '×', sentence: 'The highest leverage there is.', price: 0, owned: true });
  for (const tipId of TIP_ORDER.slice(1)) {

      sentence: tip.sentence + ' Heat +' + tip.heat + ', rests ' + tip.cooldownDays + ' day' + (tip.cooldownDays > 1 ? 's' : '') + '.',
      price: tip.price * inflation, owned: run.tips[tipId].owned });
  }
  for (const tickerId of Object.keys(TICKER_PRICES)) {
    const ticker = TICKERS[tickerId];
    items.push({ id: 'ticker:' + tickerId, row: 'stocks', icon: ticker.icon, name: tickerId, chips: deckSize(ticker.deck) + ' cards',
      sentence: ticker.name + '. ' + ticker.sentence + ' Pick it before the open.',

}
// Buy a plain item (not a deck edit). Returns true when bought.
function buyShopItem(run, item) {

  const [kind, which] = item.id.split(':');
  if (kind === 'unlock') run.unlocked[which] = true;

// Can this deck edit be applied to this card in this deck?
function deckEditAllowed(run, item, tickerId, cardId) {

  if (item.picker === 'remove') return deck[cardId] > 0 && deckSize(deck) - Math.min(deck[cardId], deckBatchSize(run.removalsDone)) >= MINIMUM_DECK_SIZE;
  if (item.picker === 'add') return CARD_TYPES[cardId].kind !== 'event' || deck[cardId] > 0;

function applyDeckEdit(run, item, tickerId, cardId) {

    for (let copy = 0; copy < copies; copy++) market.shoe.splice(Math.floor(random() * (market.shoe.length + 1)), 0, cardId);

// Saving: the whole run is plain data. Forecasts are rebuilt on load.
function serialiseRun(run) {

  return JSON.stringify(copy);
}
function loadRun(text) {

  if (run.unlocked.call !== undefined || run.unlocked.put !== undefined) {   // runs from before the four separate unlocks
    const { call, put } = run.unlocked;
    run.unlocked = { longCall: !!call, shortCall: !!call, longPut: !!put, shortPut: !!put };

// ═══════════════════════════════════════ § 8 SOUND ═══════════════════════════════════════
const sound = { context: null, muted: false };
function playTone(frequency, seconds, { type = 'triangle', volume = 0.05, slideTo = null, delay = 0 } = {}) {

    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);

const sounds = {

  bigCard(positive) { playTone(positive ? 520 : 300, 0.35, { volume: 0.06, slideTo: positive ? 1040 : 120, type: 'sawtooth' }); },
  trade(direction) { playTone(direction > 0 ? 880 : 330, 0.09, { volume: 0.05, type: 'square' }); },

  buy() { playTone(980, 0.1, { volume: 0.04 }); playTone(1470, 0.12, { volume: 0.03, delay: 0.06 }); },
  denied() { playTone(160, 0.12, { volume: 0.04, type: 'square' }); },

// ═══════════════════════════════════════ § 9 CHART ═══════════════════════════════════════
// Everything the screen keeps that is not part of the saved run.
const view = {
  run: null, speedIndex: 0, paused: false, overlay: null,
  floaters: [], lastEquity: null, freshTick: -1,            // chart pops, equity flash, the newest card chip
  trade: null,                                              // the open trade menu (see § 11)
  shopItems: [], shopSelection: 0,                          // the shop's cards and the selected one
  pickerItem: null, pickerTicker: null, pickerCardsShown: [], pickerSelection: 0,   // the deck picker
};

function fitCanvas(canvas) {
  const ratio = window.devicePixelRatio || 1, box = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(box.width * ratio) || canvas.height !== Math.round(box.height * ratio)) {
    canvas.width = Math.round(box.width * ratio); canvas.height = Math.round(box.height * ratio);
  }
  const context = canvas.getContext('2d');
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  return { context, width: box.width, height: box.height };
}

// Price levels the chart keeps in view besides the paths: the forecast, your entry and strikes, insider marks.
function chartLevels(run) {
  const today = run.today, levels = [];
  if (today.forecastSummary) levels.push(today.forecastSummary.low, today.forecastSummary.high);
  if (today.shares !== 0) levels.push(today.averageEntry);
  for (const lot of today.optionLots) levels.push(lot.strike);
  if (today.insights.analyst) levels.push(today.insights.analyst.low, today.insights.analyst.high);
  if (today.insights.exactClose) levels.push(today.insights.exactClose.close);
  return levels;
}

// The chart, left to right: the previous week (thin), today (live), and three dashed lines from now to the close
// FORECAST_DAYS_AHEAD days ahead (top 10%, average, bottom 10%) with only their numbers. Faint lines mark your
// entry and strikes; insider tips draw their marks at today's close.
function drawChart() {
  const run = view.run;
  const { context, width, height } = fitCanvas(element('chart'));
  context.clearRect(0, 0, width, height);
  if (!run || !run.today) return;
  const today = run.today, states = today.schedule.states, open = states[0].price, price = currentPrice(today);
  const history = run.markets[today.ticker].history.filter(day => day.day < run.day);
  const left = 20, right = width - 84, top = 26, bottom = height - 26;
  const historyEnd = left + (right - left) * CHART_HISTORY_SHARE;
  const todayEnd = historyEnd + (right - left) * CHART_TODAY_SHARE;
  const xHistory = (dayIndex, tick) => left + (historyEnd - left) * (dayIndex * TICKS_PER_DAY + tick) / (Math.max(1, history.length) * TICKS_PER_DAY);
  const xToday = tick => historyEnd + (todayEnd - historyEnd) * tick / TICKS_PER_DAY;

  const visible = history.flatMap(day => day.prices).concat(states.slice(0, today.tick + 1).map(state => state.price), chartLevels(run));
  let low = Math.min(...visible), high = Math.max(...visible);
  if (high / low < 1.06) { const middle = Math.sqrt(high * low); low = middle / 1.03; high = middle * 1.03; }
  const logLow = Math.log(low) - 0.05 * Math.log(high / low), logHigh = Math.log(high) + 0.05 * Math.log(high / low);
  const yOf = level => bottom - (bottom - top) * (Math.log(level) - logLow) / (logHigh - logLow);
  const font = (weight, size) => weight + ' ' + size + 'px JetBrains Mono, Menlo, monospace';
  const vertical = (x, colour) => { context.strokeStyle = colour; context.lineWidth = 1; context.beginPath(); context.moveTo(x, top - 10); context.lineTo(x, bottom + 10); context.stroke(); };
  const horizontal = (level, colour, dashed, from = left) => {
    context.strokeStyle = colour; context.lineWidth = 1; context.setLineDash(dashed ? [5, 5] : []);
    context.beginPath(); context.moveTo(from, yOf(level)); context.lineTo(right, yOf(level)); context.stroke(); context.setLineDash([]);
  };

  // day boundaries: faint for past days, brighter around today
  for (let dayIndex = 1; dayIndex < history.length; dayIndex++) vertical(xHistory(dayIndex, 0), CHART_COLOURS.grid);
  vertical(historyEnd, CHART_COLOURS.open); vertical(todayEnd, CHART_COLOURS.open);
  horizontal(open, CHART_COLOURS.open, true, historyEnd);
  if (today.shares !== 0) horizontal(today.averageEntry, CHART_COLOURS.entry, false, historyEnd);
  for (const lot of today.optionLots) horizontal(lot.strike, lot.kind === 'call' ? CHART_COLOURS.up : CHART_COLOURS.down, true, historyEnd);

  // the previous week
  context.strokeStyle = CHART_COLOURS.history; context.lineWidth = 1.5; context.lineJoin = 'round';
  context.beginPath();
  history.forEach((day, dayIndex) => {
    for (let tick = 0; tick <= TICKS_PER_DAY; tick += CHART_HISTORY_STEP) {
      const x = xHistory(dayIndex, tick), y = yOf(day.prices[tick]);
      dayIndex === 0 && tick === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
    }
  });
  context.lineTo(xToday(0), yOf(open));
  context.stroke();

  // insider marks at today's close
  if (today.insights.volatility) {
    const sigmas = today.insights.volatility.sigmas, tallest = Math.max(2, ...sigmas);
    context.strokeStyle = CHART_COLOURS.sigma; context.globalAlpha = 0.45; context.lineWidth = 1.5;
    context.beginPath();
    sigmas.forEach((sigma, tick) => { const y = bottom - 46 * sigma / tallest; tick ? context.lineTo(xToday(tick), y) : context.moveTo(xToday(tick), y); });
    context.stroke(); context.globalAlpha = 1;
  }
  if (today.insights.analyst) {
    const yHigh = yOf(today.insights.analyst.high), yLow = yOf(today.insights.analyst.low);
    context.fillStyle = 'rgba(255,201,77,.22)'; context.fillRect(todayEnd - 7, yHigh, 14, yLow - yHigh);
  }
  if (today.insights.exactClose) {
    context.fillStyle = CHART_COLOURS.insight;
    context.beginPath(); context.arc(todayEnd, yOf(today.insights.exactClose.close), 6, 0, Math.PI * 2); context.fill();
  }
  if (today.insights.rumour) {
    const up = today.insights.rumour.direction === 'up';
    context.fillStyle = up ? CHART_COLOURS.up : CHART_COLOURS.down; context.font = font(800, 20); context.textAlign = 'center'; context.textBaseline = 'middle';
    context.fillText(up ? '▲' : '▼', todayEnd, yOf(open) + (up ? -18 : 18));
  }

  // the forecast fan: now → the close FORECAST_DAYS_AHEAD days ahead
  const nowX = xToday(today.tick), nowY = yOf(price), summary = today.forecastSummary;
  context.textAlign = 'left'; context.textBaseline = 'middle';
  if (summary) {
    const labelYs = [];
    for (const [level, colour] of [[summary.high, CHART_COLOURS.up], [summary.average, CHART_COLOURS.average], [summary.low, CHART_COLOURS.down]]) {
      context.strokeStyle = colour; context.globalAlpha = 0.5; context.lineWidth = 1.5; context.setLineDash([6, 6]);
      context.beginPath(); context.moveTo(nowX, nowY); context.lineTo(right, yOf(level)); context.stroke();
      context.setLineDash([]); context.globalAlpha = 1;
      let labelY = yOf(level);
      for (const used of labelYs) if (Math.abs(labelY - used) < 18) labelY = used + (labelY >= used ? 18 : -18);
      labelYs.push(labelY);
      context.fillStyle = colour; context.font = font(800, 14);
      context.fillText(formatPlain(level), right + 10, labelY);
    }
  }
  // today, green above the open and red below
  context.lineWidth = 2.6;
  for (const [colour, clipTop, clipBottom] of [[CHART_COLOURS.up, 0, yOf(open)], [CHART_COLOURS.down, yOf(open), height]]) {
    context.save(); context.beginPath(); context.rect(historyEnd, clipTop, todayEnd - historyEnd + 4, clipBottom - clipTop); context.clip();
    context.strokeStyle = colour; context.beginPath();
    for (let tick = 0; tick <= today.tick; tick++) tick ? context.lineTo(xToday(tick), yOf(states[tick].price)) : context.moveTo(xToday(tick), yOf(states[tick].price));
    context.stroke(); context.restore();
  }
  context.fillStyle = price >= open ? CHART_COLOURS.up : CHART_COLOURS.down;
  context.beginPath(); context.arc(nowX, nowY, 5.5, 0, Math.PI * 2); context.fill();
  context.font = font(800, 15); context.fillStyle = CHART_COLOURS.average; context.textAlign = 'right';
  context.fillText(formatPlain(price), nowX - 10, nowY - 18);
  context.textAlign = 'left';

  // floating texts (P&L pops, messages), stacked, newest lowest
  const now = performance.now() / 1000;
  view.floaters = view.floaters.filter(floater => now - floater.born < FLOATER_SECONDS).slice(-FLOATERS_SHOWN);
  view.floaters.forEach((floater, index) => {
    const age = (now - floater.born) / FLOATER_SECONDS;
    const stackOffset = (view.floaters.length - 1 - index) * (floater.size + 6);
    context.globalAlpha = 1 - age; context.fillStyle = floater.colour; context.font = font(800, floater.size); context.textAlign = 'center';
    context.fillText(floater.text, clamp(nowX, left + 80, right - 80), Math.max(top + 10, nowY - 46 - stackOffset - age * 30));
    context.textAlign = 'left'; context.globalAlpha = 1;
  });
}
// A number written out in full: thousands separators, two decimals, never K / M / B.
function formatFull(value) { return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
// Chart numbers: no currency sign, few digits.
function formatPlain(price) {
  if (price < 10) return price.toFixed(2);
  if (price < 1000) return price.toFixed(price < 100 ? 1 : 0);
  return formatMoney(price).replace('$', '');
}
function addFloater(text, colour, size = 18) { view.floaters.push({ text, colour, size, born: performance.now() / 1000 }); }
function shakeChart(strength) {
  const box = element('chartBox');
  box.classList.remove('shake', 'shakeBig'); void box.offsetWidth;
  box.classList.add(strength >= 2 ? 'shakeBig' : 'shake');
}

const element = id => document.getElementById(id);
const colourClass = value => (value >= 0 ? 'up' : 'down');
function chipHtml(cardId, extraClass = '') {
  const card = CARD_TYPES[cardId];
  const sign = card.kind === 'price' ? (card.move > 0 ? 'pos' : 'neg') : '';
  const extreme = cardDrama(cardId) === 2 ? 'extreme' : '';
  const tip = card.kind === 'event' ? card.name + ': ' + card.sentence : cardId + ' ' + cardValueText(cardId);
  return '<span class="chip ' + card.kind + ' ' + sign + ' ' + extreme + ' ' + extraClass + '" data-tip="' + tip + '">' + (card.kind === 'event' ? card.icon : cardValueText(cardId)) + '</span>';
}

// The side menu: day, cash, the stock line (x × average = buy-in, then its value now), options, equity, heat, meeting.

function formatSignedCount(value) { return (value >= 0 ? '+' : '−') + formatCount(Math.abs(value)); }

function readRecords() { try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || { bestEquity: 0, longestRun: 0 }; } catch (error) { return { bestEquity: 0, longestRun: 0 }; } }

// Balatro-style count-up of the day's P&L.
function countUp(target, finalValue) {
  const started = performance.now(), seconds = 0.9;
  const step = () => {
    if (!target.isConnected) return;
    const progress = Math.min(1, (performance.now() - started) / 1000 / seconds);
    target.textContent = formatSignedMoney(finalValue * (1 - Math.pow(1 - progress, 3)));
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
