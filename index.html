    <div class="label"><span>options</span><span>${options.length || ''}</span></div>${optionsHtml}
    <div class="rule"></div>
    <div class="label">equity</div><div class="value ${colourClass(equity - today.startEquity)}" id="equityValue">${formatMoney(equity)}</div>
    <div class="label" data-tip="SEC heat: ending a day at ${HEAT_LIMIT} starts an investigation"><span>heat</span><span class="heat">${Math.round(run.heat)} / ${HEAT_LIMIT}${investigation}</span></div>
    <div class="heatBar"><i style="width:${clamp(run.heat / HEAT_LIMIT, 0, 1) * 100}%"></i></div>
    <div class="label" data-tip="Equity at the close of that day must reach this"><span>meeting · day ${meetingNumber * MEETING_EVERY_DAYS}</span></div>
    <div class="line"><span class="${equity >= target ? 'up' : 'gold'}">${formatMoney(target)}</span></div>
    <div class="sideButtons">
      <button class="button" data-action="openDeck" data-tip="The deck (D)">🂠 DECK</button>
      <button class="button" data-action="menu" data-tip="Menu (Esc)">☰</button>
    </div>`;

  if (view.lastEquity !== null && Math.abs(equity - view.lastEquity) > Math.abs(view.lastEquity) * EQUITY_FLASH_CHANGE)
    element('equityValue').classList.add(equity > view.lastEquity ? 'flashUp' : 'flashDown');
  view.lastEquity = equity;
}

// The buttons under the chart. Before the open: tips, stock choice, TRADE, OPEN. During the day: TRADE, CLOSE ALL,
// speed, skip to the close, pause. The button to press next glows.
function renderActions() {
  const run = view.run;
  element('actions').innerHTML = run.phase === 'preopen' ? preOpenButtons(run) : tradingButtons(run);
}
function preOpenButtons(run) {
  const today = run.today;
  const tips = TIP_ORDER.map(tipId => {
    const tip = INSIDER_TIPS[tipId], status = tipStatus(run, tipId), resting = run.tips[tipId].cooldownLeft;
    let hover = `${tip.name}: ${tip.sentence} Heat +${tip.heat}.`;
    if (status === 'locked') hover = `${tip.name}: in the shop`;
    if (status === 'cooling') hover = `${tip.name}: resting ${resting}d`;
    return `<div class="tipButton ${status}" data-action="tip" data-argument="${tipId}" data-tip="${hover}">
      ${status === 'cooling' ? `<span class="cd">${resting}d</span>` : ''}<span class="icon">${status === 'locked' ? '🔒' : tip.icon}</span>🔥${tip.heat}</div>`;
  }).join('');
  const switchLocked = today.tickerLocked || hasPositions(run) ? 'locked' : '';
  const stocks = run.tickersOwned.length < 2 ? '' : '<span class="gap"></span>' + run.tickersOwned.map(tickerId => `
    <button class="toggle ${tickerId === today.ticker ? 'on' : ''} ${switchLocked}" data-action="ticker" data-argument="${tickerId}"
      data-tip="${TICKERS[tickerId].name}: ${TICKERS[tickerId].sentence}">${TICKERS[tickerId].icon} ${tickerId}</button>`).join('');
  return `${tips}${stocks}<span class="gap"></span>
    <button class="button" data-action="openTrade">TRADE<kbd>T</kbd></button>
    <button class="button primary suggest" data-action="openMarket">OPEN ▶<kbd>SPACE</kbd></button>`;
}
function tradingButtons(run) {
  const positions = hasPositions(run);
  return `
    <button class="button primary ${positions ? '' : 'suggest'}" data-action="openTrade">TRADE<kbd>T</kbd></button>
    <button class="button" style="visibility:${positions ? 'visible' : 'hidden'}" data-action="closeEverything" data-tip="Close the stock and every option">CLOSE ALL<kbd>X</kbd></button>
    <span class="gap"></span>
    <button class="button" data-action="speed" data-tip="Speed (F)" style="width:74px">${GAME_SPEEDS[view.speedIndex]}×</button>
    <button class="button" data-action="skipToClose" data-tip="Play the rest of the day instantly">⏭ CLOSE<kbd>K</kbd></button>
    <button class="button" data-action="pause" data-tip="Pause (Space)" style="width:56px">${view.paused ? '▶' : '⏸'}</button>`;
}

// The last card drawn in the corner of the chart, and the cards a Peek showed that are still to come.
function renderLastCards() {
  const today = view.run.today;
  const last = today.tick > 0 ? today.schedule.cards[today.tick] : [];
  const upcoming = today.insights.peek ? today.insights.peek.cards.slice(today.schedule.drawnBefore[today.tick]) : [];
  element('lastCards').innerHTML = last.map(cardId => chipHtml(cardId, view.freshTick === today.tick ? 'fresh' : '')).join('')
    + upcoming.map(cardId => chipHtml(cardId, 'future')).join('');
}

function renderAll() {
  if (!view.run || !view.run.today) return;
  renderSide();
  renderActions();
  renderLastCards();
}

// ═══════════════════════════════════════ § 11 OVERLAYS ═══════════════════════════════════════
// ── 11.1 Showing and hiding. soft = the game stays visible behind (the trade menu).
function showOverlay(name, html, soft = false) {
  view.overlay = name;
  element('overlay').innerHTML = html;
  element('overlay').classList.toggle('show', !!name);
  element('overlay').classList.toggle('soft', soft);
}
function hideOverlay() {
  view.overlay = null;
  view.tradeMenu = null;
  element('overlay').classList.remove('show', 'soft');
  element('overlay').innerHTML = '';
}

// ── 11.2 Title, menu, day result, game over, deck
function readRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || { bestEquity: 0, longestRun: 0 }; }
  catch (error) { return { bestEquity: 0, longestRun: 0 }; }
}
function writeRecords(run) {
  const records = readRecords();
  records.bestEquity = Math.max(records.bestEquity, run.peakEquity);
  records.longestRun = Math.max(records.longestRun, run.day);
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (error) { /* storage blocked */ }
}

function showTitle() {
  const saved = localStorage.getItem(SAVE_KEY), records = readRecords();
  showOverlay('title', `
    <div class="card">
      <div class="title">INSIDER</div>
      <div class="note">the price is a deck of cards · rig it</div>
      ${records.bestEquity ? `<div class="note">best ${formatMoney(records.bestEquity)} · longest ${records.longestRun} days</div>` : ''}
      <div class="menuButtons">
        ${saved ? '<button class="button primary" data-action="continueRun">CONTINUE</button>' : ''}
        <button class="button ${saved ? '' : 'primary'}" data-action="newRun">NEW RUN</button>
      </div>
    </div>`);
}

function showMenu() {
  view.paused = true;
  showOverlay('menu', `
    <div class="card">
      <h1>Paused</h1>
      <div class="menuButtons">
        <button class="button primary" data-action="resume">RESUME</button>
        <button class="button" data-action="sound">${sound.muted ? 'SOUND OFF' : 'SOUND ON'}</button>
        <button class="button" data-action="toTitle">TITLE</button>
      </div>
      <div class="keys"><span class="key">T</span> trade <span class="key">X</span> close all <span class="key">F</span> speed <span class="key">K</span> to the close <span class="key">D</span> deck</div>
    </div>`);
}

function showResult() {
  const run = view.run, result = run.lastResult, meeting = result.meeting;
  const profit = result.endEquity - result.startEquity;
  const notes = [];
  if (result.heatAdded > 0) notes.push(`<div class="note heat">🔥 +${Math.round(result.heatAdded)} heat: abnormal day</div>`);
  if (result.investigationNote === 'opened') notes.push(`<div class="note heat">🚨 SEC investigation: ${INVESTIGATION_DAYS} clean days</div>`);
  if (result.investigationNote === 'cleared') notes.push('<div class="note up">Investigation closed</div>');
  if (meeting) notes.push(`<div class="note ${meeting.passed ? 'up' : 'down'}">Meeting ${meeting.number}: ${formatMoney(meeting.target)} ${meeting.passed ? '✓' : '✗'}</div>`);
  if (meeting && meeting.passed && meeting.final) notes.push('<div class="note gold">🏆 Last meeting passed. Play on for bigger numbers.</div>');
  showOverlay('result', `
    <div class="card">
      <h1>Day ${result.day} · ${result.ticker}</h1>
      <div class="note">${formatPrice(result.openPrice)} → ${formatPrice(result.closePrice)} <span class="${colourClass(result.closePrice - result.openPrice)}">${formatPercent(result.closePrice / result.openPrice - 1)}</span></div>
      <div class="huge ${colourClass(profit)}" id="countUp">${formatSignedMoney(0)}</div>
      <div class="note">equity ${formatMoney(result.endEquity)}</div>
      ${notes.join('')}
      <div class="menuButtons"><button class="button primary" data-action="afterResult">${run.gameOverReason ? 'CONTINUE' : 'SHOP'}<kbd>SPACE</kbd></button></div>
    </div>`);
  countUp(element('countUp'), profit);
}
// Balatro-style count-up of the day's P&L.
function countUp(target, finalValue) {
  const started = performance.now(), seconds = 0.9;
  const step = () => {
    if (!target.isConnected) return;
    const progress = Math.min(1, (performance.now() - started) / 1000 / seconds);
    target.textContent = formatSignedMoney(finalValue * (1 - Math.pow(1 - progress, 3)));
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function showGameOver() {
  const run = view.run;
  writeRecords(run);
  showOverlay('gameover', `
    <div class="card">
      <h1>Fund closed</h1>
      <div class="note">${run.gameOverReason === 'meeting' ? 'The investors pulled their money.' : 'No money left to trade.'}</div>
      <div class="huge gold">${run.day} days</div>
      <div class="note">peak ${formatMoney(run.peakEquity)} · meetings ${run.meetingsPassed}</div>
      <div class="menuButtons"><button class="button primary" data-action="newRun">NEW RUN<kbd>SPACE</kbd></button></div>
    </div>`);
  try { localStorage.removeItem(SAVE_KEY); } catch (error) { /* storage blocked */ }
}

// The deck window: every card of today's stock: how many are left in the draw pile / how many the deck holds.
function showDeck() {
  const today = view.run.today, deck = view.run.decks[today.ticker], left = countCards(remainingDrawPile(today));
  const cards = CARD_ORDER.filter(cardId => CARD_TYPES[cardId].category !== 'event' || deck[cardId] > 0);
  showOverlay('deck', `
    <div class="card fullScreen">
      <div class="shopHead">
        <h1>${TICKERS[today.ticker].icon} ${today.ticker}</h1>
        <span class="slot"><small>left in the draw pile</small><b>${remainingDrawPile(today).length} / ${deckSize(deck)}</b></span>
        <span class="spacer"></span>
        <button class="button" data-action="closeOverlay">CLOSE<kbd>D</kbd></button>
      </div>
      <div class="deckGrid">${cards.map(cardId => `
        <div class="deckCard ${deck[cardId] === 0 ? 'gone' : ''}">
          ${chipHtml(cardId)}<span>${cardLabel(cardId)}</span>
          <span class="count">${left[cardId]}<small> / ${deck[cardId]}</small></span>
        </div>`).join('')}
      </div>
    </div>`);
}

// ── 11.3 The trade menu: one question per step.
//   'action'   the six trades (long / short stock, long / short call, long / short put). Open trades sit as small
//              icons on their own row: a key letter or a click opens one.
//   'strike'   a new option: choose the strike price K (each row shows K and the premium).
//   'position' an open trade: ADD (more of the same: direction, K and expiry) or CLOSE (part or all).
//   'amount'   the slider, the numbers it gives, and the button that makes the trade.
// view.tradeMenu = { step, mode: 'new' | 'add' | 'close', action: 'long' | 'short' | 'longOption' | 'shortOption',
//   type, strikePrice, expiryDay, position: { type: 'stock' } | { type: 'option', index }, percent, selection, message }.
// After a trade the menu returns to 'action', so the game stays paused until Esc.
function openTrade() {
  if (!tradingOpen()) return;
  view.tradeMenu = freshTradeMenu();
  showTrade();
}
function freshTradeMenu(message = null) {
  return { step: 'action', mode: 'new', action: null, type: null, strikePrice: null, expiryDay: null, position: null, percent: SLIDER_DEFAULT_PERCENT, selection: 0, message };
}
function goTo(step, changes) {
  Object.assign(view.tradeMenu, changes, { step, selection: 0, message: null });
  if (step === 'amount') view.tradeMenu.percent = view.tradeMenu.mode === 'close' ? 100 : SLIDER_DEFAULT_PERCENT;
  showTrade();
}
function tradeBack() {
  const tradeMenu = view.tradeMenu;
  if (tradeMenu.step === 'action') { hideOverlay(); renderAll(); return; }
  if (tradeMenu.step === 'amount' && tradeMenu.mode !== 'new') { goTo('position', {}); return; }
  if (tradeMenu.step === 'amount' && tradeMenu.strikePrice !== null) { goTo('strike', { strikePrice: null }); return; }
  goTo('action', { strikePrice: null, position: null, mode: 'new' });
}
function optionPositionInfo(option) { return OPTION_POSITIONS[optionPositionId(option.direction, option.type)]; }
function selectedOption() {
  const position = view.tradeMenu.position;
  return position && position.type === 'option' ? view.run.today.options[position.index] : null;
}

// The rows of the current step: { main, detail, locked, tip, openTrades, pick() }.
function tradeRows() {
  const step = view.tradeMenu.step;
  if (step === 'action') return actionRows();
  if (step === 'strike') return strikeRows();
  if (step === 'position') return positionRows();
  return [];
}
function actionRows() {
  const run = view.run, today = run.today;
  const optionRow = (direction, type) => {
    const positionId = optionPositionId(direction, type), position = OPTION_POSITIONS[positionId];
    return {
      main: position.name.toUpperCase(), detail: position.formula, openTrades: openTradesOn(positionId),
      locked: !run.unlocked[positionId] || today.investigation,
      tip: today.investigation ? 'No options during an investigation' : `${position.name} is unlocked in the shop`,
      choose: () => goTo('strike', { action: direction + 'Option', type, mode: 'new', expiryDay: newExpiryDay(run) }),
    };
  };
  return [
    { main: 'LONG STOCK', detail: 'P&L = S − entry price', openTrades: openTradesOn('longStock'), choose: () => goTo('amount', { action: 'long', mode: 'new' }) },
    { main: 'SHORT STOCK', detail: 'P&L = entry price − S', openTrades: openTradesOn('shortStock'), choose: () => goTo('amount', { action: 'short', mode: 'new' }) },
    optionRow('long', 'call'), optionRow('short', 'call'), optionRow('long', 'put'), optionRow('short', 'put'),
  ];
}
// The open trades that belong on a row ('longStock', 'shortStock' or an option position id): { icon, hover, profit, show() }.
function openTradesOn(rowId) {
  const run = view.run, today = run.today, price = currentPrice(today), trades = [];
  if (today.shares !== 0 && rowId === (today.shares > 0 ? 'longStock' : 'shortStock'))

      profit: optionValueNow(run, option) - optionBuyIn(option), show: () => goTo('position', { position: { type: 'option', index } }) });

// Arrow keys move to the nearest card in that direction, by where the cards sit on screen (wrapping along a row).
function moveSelectionByPosition(selector, currentIndex, arrowX, arrowY) {
  const cards = [...document.querySelectorAll(selector)];
  if (!cards.length) return currentIndex;
  const placeOf = card => {
    const bounds = card.getBoundingClientRect();
    return { centreX: bounds.left + bounds.width / 2, centreY: bounds.top + bounds.height / 2, top: bounds.top, left: bounds.left };
  };
  const from = placeOf(cards[currentIndex]);
  let best = currentIndex, bestScore = Infinity;
  cards.forEach((card, index) => {
    const to = placeOf(card);
    const ahead = arrowX ? (to.centreX - from.centreX) * arrowX : (to.centreY - from.centreY) * arrowY;   // how far in the arrow's direction
    const aside = arrowX ? Math.abs(to.centreY - from.centreY) : Math.abs(to.centreX - from.centreX);    // how far off to the side
    if (index === currentIndex || ahead <= 4) return;
    if (ahead + aside * 3 < bestScore) { bestScore = ahead + aside * 3; best = index; }
  });
  if (best === currentIndex && arrowX) {                    // nothing further along: wrap to the other end of the row
    const row = cards.map((card, index) => ({ index, ...placeOf(card) })).filter(place => Math.abs(place.top - from.top) < 10);
    row.sort((first, second) => first.left - second.left);
    best = (arrowX > 0 ? row[0] : row[row.length - 1]).index;
  }
  return best;
}

// Saving never stops the game: if the browser blocks storage, the run just isn't saved.
function saveRun() {
  try { if (view.run) localStorage.setItem(SAVE_KEY, serialiseRun(view.run)); } catch (error) { /* storage blocked */ }
}
function savePreferences() {
  const preferences = { muted: sound.muted, speedIndex: view.speedIndex };
  try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify(preferences)); } catch (error) { /* storage blocked */ }
}
function tradingOpen() { const run = view.run; return run && (run.phase === 'preopen' || run.phase === 'trading') && run.today.tick < TICKS_PER_DAY; }

// Everything a button or key can do. Buttons name their action in data-action (and an optional data-argument).
const ACTIONS = {
  newRun() { view.run = newRun(); view.lastEquity = null; hideOverlay(); saveRun(); },
  continueRun() {
    const run = loadRun(localStorage.getItem(SAVE_KEY));
    if (!run) { ACTIONS.newRun(); return; }
    view.run = run; view.lastEquity = null; hideOverlay();
    if (run.phase === 'trading') showMenu();
    else if (run.phase === 'result') showResult();
    else if (run.phase === 'shop') showShop();
  },
  toTitle() { saveRun(); view.paused = false; showTitle(); },
  resume() { view.paused = false; hideOverlay(); },
  menu() { if (view.overlay === 'menu') ACTIONS.resume(); else if (!view.overlay && view.run) showMenu(); },
  closeOverlay() { hideOverlay(); },
  speed() { view.speedIndex = (view.speedIndex + 1) % GAME_SPEEDS.length; savePreferences(); },
  sound() { sound.muted = !sound.muted; savePreferences(); if (view.overlay === 'menu') showMenu(); },
  pause() { if (view.run.phase === 'trading') view.paused = !view.paused; },
  openDeck() { if (!view.overlay) showDeck(); },
  openTrade() { openTrade(); },
  tradeRow(index) { pickTradeRow(index); },
  openTradeIcon(index) { openTradeIcon(index); },
  confirmTrade() { confirmTrade(); },
  closeEverything() { if (tradingOpen() && hasPositions(view.run) && !view.tradeMenu) finishTrade(closeEverything(view.run), 'ALL CLOSED'); },
  tip(tipId) { if (useTip(view.run, tipId)) { sounds.tip(); saveRun(); } else sounds.denied(); },
  ticker(tickerId) { if (switchTicker(view.run, tickerId)) saveRun(); else sounds.denied(); },
  openMarket() { if (view.run.phase === 'preopen') { view.run.phase = 'trading'; view.run.today.tickerLocked = true; view.paused = false; saveRun(); } },
  skipToClose() { while (view.run.phase === 'trading') runOneTick(true); },
  afterResult() {
    if (view.run.gameOverReason) { showGameOver(); return; }
    view.run.phase = 'shop';
    saveRun();
    showShop();
  },
  nextDay() { startNextDay(view.run); view.lastEquity = null; hideOverlay(); saveRun(); },
  shopItem(index) { chooseShopItem(index); },
  pickCard(index) { pickCard(index); },
  deckPickerTicker(tickerId) { view.deckPickerTicker = tickerId; view.deckPickerSelection = 0; showPicker(); },
};
const NUMBER_ARGUMENT_ACTIONS = ['tradeRow', 'openTradeIcon', 'shopItem', 'pickCard'];

function handleClick(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.classList.contains('locked')) { sounds.denied(); return; }
  const action = ACTIONS[target.dataset.action];
  if (!action) return;
  const argument = target.dataset.argument;
  action(NUMBER_ARGUMENT_ACTIONS.includes(target.dataset.action) ? Number(argument) : argument);
  if (!view.overlay || view.overlay === 'menu') renderAll();
}

// Keys go to whatever is on screen: the trade menu, the shop or picker, another overlay, or the game itself.
function handleKey(event) {
  if (event.metaKey || event.ctrlKey || !view.run) return;
  const overlay = view.overlay;
  if (overlay === 'trade') { tradeMenuKey(event.key); event.preventDefault(); return; }
  if (overlay === 'shop' || overlay === 'picker') { shopKey(event); return; }
  if (overlay) { overlayKey(overlay, event); return; }
  gameKey(event);
}
function tradeMenuKey(key) {
  const tradeMenu = view.tradeMenu;
  if (key === 'Escape') { tradeBack(); return; }
  if (tradeMenu.step === 'amount') {
    if (key === 'Enter') confirmTrade();
    if (key === 'ArrowLeft' || key === 'ArrowRight') {
      tradeMenu.percent = clamp(tradeMenu.percent + (key === 'ArrowRight' ? 1 : -1) * SLIDER_STEP_PERCENT, 0, 100);
      element('tradeSlider').value = tradeMenu.percent;
      refreshAmount();
    }
    return;
  }
  const rows = tradeRows(), letter = key.length === 1 ? key.toLowerCase() : '';
  if (/^[1-9]$/.test(key)) pickTradeRow(Number(key) - 1);
  else if (tradeMenu.step === 'action' && letter && OPEN_TRADE_KEYS.includes(letter)) openTradeIcon(OPEN_TRADE_KEYS.indexOf(letter));
  else if (key === 'ArrowDown') { tradeMenu.selection = (tradeMenu.selection + 1) % rows.length; showTrade(); }
  else if (key === 'ArrowUp') { tradeMenu.selection = (tradeMenu.selection + rows.length - 1) % rows.length; showTrade(); }
  else if (key === 'Enter') pickTradeRow(tradeMenu.selection);
}
function shopKey(event) {
  const key = event.key, inShop = view.overlay === 'shop';
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[key]) {
    const [arrowX, arrowY] = arrows[key];
    if (inShop) { view.shopSelection = moveSelectionByPosition('.choice', view.shopSelection, arrowX, arrowY); showShop(); }
    else { view.deckPickerSelection = moveSelectionByPosition('.choice', view.deckPickerSelection, arrowX, arrowY); showPicker(); }
    event.preventDefault();
  } else if (key === 'Enter') {
    if (inShop) chooseShopItem(view.shopSelection); else pickCard(view.deckPickerSelection);
  } else if (key === ' ' && inShop) {
    ACTIONS.nextDay(); renderAll(); event.preventDefault();
  } else if (key === 'Escape' && !inShop) {
    showShop();
  } else if (key === 'Tab' && !inShop) {
    const owned = view.run.tickersOwned;
    view.deckPickerTicker = owned[(owned.indexOf(view.deckPickerTicker) + 1) % owned.length];
    showPicker(); event.preventDefault();
  }
}
function overlayKey(overlay, event) {
  const key = event.key, confirm = key === ' ' || key === 'Enter';
  if (overlay === 'title' && confirm) { (localStorage.getItem(SAVE_KEY) ? ACTIONS.continueRun : ACTIONS.newRun)(); renderAll(); }
  if (overlay === 'result' && confirm) { ACTIONS.afterResult(); event.preventDefault(); }
  if (overlay === 'gameover' && confirm) { ACTIONS.newRun(); renderAll(); event.preventDefault(); }
  if (overlay === 'menu' && (key === 'Escape' || key === ' ')) { ACTIONS.resume(); renderAll(); }
  if (overlay === 'deck' && (key === 'Escape' || key.toLowerCase() === 'd')) hideOverlay();
}
function gameKey(event) {
  const keyActions = {
    t: ACTIONS.openTrade, x: ACTIONS.closeEverything, d: ACTIONS.openDeck, k: ACTIONS.skipToClose,
    f: ACTIONS.speed, m: ACTIONS.sound, Escape: ACTIONS.menu,
    ' ': () => (view.run.phase === 'preopen' ? ACTIONS.openMarket() : ACTIONS.pause()),
  };
  const handler = keyActions[event.key.length === 1 ? event.key.toLowerCase() : event.key];
  if (!handler) return;
  handler();
  event.preventDefault();
  if (!view.overlay || view.overlay === 'menu') renderAll();
}

// Instant tooltips for anything with data-tip.
function handleMouseMove(event) {
  const tooltip = element('tooltip'), target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) { tooltip.style.display = 'none'; return; }
  tooltip.textContent = target.dataset.tip;
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, event.clientX + 14) + 'px';
  tooltip.style.top = Math.min(window.innerHeight - tooltip.offsetHeight - 8, event.clientY + 16) + 'px';
}

// ═══════════════════════════════════════ § 13 START ═══════════════════════════════════════
// One tick of the live day, with its sound, shake and popup. quiet = skipping to the close.
function runOneTick(quiet) {
  const run = view.run, equityBefore = totalEquity(run);
  const outcome = advanceTick(run);
  view.freshTick = run.today.tick;
  if (!quiet) {
    const impact = Math.max(0, ...outcome.cards.map(cardImpact));
    const priceNow = currentPrice(run.today), priceBefore = run.today.schedule.states[run.today.tick - 1].price;
    if (impact > 0) { shakeChart(impact); sounds.bigCard(priceNow >= priceBefore); }
    else if (outcome.cards.length) sounds.tick(priceNow - priceBefore);
    const change = totalEquity(run) - equityBefore;
    if (Math.abs(change) > Math.max(1, Math.abs(equityBefore) * POPUP_CHANGE))
      addPopup(formatSignedMoney(change), change > 0 ? CHART_COLOURS.up : CHART_COLOURS.down, impact === 2 ? 26 : 18);
  }
  if (outcome.message) { sounds.bad(); addPopup(outcome.message, CHART_COLOURS.stop, 22); }
  if (outcome.closed) {
    const result = closeDay(run);
    saveRun();
    sounds.cash(result.endEquity >= result.startEquity);
    renderAll();
    showResult();
  }
}

// Every frame: the clock runs (unless paused, halted or a window is open), a tick happens each SECONDS_PER_TICK,
// and the chart is redrawn.
let lastFrameTime = null;
function frame(time) {
  const seconds = lastFrameTime === null ? 0 : Math.min(0.25, (time - lastFrameTime) / 1000);
  lastFrameTime = time;
  const run = view.run, clockRuns = run && run.phase === 'trading' && !view.paused && !view.overlay;
  if (clockRuns) {
    const today = run.today, gameSeconds = seconds * GAME_SPEEDS[view.speedIndex];
    if (today.haltSecondsLeft > 0) today.haltSecondsLeft = Math.max(0, today.haltSecondsLeft - gameSeconds);
    else today.tickClock += gameSeconds;
    if (today.tickClock >= SECONDS_PER_TICK) {
      today.tickClock -= SECONDS_PER_TICK;
      runOneTick(false);
      if (run.phase === 'trading') { saveRun(); renderAll(); }
    }
  }
  element('pauseNote').style.display = view.paused && run && run.phase === 'trading' && !view.overlay ? 'grid' : 'none';
  drawChart();
  requestAnimationFrame(frame);
}

function start() {
  try {
    const preferences = JSON.parse(localStorage.getItem(PREFERENCES_KEY)) || {};
    sound.muted = !!preferences.muted;
    view.speedIndex = preferences.speedIndex || 0;
  } catch (error) { /* defaults */ }
  if (new URLSearchParams(location.search).has('mute')) sound.muted = true;
  try { const saved = localStorage.getItem(SAVE_KEY); view.run = saved ? loadRun(saved) : null; } catch (error) { view.run = null; }
  if (!view.run) view.run = newRun();
  showTitle();
  renderAll();
  document.addEventListener('click', handleClick);
  document.addEventListener('keydown', handleKey);
  document.addEventListener('mousemove', handleMouseMove);
  window.addEventListener('resize', renderAll);
  requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') start();
</script>
